/* Українські відмінки для чисел: 1 медаль, 2 медалі, 5 медалей */
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5) return few;
  if(b === 1) return one;
  return many;
}

/* ======== UI ======== */
/* ---------------------------------------------------------------------
   Висота прилиплих карток → CSS-змінна для шапки таблиці (14.08.2026).
   Картки клеяться до верху вікна, а шапка таблиці — ПІД ними, тож їй
   треба знати їхню висоту. Зашити число не можна: картки переносяться
   на другий рядок залежно від ширини вікна й кількості гравців (6 у
   EuroSeason, 9 в архівних турнірах).
   ⚠️ Слухаємо саме ResizeObserver, а не `resize` вікна: висота
   змінюється ще й коли дозавантажились шрифти, а події вікна тоді немає.
   --------------------------------------------------------------------- */
let stickyRO = null;
function syncStickyOffset(){
  const sum = document.querySelector('.gp-summary');
  const put = () => document.documentElement.style.setProperty(
    '--gp-sum-h', (sum ? Math.round(sum.getBoundingClientRect().height) : 0) + 'px');
  put();
  if(stickyRO){ stickyRO.disconnect(); stickyRO = null; }
  if(sum && window.ResizeObserver){
    stickyRO = new ResizeObserver(put);
    stickyRO.observe(sum);
  }
}

async function loadActiveTab(){
  const content = document.getElementById('content');

  // SQUAD MODE — власний фронт (F1-борда), вбудований iframe-ом у оболонку
  // BoBet. Свій файл (squad-stage.html), а не вплетений сюди: механіка
  // market_* не має спільного з прогнозами/бустами. embed=1 ховає власний
  // бейдж і заголовок борди (контекст уже дає шапка BoBet). Кабінет —
  // та сама кнопка, src перемикається в модалці кабінету.
  if(activeTournament.source === 'squad'){
    document.getElementById('tabs').innerHTML = '';
    content.innerHTML =
      '<iframe src="squad-stage.html?embed=1" title="Squad Mode — борда" ' +
      'style="width:100%;border:0;min-height:82vh;display:block"></iframe>';
    return;
  }

  // HONORS живе за іншими правилами: не таблиця, а власна сторінка,
  // зібрана з чотирьох в'юх бази. Тому виходимо з загального шляху
  // до того, як він полізе по activeTournament.tabs.
  if(activeTournament.source === 'honors'){
    const kind = (activeTournament.tabs[activeTabIndex] || {}).kind || 'honorsCase';
    content.innerHTML = '<div class="status-line">Відчиняємо вітрину...</div>';
    try{
      // Усі три підвкладки живляться з одного набору даних, тому
      // тягнемо його один раз і тримаємо до перезавантаження сторінки:
      // перемикання між ними стає миттєвим.
      if(!HONORS_CACHE){
        const [medals, detail, hof, facts, season,
               dnaProfile, dnaArch, dnaScore, dnaTeam, dnaRhythm, dnaBonus, dnaPair, dnaLeague,
               dnaBelief, dnaShape, dnaVsLeague, dnaScoreKind]
          = await Promise.all([
          sbGet('honors_medals?select=*&order=gold.desc,medals_total.desc,person.asc'),
          sbGet('honors_detail?select=*&order=tournament_order.asc,place.asc'),
          // ⚠️ hall_of_fame_all, а не hall_of_fame: перша віддає лише
          // номінації 1-27 (файл 92), друга додає до них 28+ з hof_extra
          // (файл 95). Велику в'юху свідомо не переоголошуємо — вона вже
          // 28 КБ і п'ять разів ставала пасткою з порядком файлів.
          sbGet('hall_of_fame_all?select=*&order=sort_order.asc,person.asc'),
          sbGet('tournament_facts?select=*&order=tournament_order.asc'),
          sbGet('season_leaderboard?select=display_name,total_points,place&order=place.asc'),
          // «Портрети гравців» — той самий набір даних, тягнемо разом
          // з рештою Honors, щоб перемикання лишалось миттєвим.
          sbGet('dna_profile?select=*&order=matches.desc'),
          sbGet('dna_archetype?select=*'),
          sbGet('dna_score?select=*&order=person.asc,rn.asc'),
          // Поріг — 4 ставки на команду. Розділення на клуби й збірні
          // ділить вибірку навпіл, і на старому порозі 6 Женя з Максом
          // лишались зовсім без збірних, а Саня з Мишею без клубів.
          // ⚠️ Сортуємо за weighted_pct, а не backed_pct: у ньому
          // сидить поправка на малу вибірку, інакше «3 з 4» обходить
          // «11 з 15» і талісманом стає випадкова команда.
          sbGet('dna_team?select=*&backed=gte.4&order=weighted_pct.desc,backed.desc'),
          sbGet('dna_rhythm?select=*'),
          sbGet('dna_bonus?select=*'),
          sbGet('dna_pair?select=*&order=same_pct.desc'),
          sbGet('dna_league?select=*'),
          // Друге визначення улюбленої команди — «віра»: наскільки
          // частіше за решту ліги людина ставить на її перемогу.
          sbGet('dna_belief?select=*&played=gte.4&order=belief_diff.desc,played.desc'),
          sbGet('dna_shape?select=*'),
          sbGet('dna_vs_league?select=*&order=person.asc,tournament_order.asc'),
          sbGet('dna_score_kind?select=*&order=person.asc,kind.asc,rn.asc'),
        ]);
        HONORS_CACHE = { medals, detail, hof, facts, season,
                         dnaProfile, dnaArch, dnaScore, dnaTeam,
                         dnaRhythm, dnaBonus, dnaPair,
                         dnaBelief, dnaShape, dnaVsLeague, dnaScoreKind,
                         dnaLeague: (dnaLeague || [])[0] || null };
      }
      content.innerHTML = renderHonorsSection(kind, HONORS_CACHE);
      syncStickyOffset();
    }catch(err){
      content.innerHTML = `<div class="status-line err">Не вдалося завантажити HONORS: ${escapeHtml(err.message)}</div>`;
    }
    return;
  }

  const tab = activeTournament.tabs[activeTabIndex];
  const fromDb = activeTournament.source === 'supabase';
  content.innerHTML = '<div class="status-line">Завантаження даних' +
    (fromDb ? '...' : ' з Google Sheets...') + '</div>';
  try{
    const data = fromDb
      ? await fetchSupabaseTab(tab)
      : await fetchSheet(activeTournament.sheetId, tab.sheet, tab.gid);
    if(activeTournament.tabs[activeTabIndex] !== tab) return;
    content.innerHTML = renderTabContent(tab, data);
    syncStickyOffset();
  }catch(err){
    content.innerHTML = `<div class="status-line err">Не вдалося завантажити вкладку «${escapeHtml(tab.sheet)}»: ${escapeHtml(err.message)}</div>`;
  }
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  // Кольори вкладок-етапів — лише в EuroSeason: серпень/вересень/
  // жовтень/General. Архівні вкладки лишаємо без акценту, щоб не
  // фарбувати частину списку строкато.
  const colorTabs = activeTournament.key === 'euroseason2026';
  nav.innerHTML = activeTournament.tabs.map((t, idx) => {
    const accent = colorTabs ? stageClass(t.sheet) : '';
    const cls = [idx === activeTabIndex ? 'active' : '', accent].filter(Boolean).join(' ');
    return `<button data-idx="${idx}" class="${cls}">${escapeHtml(t.sheet)}</button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTabIndex = Number(btn.dataset.idx);
      nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      loadActiveTab();
    });
  });
}

// EUROSEASON_LIVE: null поки не перевірено, true/false після відповіді
// бази. Турнір «іде», доки лишається хоч один незіграний/нескасований
// матч серед aug2026/sep2026/oct2026 — тобто аж до фінального свистка
// останнього матчу останнього вікенду жовтня.
let EUROSEASON_LIVE = null;

async function checkEuroseasonLive(){
  try{
    const tours = await sbGet('tournaments?select=id&key=in.(aug2026,sep2026,oct2026)');
    const ids = tours.map(t => t.id).join(',');
    if(!ids) return false;
    const gws = await sbGet('gameweeks?select=id,matches(status)&tournament_id=in.(' + ids + ')');
    return gws.some(g => (g.matches || []).some(m => m.status !== 'played' && m.status !== 'cancelled'));
  }catch(e){ return false; }   // мережа підвела — краще без бейджа, ніж хибний LIVE
}

function renderTournaments(){
  const nav = document.getElementById('tournaments');
  nav.innerHTML = TOURNAMENTS.map(t => {
    const live = t.key === 'euroseason2026' && EUROSEASON_LIVE
      ? '<span class="live-badge"><span class="dot"></span>LIVE</span>' : '';
    const cls = [t.key === activeTournament.key ? 'active' : '', live ? 'has-live' : ''].filter(Boolean).join(' ');
    return `<button data-key="${t.key}" class="${cls}">${escapeHtml(t.title)}${live}</button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => setTournament(btn.dataset.key));
  });
}

function setTournament(key){
  const t = TOURNAMENTS.find(x => x.key === key);
  if(!t) return;
  activeTournament = t;
  activeTabIndex = 0;
  document.getElementById('tournament-title').textContent = t.title;
  document.querySelectorAll('nav.tournaments button').forEach(b =>
    b.classList.toggle('active', b.dataset.key === key));
  renderTabs();
  loadActiveTab();
  updateTimestamp();
}

function updateTimestamp(){
  document.getElementById('updated-at').textContent =
    'Оновлено: ' + new Date().toLocaleTimeString('uk-UA', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

async function refreshAll(){
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  Object.keys(cache).forEach(k => delete cache[k]);
  await loadActiveTab();
  updateTimestamp();
  btn.disabled = false;
}

document.getElementById('refresh-btn').addEventListener('click', refreshAll);

/* ======== КАБІНЕТ (модалка з app.html) ======== */
(function(){
  const overlay = document.getElementById('cabinet-overlay');
  const frame   = document.getElementById('cabinet-frame');
  const btn     = document.getElementById('cabinet-btn');
  const closeBtn= document.getElementById('cabinet-close');

  // Чи є жива сесія Supabase — щоб підписати кнопку
  function signedIn(){
    try{
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.startsWith('sb-') && k.endsWith('-auth-token')) return true;
      }
    }catch(e){}
    return false;
  }
  function labelBtn(){
    btn.textContent = signedIn() ? '⚽ Мій кабінет' : '⚽ Увійти';
  }
  labelBtn();

  // Який кабінет вантажити: Squad-турнір → власний Squad-кабінет (той
  // самий, що робили для Squad), решта — BoBet-кабінет. Та сама кнопка.
  async function desiredCabinetSrc(){
    const stage = /(^|\/)test\.html$/.test(location.pathname);
    if (typeof activeTournament !== 'undefined' && activeTournament
        && activeTournament.source === 'squad'){
      return stage ? 'squad-cabinet-stage.html' : 'squad-cabinet.html';
    }
    let appSrc = 'app.html';
    // На test.html пробуємо тестовий кабінет; якщо його не залито —
    // тихо відкриваємо бойовий, щоб кнопка ніколи не була «мертвою».
    if (stage){
      try {
        const r = await fetch('app-test.html', { method: 'HEAD' });
        if (r.ok) appSrc = 'app-test.html';
      } catch(e) {}
    }
    return appSrc;
  }

  async function open(){
    // Модалку показуємо одразу
    overlay.classList.add('open');
    document.body.classList.add('cabinet-lock');
    // src залежить від активного турніру (BoBet vs Squad) — перевіряємо
    // щоразу, бо між відкриттями турнір міг змінитись.
    const want = await desiredCabinetSrc();
    if (frame.getAttribute('src') !== want){
      frame.setAttribute('src', want);
    }
  }
  function close(){
    overlay.classList.remove('open');
    document.body.classList.remove('cabinet-lock');
    labelBtn();
  }

  btn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) close();
  });

  // app.html може попросити закритись: parent.postMessage('bobet:close','*')
  window.addEventListener('message', e => {
    if (e.data === 'bobet:close') close();
  });

  // #cabinet у посиланні одразу відкриває кабінет
  if (location.hash === '#cabinet') open();
})();

/* ======== INIT ======== */
/* ⚠️ ВБУДОВАНИЙ БОРД: `test.html?board=aug2026` — та сама сторінка, але
   лише таблиця етапу, без шапки й навігації (CSS `body.embed`). Її
   показує кабінет у вкладці «All Games».

   Рішення Богдана 14.08.2026 з трьох варіантів: скопіювати код борда в
   кабінет означало б ~1500 рядків другої копії, яка розійшлася б із
   сайтом мовчки при першій же правці самого борда.

   ⚠️ Тут НЕ кличеться `setTournament()` — він, крім вибору турніру,
   малює обидві навігації й пише заголовок, тобто робить рівно те, що в
   кабінеті зайве. Ставимо турнір і вкладку напряму й одразу вантажимо
   вміст. `checkEuroseasonLive()` теж пропускаємо: це запит у базу
   заради бейджа LIVE на кнопці, якої тут не видно. */
const EMBED_BOARD = new URLSearchParams(location.search).get('board');
if(EMBED_BOARD){
  document.body.classList.add('embed');
  const et = TOURNAMENTS.find(x => x.key === 'euroseason2026');
  const ei = et ? et.tabs.findIndex(tb => tb.source === 'month' && tb.monthKey === EMBED_BOARD) : -1;
  if(ei >= 0){
    activeTournament = et;
    activeTabIndex   = ei;
    loadActiveTab();
  }else{
    document.getElementById('content').innerHTML =
      '<div class="status-line err">Невідомий етап: ' + escapeHtml(EMBED_BOARD) + '</div>';
  }
}else{
  renderTournaments();
  setTournament(activeTournament.key);
  checkEuroseasonLive().then(v => { EUROSEASON_LIVE = v; renderTournaments(); });
}
setInterval(() => {
  if (!document.getElementById('cabinet-overlay').classList.contains('open')) refreshAll();
}, 300000);
</script>
