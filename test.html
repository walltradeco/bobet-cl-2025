  // відповіді на бонусні питання («на якій стадії вилетить Ліверпуль»),
  // а не числа й не дати. Справжні дати в архіві завжди з роком
  // (15.08.2026), тож коротка форма ні з чим не плутається.
  const stage = /^0?1\.(02|04|08|16|32)$/.exec(t);
  if(stage) return '1/' + Number(stage[1]);
  // Рахунки, які Google Sheets прийняв за час: «11:11» він зберіг як
  // «11:11:00». Справжніх часів у рахунках архіву немає (дати завжди
  // з роком), тож H:M:SS — це завжди зіпсований рахунок. Женин 11:11
  // на Аргентина–Іспанія (нічия, +1 очко) — саме цей випадок.
  const timeScore = /^(\d{1,2}):(\d{1,2}):\d{2}$/.exec(t);
  if(timeScore) return timeScore[1] + ':' + timeScore[2];
  return t;
}

/* Known participant names across all tournaments — used to reliably locate the
   player header row regardless of surrounding structure. */
const KNOWN_PLAYERS = ['бо','лб','антон','макс','саня','миша','женя','денис','андрей','андрій'];
function isKnownPlayer(name){
  return KNOWN_PLAYERS.includes(cellStr(name).toLowerCase());
}

/* Клітинка вважається "порожньою" для гравця: службові й нульові значення. */
function isBlankCell(v){
  const s = cellStr(v);
  return s === '' || s === '0' || s === '-' || s === '#REF!' ||
         /^points?$/i.test(s) || /^prediction$/i.test(s) || isPlaceholderName(s);
}

/* Таблиці мають дубльовані колонки (двічі «Женя») і колонки учасників, які цей
   турнір не грають (усе порожнє, тотал 0). Прибираємо і те, і те. */
function filterActivePlayers(rows, players, startRow, totals){
  const seen = new Set();
  const kept = [];
  for(const p of players){
    const key = cellStr(p.name).toLowerCase();
    if(seen.has(key)) continue;
    let hasData = false;
    for(let ri = startRow; ri < rows.length && !hasData; ri++){
      if(!isBlankCell(rows[ri][p.col])) hasData = true;
    }
    const tot = totals ? toNum(totals[p.col]) : null;
    if(!hasData && !tot) continue;
    seen.add(key);
    kept.push(p);
  }
  return kept.length >= 2 ? kept : players;
}
// find the row that contains player names and return {rowIdx, players:[{col,name}]}
function findPlayersRow(rows, minCol){
  minCol = minCol || 0;
  for(let ri = 0; ri < rows.length; ri++){
    const cand = [];
    for(let ci = minCol; ci < rows[ri].length; ci++){
      if(isKnownPlayer(rows[ri][ci])) cand.push({ col: ci, name: cellStr(rows[ri][ci]) });
    }
    if(cand.length >= 2) return { rowIdx: ri, players: cand };
  }
  return null;
}
// find the Points totals row: has "Points" label and numbers in player columns
function findTotalsRow(rows, players){
  for(let ri = 0; ri < rows.length; ri++){
    if(rows[ri].some(v => /^points$/i.test(cellStr(v))) &&
       players.some(p => toNum(rows[ri][p.col]) !== null)){
      const t = {};
      players.forEach(p => { const n = toNum(rows[ri][p.col]); if(n !== null) t[p.col] = n; });
      return t;
    }
  }
  return null;
}
function isPlaceholderName(name){
  return /^№\s*\d+$/.test(name.trim());
}
function toNum(v){
  const n = parseFloat(String(v).replace(',', '.'));
  return isNaN(n) ? null : n;
}
function parseScore(s){
  const m = cellStr(s).match(/^(\d+)\s*[:\-–]\s*(\d+)$/);
  if(!m) return null;
  return [Number(m[1]), Number(m[2])];
}
function outcomeSign(pair){
  return pair[0] > pair[1] ? 1 : pair[0] < pair[1] ? -1 : 0;
}
function stageClass(title){
  const t = title.toLowerCase();
  if(t.includes('general')) return 'stage-general';   // золота смуга — лише справжній General
  if(t.includes('knockout')) return 'stage-knockout';
  if(t.includes('play')) return 'stage-playoff';
  if(t.includes('group')) return 'stage-group';
  // Етапи EuroSeason 2026 — свій колір кожному місяцю (як архівні
  // Group/Play-off/Knockout). Місяці не зустрічаються в назвах бордів
  // архіву, тож ці гілки чіпають лише живий сезон.
  if(t.includes('august'))    return 'stage-aug';
  if(t.includes('september')) return 'stage-sep';
  if(t.includes('october'))   return 'stage-oct';
  return '';
}

/* ======== LEADERBOARDS ======== */
function renderLeaderboard(data){
  const rows = data.rows;
  const nCols = Math.max(0, ...rows.map(r => r.length));

  // Find the header row: the one containing "Name" cells. Each "Name" cell marks a board
  // whose columns are [№ | Name | Points] = [ci-1 | ci | ci+1]. The board title sits in
  // the row(s) above, spanning that block.
  // У таблиці буває кілька блоків «№ | Name | Points»: службові копії без
  // заголовків і справжні борди із заголовком над ними. Збираємо всі рядки-шапки
  // і далі обираємо той, у якого борди підписані.
  const candidates = [];
  for(let ri = 0; ri < rows.length; ri++){
    const cols = [];
    for(let ci = 0; ci < nCols; ci++){
      if(/^name$/i.test(cellStr(rows[ri][ci]))) cols.push(ci);
    }
    if(cols.length) candidates.push({ rowIdx: ri, cols });
  }
  if(candidates.length === 0) return renderGenericTable(data);

  let best = null;
  for(const cand of candidates){
    const built = buildLeaderboardBoards(rows, nCols, cand.rowIdx, cand.cols);
    const titled = built.filter(b => b.title).length;
    if(!best || titled > best.titled || (titled === best.titled && built.length > best.boards.length)){
      best = { titled, boards: built, headerRowIdx: cand.rowIdx };
    }
  }
  const boards = best.boards;
  const headerRowIdx = best.headerRowIdx;

  // Keep only boards that have a real stage title. Hidden helper copies have none.
  const titled = boards.filter(b => b.title);
  let finalBoards;
  if(titled.length >= 1){
    finalBoards = titled;
  } else {
    // Fall back to this tournament's explicit board names.
    const STD = LEADERBOARD_NAMES[activeTournament.key] || ['Group', 'Play-off', 'General'];
    finalBoards = boards.map((b, i) => ({ ...b, title: STD[i] || `Board ${i + 1}` }));
  }
  if(finalBoards.length === 0) return renderGenericTable(data);

  let out = renderBoards(finalBoards);

  // Season-номінації MVP/Rivals призового фонду — лише коли є живі
  // season-дані (fetchSupabaseTab кладе їх у data.prizeBoard; архівні
  // борди цього поля не мають). Окремий рядок нижче основних чотирьох —
  // не тулимо в той самий flex-ряд, інакше він ламається на п'ятому/
  // шостому борді. Той самий renderBoards — тайбрейк і медалі рахуються
  // так само, як в August/September/October/General.
  if(data.prizeBoard && data.prizeBoard.length){
    const prizeBoards = [
      {
        title: 'MVP — найбільше нагород за турнір',
        titleHtml: '<span style="color:var(--gold);font-weight:700">MVP</span> — найбільше нагород за турнір',
        entries: data.prizeBoard.map(r => ({ name: r.display_name, pts: r.mvp_count, delta: r.mvp_delta ?? null }))
      },
      {
        title: '⚔️ Rivals — найбільше перемог за турнір',
        entries: data.prizeBoard.map(r => ({ name: r.display_name, pts: r.rival_wins, delta: r.rival_delta ?? null }))
      }
    ];
    out += `<div class="boards-subhead">Окремі номінації призового фонду · рахується наскрізно за весь турнір</div>`
         + renderBoards(prizeBoards);
  }

  return out;
}

function buildLeaderboardBoards(rows, nCols, headerRowIdx, nameCols){
  const boards = [];
  for(const nameCol of nameCols){
    const ptsCol = nameCol + 1;
    const deltaCol = ptsCol + 1;
    // title: nearest non-empty text above this board. Merged stage titles in CSV land
    // in the leftmost cell of the merged range, so scan a few columns left of Name too.
    let title = '';
    for(let up = 1; up <= 5 && headerRowIdx - up >= 0 && title === ''; up++){
      for(const tc of [nameCol - 1, nameCol, nameCol - 2, nameCol - 3, ptsCol]){
        if(tc < 0 || tc >= nCols) continue;
        const t = cellStr(rows[headerRowIdx - up][tc]);
        if(t !== '' && !/^(№|#|name|points?)$/i.test(t) && toNum(t) === null && !parseScore(t)){ title = t; break; }
      }
    }
    const entries = [];
    for(let di = headerRowIdx + 1; di < rows.length; di++){
      const name = cellStr(rows[di][nameCol]);
      const pts = toNum(rows[di][ptsCol]);
      if(name === '' || isPlaceholderName(name)) continue;
      if(pts === null) continue;
      const delta = toNum(rows[di][deltaCol]);   // null для архіву — там немає зміни місця
      entries.push({ name, pts, delta });
    }
    // Учасники, які цей турнір не грають, стоять у таблиці з 0. Ховаємо їх, але
    // лише коли турнір уже стартував (є хоч кілька ненульових результатів).
    const scored = entries.filter(e => e.pts > 0);
    const shown = scored.length >= 3 ? scored : entries;
    if(shown.length) boards.push({ title, entries: shown });
  }
  return boards;
}

// Зміна місця з останнього знімку (файл 116). null/undefined — немає
// даних (архів, або живий борд ще не мав жодного знімку) — не показуємо
// нічого, а не «=», щоб не брехати «нуль змін», коли просто нема історії.
function lbDelta(d){
  if(d === null || d === undefined || d === '') return '';
  if(d > 0)  return `<span class="lb-up">▲${d}</span>`;
  if(d < 0)  return `<span class="lb-down">▼${-d}</span>`;
  return `<span class="lb-same">=</span>`;
}

function renderBoards(finalBoards){

  return `<div class="boards">${finalBoards.map(b => {
    const sorted = [...b.entries].sort((a, z) => z.pts - a.pts);
    // tie-aware: assign each entry a "place" (1-based). Tied entries share the same place.
    const labels = [];
    const places = []; // best place index for coloring (0-based rank)
    let pos = 1, k = 0;
    while(k < sorted.length){
      let j = k;
      while(j + 1 < sorted.length && sorted[j+1].pts === sorted[k].pts) j++;
      const size = j - k + 1;
      const label = size === 1 ? String(pos) : Array.from({length:size}, (_, q) => pos + q).join('&');
      for(let q = k; q <= j; q++){ labels[q] = label; places[q] = pos - 1; }
      pos += size;
      k = j + 1;
    }
    return `
    <div class="board ${stageClass(b.title)}">
      <div class="board-head">${b.titleHtml || escapeHtml(b.title)}</div>
      ${sorted.map((e, idx) => {
        const place = places[idx]; // 0=first, 1=second, 2=third (shared across ties)
        const placeCls = place === 0 ? 'p1' : place === 1 ? 'p2' : place === 2 ? 'p3' : '';
        // podium places show ONLY a medal (shared across ties); others show the numeric place.
        // General — залік за весь турнір, не етап — тому перше місце отримує ще й
        // 🏆 поруч із 🥇, щоб на око відрізнялось від будь-якого етапного 🥇.
        const isGeneral = /general/i.test(b.title);
        const rankInner = place < 3
          ? `<span class="crown">${MEDALS[place]}${place === 0 && isGeneral ? '🏆' : ''}</span>`
          : escapeHtml(labels[idx]);
        return `
        <div class="lb-row ${placeCls}">
          <div class="lb-rank">${rankInner}</div>
          <div class="lb-name">${escapeHtml(canonPerson(e.name))}</div>
          <div class="lb-delta">${lbDelta(e.delta)}</div>
          <div class="lb-pts">${e.pts}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('')}</div>`;
}

/* ======== POINTS SUMMARY (спільний блок карток над будь-якою вкладкою) ========
   players: [{col,name}], totals: {col: number} або масив чисел у порядку players. */
function renderPointsSummary(players, totals){
  if(!players || !players.length || !totals) return '';
  const val = (p, i) => {
    if(Array.isArray(totals)) return totals[i];
    return totals[p.col];
  };
  if(players.every((p, i) => val(p, i) === undefined || val(p, i) === null || val(p, i) === '')) return '';
  return `
    <div class="gp-summary">
      ${players.map((p, i) => {
        const v = val(p, i);
        return `
        <div class="gp-summary-cell">
          <span class="rv-badges">${mvpBadge(p.name)}${rivalBadge(p.name)}${styleBadge(p.name)}</span>
          <span class="gp-summary-name">${escapeHtml(canonPerson(p.name))}</span>
          <span class="gp-summary-pts">${escapeHtml(v === undefined || v === null || v === '' ? '0' : String(v))}</span>
        </div>`;
      }).join('')}
    </div>`;
}

/* Бейдж ⚔️ з дуелями учасника біля його імені в рядку Points.
   Показуємо лише в місячній таблиці EuroSeason (LIVE_RIVALS != null).
   Деталі кожної дуелі — у підказці по наведенню. */
function rivalBadge(name){
  if(!LIVE_RIVALS) return '';
  const duels = LIVE_RIVALS[name];
  if(!duels || !duels.length) return '';
  const label = { win: 'переміг', draw: 'нічия', loss: 'поразка', pending: 'очікує' };
  const rows = duels
    .slice()
    .sort((a, b) => a.gw - b.gw)
    .map(d => {
      const txt = label[d.status] || d.status;
      const pts = d.status === 'pending' ? '' : ` +${d.points}/2`;
      return `<div class="rv-tip-row">Вікенд ${d.gw}: проти ${escapeHtml(d.rival)}
      · <span class="${d.status}">${txt}${pts}</span></div>`;
    })
    .join('');
  return `<span class="rv-badge">⚔️<span class="rv-tip">${rows}</span></span>`;
}

/* Бейдж 👔 з тренерськими стилями учасника — поруч із ⚔️ Rivals.
   Показуємо лише в місячній таблиці (LIVE_STYLES != null). У підказці —
   який стиль на якому вікенді і скільки дав. Якщо стеля етапу зрізала
   бали, пишемо це явно, інакше «+3 із 6» виглядало б як помилка. */
function styleBadge(name){
  if(!LIVE_STYLES) return '';
  const picks = LIVE_STYLES[name];
  if(!picks || !picks.length) return '';
  const rows = picks
    .slice()
    .sort((a, b) => a.gw - b.gw)
    .map(s => {
      const capTxt = LIVE_STYLE_CAP ? '/' + LIVE_STYLE_CAP : '';
      const pts = s.scored
        ? `<span class="win">+${s.points}${capTxt}</span>${s.capped ? ` <span class="cap">(зі ${s.raw}, стеля)</span>` : ''}`
        : '<span class="pending">очікує</span>';
      return `<div class="rv-tip-row">Вікенд ${s.gw}: ${escapeHtml(s.title)} · ${pts}</div>`;
    })
    .join('');
  return `<span class="rv-badge">👔<span class="rv-tip">${rows}</span></span>`;
}

/* Бейдж 🏆 з турами, де учасник став MVP. Показуємо лише в місячній
   таблиці (LIVE_MVP != null). Кількість MVP видно як «×N», деталі —
   у підказці по наведенню. */
function mvpBadge(name){
  if(!LIVE_MVP) return '';
  const wins = LIVE_MVP[name];
  if(!wins || !wins.length) return '';
  const rows = wins
    .slice()
    .sort((a, b) => a.gw - b.gw)
    .map(w => `<div class="rv-tip-row">Вікенд ${w.gw}: MVP
      · <span class="win">+${w.points}</span></div>`)
    .join('');
  const count = wins.length > 1 ? `<span class="rv-count">${wins.length}</span>` : '';
  return `<span class="rv-badge" style="color:var(--gold);font-weight:700;font-size:11px;letter-spacing:0.03em">MVP${count}<span class="rv-tip">${rows}</span></span>`;
}

/* ======== MATCHES ======== */
const GROUP_PALETTE = ['#E8944A','#9AA5A8','#A98FDB','#5FB3B3','#7CC47F','#D9C79A','#D07777','#5E97D0'];

function isDateLike(s){
  return /\d{1,2}\.\d{1,2}(\.\d{2,4})?/.test(s);
}

function findMatchesLayout(rows){
  for(let ri = 0; ri < Math.min(rows.length, 12); ri++){
    const r = rows[ri];
    let dateCol = -1, gameCol = -1, resCol = -1;
    r.forEach((v, ci) => {
      const s = cellStr(v).toLowerCase();
      if(s === 'date' && dateCol === -1) dateCol = ci;
      if((s === 'game' || s === 'match') && gameCol === -1) gameCol = ci;
      if((s === 'result' || s === 'score') && resCol === -1) resCol = ci;
    });
    // Game + Result are required; Date is optional (Knockout tabs may omit it)
    if(gameCol !== -1 && resCol !== -1){
      // If no explicit "Date" header found, check the column to the left of Game:
      // if body rows there hold date-like values, it's the date column.
      if(dateCol === -1 && gameCol - 1 >= 0){
        let dateHits = 0;
        for(let bi = ri + 1; bi < Math.min(rows.length, ri + 12); bi++){
          if(isDateLike(cellStr(rows[bi][gameCol - 1]))) dateHits++;
        }
        if(dateHits >= 1) dateCol = gameCol - 1;
      }
      // Locate players reliably by known names (works for both old and new layouts).
      let players = [];
      const pr = findPlayersRow(rows, resCol + 1);
      if(pr) players = pr.players;
      // fallback: any text cells to the right of Result on the header row
      if(players.length === 0){
        for(let ci = resCol + 1; ci < r.length; ci++){
          const name = cellStr(r[ci]);
          if(name !== '' && !isPlaceholderName(name) && toNum(name) === null){
            players.push({ col: ci, name });
          }
        }
      }
      if(players.length === 0) return null;
      // totals: спершу шукаємо рядок з підписом "Points"…
      let totals = findTotalsRow(rows, players);
      // …а якщо підпису немає (Group / Play-off / Knockout: числа просто стоять
      // у рядку над іменами) — беремо найближчий рядок вище з числами в колонках гравців.
      if(!totals){
        const namesRow = pr ? pr.rowIdx : ri;
        for(let up = namesRow - 1; up >= 0 && !totals; up--){
          const t = {};
          let hits = 0;
          players.forEach(p => {
            const n = toNum(rows[up][p.col]);
            if(n !== null){ t[p.col] = n; hits++; }
          });
          if(hits >= 2) totals = t;
        }
      }
      // прибираємо дублі імен і колонки без даних (Денис/Андрій/друга «Женя»)
      players = filterActivePlayers(rows, players, (pr ? pr.rowIdx : ri) + 1, totals);
      return { headerRow: ri, dateCol, gameCol, resCol, players, totals };
    }
  }
  return null;
}

/* Group compositions block (Group A ... Group F with team lists) */
function extractGroupsBlock(rows, headerRow, minCol, maxCol){
  const groups = [];
  const seen = new Set();
  const searchLimit = Math.max(0, headerRow - 1);
  for(let ri = 0; ri < searchLimit; ri++){
    const r = rows[ri];
    for(let ci = 0; ci <= Math.min(r.length - 1, maxCol); ci++){
      const v = cellStr(r[ci]);
      if(/^group\s+\S+$/i.test(v)){
        const key = v.toLowerCase();
        if(seen.has(key)) continue; // hidden duplicates repeat the same titles
        const teams = [];
        for(let di = ri + 1; di < headerRow; di++){
          const t = cellStr(rows[di][ci]);
          if(t === '' || toNum(t) !== null || /^points?$/i.test(t)) break;
          teams.push(t);
        }
        if(teams.length){
          seen.add(key);
          groups.push({ title: v, teams });
        }
      }
    }
    if(groups.length) break; // group titles all live on one row
  }
  return groups;
}

function renderGroupsBlock(groups){
  if(!groups.length) return '';
  return `<div class="groups-grid">${groups.map((g, i) => {
    const color = GROUP_PALETTE[i % GROUP_PALETTE.length];
    return `
    <div class="group-card">
      <div class="g-head" style="color:${color}; box-shadow:inset 0 3px 0 ${color};">${escapeHtml(g.title)}</div>
      ${g.teams.map(t => `<div class="g-team">${withFlag(t)}</div>`).join('')}
    </div>`;
  }).join('')}</div>`;
}

/* ======== BOOSTS (2х / 3х / Double prediction / Overtime) ========
   Внизу аркуша Play-off / Knockout лежить блок:
   [ | Boosts (only 1/8, 1/4,1/2) | ... ]
   [ | | 2х | <матч Бо> | <матч Лб> | ... ]
   Підпис буста — остання непорожня клітинка ліворуч від колонок гравців. */
function findBoostsRow(rows, headerRow, players){
  const firstPCol = Math.min(...players.map(p => p.col));
  for(let ri = headerRow + 1; ri < rows.length; ri++){
    for(let ci = 0; ci < firstPCol; ci++){
      if(/^boosts\b/i.test(cellStr(rows[ri][ci]))) return ri;
    }
  }
  return -1;
}

function extractBoosts(rows, startRow, players){
  if(startRow === -1) return null;
  const firstPCol = Math.min(...players.map(p => p.col));
  let title = '';
  for(let ci = 0; ci < firstPCol; ci++){
    const v = cellStr(rows[startRow][ci]);
    if(/^boosts\b/i.test(v)){ title = v; break; }
  }
  const items = [];
  for(let ri = startRow + 1; ri < rows.length; ri++){
    let label = '';
    for(let ci = firstPCol - 1; ci >= 0; ci--){
      const v = cellStr(rows[ri][ci]);
      if(v !== ''){ label = v; break; }
    }
    const vals = players.map(p => cellStr(rows[ri][p.col]));
    if(label === '' && vals.every(v => v === '')) continue;
    if(label === '') continue;
    items.push({ label, vals });
  }
  return items.length ? { title: title || 'Boosts', items } : null;
}

function renderBoostsBlock(boosts, players, predMap){
  if(!boosts) return '';
  predMap = predMap || {};
  return `
  <div class="table-card boosts-card">
    <table class="sheet-table boosts">
      ${colGroup([14], players.length)}
      <thead>
        <tr>
          <th class="boost-head">${escapeHtml(boosts.title)}</th>
          ${players.map(p => `<th class="boost-player">${escapeHtml(canonPerson(p.name))}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${boosts.items.map(it => `
          <tr>
            <td class="boost-label ${boostKind(it.label)}">${escapeHtml(it.label)}</td>
            ${it.vals.map((v, i) => {
              const lines = cellStr(v).split(/\r?\n/).map(cellStr).filter(Boolean);
              if(!lines.length) return '<td class="boost-val">—</td>';
              const game = lines[0];
              const scores = lines.slice(1).join(' ').split('/').map(cellStr).filter(Boolean);
              // жирним — той рахунок, який реально стоїть у таблиці матчів
              const counted = cellStr(predMap[players[i].col + '|' + normGame(game)]);
              const scoreHtml = scores.length
                ? `<span class="boost-scores">${scores.map(sc =>
                    counted && sc === counted ? `<b>${escapeHtml(sc)}</b>` : escapeHtml(sc)).join(' / ')}</span>`
                : '';
              return `<td class="boost-val">${gameWithFlags(game)}${scoreHtml}</td>`;
            }).join('')}
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

/* Прапорець джерела. Ставиться в точках входу: fetchSupabaseTab —
   живий EuroSeason, fetchSheet — архів. Потрібен тому, що підписи
   бустів у архіві й у EuroSeason частково однакові («2х», «Double
   Predict»), і за текстом їх не розрізнити. Архів має лишитись
   у старих кольорах із Google Sheets, EuroSeason — у нових. */
let LIVE_BOOSTS = false;

/* Дуелі Rivals для рядка Points місячної таблиці. null — не показувати
   бейджі (архів, інші вкладки). Заповнює buildMonthRows, читає
   renderPointsSummary. Формат: { 'Ім'я': [{rival, status, gw}], ... } */
let LIVE_RIVALS = null;

/* MVP по вікендах для бейджа 🏆 в рядку Points. null — не показувати.
   Формат: { 'Ім'я': [{gw, points}], ... } */
let LIVE_MVP = null;

/* Тренерські стилі етапу (файл 78) для бейджа 👔 біля імені.
   Формат: { 'Ім'я': [{gw, title, icon, photo, points, scored}], ... }
   null — таблиця не місячна (архів, Leaderboards), бейджів немає. */
let LIVE_STYLES = null;

/* Стеля Manager Style за вікенд (3 у серпні, 4 далі) — тільки для
   тексту підказки бейджа 👔, «+1/3» замість голого «+1». */
let LIVE_STYLE_CAP = null;

/* Тип буста за підписом.
   Архів дає людський підпис із Google Sheets, EuroSeason — назву
   або код із Supabase, тому ловимо і те, і те. Порядок перевірок
   має значення: «3x» шукаємо раніше за «total 3.5», інакше тройка
   з тоталу зловиться першою. */
function boostKind(label){
  const s = cellStr(label).toLowerCase();
  let k;
  if(/double|dp\b/.test(s))                       k = 'bdp';
  else if(/goal_diff|різниц|разниц/.test(s))      k = 'bgd';
  else if(/autopilot|автопілот|автопилот/.test(s))k = 'bap';
  else if(/btts|обидв|обе\s|both/.test(s))        k = 'bbt';
  else if(/^3\s*[хx]|\bx3\b/.test(s))             k = 'b3x';
  else if(/^2\s*[хx]|\bx2\b/.test(s))             k = 'b2x';
  else if(/under|андер|2\.5|менше 2/.test(s))     k = 'bun';
  else if(/total|тотал|3\.5/.test(s))             k = 'btot';
  else if(/overtime|овертайм|додатков/.test(s))   k = 'bot';
  else                                            k = 'bgen';

  if(!LIVE_BOOSTS) {
    // В архіві є лише п'ять класів; чого нема — в запасний.
    return ['b2x','b3x','bdp','bot','bgen'].includes(k) ? k : 'bgen';
  }
  // EuroSeason: свій набір, овертайму тут не буває
  return k === 'bot' || k === 'bgen' ? 'bgen' : 'l' + k;
}

/* Нормалізація назви матчу, щоб «Франція - Швеція » з блоку бустів збіглася
   з «Франція - Швеція» у таблиці матчів. */
function normGame(s){
  return cellStr(s).toLowerCase().replace(/[–—]/g, '-').replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ').trim();
}

/* key: "<колонка гравця>|<матч>" -> { kind, label, scores:[...] } */
function buildBoostMap(boosts, players){
  const map = {};
  if(!boosts) return map;
  for(const item of boosts.items){
    const kind = boostKind(item.label);
    item.vals.forEach((val, i) => {
      const lines = cellStr(val).split(/\r?\n/).map(cellStr).filter(Boolean);
      if(!lines.length) return;
      const game = lines[0];
      const scores = [];
      lines.slice(1).join(' ').split('/').forEach(part => {
        const p = cellStr(part);
        if(parseScore(p)) scores.push(p);
      });
      map[players[i].col + '|' + normGame(game)] = { kind, label: item.label, scores };
    });
  }
  return map;
}

/* Рівномірна сітка колонок: службові колонки мають фіксовану частку, всі
   колонки гравців — однакову. Без цього довші імена (Антон, Андрей) розтягують
   свою колонку більше за решту. */
function colGroup(metaWidths, playerCount){
  const meta = metaWidths.reduce((a, b) => a + b, 0);
  const per = playerCount ? Math.min(11, (100 - meta) / playerCount) : 0;
  const used = meta + per * playerCount;
  // залишок віддаємо першій «широкій» колонці (Game / Question)
  const extra = 100 - used;
  const extraIdx = Math.max(0, metaWidths.length - 2);
  return `<colgroup>${metaWidths.map((w, i) =>
      `<col style="width:${(i === extraIdx ? w + extra : w).toFixed(2)}%">`).join('')
    }${Array.from({length: playerCount}, () => `<col style="width:${per.toFixed(2)}%">`).join('')}</colgroup>`;
}

function renderMatches(data){
  const rows = data.rows;
  const layout = findMatchesLayout(rows);
  if(!layout) return null;
  const { headerRow, dateCol, gameCol, resCol, players } = layout;
  let totals = layout.totals;

  // Блок бустів іде окремо в кінці аркуша — виносимо його з таблиці матчів.
  const boostsStart = findBoostsRow(rows, headerRow, players);

  const body = [];
  const predMap = {};
  let lastDate = '';
  let filledDate = '';   // last non-empty, date-like value seen (for merge forward-fill)
  let dayIndex = 0;
  const bodyEnd = boostsStart === -1 ? rows.length : boostsStart;
  for(let ri = headerRow + 1; ri < bodyEnd; ri++){
    const r = rows[ri];
    // Клітинка матчу може нести другий рядок — назву турніру («УПЛ»,
    // «Суперкубок Англії»). Відрізаємо його одразу, щоб уся логіка
    // нижче працювала з чистою назвою пари, як і раніше.
    const gameCell = cellStr(r[gameCol]);
    const gameLines = gameCell.split('\n');
    const game = gameLines[0].trim();
    const comp = (gameLines[1] || '').trim();
    const rawDate = cellStr(r[dateCol]);
    const preds = players.map(p => cellStr(r[p.col]));

    // рядок тоталів («Points | | | 12 | 10 | …») — не стадія і не матч
    if(/^points?$/i.test(rawDate) || /^points?$/i.test(game)) continue;

    if(game === ''){
      // stage separator (merged "1/8", "Semifinals", "Final" lands in the date column)
      if(rawDate !== '' && !isDateLike(rawDate)){
        // this row may carry the totals (Play-off layout)
        if(!totals){
          const t = {};
          let any = false;
          players.forEach((p, pi) => {
            const n = toNum(preds[pi]);
            if(n !== null){ t[p.col] = n; any = true; }
          });
          if(any) totals = t;
        }
        body.push({ sep: true, label: rawDate });
      }
      continue;
    }
    // a stage label can also land in the game column
    if(cellStr(r[resCol]) === '' && !isDateLike(rawDate) && rawDate === '' && preds.every(v => v === '' || toNum(v) !== null) && !parseScore(game) && preds.some(v => toNum(v) !== null)){
      if(!totals){
        const t = {};
        players.forEach((p, pi) => {
          const n = toNum(preds[pi]);
          if(n !== null) t[p.col] = n;
        });
        totals = t;
      }
      body.push({ sep: true, label: game });
      continue;
    }
    // рядок-стадія, у якого підпис лежить у колонці Game, а прогнози порожні
    // ("1/8", "1/4", "Фінал" у старих турнірах)
    if(cellStr(r[resCol]) === '' && !parseScore(game) && !splitGame(game) && preds.every(v => v === '') &&
       (rawDate === '' || !isDateLike(rawDate)) && game.length <= 40){
      body.push({ sep: true, label: game });
      continue;
    }

    // forward-fill so every match row carries its date.
    if(rawDate !== '' && isDateLike(rawDate)) filledDate = rawDate;
    const dateVal = filledDate;
    const isDayStart = dateVal !== '' && dateVal !== lastDate;
    if(isDayStart){ lastDate = dateVal; dayIndex++; }
    const resultCell = cellStr(r[resCol]);
    body.push({ date: dateVal, isDayStart, dayIndex, game, comp, result: resultCell, preds });
    // Жирним у блоці Boosts позначаємо рахунок, який реально зарахований —
    // а це видно лише коли матч уже зіграний. Без цієї умови перша з двох
    // цифр Double Predict завжди збігалась з основним прогнозом і завжди
    // жирніла, навіть коли матч іще не почався.
    if(resultCell !== ''){
      players.forEach((p, pi) => {
        if(preds[pi] !== '') predMap[p.col + '|' + normGame(game)] = preds[pi];
      });
    }
  }
  if(body.filter(b => !b.sep).length === 0) return null;

  const groups = extractGroupsBlock(rows, headerRow, Math.min(...players.map(p => p.col)), Math.max(...players.map(p => p.col)));
  const boosts = extractBoosts(rows, boostsStart, players);
  const boostMap = buildBoostMap(boosts, players);
  const usedKinds = [...new Set(Object.values(boostMap).map(b => b.kind + '\u0000' + b.label))]
    .map(s => ({ kind: s.split('\u0000')[0], label: s.split('\u0000')[1] }));
  const hasDate = dateCol !== -1;
  const nCols = (hasDate ? 3 : 2) + players.length;

  return `
  ${renderPointsSummary(players, totals)}
  ${renderGroupsBlock(groups)}
  <div class="matches-card">
    <table class="matches">
      ${colGroup(hasDate ? [9, 26, 9] : [26, 9], players.length)}
      <thead>
        <tr>
          ${hasDate ? '<th class="meta">Date</th>' : ''}
          <th class="meta th-game">Game</th>
          <th class="meta th-result" style="text-align:center;">Result</th>
          ${players.map(p => `<th class="p-name-cell">${escapeHtml(canonPerson(p.name))}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${body.map(row => {
          if(row.sep){
            return `<tr class="sep-row"><td colspan="${nCols}">${escapeHtml(row.label)}</td></tr>`;
          }
          const resPair = parseScore(row.result);
          return `
          <tr class="${row.isDayStart ? 'day-start' : ''} ${row.dayIndex % 2 === 0 ? 'day-even' : ''}">
            ${hasDate ? `<td class="c-date">${escapeHtml(row.date)}</td>` : ''}
            <td class="c-game">${row.comp
              ? `<span class="comp-tag">${escapeHtml(row.comp)}</span>` : ''
              }${gameWithFlags(row.game)}</td>
            <td class="c-result">${row.result ? `<span class="result-pill">${escapeHtml(row.result)}</span>` : '—'}</td>
            ${row.preds.map((pv, pi) => {
              const pPair = parseScore(pv);
              const boost = boostMap[players[pi].col + '|' + normGame(row.game)];
              // Double prediction: у блоці бустів лежать обидва рахунки, у таблиці — зарахований.
              const alt = boost && boost.scores.length > 1
                ? boost.scores.find(s => parseScore(s) && cellStr(s) !== cellStr(pv))
                : null;
              const altPair = alt ? parseScore(alt) : null;
              const hit = p => resPair && p && p[0] === resPair[0] && p[1] === resPair[1];
              const exact = hit(pPair) || hit(altPair);
              // вгаданий лише результат (перемога/нічия/поразка) — 1 очко
              const sameSide = p => resPair && p && outcomeSign(p) === outcomeSign(resPair);
              const outcome = !exact && (sameSide(pPair) || sameSide(altPair));
              const cls = ['pred', exact ? 'exact' : '', outcome ? 'outcome' : '',
                           boost ? 'boosted ' + boost.kind : ''].filter(Boolean).join(' ');
              const tip = boost ? ` title="${escapeHtml(boost.label)}"` : '';

              // Double Predict. Доки результату немає, жоден із двох
              // рахунків не головний — показуємо їх однаково. Щойно
              // результат внесено, нагору йде той, що приніс більше:
              // точний рахунок > вгаданий результат > нічого.
              // Раніше нагорі завжди стояв перший введений, навіть
              // якщо зарахувався другий.
              let main = pv, second = alt;
              if(alt && resPair){
                const rank = p => hit(p) ? 2 : (sameSide(p) ? 1 : 0);
                if(rank(altPair) > rank(pPair)){ main = alt; second = pv; }
              }
              const dpEven = !!alt && !resPair;
              const altHtml = second
                ? `<span class="dp-alt${dpEven ? ' dp-even' : ''}">${escapeHtml(second)}</span>`
                : '';
              return `<td class="${cls}"${tip}>${escapeHtml(main || '—')}${altHtml}</td>`;
            }).join('')}
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  <div class="legend">
    <span><span class="chip exact"></span> вгаданий точний рахунок</span>
    <span><span class="chip outcome"></span> вгаданий результат</span>
    ${usedKinds.map(k => `<span><span class="chip ${k.kind}"></span> ${escapeHtml(k.label)}</span>`).join('')}
  </div>
  ${renderBoostsBlock(boosts, players, predMap)}`;
}

/* ======== GROUP POSITIONS ========
   Layout per group block:
   [Group X | Final positions |  | P1 | P2 | ... ]  <- header-ish
   [team    | actualTeam      |  | predTeam | ...  ]  x4 teams
   Groups stacked vertically, separated by a "-" spacer row.
   A trailing "Points" row holds each player's score. */
function renderGroupPositions(data){
  const rows = data.rows.map(r => r.map(cellStr));
  const nCols = Math.max(0, ...rows.map(r => r.length));

  // "Final result" column — holds the actual final standings.
  let fpCol = -1;
  for(let ri = 0; ri < rows.length; ri++){
    const ci = rows[ri].findIndex(v => /^final (result|positions?)$/i.test(v));
    if(ci !== -1){ fpCol = ci; break; }
  }
  if(fpCol === -1) return null;

  // "Group X" title column (the seeded/composition column). Confirmed structure:
  // col0 = seed list + "Group X" title, then a spacer, fpCol = Final result, spacer, players.
  let seedCol = -1;
  for(let ri = 0; ri < rows.length && seedCol === -1; ri++){
    for(let ci = 0; ci < fpCol; ci++){
      if(/^group\s+\S+/i.test(cellStr(rows[ri][ci]))){ seedCol = ci; break; }
    }
  }
  if(seedCol === -1) seedCol = 0;

  // Players row: reliably located by known participant names (to the right of Final result).
  const pr = findPlayersRow(rows, fpCol + 1);
  if(!pr) return null;
  const players = filterActivePlayers(rows, pr.players, pr.rowIdx + 1, null);
  const totalsRow = findTotalsRow(rows, players);

  // build points summary (player -> total)
  let pointsRow = null;
  if(totalsRow){
    pointsRow = players.map(p => totalsRow[p.col] !== undefined ? String(totalsRow[p.col]) : '0');
  }

  // walk rows building group blocks
  const blocks = [];
  let cur = null;
  for(let ri = 0; ri < rows.length; ri++){
    const r = rows[ri];
    const gcell = cellStr(r[seedCol]);
    const fpHeader = /^final (result|positions?)$/i.test(cellStr(r[fpCol]));

    if(/^group\s+\S+/i.test(gcell) && fpHeader){
      if(cur && cur.teams.length) blocks.push(cur);
      cur = { title: gcell, teams: [] };
      continue;
    }
    if(cur){
      const seed = cellStr(r[seedCol]);          // composition (col 0)
      const actual = cellStr(r[fpCol]);          // final standing
      const preds = players.map(p => cellStr(r[p.col]));
      if(actual !== '' && actual !== '-'){
        cur.teams.push({ seed, actual, preds });
      } else if(seed === '' && actual === '' && preds.every(v => v === '')){
        if(cur.teams.length){ blocks.push(cur); cur = null; }
      }
    }
  }
  if(cur && cur.teams.length) blocks.push(cur);
  if(blocks.length === 0) return null;

  const body = blocks.map(b => `
    <div class="gp-block">
      <div class="gp-head">
        <span class="gp-title">${escapeHtml(b.title)}</span>
      </div>
      <table class="gp-table">
        <thead>
          <tr>
            <th>#</th>
            <th class="gp-seed-h">Склад</th>
            <th class="gp-actual-h">Final result</th>
            ${players.map(p => `<th class="gp-player">${escapeHtml(canonPerson(p.name))}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${b.teams.map((t, i) => `
            <tr>
              <td class="gp-rank">${i + 1}</td>
              <td class="gp-seed">${t.seed ? withFlag(t.seed) : ''}</td>
              <td class="gp-actualteam"><span class="result-pill">${withFlag(t.actual)}</span></td>
              ${t.preds.map(pv => {
                const correct = pv !== '' && pv === t.actual;
                return `<td class="gp-pred ${correct ? 'hit' : ''}">${withFlag(pv)}</td>`;
              }).join('')}
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`).join('');

  // Points summary on TOP (like the totals badges in other tabs)
  const pointsHeader = pointsRow ? `
    <div class="gp-summary">
      ${players.map((p, i) => `
        <div class="gp-summary-cell">
          <span class="gp-summary-name">${escapeHtml(canonPerson(p.name))}</span>
          <span class="gp-summary-pts">${escapeHtml(pointsRow[i] || '0')}</span>
        </div>`).join('')}
    </div>` : '';

  return `${pointsHeader}<div class="gp-wrap">${body}</div>
  <div class="legend"><span><span class="chip exact"></span> correct position</span></div>`;
}

/* ======== PAIR WINNERS (Knockout phase play-offs winners) ========
   Layout: row1 = Points + totals, row2 = "Pair | Pair winner | Бо | Лб | ...",
   then rows = "Брест/ПСЖ | Псж(actual) | Псж | Псж | ...".
   Highlight a player's pick green when it equals the actual pair winner. */
function renderPairWinners(data){
  const rows = data.rows.map(r => r.map(cellStr));

  let headerRow = -1, pairCol = -1, winnerCol = -1;
  for(let ri = 0; ri < rows.length; ri++){
    const wi = rows[ri].findIndex(v => /^pair winner$/i.test(v));
    if(wi !== -1){
      headerRow = ri;
      winnerCol = wi;
      const pi = rows[ri].findIndex(v => /^pair$/i.test(v));
      pairCol = pi !== -1 ? pi : 0;
      break;
    }
  }
  if(headerRow === -1) return null;

  const prPW = findPlayersRow(rows, winnerCol + 1);
  const players = prPW ? filterActivePlayers(rows, prPW.players, prPW.rowIdx + 1, null) : [];
  if(players.length === 0) return null;

  let totals = null;
  for(let ri = 0; ri < rows.length; ri++){
    if(rows[ri].some(v => /^points$/i.test(v)) && players.some(p => toNum(rows[ri][p.col]) !== null)){
      totals = {};
      players.forEach(p => { const n = toNum(rows[ri][p.col]); if(n !== null) totals[p.col] = n; });
      break;
    }
  }
  // фолбек: рядок з числами над іменами, без підпису "Points"
  if(!totals){
    for(let up = prPW.rowIdx - 1; up >= 0 && !totals; up--){
      const t = {};
      let hits = 0;
      players.forEach(p => { const n = toNum(rows[up][p.col]); if(n !== null){ t[p.col] = n; hits++; } });
      if(hits >= 2) totals = t;
    }
  }

  const items = [];
  for(let ri = headerRow + 1; ri < rows.length; ri++){
    const r = rows[ri];
    const pair = cellStr(r[pairCol]);
    const actual = cellStr(r[winnerCol]);
    if(pair === '' && actual === '') continue;
    if(/^points$/i.test(pair)) continue;
    items.push({ pair, actual, picks: players.map(p => cellStr(r[p.col])) });
  }
  if(items.length === 0) return null;

  return `
  ${renderPointsSummary(players, totals)}
  <div class="table-card">
    <table class="matches">
      ${colGroup([24, 12], players.length)}
      <thead>
        <tr>
          <th class="meta">Pair</th>
          <th class="meta th-result">Winner</th>
          ${players.map(p => `<th class="p-name-cell">${escapeHtml(canonPerson(p.name))}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${items.map(it => `
          <tr>
            <td class="c-game">${gameWithFlags(it.pair)}</td>
            <td class="c-result">${it.actual ? `<span class="result-pill">${withFlag(it.actual)}</span>` : '—'}</td>
            ${it.picks.map(pick => {
              const correct = pick !== '' && it.actual !== '' && pick.toLowerCase() === it.actual.toLowerCase();
              return `<td class="pred ${correct ? 'exact' : ''}">${pick ? withFlag(pick) : '—'}</td>`;
            }).join('')}
          </tr>`).join('')}
      </tbody>
    </table>
  </div>
  <div class="legend"><span><span class="chip exact"></span> вгаданий переможець пари</span></div>`;
}

/* ======== SPECIAL BETS (1&2place + ... tabs) ========
   Layout (screenshot-confirmed):
   [Question | Final Result | (marker) | Бо | Лб | ...]   header row
   [1 place  | Іспанія      | Prediction | Франція | ...]  a bet's predictions
   [         |              | Points     | 0 | 4 | ...]    that bet's points
   [Mudryk   | -            | Prediction | 1 | 2 | ...]     numeric bets: Final Result "-"
   [         |              | Points     | 0 | 0 | ...]
   A player's prediction is highlighted green when it matches the Final Result
   (text bets), or — when Final Result is "-" — when that player's Points > 0. */
function renderSpecialBets(data){
  const rows = data.rows.map(r => r.map(cellStr));

  // marker column: the one containing "Prediction" / "Points" labels
  let markerCol = -1;
  for(const r of rows){
    for(let ci = 0; ci < r.length; ci++){
      if(/^prediction$/i.test(r[ci])){ markerCol = ci; break; }
    }
    if(markerCol !== -1) break;
  }
  if(markerCol === -1) return null;

  // player header row: reliably located by known participant names (right of marker)
  const pr = findPlayersRow(rows, markerCol + 1);
  if(!pr) return null;
  const playersRowIdx = pr.rowIdx;
  const players = filterActivePlayers(rows, pr.players, pr.rowIdx + 1, null);

  // Build bets: each bet couples a Prediction row with the following Points row.
  const bets = [];
  let carryLabel = '';
  let cur = null;
  for(let ri = playersRowIdx + 1; ri < rows.length; ri++){
    const r = rows[ri];
    const marker = cellStr(r[markerCol]);
    if(/^prediction$/i.test(marker)){
      // flush a dangling prediction with no points row
      if(cur) bets.push(cur);
      let label = '';
      for(let ci = 0; ci < markerCol - 1; ci++){
        if(cellStr(r[ci]) !== ''){ label = cellStr(r[ci]); break; }
      }
      if(label !== '') carryLabel = label;
      const actual = markerCol - 1 >= 0 ? cellStr(r[markerCol - 1]) : '';
      cur = {
        label: label || carryLabel,
        actual,
        preds: players.map(p => cellStr(r[p.col])),
        points: players.map(() => '')
      };
    } else if(/^points?$/i.test(marker)){
      if(cur){
        cur.points = players.map(p => cellStr(r[p.col]));
        bets.push(cur);
        cur = null;
      }
    }
  }
  if(cur) bets.push(cur);
  if(bets.length === 0) return null;

  // decide green highlight per player for a bet
  function isHit(bet, i){
    const pred = cellStr(bet.preds[i]);
    if(pred === '' || pred === '-') return false;
    const actual = cellStr(bet.actual);
    if(actual !== '' && actual !== '-'){
      return pred.toLowerCase() === actual.toLowerCase();  // text bet: match Final Result
    }
    const pts = toNum(bet.points[i]);                       // numeric bet: scored points
    return pts !== null && pts > 0;
  }

  // загальні Points = сума всіх Points-рядків по кожному гравцю
  const grandTotals = players.map((p, i) =>
    bets.reduce((acc, b) => { const n = toNum(b.points[i]); return acc + (n === null ? 0 : n); }, 0));

  return `
  ${renderPointsSummary(players, grandTotals)}
  <div class="table-card">
    <table class="sheet-table special">
      ${colGroup([20, 17], players.length)}
      <thead>
        <tr>
          <th class="sb-th">Question</th>
          <th class="sb-th sb-th-actual" style="text-align:center;">Final Result</th>
          ${players.map(p => `<th class="sb-th-player">${escapeHtml(canonPerson(p.name))}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${bets.map(bet => {
          // Другий рядок лейблу (якщо є) — бейдж «скільки очок» для
          // живого EuroSeason, тим самим підходом, що підпис ліги
          // біля матчу (.comp-tag). В архіві другого рядка нема —
          // split просто поверне порожній хвіст, і бейдж не покажеться.
          const [qText, qBadge] = bet.label.split('\n');
          const predRow = `<tr>
            <td class="sb-label">${qBadge ? `<span class="comp-tag">${escapeHtml(qBadge)}</span>` : ''}${escapeHtml(qText)}</td>
            <td class="sb-actual">${bet.actual && bet.actual !== '-' ? `<span class="result-pill">${withFlag(bet.actual)}</span>` : '<span style="color:var(--text-dim);">—</span>'}</td>
            ${bet.preds.map((v, i) => {
              const hit = isHit(bet, i);
              return `<td class="sb-val ${hit ? 'sb-hit' : ''}">${v ? withFlag(v) : '—'}</td>`;
            }).join('')}
          </tr>`;
          const pointsRow = `<tr class="sb-points">
            <td class="sb-label">Points</td>
            <td></td>
            ${bet.points.map(v => {
              const n = toNum(v);
              return `<td class="sb-val ${n !== null && n > 0 ? 'scored' : ''}">${escapeHtml(v || '—')}</td>`;
            }).join('')}
          </tr>`;
          return predRow + pointsRow;
        }).join('')}
      </tbody>
    </table>
  </div>
  <div class="legend"><span><span class="chip exact"></span> вгаданий прогноз</span></div>`;
}

/* ======== GENERIC TABLE ======== */
function renderGenericTable(data){
  let rows = data.rows.map(r => r.map(cellStr));

  rows = rows.filter(r => r.some(v => v !== ''));
  rows = rows.filter(r => {
    const filled = r.filter(v => v !== '');
    if(filled.length === 0) return false;
    return !filled.every(v => v === '0' || isPlaceholderName(v));
  });

  if(rows.length === 0) return '<div class="status-line">Немає даних для відображення.</div>';

  const colCount = Math.max(...rows.map(r => r.length));
  const keepCols = [];
  for(let ci = 0; ci < colCount; ci++){
    const vals = rows.map(r => cellStr(r[ci])).filter(v => v !== '');
    if(vals.length === 0) continue; // fully empty column
    // junk column: every value is 0 / №N placeholder (hidden helper columns)
    const junk = vals.every(v => v === '0' || isPlaceholderName(v));
    if(!junk) keepCols.push(ci);
  }
  rows = rows.map(r => keepCols.map(ci => cellStr(r[ci])));

  const headerRow = rows[0];
  const bodyRows = rows.slice(1);

  // detect a "Points" column (header cell equals Points/Очки) to gold-highlight it
  const pointsColIdx = headerRow.findIndex(c => /^(points?|очк[иі]|бали?)$/i.test(cellStr(c)));

  return `
    <div class="table-card">
      <table class="sheet-table">
        <thead><tr>${headerRow.map((c, ci) =>
          `<th class="${ci === pointsColIdx ? 'th-points' : ''}">${escapeHtml(canonPerson(c))}</th>`
        ).join('')}</tr></thead>
        <tbody>
          ${bodyRows.map(r => `<tr>${headerRow.map((_, ci) =>
            `<td class="${ci === pointsColIdx ? 'td-points' : ''}">${escapeHtml(canonPerson(r[ci] ?? ''))}</td>`
          ).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

/* ======== RULES + PRIZE POOL ======== */
function renderRules(data){
  const raw = data.rows.map(r => r.map(cellStr));

  // find the "Condition" header row
  let condRowIdx = -1, condCol = -1;
  for(let ri = 0; ri < raw.length; ri++){
    const ci = raw[ri].findIndex(v => /^condition$/i.test(v));
    if(ci !== -1){ condRowIdx = ri; condCol = ci; break; }
  }
  if(condRowIdx === -1) return renderGenericTable(data);

  // table ends at first fully-empty row (Prize pool block follows — dropped)
  let endIdx = raw.length;
  for(let ri = condRowIdx + 2; ri < raw.length; ri++){
    if(raw[ri].every(v => v === '')){ endIdx = ri; break; }
    if(raw[ri].some(v => /^(призові|prize pool)$/i.test(v))){ endIdx = ri; break; }
    // примітка внизу: довгий текст в колонці Condition без очок і без yes/no
    const cond = cellStr(raw[ri][condCol]);
    const rest = raw[ri].filter((v, ci) => ci !== condCol && cellStr(v) !== '');
    if(cond.length > 60 && rest.length === 0){ endIdx = ri; break; }
  }

  const h1 = raw[condRowIdx];
  const h2 = raw[condRowIdx + 1] || [];
  const bodyRows = raw.slice(condRowIdx + 2, endIdx).filter(r => r.some(v => v !== ''));

  let pointsCol = h1.findIndex(v => /^points?$/i.test(v));
  if(pointsCol === -1){
    // підпис міг загубитись — шукаємо першу колонку праворуч від Condition,
    // де в тілі таблиці стоять числа, а не yes/no
    for(let ci = condCol + 1; ci < Math.max(h1.length, h2.length) && pointsCol === -1; ci++){
      const vals = bodyRows.map(r => cellStr(r[ci])).filter(v => v !== '');
      if(vals.length && vals.every(v => toNum(v) !== null || /^yes\s*-|no\s*-/i.test(v))) pointsCol = ci;
    }
  }

  // yes/no columns = every column at/after (pointsCol+1) that has a sub-header (h2)
  // or yes/no body values. Collect them in order.
  const nCols = Math.max(h1.length, h2.length, ...bodyRows.map(r => r.length));
  const ynCols = [];
  for(let ci = Math.max(pointsCol + 1, condCol + 1); ci < nCols; ci++){
    const sub = cellStr(h2[ci]);
    const bodyHasYN = bodyRows.some(r => /^(yes|no)$/i.test(cellStr(r[ci])));
    if(sub !== '' || bodyHasYN) ynCols.push(ci);
  }

  // group the yn columns by their h1 top-label (carry-forward across empty h1 cells)
  const groups = [];
  let curLabel = null;
  for(const ci of ynCols){
    let top = cellStr(h1[ci]);
    if(top === ''){
      // carry forward: search left until a non-empty h1 within the yn region
      for(let k = ci - 1; k > pointsCol; k--){
        if(cellStr(h1[k]) !== ''){ top = cellStr(h1[k]); break; }
      }
    }
    if(groups.length === 0 || groups[groups.length-1].label !== top){
      groups.push({ label: top, cols: [ci] });
      curLabel = top;
    } else {
      groups[groups.length-1].cols.push(ci);
    }
  }

  const hasGroups = groups.some(g => g.label !== '');

  const topHeader = `
    <tr>
      <th class="c-condition" rowspan="2">Condition</th>
      <th rowspan="2" style="text-align:center;">Points</th>
      ${groups.map(g => `<th class="group-head" colspan="${g.cols.length}">${escapeHtml(g.label)}</th>`).join('')}
    </tr>
    <tr>
      ${ynCols.map(ci => `<th class="sub-head">${escapeHtml(cellStr(h2[ci]))}</th>`).join('')}
    </tr>`;

  const body = bodyRows.map(r => `
    <tr>
      <td class="c-condition">${escapeHtml(cellStr(r[condCol]))}</td>
      <td class="c-points">${escapeHtml(cellStr(r[pointsCol]))}</td>
      ${ynCols.map(ci => `<td>${formatYesNo(cellStr(r[ci]))}</td>`).join('')}
    </tr>`).join('');

  // footnote (the "Прогноз робимо лише..." paragraph)
  let footnote = '';
  for(let ri = endIdx; ri < raw.length; ri++){
    const text = raw[ri].map(cellStr).filter(v => v !== '').join(' ');
    if(text.length > 40 && !/^(група|group|play|general|\d+%)/i.test(text)){ footnote = text; break; }
  }
  const note = footnote ? `<div class="rules-note">${escapeHtml(footnote)}</div>` : '';

  return `
  <div class="rules-block table-card">
    <table class="sheet-table rules">
      <thead>${topHeader}</thead>
      <tbody>${body}</tbody>
    </table>
  </div>${note}`;
}

function formatYesNo(v){
  const s = cellStr(v);
  if(/^yes$/i.test(s)) return '<span class="yn yes">yes</span>';
  if(/^no$/i.test(s)) return '<span class="yn no">no</span>';
  return escapeHtml(s);
}

/* ======== DISPATCH ======== */
function renderTabContent(tab, data){
  if(tab.kind === 'leaderboard') return renderLeaderboard(data);
  if(tab.kind === 'rules'){
    return renderRules(data) + (tab.source === 'rules' ? renderEuroRulesExtras() : '');
  }
  // explicit renderers (bypass auto-detect to avoid mis-routing)
  if(tab.kind === 'pairWinners'){ return renderPairWinners(data) || renderGenericTable(data); }
  if(tab.kind === 'special'){ return renderSpecialBets(data) || renderGenericTable(data); }
  if(tab.kind === 'groupPositions'){ return renderGroupPositions(data) || renderGenericTable(data); }
  const pairs = renderPairWinners(data);
  if(pairs) return pairs;
  const matches = renderMatches(data);
  if(matches) return matches;
  const positions = renderGroupPositions(data);
  if(positions) return positions;
  const special = renderSpecialBets(data);
  if(special) return special;
  return renderGenericTable(data);
}


/* =====================================================================
   HONORS — рендер вітрини

   Три підвкладки, спільні дані (HONORS_CACHE):
     1. Трофейна вітрина  — картки переможців турнірів + полиці по
        людях із підписаними медалями
     2. Рекорди ліги      — номінації плакетками
     3. Портрети гравців  — DNA

   Групування вітрини саме по людях (рішення Богдана): так видно,
   хто найтитулованіший, без читання цифр — Антон і Бо з дев'ятьма
   медалями фізично займають найбільше місця.
   ===================================================================== */
let HONORS_CACHE = null;

function renderHonorsSection(kind, d){
  if(kind === 'honorsRecords') return honorsRecords(d);
  if(kind === 'honorsDna')     return honorsDna(d);
  return honorsCase(d);
}

/* --- 1. Трофейна вітрина --- */
function honorsCase(d){
  const byPerson = {};
  (d.detail || []).forEach(x => (byPerson[x.person] = byPerson[x.person] || []).push(x));

  const cases = (d.medals || []).filter(m => m.medals_total > 0).map(m => {
    const mine = (byPerson[m.person] || []).slice()
      .sort((a, b) => a.place - b.place || a.tournament_order - b.tournament_order);
    // Єдиний патерн підпису: рівно два рядки, «Турнір» і «Етап».
    // Раніше підпис був одним склеєним рядком різної довжини, і
    // медалі стрибали по висоті. Тепер усі колонки однакові.
    const shelf = mine.map(x =>
      `<div class="hn-m"><div class="ic">${x.medal}</div>
         <div class="cap">
           <span class="lb">Турнір</span> ${escapeHtml(x.tournament)}<br>
           <span class="lb">Етап</span> ${escapeHtml(x.phase)}
         </div></div>`).join('');
    const tally = [['🥇', m.gold], ['🥈', m.silver], ['🥉', m.bronze]]
      .filter(([, n]) => n > 0)
      .map(([ic, n]) => `<i>${ic} ${n}</i>`).join('');
    return `
      <div class="hn-case">
        <div class="hn-lamp"></div>
        <div class="hn-row">
          <div class="hn-who">
            <b>${escapeHtml(m.person)}</b>
            <span>${m.medals_total} ${plural(m.medals_total, 'медаль', 'медалі', 'медалей')}
              · ${m.tournaments_played} ${plural(m.tournaments_played, 'турнір', 'турніри', 'турнірів')}</span>
            <div class="hn-tally">${tally}</div>
          </div>
          <div class="hn-shelf">${shelf}</div>
        </div>
      </div>`;
  }).join('');

  // Полиця сезону, що триває: місце під медалі вже стоїть порожнє
  const lead = (d.season || [])[0];
  const euro = `
    <div class="hn-case dim">
      <div class="hn-lamp"></div>
      <div class="hn-empty">
        <b>ЄвроСезон 2026</b> · сезон триває, полиця чекає
        ${lead ? `<br>зараз попереду ${escapeHtml(lead.display_name)} — ${lead.total_points}` : ''}
      </div>
    </div>`;

  /* Картки переможців турнірів переїхали сюди з вкладки «Історія
     турнірів» (рішення Богдана 27.07.2026). Сама вкладка прибрана:
     медальний залік таблицею дублював цифри 🥇🥈🥉, які й так стоять
     біля кожного імені у вітрині. Картки йдуть ЗВЕРХУ — спершу «що
     це були за турніри», потім «хто скільки з них узяв». */
  const cards = (d.facts || []).map(f => `
    <div class="hn-fact">
      <div class="t">${escapeHtml(f.tournament)}</div>
      <div class="w">🏆 ${escapeHtml(f.winner || '—')}</div>
      <div class="d">відрив від другого — ${f.margin}
        ${plural(f.margin, 'очко', 'очки', 'очок')}</div>
    </div>`).join('');

  return honorsWrap('Трофейна вітрина',
    'Усе, що виграно за історію ліги — з точністю до етапу',
    `<div class="hn-facts">${cards}</div>` + cases + euro);
}

/* --- 3. Рекорди ліги --- */
function honorsRecords(d){
  // Поділене перше місце приходить кількома рядками з однаковим
  // sort_order — зводимо їх в одну плакетку через « · ».
  const groups = [];
  (d.hof || []).forEach(r => {
    const last = groups[groups.length - 1];
    if(last && last.sort_order === r.sort_order) last.rows.push(r);
    else groups.push({ sort_order:r.sort_order, nomination:r.nomination,
                       value:r.value, rows:[r] });
  });
  const plaques = groups.map(g => {
    const people = g.rows.map(r => r.person);
    // ⚠️ Коли перше місце ділять кілька людей, підпис у них може бути
    //   РІЗНИЙ. Раніше код брав підпис лише з першого рядка — і в
    //   «Залпі» Сані приписувався чужий етап: у нього 6 із 16 на
    //   ЧС 2026, а показувалось 6 із 36 на Євро. Тепер, якщо підписи
    //   розходяться, кожен отримує власний.
    const same = g.rows.every(r => r.note === g.rows[0].note);

    // Спільний початок підпису виносимо нагору, щоб не повторювати
    // його під кожним іменем. У «Залпі» це «точних рахунків за ОДИН
    // етап:» — без цього фраза стояла б тричі поспіль.
    //
    // ⚠️ Ріжемо ТІЛЬКИ по двокрапці або тире, не по пробілу. Спершу
    // я дозволив пробіл — і спільний початок з'їв ще й «6 із», бо
    // «6 із 36» і «6 із 16» справді збігаються до цифри. Виходило
    // «…етап: 6 із» / «36 матчів». Розділові знаки такої халепи не
    // роблять: вони стоять там, де думка справді закінчується.
    let head = '', tails = g.rows.map(r => r.note);
    if(!same){
      const a = tails[0];
      let i = 0;
      while(i < a.length && tails.every(t => t[i] === a[i])) i++;
      const cut = Math.max(a.lastIndexOf(': ', i), a.lastIndexOf(' — ', i));
      if(cut > 8){
        head  = a.slice(0, cut + 1).trim();
        tails = tails.map(t => t.slice(cut + 1).replace(/^[\s:—-]+/, ''));
      }
    }

    // Люди з ОДНАКОВИМ підписом ідуть одним рядком: у «Залпі» в
    // Антона й Бо це той самий етап і та сама кількість, тож писати
    // їх окремо означало б двічі повторити ідентичний текст.
    const byNote = [];
    g.rows.forEach((r, i) => {
      const hit = byNote.find(x => x.note === tails[i]);
      if(hit) hit.people.push(r.person);
      else byNote.push({ note: tails[i], people: [r.person] });
    });

    const body = same
      ? `<div class="who">${people.map(escapeHtml).join(' · ')}</div>
         <div class="val">${escapeHtml(g.value)}</div>
         <div class="note">${escapeHtml(g.rows[0].note)}</div>`
      : `<div class="val">${escapeHtml(g.value)}</div>` +
        (head ? `<div class="note">${escapeHtml(head)}</div>` : '') +
        byNote.map(x => `
          <div class="hn-sub">
            <span class="who-one">${x.people.map(escapeHtml).join(' · ')}</span>
            <span class="note">${escapeHtml(x.note)}</span>
          </div>`).join('');
    return `<div class="hn-plq">
      <div class="nm">${escapeHtml(g.nomination)}</div>
      ${body}
    </div>`;
  }).join('');

  return honorsWrap('Рекорди ліги',
    'Кожен рекорд має власника — і кожен можна перебити',
    `<div class="hn-grid">${plaques}</div>`);
}


/* ================= ПОРТРЕТИ ГРАВЦІВ (Prediction DNA) =================
   Четверта підвкладка Honors. Балів не дає — це портрет, а не змагання.

   Стан тримаємо в модулі, а не в DOM: вибір людини й пари для
   порівняння переживає перемальовку, і повертатись «до всіх» можна
   без повторного запиту — дані вже в HONORS_CACHE. */
let DNA_PERSON = null;
let DNA_VS = null;

/* Головна цифра картки — відсоток вгаданих результатів. Саме він
   найкраще розводить людей: точні рахунки в усіх у межах 6-11%. */
function honorsDna(d){
  const profiles = d.dnaProfile || [];
  if(!profiles.length){
    return honorsWrap('Портрети гравців', 'Дані ще не залиті',
      '<div class="status-line">Портрети з’являться після заливки архіву прогнозів.</div>');
  }
  const arch = Object.fromEntries((d.dnaArch || []).map(a => [a.person, a]));
  const league = d.dnaLeague;

  const cards = profiles.map(p => {
    const a = arch[p.person] || {};
    const on = p.person === DNA_PERSON;
    return `
      <button class="dna-card${on ? ' on' : ''}" data-dna="${escapeHtml(p.person)}">
        <span class="nm">${escapeHtml(p.person)}</span>
        <span class="arch">${escapeHtml(a.archetype || '—')}</span>
        <span class="big">${p.result_pct}%</span>
        <span class="sub">результатів матчів вгадано · ${p.matches}
          ${plural(p.matches, 'прогноз', 'прогнози', 'прогнозів')}</span>
        ${p.is_solid ? '' : '<span class="thin">мало даних</span>'}
      </button>`;
  }).join('');

  const portrait = DNA_PERSON ? dnaPortrait(d, DNA_PERSON) :
    '<div class="dna-hint">Обери гравця, щоб побачити портрет цілком</div>';

  return honorsWrap('Портрети гравців',
    'Почерк кожного: улюблені рахунки, звички, сильні й слабкі місця — на 1162 прогнозах за всю історію ліги',
    `${dnaLeagueBlock(league)}
     <div class="dna-grid">${cards}</div>
     <div class="dna-portrait" id="dna-portrait">${portrait}</div>`);
}

/* Блок про лігу загалом. Тут головне відкриття розбору: нічиї
   недооцінюють геть усі, без жодного винятку. */
function dnaLeagueBlock(l){
  if(!l) return '';
  return `
    <div class="dna-league">
      <div class="f">
        <b>${l.draws_real_pct}% проти ${l.draws_pred_pct}%</b>
        <span>стільки матчів насправді закінчились унічию — і стільки нічиїх ставила ліга.
              Недооцінюють усі без винятку</span>
      </div>
      <div class="f">
        <b>${l.pair_bonus_pct}% проти ${l.long_bonus_pct}%</b>
        <span>влучань у питаннях «хто пройде пару» проти прогнозів на весь турнір наперед.
              Матч ліга читає, турнір — ні</span>
      </div>
      <div class="f">
        <b>${l.goals_pred} проти ${l.goals_real}</b>
        <span>голів у середньому в прогнозі й насправді. Тут ліга майже не помиляється</span>
      </div>
      <div class="f">
        <b>${l.predictions}</b>
        <span>прогнозів на ${l.matches} матчів за всю історію — від ${l.people} людей</span>
      </div>
    </div>`;
}

function dnaPortrait(d, person){
  const p = (d.dnaProfile || []).find(x => x.person === person);
  if(!p) return '';
  const a = (d.dnaArch || []).find(x => x.person === person) || {};
  const r = (d.dnaRhythm || []).find(x => x.person === person) || {};
  const scores = (d.dnaScore || []).filter(x => x.person === person);
  const teams = (d.dnaTeam || []).filter(x => x.person === person);
  const bonus = (d.dnaBonus || []).filter(x => x.person === person);
  const pairs = (d.dnaPair || []).filter(x => x.person === person);
  const belief = (d.dnaBelief || []).filter(x => x.person === person);
  const sh = (d.dnaShape || []).find(x => x.person === person) || {};
  const vsLg = (d.dnaVsLeague || []).filter(x => x.person === person);
  const scoreKind = (d.dnaScoreKind || []).filter(x => x.person === person);

  const twin = pairs[0];
  const anti = pairs[pairs.length - 1];

  const row = (label, value, note) => `
    <div class="dna-row"><span class="l">${label}</span>
      <span class="v">${value}</span>
      ${note ? `<span class="n">${note}</span>` : ''}</div>`;

  /* Заголовок блоку — назва плюс окреме уточнення дрібним. Раніше
     все тулилось в один рядок через « · » («Точність · вгадані
     результати», «Клуби · ЛЧ 2025 + Клубний ЧС 2025») і читалось
     як суцільна стрічка великих літер. */
  const block = (title, inner, sub) => `
    <div class="dna-block">
      <h4>${title}${sub ? `<span class="sub">${sub}</span>` : ''}</h4>
      ${inner}
    </div>`;

  /* Командні рядки йдуть окремо для клубів і збірних: Іспанія і ПСЖ
     в одному заліку нічого не означають. У кожному типі показуємо
     дві різні речі:
       ВІРА     — на кого ставиш частіше/рідше за решту ліги. Характер.
       ВЛУЧНІСТЬ — скільки з тих ставок зіграло. Результат.
     Перше цікавіше: влучність у переможця турніру висока в усіх,
     тому «Талісман» майже в кожного вийшов би ПСЖ або Іспанія. */
  const teamsFor = (kind, kindTitle, tournaments, played) => {
    // Уточнення з турнірами ставимо і тут — інакше блок «Збірні» у
    // Дениса лишався без підзаголовка, тоді як «Клуби» його мали.
    if(!played) return block(kindTitle,
      `<div class="dna-row"><span class="n">Не грав у цих турнірах</span></div>`,
      tournaments);

    const t = teams.filter(x => x.kind === kind);
    const b = belief.filter(x => x.kind === kind);
    const tBest = t[0], tWorst = t[t.length - 1];
    const bMost = b[0], bLeast = b[b.length - 1];

    /* Назви команд проганяємо через withFlag() — той самий шлях, що
       й у турнірних таблицях. Дає одразу дві речі: єдине написання
       (в архіві є «Турція», а показати треба «Туреччина») і той самий
       прапор чи емблему, що й у матчах. До цього портрет друкував
       назву як є, і вкладки розходились на тому самому слові. */
    const rows = [
      bMost ? row('Вірить у', withFlag(bMost.team),
                  `ставив на перемогу в ${bMost.my_pct}% матчів,
                   решта ліги — в ${bMost.league_pct}%`) : '',
      bLeast && bLeast !== bMost
            ? row('Не вірить у', withFlag(bLeast.team),
                  `${bLeast.my_pct}% проти ${bLeast.league_pct}% по лізі`) : '',
      tBest ? row('Щастить із', withFlag(tBest.team),
                  `зіграло ${tBest.backed_hit} з ${tBest.backed} ставок на перемогу`) : '',
      tWorst && tWorst !== tBest
            ? row('Не щастить із', withFlag(tWorst.team),
                  `лише ${tWorst.backed_hit} з ${tWorst.backed}`) : '',
    ].join('');

    return block(kindTitle, rows
      || '<div class="dna-row"><span class="n">Замало ставок на одну команду</span></div>',
      tournaments);
  };

  const vs = DNA_VS && DNA_VS !== person
    ? dnaCompare(d, person, DNA_VS) : '';

  const others = (d.dnaProfile || []).filter(x => x.person !== person)
    .map(x => `<option value="${escapeHtml(x.person)}"${x.person === DNA_VS ? ' selected' : ''}>
                 ${escapeHtml(x.person)}</option>`).join('');

  return `
    <div class="dna-head">
      <div>
        <h3>${escapeHtml(person)}</h3>
        <div class="arch">${escapeHtml(a.archetype || '')}</div>
        <div class="arch-note">${escapeHtml(a.archetype_note || '')}</div>
      </div>
      <div class="dna-vs">
        <label>Порівняти з</label>
        <select id="dna-vs"><option value="">—</option>${others}</select>
      </div>
    </div>
    ${p.is_solid ? '' :
      `<div class="dna-warn">Лише ${p.matches} прогнозів — цифри хиткі,
        один матч тут важить більше, ніж має</div>`}

    <div class="dna-blocks">
      ${block('Почерк', [
        row('Улюблені рахунки',
            scores.map(x => `${escapeHtml(x.score)} <i>×${x.used}</i>`).join(', '),
            'три найчастіші з усіх його прогнозів'),
        ...['clubs','nations'].map(k => {
          const s = scoreKind.filter(x => x.kind === k);
          return s.length ? row(k === 'clubs' ? '— у клубах' : '— у збірних',
            s.map(x => `${escapeHtml(x.score)} <i>×${x.used}</i>`).join(', ')) : '';
        }),
        row('Голів у прогнозі', p.goals_avg,
            `у цих же матчах насправді забивали ${p.goals_real}`),
        p.person === 'Женя' ? row('🃏 Фірмовий жарт', '11:11',
            'колись поставив 11:11 на Аргентина–Іспанія — і таки вгадав нічию (0:0), +1 очко. Ці 22 голи в «голів у прогнозі» свідомо не рахуємо') : '',
        row('Різних рахунків', p.repertoire,
            p.repertoire >= 20 ? 'широкий репертуар — рідко повторюється'
                               : 'вузький набір — ходить тими самими рахунками'),
        row('Нічиї', `${p.draws_pct}%`,
            `поставив ${p.draws_pred} нічиїх, вгадав ${p.draws_hit}
             (насправді нічиєю закінчується 26.7% матчів)`),
        row('Ставить на господарів / гостей', `${p.home_pct}% / ${p.away_pct}%`,
            'частка прогнозів на перемогу, решта — нічиї'),
        row('Ставить розгроми', `${p.blowout_pct}%`,
            'прогнозів із різницею 3+ голи'),
      ].join(''), `усі ${p.matches} ${plural(p.matches,'прогноз','прогнози','прогнозів')}`)}

      ${/* Термінологія тут навмисно СЛОВО В СЛОВО як у правилах
            турніру (вкладка Rules): «вгаданий результат матчу» — 1
            очко, «вгаданий точний рахунок матчу» — 3. Раніше портрет
            писав просто «Вгаданий результат» і «Точний рахунок», і
            зв'язок із балами доводилось тримати в голові. */''}
      ${block('Точність', [
        row('Результат матчу', `${p.result_pct}%`,
            `${p.result_hits} із ${p.matches} — перемога, нічия чи поразка.
             По 1 очку за кожен`),
        row('Точний рахунок', `${p.exact_pct}%`,
            `${p.exact_hits} ${plural(p.exact_hits, 'раз', 'рази', 'разів')} —
             по 3 очки за кожен`),
        row('Найдовша серія', `${p.streak_result}`,
            'вгаданих результатів поспіль, наскрізь через усі чотири турніри'),
        row('Точний рахунок наодинці', `${p.lone_exact}`,
            `${plural(p.lone_exact, 'раз', 'рази', 'разів')} вгадав точний
             рахунок, якого в тому матчі не взяв більше ніхто`),
        row('Проти більшості', `${p.against_crowd_pct}%`,
            `${p.against_crowd} прогнозів розійшлися з тим, що поставила
             більшість тих, хто грав той самий матч`),
        sh.miss_goals != null
          ? row('Промах у голах', sh.miss_goals,
                `у середньому стільки голів різниці з реальним рахунком
                 (по обох командах разом)`) : '',
      ].join(''), 'скільки вгадано і скільки це очок')}

      ${teamsFor('clubs', 'Клуби', 'ЛЧ 2025 + Клубний ЧС 2025', r.clubs_matches)}
      ${teamsFor('nations', 'Збірні', 'Євро 2024 + ЧС 2026', r.nations_matches)}

      ${block('Сильні й слабкі типи матчів', [
        sh.rout_hit_pct != null && sh.calm_hit_pct != null
          ? row('Розгроми / в\'язкі матчі',
                `${sh.rout_hit_pct}% / ${sh.calm_hit_pct}%`,
                `вгадано в матчах із різницею 3+ голи (${sh.rout_matches} шт.)
                 і в матчах, де на двох забили 0-1 (${sh.calm_matches} шт.)`) : '',
        /* ⚠️ Вердикт даємо лише коли обох типів матчів набралось хоча б
           по вісім. У Андрея їх 4 і 6, і без порога портрет писав би
           «рідкість — читає обидва типи однаково» на десяти матчах. */
        sh.blind_gap != null
          ? row('Наскільки різниця велика', `${sh.blind_gap} пункти`,
                (sh.rout_matches < 8 || sh.calm_matches < 8)
                  ? 'замало таких матчів, щоб робити висновок'
              : sh.blind_gap >= 50 ? 'сліпа зона — в\'язкі матчі майже не читає'
              : sh.blind_gap >= 30 ? 'як у більшості: розгроми даються легше всім'
                                   : 'рідкість — читає обидва типи майже однаково') : '',
        r.group_pct != null && r.playoff_pct != null
          ? row('Груповий етап → плей-оф', `${r.group_pct}% → ${r.playoff_pct}%`,
                (r.playoff_pct > r.group_pct ? 'оживає на вильоті. ' : 'на вильоті грає гірше. ')
                + 'Плей-оф — це Knockout і Play-off у всіх чотирьох турнірах') : '',
        r.nations_pct != null && r.clubs_pct != null
          ? row('Збірні / клуби', `${r.nations_pct}% / ${r.clubs_pct}%`,
                'Євро 2024 + ЧС 2026 проти ЛЧ 2025 + Клубного ЧС 2025') : '',
        r.group_goals != null && r.playoff_goals != null
          ? row('Голів у прогнозі на вильоті', `${r.group_goals} → ${r.playoff_goals}`,
                r.playoff_goals < r.group_goals ? 'стає обережнішим' : 'не стримується') : '',
      ].join('') || '<div class="dna-row"><span class="n">Грав лише в одному типі турнірів</span></div>')}

      ${block('Відносно решти ліги', vsLg.length
        ? vsLg.map(t => row(escapeHtml(t.tournament),
              `${t.diff > 0 ? '+' : ''}${t.diff} пункти`,
              `${t.my_pct}% проти ${t.league_pct}% у середньому по лізі`)).join('')
          + `<div class="dna-row"><span class="n">Голий відсоток порівнювати між
             турнірами не можна: у Клубному ЧС і ЧС було більше нерівних пар,
             і вгадувати стало легше всім (46% → 60%). Тут це вже враховано</span></div>`
        : '<div class="dna-row"><span class="n">Немає даних</span></div>')}

      ${block('Бонусні питання', bonus.length
        ? bonus.map(b => row(escapeHtml(b.kind_title), `${b.hit_pct}%`,
                             `${b.hits} із ${b.questions}` + (
                               b.kind === 'special' ? ' · чемпіон, бомбардир і подібне — ставилось до старту турніру'
                             : b.kind === 'group'   ? ' · місця команд у групах A-F, було тільки на Євро 2024'
                             : b.kind === 'pair'    ? ' · ставилось уже по ходу, коли пари були відомі'
                                                    : ''))).join('')
        : '<div class="dna-row"><span class="n">Не відповідав на бонусні питання</span></div>')}

      ${block('Люди', [
        twin ? row('Близнюк', escapeHtml(twin.other),
                   `${twin.same_pct}% прогнозів збіглися рахунок-у-рахунок
                    на ${twin.together} матчах, які прогнозували обидва`) : '',
        anti && anti !== twin
             ? row('Антипод', escapeHtml(anti.other),
                   `лише ${anti.same_pct}% на ${anti.together} спільних матчах`) : '',
      ].join('') || '<div class="dna-row"><span class="n">Замало спільних матчів</span></div>')}
    </div>
    ${vs}`;
}

/* Порівняння двох портретів. Показуємо тільки те, де різниця має сенс:
   відсотки й почерк, а не абсолютні числа — вони залежать від того,
   хто скільки зіграв. */
function dnaCompare(d, a, b){
  const pa = (d.dnaProfile || []).find(x => x.person === a);
  const pb = (d.dnaProfile || []).find(x => x.person === b);
  if(!pa || !pb) return '';
  const pair = (d.dnaPair || []).find(x => x.person === a && x.other === b);
  const line = (label, va, vb, better) => {
    const win = better === 'more' ? (parseFloat(va) > parseFloat(vb))
              : better === 'less' ? (parseFloat(va) < parseFloat(vb)) : null;
    return `<tr><td class="${win === true ? 'w' : ''}">${va}</td>
                <th>${label}</th>
                <td class="${win === false ? 'w' : ''}">${vb}</td></tr>`;
  };
  return `
    <div class="dna-cmp">
      <h4>${escapeHtml(a)} проти ${escapeHtml(b)}</h4>
      ${pair ? `<p class="dna-cmp-note">Однакові рахунки в
        ${pair.same_pct}% із ${pair.together} спільних матчів</p>` : ''}
      <table>
        ${line('вгаданий результат', pa.result_pct + '%', pb.result_pct + '%', 'more')}
        ${line('точний рахунок', pa.exact_pct + '%', pb.exact_pct + '%', 'more')}
        ${line('голів у прогнозі', pa.goals_avg, pb.goals_avg)}
        ${line('нічиї', pa.draws_pct + '%', pb.draws_pct + '%')}
        ${line('вгаданих нічиїх', pa.draws_hit, pb.draws_hit, 'more')}
        ${line('різних рахунків', pa.repertoire, pb.repertoire)}
        ${line('проти більшості', pa.against_crowd_pct + '%', pb.against_crowd_pct + '%')}
        ${line('серія влучань', pa.streak_result, pb.streak_result, 'more')}
        ${line('сам проти всіх', pa.lone_exact, pb.lone_exact, 'more')}
      </table>
    </div>`;
}

/* Кліки й вибір у порівнянні. Слухаємо на документі, бо вміст
   вкладки перемальовується цілком і власні обробники б губились. */
document.addEventListener('click', e => {
  const card = e.target.closest('.dna-card');
  if(!card) return;
  const person = card.getAttribute('data-dna');
  DNA_PERSON = (DNA_PERSON === person) ? null : person;
  DNA_VS = null;
  loadActiveTab();
});
document.addEventListener('change', e => {
  if(e.target && e.target.id === 'dna-vs'){
    DNA_VS = e.target.value || null;
    loadActiveTab();
  }
});

/* Спільна обгортка: заголовок секції + вміст */
function honorsWrap(title, sub, inner){
  return `
    <div class="hn-wrap">
      <div class="hn-head">
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(sub)}</p>
      </div>
      ${inner}
    </div>`;
}

/* Українські відмінки для чисел: 1 медаль, 2 медалі, 5 медалей */
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5) return few;
  if(b === 1) return one;
  return many;
}

/* ======== UI ======== */
async function loadActiveTab(){
  const content = document.getElementById('content');

  // HONORS живе за іншими правилами: не таблиця, а власна сторінка,
  // зібрана з чотирьох в'юх бази. Тому виходимо з загального шляху
  // до того, як він полізе по activeTournament.tabs.
  if(activeTournament.source === 'honors'){
    const kind = (activeTournament.tabs[activeTabIndex] || {}).kind || 'honorsCase';
    content.innerHTML = '<div class="status-line">Відчиняємо вітрину...</div>';
    try{
      // Усі три підвкладки живляться з одного набору даних, тому
      // тягнемо його один раз і тримаємо до перезавантаження сторінки:
      // перемикання між ними стає миттєвим.
      if(!HONORS_CACHE){
        const [medals, detail, hof, facts, season,
               dnaProfile, dnaArch, dnaScore, dnaTeam, dnaRhythm, dnaBonus, dnaPair, dnaLeague,
               dnaBelief, dnaShape, dnaVsLeague, dnaScoreKind]
          = await Promise.all([
          sbGet('honors_medals?select=*&order=gold.desc,medals_total.desc,person.asc'),
          sbGet('honors_detail?select=*&order=tournament_order.asc,place.asc'),
          // ⚠️ hall_of_fame_all, а не hall_of_fame: перша віддає лише
          // номінації 1-27 (файл 92), друга додає до них 28+ з hof_extra
          // (файл 95). Велику в'юху свідомо не переоголошуємо — вона вже
          // 28 КБ і п'ять разів ставала пасткою з порядком файлів.
          sbGet('hall_of_fame_all?select=*&order=sort_order.asc,person.asc'),
          sbGet('tournament_facts?select=*&order=tournament_order.asc'),
          sbGet('season_leaderboard?select=display_name,total_points,place&order=place.asc'),
          // «Портрети гравців» — той самий набір даних, тягнемо разом
          // з рештою Honors, щоб перемикання лишалось миттєвим.
          sbGet('dna_profile?select=*&order=matches.desc'),
          sbGet('dna_archetype?select=*'),
          sbGet('dna_score?select=*&order=person.asc,rn.asc'),
          // Поріг — 4 ставки на команду. Розділення на клуби й збірні
          // ділить вибірку навпіл, і на старому порозі 6 Женя з Максом
          // лишались зовсім без збірних, а Саня з Мишею без клубів.
          // ⚠️ Сортуємо за weighted_pct, а не backed_pct: у ньому
          // сидить поправка на малу вибірку, інакше «3 з 4» обходить
          // «11 з 15» і талісманом стає випадкова команда.
          sbGet('dna_team?select=*&backed=gte.4&order=weighted_pct.desc,backed.desc'),
          sbGet('dna_rhythm?select=*'),
          sbGet('dna_bonus?select=*'),
          sbGet('dna_pair?select=*&order=same_pct.desc'),
          sbGet('dna_league?select=*'),
          // Друге визначення улюбленої команди — «віра»: наскільки
          // частіше за решту ліги людина ставить на її перемогу.
          sbGet('dna_belief?select=*&played=gte.4&order=belief_diff.desc,played.desc'),
          sbGet('dna_shape?select=*'),
          sbGet('dna_vs_league?select=*&order=person.asc,tournament_order.asc'),
          sbGet('dna_score_kind?select=*&order=person.asc,kind.asc,rn.asc'),
        ]);
        HONORS_CACHE = { medals, detail, hof, facts, season,
                         dnaProfile, dnaArch, dnaScore, dnaTeam,
                         dnaRhythm, dnaBonus, dnaPair,
                         dnaBelief, dnaShape, dnaVsLeague, dnaScoreKind,
