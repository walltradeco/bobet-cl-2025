<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BoBet · Fantasy League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1410;
    --panel: #151D17;
    --panel-2: #1B251D;
    --panel-3: #212D23;
    --line: #2A362B;
    --text: #EDEFE8;
    --text-dim: #8B9A8C;
    --gold: #E8B23C;
    --teal: #6FAFAF;
    --blue: #5E97D0;
    --purple: #A98FDB;
    --purple-soft: rgba(169,143,219,0.12);
    --green: #4CAE6B;
    --green-soft: rgba(76,174,107,0.14);
    --red: #C75C4A;
    --red-soft: rgba(199,92,74,0.14);
    --gold-soft: rgba(232,178,60,0.10);
    --field-line: rgba(237,239,232,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--field-line) 0px, var(--field-line) 1px, transparent 1px, transparent 64px),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:2100px;margin:0 auto;padding:0 48px 80px;}

  /* ===== HEADER ===== */
  header{
    padding:36px 0 0;
    border-bottom:1px solid var(--line);
    margin-bottom:28px;
  }
  .head-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:22px;
  }
  .brand-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--green);
    margin:0 0 10px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:42px;
    line-height:1.05;
    margin:0;
    letter-spacing:-0.01em;
    text-transform:uppercase;
  }
  .meta-block{
    text-align:right;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--text-dim);
  }
  #refresh-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    margin-top:8px;
    transition:border-color .15s;
  }
  #refresh-btn:hover{border-color:var(--green);}
  #refresh-btn:focus-visible{outline:2px solid var(--green); outline-offset:2px;}
  #refresh-btn:disabled{opacity:0.6; cursor:wait;}

  nav.tournaments{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding-bottom:20px;
  }
  nav.tournaments button{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
    transition:all .15s;
  }
  nav.tournaments button:hover{color:var(--text); border-color:var(--green);}
  nav.tournaments button.active{
    background:var(--green);
    border-color:var(--green);
    color:#0E1410;
  }
  nav.tournaments button:focus-visible{outline:2px solid var(--green); outline-offset:2px;}
  /* HONORS не турнір, а наскрізна вітрина — тому золота, не зелена.
     Так вона не читається як «ще один турнір у ряду». */
  nav.tournaments button[data-key="honors"]{ color:var(--gold); border-color:rgba(232,178,60,0.35); }
  nav.tournaments button[data-key="honors"]:hover{ border-color:var(--gold); }
  nav.tournaments button[data-key="honors"].active{
    background:var(--gold); border-color:var(--gold); color:#0E1410;
  }

  nav.tabs{
    display:flex;
    gap:4px;
    margin-bottom:28px;
    overflow-x:auto;
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    font-weight:600;
    padding:12px 18px;
    cursor:pointer;
    white-space:nowrap;
    border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{color:var(--green); border-bottom-color:var(--green);}
  nav.tabs button:focus-visible{outline:2px solid var(--green); outline-offset:-2px;}

  /* ===== LEADERBOARDS ===== */
  .boards{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
    gap:24px;
    align-items:start;
  }
  .board{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .board-head{
    padding:14px 18px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    border-bottom:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
  }
  /* stage accents (match the sheet: Group=teal, Play-off=blue, General=gold) */
  .board.stage-group .board-head{color:var(--teal); box-shadow:inset 0 3px 0 var(--teal);}
  .board.stage-playoff .board-head{color:var(--blue); box-shadow:inset 0 3px 0 var(--blue);}
  .board.stage-knockout .board-head{color:#B98FE0; box-shadow:inset 0 3px 0 #B98FE0;}
  .board.stage-general .board-head{color:var(--gold); box-shadow:inset 0 3px 0 var(--gold);}
  .lb-row{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 22px;
    border-bottom:1px solid var(--line);
    transition:background .12s;
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-row.p1{background:linear-gradient(90deg, rgba(232,178,60,0.16), rgba(232,178,60,0.03));}
  .lb-row.p2{background:linear-gradient(90deg, rgba(199,205,195,0.14), rgba(199,205,195,0.02));}
  .lb-row.p3{background:linear-gradient(90deg, rgba(201,123,74,0.14), rgba(201,123,74,0.02));}
  .lb-rank{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    font-weight:700;
    min-width:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-dim);
    flex-shrink:0;
  }
  .lb-row.p1 .lb-rank{color:var(--gold);}
  .lb-row.p2 .lb-rank{color:#C7CDC3;}
  .lb-row.p3 .lb-rank{color:#C97B4A;}
  .lb-rank .crown{font-size:26px;}
  .lb-name{
    flex:1;
    font-family:'Space Grotesk',sans-serif;
    font-size:21px;
    font-weight:500;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .lb-row.p1 .lb-name, .lb-row.p2 .lb-name, .lb-row.p3 .lb-name{font-weight:700;}
  .lb-pts{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:25px;
    color:var(--text);
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .lb-row.p1 .lb-pts{color:var(--gold);}
  .lb-row.p2 .lb-pts{color:#C7CDC3;}
  .lb-row.p3 .lb-pts{color:#C97B4A;}

  /* ===== MATCHES ===== */
  .matches-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:auto;
  }
  table.matches{
    width:100%;
    border-collapse:collapse;
    font-size:15px;
    table-layout:fixed;
  }
  table.matches thead th{
    position:sticky;
    top:0;
    z-index:2;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
    padding:12px 12px 10px;
    text-align:center;
    vertical-align:bottom;
  }
  table.matches thead th.meta{
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    padding:12px 12px 10px;
  }
  table.matches thead th.meta.th-game{text-align:center;}
  /* separate Points totals row (gold), above the player-names row */
  table.matches thead tr.totals-row th{
    background:var(--gold-soft);
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    text-align:center;
  }
  table.matches thead th.totals-label{
    text-align:right;
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--gold);
  }
  table.matches thead th.totals-val{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:16px;
    color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
  table.matches thead th.p-name-cell{
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--text);
    padding:12px;
  }
  .player-head{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .player-head .p-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--text);
    letter-spacing:0.01em;
  }
  .player-head .p-total{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:14px;
    color:var(--gold);
    background:var(--gold-soft);
    padding:3px 12px;
    border-radius:20px;
    font-variant-numeric:tabular-nums;
  }
  table.matches td{
    padding:14px 10px;
    border-bottom:1px solid var(--line);
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:19px;
    color:var(--text-dim);
    white-space:nowrap;
  }
  table.matches tbody tr:last-child td{border-bottom:none;}
  td.c-date{
    text-align:center;
    font-size:16px;
    color:var(--text-dim);
    white-space:normal;
  }
  td.c-game{
    text-align:center;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:20px;
    color:var(--text);
    white-space:normal;
  }
  .flag{
    display:inline-block;
    width:24px;
    height:18px;
    border-radius:2px;
    object-fit:cover;
    vertical-align:middle;
    flex-shrink:0;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08);
  }
  .crest{
    display:inline-block;
    width:22px;
    height:22px;
    object-fit:contain;
    vertical-align:middle;
    flex-shrink:0;
  }
  .team{display:inline-flex; align-items:center; gap:8px;}
  .game-teams{display:inline-flex; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap;}
  .game-teams .vs{color:var(--text-dim); margin:0 2px;}
  td.c-result{
    font-weight:700;
    font-size:20px;
    color:var(--gold);
    background:rgba(232,178,60,0.07);
    box-shadow:inset 1px 0 0 rgba(232,178,60,0.28), inset -1px 0 0 rgba(232,178,60,0.28);
  }
  .result-pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-width:68px;
    max-width:100%;
    padding:6px 14px;
    border-radius:8px;
    background:rgba(232,178,60,0.22);
    border:1px solid rgba(232,178,60,0.55);
    color:#F5D488;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.03em;
  }
  .result-pill .team{gap:8px; min-width:0;}
  .result-pill .team span{overflow:hidden; text-overflow:ellipsis;}
  table.matches thead th.th-result{color:var(--gold);}
  td.pred{position:relative;}
  td.pred.exact{
    background:rgba(76,174,107,0.45);
    color:#EFFAF0;
    font-weight:700;
    box-shadow:inset 0 0 0 1px rgba(76,174,107,0.7);
  }
  /* вгаданий результат (перемога/нічия) — без заливки, лише яскравий текст */
  td.pred.outcome{
    color:var(--text);
    font-weight:700;
  }
  .chip.outcome{background:rgba(237,239,232,0.9);}
  tr.day-start td{border-top:2px solid var(--panel-3);}
  tr.day-even td.c-date, tr.day-even td.c-game{background:rgba(255,255,255,0.02);}
  /* stage separators (1/8, 1/4, Semifinals, Final) */
  tr.sep-row td{
    background:var(--panel-3);
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold);
    text-align:center;
    padding:10px 12px;
  }
  .legend{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-top:14px;
    font-size:12px;
    color:var(--text-dim);
  }
  .legend span{display:inline-flex; align-items:center; gap:7px;}
  .chip{
    display:inline-block;
    width:22px; height:14px;
    border-radius:3px;
  }
  .chip.exact{background:rgba(76,174,107,0.45); box-shadow:inset 0 0 0 1px rgba(76,174,107,0.7);}

  /* ===== GROUPS BLOCK (Group A–F team compositions) ===== */
  .groups-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:14px;
    margin-bottom:24px;
  }
  .group-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .group-card .g-head{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:9px 14px;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
  }
  .group-card .g-team{
    font-size:13px;
    padding:7px 14px;
    border-bottom:1px solid var(--line);
    color:var(--text);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .group-card .g-team:last-child{border-bottom:none;}

  /* ===== GROUP POSITIONS ===== */
  .gp-wrap{
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
    margin-bottom:22px;
    align-items:start;
  }
  .gp-block{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:auto;
  }
  .gp-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 16px;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
  }
  .gp-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--gold);
  }
  table.gp-table{
    width:100%;
    border-collapse:collapse;
    font-size:15px;
  }
  table.gp-table th{
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-dim);
    padding:9px 14px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  table.gp-table th.gp-player{
    color:var(--text);
    font-weight:700;
    font-size:18px;
    letter-spacing:0.02em;
    text-transform:none;
  }
  table.gp-table th.gp-seed-h{color:var(--text-dim);}
  table.gp-table th.gp-actual-h{color:var(--gold); font-weight:700; font-size:16px;}
  table.gp-table td{
    padding:11px 16px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    font-size:17px;
    text-align:center;
  }
  table.gp-table .team{justify-content:center;}
  table.gp-table tbody tr:last-child td{border-bottom:none;}
  .gp-rank{
    font-family:'JetBrains Mono',monospace;
    color:var(--text-dim);
    width:44px;
    font-size:15px;
    text-align:center;
  }
  .gp-seed{
    color:var(--text-dim);
    border-right:1px solid var(--line);
  }
  .gp-seed .team{gap:7px;}
  .gp-seed .flag{width:20px; height:15px;}
  .gp-actualteam{
    font-weight:600;
    background:rgba(232,178,60,0.07);
    box-shadow:inset 1px 0 0 rgba(232,178,60,0.28), inset -1px 0 0 rgba(232,178,60,0.28);
  }
  .gp-actualteam .result-pill{
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:4px 12px;
    min-width:0;
  }
  .gp-actualteam .result-pill .flag{width:20px; height:15px;}
  .gp-actualteam .team, .gp-pred .team{gap:7px;}
  .gp-actualteam .flag, .gp-pred .flag{width:20px; height:15px;}
  .gp-pred{color:var(--text-dim);}
  .gp-pred.hit{
    background:var(--green-soft);
    color:var(--green);
    font-weight:700;
  }
  /* Points summary on top */
  .gp-summary{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
  }
  .gp-summary-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    min-width:96px;
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    position:relative;
  }
  /* Rivals / MVP badges on the Points summary cells */
  .rv-badges{
    position:absolute; top:8px; right:10px;
    display:flex; gap:6px; align-items:center;
  }
  .rv-badge{
    position:relative;
    font-size:14px; line-height:1; cursor:default;
    display:inline-flex; align-items:center; gap:1px;
  }
  .rv-count{
    font-family:'JetBrains Mono',monospace; font-size:10px;
    font-weight:700; color:var(--gold);
  }
  .rv-tip{
    display:none;
    position:absolute; top:22px; right:0;
    background:var(--panel-2); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; min-width:200px;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--text); z-index:40; text-align:left; white-space:nowrap;
    box-shadow:0 6px 18px rgba(0,0,0,0.5);
  }
  .rv-badge:hover .rv-tip{ display:block; }
  .rv-tip-row + .rv-tip-row{ margin-top:5px; padding-top:5px; border-top:1px solid var(--line); }
  .rv-tip .win{ color:var(--green); font-weight:700; }
  .rv-tip .draw{ color:var(--gold); }
  .rv-tip .loss{ color:var(--red); }
  .rv-tip .pending{ color:var(--text); opacity:0.6; }
  .rv-tip .cap{ color:var(--text); opacity:0.55; }


  /* BoOrbit — логотип по центру над шапкою */
  .boorbit-mark{
    display:flex; justify-content:center;
    padding:22px 16px 6px;
  }
  .boorbit-mark img{
    width:100%; max-width:620px; height:auto; display:block;
  }
  @media (max-width:640px){
    .boorbit-mark{ padding:14px 12px 2px; }
    .boorbit-mark img{ max-width:340px; }
  }

  /* ================= HONORS — трофейна вітрина =================
     Ідея: не таблиця, а фізичний простір. Темна ніша, згори
     світло, медалі стоять на полиці й дають відблиск. Головний
     колір тут золотий, а не зелений, — вкладка навмисно інша. */
  .hn-wrap{ padding:4px 0 40px; }
  .hn-head{ text-align:center; margin:18px 0 26px; }
  .hn-head h2{
    font-family:'Space Grotesk',sans-serif; font-size:31px; letter-spacing:0.16em;
    color:var(--gold); margin:0 0 6px; text-transform:uppercase;
  }
  .hn-head p{ color:var(--text-dim); font-size:15px; margin:0; }
  .hn-sec{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--text-dim);
    margin:34px 0 14px; display:flex; align-items:center; gap:10px;
  }
  .hn-sec::after{ content:''; flex:1; height:1px; background:var(--line); }

  /* Ніша: темніша за сторінку, зі світлом угорі */
  .hn-case{
    background:linear-gradient(180deg, rgba(232,178,60,0.10) 0%, rgba(0,0,0,0) 42%), var(--panel);
    border:1px solid var(--line); border-radius:14px;
    padding:0 0 2px; overflow:hidden; margin-bottom:12px;
  }
  .hn-case.dim{ opacity:0.75; }
  .hn-lamp{ height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:0.55; }
  .hn-row{
    display:flex; align-items:center; gap:16px;
    padding:14px 16px 16px; flex-wrap:wrap;
  }
  .hn-who{ min-width:132px; }
  .hn-who b{
    font-family:'Space Grotesk',sans-serif; font-size:23px; color:var(--text);
    display:block; line-height:1.15;
  }
  .hn-who span{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-dim); }
  .hn-tally{ display:flex; gap:9px; margin-top:6px; font-family:'JetBrains Mono',monospace; font-size:15px; }
  .hn-tally i{ font-style:normal; color:var(--text-dim); }

  /* Полиця. Лінії під медалями свідомо НЕМАЄ: вона імітувала край
     полиці, але з'їдала цілий рядок і нічого не пояснювала. Без неї
     медалі й підписи більші — читається краще. */
  .hn-shelf{
    flex:1; display:flex; flex-wrap:wrap; gap:10px; min-width:240px;
  }
  .hn-m{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    width:168px; text-align:center;   /* «Клубний ЧС 2025 · Play-off» має лягати у два рядки */
  }
  .hn-m .ic{
    font-size:44px; line-height:1;
    filter:drop-shadow(0 3px 5px rgba(232,178,60,0.35));
  }
  .hn-m .cap{
    font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.5;
    color:var(--text); word-break:break-word;
  }
  .hn-m .cap .lb{ color:var(--text-dim); opacity:0.65; }
  .hn-empty{
    padding:16px; text-align:center; color:var(--text-dim);
    font-family:'JetBrains Mono',monospace; font-size:14px;
  }
  .hn-empty b{ color:var(--gold); }

  /* Зала слави: плакетки на стіні */
  .hn-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .hn-plq{
    background:var(--panel-2); border:1px solid var(--line);
    border-left:3px solid var(--gold); border-radius:12px; padding:16px 18px;
  }
  .hn-plq .nm{
    font-family:'JetBrains Mono',monospace; font-size:13.5px; letter-spacing:0.06em;
    color:var(--gold); margin-bottom:9px;
  }
  .hn-plq .who{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:23px;
    color:var(--text); line-height:1.2;
  }
  .hn-plq .val{
    font-family:'JetBrains Mono',monospace; font-size:30px; color:var(--gold);
    margin:5px 0 8px; line-height:1.1;
  }
  .hn-plq .note{ font-size:14px; color:var(--text-dim); line-height:1.45; }

  /* Медальний залік таблицею.
     Смугу «Склад» прибрано на прохання Богдана — вона дублювала
     цифри 🥇🥈🥉, які й так стоять поруч. */
  .hn-tbl{ width:100%; border-collapse:collapse; margin-bottom:6px; }
  .hn-tbl th{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:500;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim);
    padding:11px 8px; font-size:12.5px; border-bottom:1px solid var(--line); text-align:center;
    white-space:nowrap;
  }
  .hn-tbl th:first-child{ text-align:left; padding-left:14px; }
  .hn-tbl td{
    font-family:'JetBrains Mono',monospace; font-size:21px; color:var(--text);
    padding:14px 8px; text-align:center; border-bottom:1px solid rgba(42,54,43,0.5);
  }
  .hn-tbl td.nm{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:23px;
    text-align:left; white-space:nowrap; padding-left:14px;
  }
  .hn-tbl td.nm .pos{
    font-family:'JetBrains Mono',monospace; font-size:13px;
    color:var(--text-dim); margin-right:9px;
  }
  .hn-tbl td.g{ color:var(--gold); }
  .hn-tbl td.s{ color:#C7CBD1; }
  .hn-tbl td.b{ color:#C0803E; }
  .hn-tbl td.zero{ color:var(--text-dim); opacity:0.4; }
  .hn-tbl td.tot{ color:var(--text); font-weight:700; }
  .hn-tbl tbody tr:hover{ background:rgba(232,178,60,0.05); }

  @media (max-width:720px){
    .hn-tbl td{ font-size:15px; padding:9px 4px; }
    .hn-tbl td.nm{ font-size:16px; }
    .hn-tbl th{ font-size:10px; padding:8px 4px; }
  }

  /* Історія ліги */
  .hn-facts{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .hn-fact{
    background:var(--panel-2); border:1px solid var(--line);
    border-left:3px solid rgba(232,178,60,0.45);
    border-radius:12px; padding:16px 18px;
  }
  .hn-fact .t{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; color:var(--text);
  }
  .hn-fact .w{ font-family:'JetBrains Mono',monospace; font-size:16px; color:var(--gold); margin:7px 0 9px; }
  .hn-fact .d{ font-size:13.5px; color:var(--text-dim); line-height:1.55; }

  @media (max-width:640px){
    .hn-row{ gap:10px; padding:12px; }
    .hn-who{ min-width:100%; }
    .hn-m{ width:132px; }
  }

  .gp-summary-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:17px;
    color:var(--text);
  }
  .gp-summary-pts{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:24px;
    color:var(--gold);
    font-variant-numeric:tabular-nums;
  }

  /* ===== SPECIAL BETS ===== */
  table.special{table-layout:fixed;}
  table.special th.sb-th{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  table.special th.sb-th-player{
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--text);
    text-transform:none;
    letter-spacing:0.01em;
  }
  table.special td.sb-label{
    text-align:left;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--text);
    white-space:normal;
  }
  table.special td.sb-actual{text-align:center;}
  table.special td.sb-actual{
    background:rgba(232,178,60,0.07);
    box-shadow:inset 1px 0 0 rgba(232,178,60,0.28), inset -1px 0 0 rgba(232,178,60,0.28);
  }
  table.special th.sb-th-actual{color:var(--gold);}
  td.sb-actual .result-pill{
    font-family:'Inter',sans-serif;
    font-size:17px;
    min-width:0;
    padding:6px 10px;
    max-width:100%;
  }
  /* назва результату не обрізається трьома крапками — краще трохи менший шрифт */
  td.sb-actual .result-pill .team span{overflow:visible; text-overflow:clip; white-space:nowrap;}
  table.special td.sb-val{
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:18px;
    white-space:normal;
  }
  table.special td.sb-val .team{justify-content:center; gap:7px;}
  table.special td.sb-val.sb-hit{
    background:rgba(76,174,107,0.45);
    color:#EFFAF0;
    font-weight:700;
    box-shadow:inset 0 0 0 1px rgba(76,174,107,0.7);
  }
  table.special tr.sb-points td{
    background:var(--gold-soft);
    border-bottom:1px solid var(--line);
  }
  table.special tr.sb-points td.sb-label{color:var(--gold);}
  table.special tr.sb-points td.sb-val{
    color:var(--gold);
    font-weight:700;
  }
  table.special tr.sb-points td.sb-val.scored{color:var(--green);}

  /* ===== BOOSTS ===== */
  .boosts-card{margin-top:22px;}
  table.boosts th.boost-head{
    color:var(--gold);
    font-size:13px;
    letter-spacing:0.08em;
    white-space:nowrap;
  }
  table.boosts th.boost-player{
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:17px;
    color:var(--text);
    text-transform:none;
    letter-spacing:0.01em;
  }
  table.boosts td.boost-label{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--gold);
    background:var(--gold-soft);
    white-space:nowrap;
  }
  table.boosts td.boost-val{
    text-align:center;
    font-size:15px;
    color:var(--text-dim);
    white-space:normal;
    line-height:1.6;
    padding:12px 8px;
  }
  table.boosts{table-layout:fixed;}
  .boost-scores{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    margin-top:4px;
    color:var(--text-dim);
  }
  .boost-scores b{color:var(--text); font-weight:700;}
  table.boosts td.boost-val .flag, table.boosts td.boost-val .crest{width:18px; height:13px;}
  table.boosts td.boost-val .crest{height:18px;}

  /* ===== BOOST COLOURS =====
     ДВА НАБОРИ, навмисно.
     b* — архівні турніри. Кольори повторюють контури з Google Sheets,
     їх не чіпаємо: Euro 2024, CL 2025, Club WC і WC 2026 мають
     лишитись такими, якими були.
     lb* — EuroSeason 2026. Тут бустів сім, і раніше чотири з них
     падали в один сірий bgen — через це вони й не розрізнялись.
     Ці кольори збігаються з константою BOOST_COLORS в app.html. */
  :root{
    --b2x: #C2568F;
    --b3x: #57BE7A;
    --bdp: #5E97D0;
    --bot: #E8B23C;
    --bgen: #A98FDB;

    --lbdp: #40C4FF;   /* Double Predict — блакитний */
    --lbgd: #B388FF;   /* Різниця голів — бузковий   */
    --lb2x: #FFD740;   /* 2x — жовтий                */
    --lbtot:#69F0AE;   /* Total 3.5+ — зелений       */
    --lbap: #FF9100;   /* Автопілот — помаранчевий   */
    --lbbt: #FF4081;   /* Обидві заб'ють — рожевий   */
    --lb3x: #FF5252;   /* 3x — червоний              */
  }
  td.pred.boosted{
    position:relative;
    border-radius:4px;
  }
  td.pred.b2x{box-shadow:inset 0 0 0 5px var(--b2x);}
  td.pred.b3x{box-shadow:inset 0 0 0 5px var(--b3x);}
  td.pred.bdp{box-shadow:inset 0 0 0 5px var(--bdp);}
  td.pred.bot{box-shadow:inset 0 0 0 5px var(--bot);}
  td.pred.lbdp{box-shadow:inset 0 0 0 5px var(--lbdp);}
  td.pred.lbgd{box-shadow:inset 0 0 0 5px var(--lbgd);}
  td.pred.lb2x{box-shadow:inset 0 0 0 5px var(--lb2x);}
  td.pred.lbtot{box-shadow:inset 0 0 0 5px var(--lbtot);}
  td.pred.lbap{box-shadow:inset 0 0 0 5px var(--lbap);}
  td.pred.lbbt{box-shadow:inset 0 0 0 5px var(--lbbt);}
  td.pred.lb3x{box-shadow:inset 0 0 0 5px var(--lb3x);}
  td.pred.bgen{box-shadow:inset 0 0 0 5px var(--bgen);}
  /* вгаданий рахунок + буст: лишаємо зелену заливку і контур буста поверх */
  td.pred.exact.b2x{box-shadow:inset 0 0 0 5px var(--b2x);}
  td.pred.exact.b3x{box-shadow:inset 0 0 0 5px var(--b3x);}
  td.pred.exact.bdp{box-shadow:inset 0 0 0 5px var(--bdp);}
  td.pred.exact.bot{box-shadow:inset 0 0 0 5px var(--bot);}
  .dp-alt{
    display:block;
    font-size:13px;
    color:var(--text-dim);
    margin-top:2px;
  }
  td.pred.exact .dp-alt{color:rgba(239,250,240,0.75);}
  /* Double Predict до внесення результату: жоден із двох рахунків
     не головний, тому другий не приглушуємо. Два класи в селекторі —
     щоб перебити .dp-alt із медіазапитів незалежно від порядку. */
  .dp-alt.dp-even{
    font-size:inherit;
    font-weight:inherit;
    color:inherit;
    opacity:1;
  }
  .chip.b2x{background:transparent; box-shadow:inset 0 0 0 5px var(--b2x);}
  .chip.b3x{background:transparent; box-shadow:inset 0 0 0 5px var(--b3x);}
  .chip.bdp{background:transparent; box-shadow:inset 0 0 0 5px var(--bdp);}
  .chip.bot{background:transparent; box-shadow:inset 0 0 0 5px var(--bot);}
  .chip.bgen{background:transparent; box-shadow:inset 0 0 0 5px var(--bgen);}
  .chip.lbdp{background:transparent; box-shadow:inset 0 0 0 5px var(--lbdp);}
  .chip.lbgd{background:transparent; box-shadow:inset 0 0 0 5px var(--lbgd);}
  .chip.lb2x{background:transparent; box-shadow:inset 0 0 0 5px var(--lb2x);}
  .chip.lbtot{background:transparent; box-shadow:inset 0 0 0 5px var(--lbtot);}
  .chip.lbap{background:transparent; box-shadow:inset 0 0 0 5px var(--lbap);}
  .chip.lbbt{background:transparent; box-shadow:inset 0 0 0 5px var(--lbbt);}
  .chip.lb3x{background:transparent; box-shadow:inset 0 0 0 5px var(--lb3x);}
  table.boosts td.boost-label.lbdp{color:var(--lbdp); box-shadow:inset 3px 0 0 var(--lbdp);}
  table.boosts td.boost-label.lbgd{color:var(--lbgd); box-shadow:inset 3px 0 0 var(--lbgd);}
  table.boosts td.boost-label.lb2x{color:var(--lb2x); box-shadow:inset 3px 0 0 var(--lb2x);}
  table.boosts td.boost-label.lbtot{color:var(--lbtot); box-shadow:inset 3px 0 0 var(--lbtot);}
  table.boosts td.boost-label.lbap{color:var(--lbap); box-shadow:inset 3px 0 0 var(--lbap);}
  table.boosts td.boost-label.lbbt{color:var(--lbbt); box-shadow:inset 3px 0 0 var(--lbbt);}
  table.boosts td.boost-label.lb3x{color:var(--lb3x); box-shadow:inset 3px 0 0 var(--lb3x);}
  table.boosts td.boost-label.b2x{color:var(--b2x); background:rgba(194,86,143,0.12); box-shadow:inset 3px 0 0 var(--b2x);}
  table.boosts td.boost-label.b3x{color:var(--b3x); background:rgba(87,190,122,0.12); box-shadow:inset 3px 0 0 var(--b3x);}
  table.boosts td.boost-label.bdp{color:var(--bdp); background:rgba(94,151,208,0.12); box-shadow:inset 3px 0 0 var(--bdp);}
  table.boosts td.boost-label.bot{color:var(--bot); background:var(--gold-soft); box-shadow:inset 3px 0 0 var(--bot);}

  /* ===== GENERIC TABLE ===== */
  .table-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:auto;
    margin-bottom:24px;
  }
  table.sheet-table{
    width:100%;
    border-collapse:collapse;
    font-size:15px;
  }
  table.sheet-table th{
    text-align:left;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
    background:var(--panel-2);
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    position:sticky;
    top:0;
  }
  table.sheet-table td{
    padding:11px 16px;
    border-bottom:1px solid var(--line);
    color:var(--text);
    white-space:nowrap;
  }
  table.sheet-table tbody tr:last-child td{border-bottom:none;}
  table.sheet-table tbody tr:nth-child(even){background:rgba(255,255,255,0.015);}
  table.sheet-table tbody tr:hover{background:rgba(76,174,107,0.06);}
  /* uniform Points highlighting in generic tables */
  table.sheet-table th.th-points{
    color:var(--gold);
    font-weight:700;
  }
  table.sheet-table td.td-points{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    color:var(--gold);
    background:var(--gold-soft);
    font-variant-numeric:tabular-nums;
  }

  /* ===== RULES ===== */
  .rules-block{margin-bottom:26px;}
  table.rules th.group-head{
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text);
    background:var(--panel-3);
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    border-left:1px solid var(--line);
  }
  table.rules th.sub-head{
    text-align:center;
    font-size:14px;
    color:var(--text);
  }
  table.rules thead th{padding:14px 14px;}
  table.rules td{padding:15px 14px;}
  table.rules td{text-align:center;}
  table.rules td.c-condition{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:18px;
    line-height:1.5;
    white-space:normal;
    min-width:220px;
  }
  table.rules td.c-points{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:20px;
    color:var(--gold);
    background:var(--gold-soft);
  }
  .yn{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    font-weight:700;
    text-transform:uppercase;
    padding:5px 16px;
    border-radius:20px;
  }
  .yn.yes{color:var(--green); background:var(--green-soft); border:1px solid rgba(76,174,107,0.4);}
  .yn.no{color:var(--red); background:var(--red-soft); border:1px solid rgba(199,92,74,0.4);}
  .rules-note{
    margin-top:16px;
    padding:16px 20px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    font-size:16px;
    line-height:1.7;
    color:var(--text-dim);
  }

  .status-line{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    padding:30px 0;
    text-align:center;
  }
  .status-line.err{color:var(--red);}

  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  /* ===== RESPONSIVE ===== */
  @media(max-width:1000px){
    h1{font-size:28px;}
  }
  @media(max-width:640px){
    .wrap{padding:0 12px 60px;}
    header{padding-top:22px;}
    .head-top{flex-direction:column; gap:10px; margin-bottom:14px;}
    .meta-block{text-align:left; display:flex; align-items:center; gap:12px;}
    #refresh-btn{margin-top:0;}
    h1{font-size:24px;}
    nav.tournaments{padding-bottom:14px; gap:6px;}
    nav.tournaments button{padding:8px 12px; font-size:12px;}
    nav.tabs{margin-bottom:20px;}
    nav.tabs button{padding:9px 12px; font-size:13px;}
    .boards{gap:14px;}
    .lb-row{padding:10px 14px; gap:10px;}
    .lb-name{font-size:14px;}
    .lb-pts{font-size:15px;}
    .lb-rank{min-width:34px;}
    table.matches{font-size:13px;}
    table.matches td{padding:8px 5px; font-size:13px;}
    table.matches thead th{padding:9px 5px 8px;}
    table.matches thead th.p-name-cell{font-size:13px;}
    td.c-game{font-size:13px;}
    td.c-result{font-size:14px;}
    td.c-date{font-size:11px;}
    .dp-alt{font-size:10px;}
    .player-head .p-name{font-size:12px;}
    .player-head .p-total{font-size:11px; padding:1px 8px;}
    table.sheet-table{font-size:13px;}
    table.sheet-table td{padding:8px 6px;}
    table.sheet-table th{padding:9px 6px;}
    table.special td.sb-label, table.special th.sb-th-player{font-size:13px;}
    table.special td.sb-val{font-size:13px;}
    table.boosts td.boost-val, .boost-scores{font-size:12px;}
    .gp-summary-name{font-size:13px;}
    .gp-summary-pts{font-size:18px;}
    .flag{width:20px; height:15px;}
    .yn{padding:2px 8px; font-size:10px;}
  }

  /* ===================================================================
     ВЕЛИКІ ЕКРАНИ (зовнішні монітори, Studio Display, 4K/5K).
     Нижче 1800px нічого не змінюється — MacBook Air лишається як був.
     =================================================================== */
  @media(min-width:1800px){
    .wrap{padding:0 64px 90px;}
    h1{font-size:48px;}
    .brand-tag{font-size:14px;}
    nav.tournaments button{font-size:17px; padding:13px 26px;}
    nav.tabs button{font-size:18px; padding:13px 20px;}

    .board-head{font-size:16px; padding:16px 20px;}
    .lb-row{padding:18px 24px;}
    .lb-name{font-size:23px;}
    .lb-pts{font-size:28px;}
    .lb-rank .crown{font-size:29px;}

    .gp-summary-cell{padding:16px 18px;}
    .gp-summary-name{font-size:18px;}
    .gp-summary-pts{font-size:27px;}

    table.matches{font-size:16px;}
    table.matches td{padding:16px 12px; font-size:21px;}
    table.matches thead th.p-name-cell{font-size:21px;}
    table.matches thead th.meta{font-size:17px;}
    td.c-game{font-size:22px;}
    td.c-date{font-size:17px;}
    td.c-result, .result-pill{font-size:22px;}
    .result-pill{padding:7px 16px; min-width:76px;}
    .dp-alt{font-size:14px;}
    .flag{width:26px; height:19px;}
    .crest{width:24px; height:24px;}

    table.special th.sb-th-player{font-size:21px;}
    table.special td.sb-label{font-size:20px;}
    table.special td.sb-val{font-size:20px;}
    td.sb-actual .result-pill{font-size:17px; padding:6px 10px;}

    table.gp-table td{font-size:19px;}
    table.gp-table th.gp-player{font-size:20px;}
    .gp-actualteam .result-pill{font-size:18px;}

    table.boosts th.boost-player{font-size:19px;}
    table.boosts td.boost-val, .boost-scores{font-size:17px;}

    table.rules td.c-condition{font-size:20px;}
    table.rules td.c-points{font-size:22px;}
    table.rules th.group-head{font-size:15px;}
    table.rules th.sub-head{font-size:15px;}
    .yn{font-size:15px; padding:6px 18px;}
    .rules-note{font-size:17px;}
    .legend{font-size:14px;}
  }

  /* 5K / надширокі монітори */
  @media(min-width:2600px){
    .wrap{max-width:2560px; padding:0 80px 100px;}
    h1{font-size:54px;}
    table.matches td{font-size:23px;}
    td.c-game{font-size:24px;}
    td.c-result, .result-pill{font-size:24px;}
    table.matches thead th.p-name-cell{font-size:23px;}
    .lb-name{font-size:25px;}
    .lb-pts{font-size:30px;}
    .gp-summary-pts{font-size:30px;}
  }

  /* ===================================================================
     ПЛАНШЕТИ І ВУЗЬКІ ВІКНА: широкі таблиці не стискаються в кашу,
     а прокручуються горизонтально всередині своєї картки.
     =================================================================== */
  @media(max-width:1100px){
    .matches-card, .table-card, .gp-block{-webkit-overflow-scrolling:touch;}
    table.matches{min-width:820px;}
    table.special{min-width:760px;}
    table.gp-table{min-width:720px;}
    table.boosts{min-width:760px;}
    table.rules{min-width:720px;}
    table.sheet-table{min-width:640px;}
  }

  /* ===================================================================
     iPhone (15 / 16 / 17, у т.ч. Pro Max) — 390-440pt
     =================================================================== */
  @media(max-width:640px){
    .wrap{
      padding-left:max(12px, env(safe-area-inset-left));
      padding-right:max(12px, env(safe-area-inset-right));
      padding-bottom:calc(60px + env(safe-area-inset-bottom));
    }
    header{padding-top:max(18px, env(safe-area-inset-top));}
    h1{font-size:30px; letter-spacing:-0.02em;}
    .brand-tag{font-size:11px; margin-bottom:6px;}
    .meta-block{font-size:12px; gap:10px;}
    #refresh-btn{font-size:13px; padding:10px 14px;}

    nav.tournaments{gap:8px; padding-bottom:16px;}
    nav.tournaments button{font-size:13px; padding:10px 14px;}
    nav.tabs button{font-size:14px; padding:11px 12px;}

    /* борди */
    .board-head{font-size:14px; padding:12px 16px;}
    .lb-row{padding:12px 14px; gap:12px;}
    .lb-name{font-size:17px;}
    .lb-pts{font-size:19px;}
    .lb-rank{min-width:38px;}
    .lb-rank .crown{font-size:22px;}

    /* картки очок — по дві-три в ряд, а не стовпчиком */
    .gp-summary{gap:8px;}
    .gp-summary-cell{min-width:0; flex:1 1 28%; padding:10px 8px; gap:3px;}
    .gp-summary-name{font-size:13px;}
    .gp-summary-pts{font-size:20px;}

    /* таблиці прокручуються вбік, а не стискаються */
    table.matches{font-size:14px; min-width:700px;}
    table.matches td{padding:11px 6px; font-size:16px;}
    table.matches thead th{padding:10px 6px 9px;}
    table.matches thead th.p-name-cell{font-size:15px;}
    table.matches thead th.meta{font-size:13px;}
    td.c-game{font-size:15px;}
    td.c-date{font-size:12px;}
    td.c-result, .result-pill{font-size:16px;}
    .result-pill{min-width:52px; padding:5px 10px;}
    .dp-alt{font-size:11px;}
    .flag{width:20px; height:15px;}
    .crest{width:19px; height:19px;}
    td.pred.b2x{box-shadow:inset 0 0 0 4px var(--b2x);}
    td.pred.b3x{box-shadow:inset 0 0 0 4px var(--b3x);}
    td.pred.bdp{box-shadow:inset 0 0 0 4px var(--bdp);}
    td.pred.bot{box-shadow:inset 0 0 0 4px var(--bot);}

    table.special{min-width:660px;}
    table.special td.sb-label, table.special th.sb-th-player{font-size:14px;}
    table.special td.sb-val{font-size:14px;}
    td.sb-actual .result-pill{font-size:13px; padding:4px 8px;}

    table.gp-table{min-width:640px; font-size:13px;}
    table.gp-table td{padding:9px 8px; font-size:14px;}
    table.gp-table th{padding:8px 8px; font-size:13px;}
    table.gp-table th.gp-player{font-size:14px;}
    .gp-actualteam .result-pill{font-size:13px; padding:3px 8px;}
    .gp-title{font-size:13px;}

    table.boosts{min-width:660px;}
    table.boosts td.boost-val, .boost-scores{font-size:12px;}
    table.boosts th.boost-player{font-size:14px;}
    table.boosts td.boost-label{font-size:13px;}

    table.rules{min-width:660px;}
    table.rules td.c-condition{font-size:14px; min-width:180px;}
    table.rules td.c-points{font-size:16px;}
    table.rules th.group-head{font-size:11px;}
    table.rules th.sub-head{font-size:11px;}
    .yn{font-size:11px; padding:4px 10px;}
    .rules-note{font-size:14px; padding:14px 16px;}

    .legend{font-size:12px; gap:14px;}
    ::-webkit-scrollbar{height:6px;}
  }

  /* маленькі iPhone (SE / mini) */
  @media(max-width:380px){
    h1{font-size:26px;}
    nav.tournaments button{font-size:12px; padding:9px 12px;}
    .gp-summary-cell{flex:1 1 44%;}
  }

  /* ===================== КАБІНЕТ (модалка з app.html) ===================== */
  #cabinet-btn{
    background:var(--panel-2);
    border:1px solid var(--gold);
    color:var(--gold);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    margin-top:8px;
    margin-left:8px;
    transition:background .15s;
  }
  #cabinet-btn:hover{background:var(--gold-soft);}
  #cabinet-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  #cabinet-overlay{
    position:fixed; inset:0; z-index:9000;
    background:rgba(6,10,7,0.86);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    display:none;
    padding:16px;
  }
  #cabinet-overlay.open{display:block;}
  #cabinet-shell{
    position:relative;
    max-width:1200px; height:100%; margin:0 auto;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.55);
    display:flex; flex-direction:column;
  }
  #cabinet-bar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:10px 14px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  #cabinet-bar .t{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
  }
  #cabinet-bar .t span{color:var(--gold);}
  #cabinet-close{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:13px;
    padding:7px 14px; border-radius:6px; cursor:pointer;
  }
  #cabinet-close:hover{border-color:var(--red); color:var(--red);}
  #cabinet-frame{
    flex:1 1 auto; width:100%; border:0; display:block; background:var(--bg);
  }
  body.cabinet-lock{overflow:hidden;}

  @media (max-width:720px){
    #cabinet-overlay{padding:0;}
    #cabinet-shell{border-radius:0; border:0; max-width:none;}
    #cabinet-btn{margin-left:0;}
  }
</style>

/* Сайт упізнає гравців за вбудованим списком імен. Щоб новий учасник
   не зник із таблиці мовчки, доповнюємо цей список із бази. */
function registerPlayers(names){
  if(typeof KNOWN_PLAYERS === 'undefined') return;
  names.forEach(n => {
    const k = String(n).trim().toLowerCase();
    if(k && !KNOWN_PLAYERS.includes(k)) KNOWN_PLAYERS.push(k);
  });
}

async function sbGet(path){
  const res = await fetch(SB_URL + '/rest/v1/' + path, {
    headers:{ apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  });
  if(!res.ok) throw new Error('база відповіла ' + res.status);
  return res.json();
}

/* Порожня сітка потрібного розміру */
function grid(rowCount, colCount){
  return Array.from({ length: rowCount }, () => Array(colCount).fill(''));
}

function fmtScore(h, a){
  return (h === null || h === undefined || a === null || a === undefined)
    ? '' : h + ':' + a;
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear();
}

/* ---------------------------------------------------------------------
   ЛІДЕРБОРД: чотири борди в ряд — August | September | October | General

   Рендер шукає рядок із клітинками «Name». Кожна така клітинка задає
   борд із колонок [№ | Name | Points], а назва борда лежить рядком вище
   над колонкою №. Відтворюємо саме це.
   --------------------------------------------------------------------- */
async function buildLeaderboardRows(){
  const tours = await sbGet(
    'tournaments?select=id,key,title,status&key=in.(aug2026,sep2026,oct2026)');
  const byKey = {};
  tours.forEach(t => { byKey[t.key] = t; });

  const monthly = await sbGet(
    'leaderboard?select=tournament_id,display_name,total_points,place');
  const season = await sbGet(
    'season_leaderboard?select=display_name,total_points,place&order=place.asc');

  // Склад гравців: беремо з будь-якого місяця, який уже видно.
  const roster = [...new Set(monthly.map(r => r.display_name))];
  registerPlayers(roster.concat(season.map(r => r.display_name)));

  const boards = [];
  for(const m of MONTHS){
    const t = byKey[m.key];
    const rows = t
      ? monthly.filter(r => r.tournament_id === t.id).sort((a, b) => a.place - b.place)
      : [];
    // Місяць ще не стартував — показуємо борд із нулями, як у таблиці.
    boards.push({
      title: m.label,
      rows: rows.length ? rows
        : roster.map((n, i) => ({ place: 1, display_name: n, total_points: 0 }))
    });
  }
  boards.push({ title:'General', rows: season });

  const BOARD_W = 4;                       // №, Name, Points, порожня
  const cols = boards.length * BOARD_W;
  const depth = Math.max(1, ...boards.map(b => b.rows.length));
  const out = grid(depth + 2, cols);

  boards.forEach((b, bi) => {
    const c = bi * BOARD_W;
    out[0][c]     = b.title;               // назва борда над колонкою №
    out[1][c]     = '№';
    out[1][c + 1] = 'Name';
    out[1][c + 2] = 'Points';
    b.rows.forEach((r, ri) => {
      out[ri + 2][c]     = r.place;
      out[ri + 2][c + 1] = r.display_name;
      out[ri + 2][c + 2] = r.total_points;
    });
  });

  return out;
}

/* ---------------------------------------------------------------------
   МІСЯЦЬ: список матчів по вікендах

   Рендер шукає рядок із підписами Game і Result, імена гравців праворуч
   від Result, а тотали — у рядку з підписом Points вище. Роздільник
   стадії — рядок, де в колонці дати стоїть текст, а колонка Game порожня.
   Саме так і робимо «Вікенд 1», «Вікенд 2».
   --------------------------------------------------------------------- */
async function buildMonthRows(tournamentKey){
  const tours = await sbGet(
    'tournaments?select=id,key&key=eq.' + tournamentKey);
  if(!tours.length) return [['Цей місяць ще не відкрито']];
  const tid = tours[0].id;

  const weeks = await sbGet(
    'gameweek_status?select=gameweek_id,number,title,deadline_at,is_open' +
    '&tournament_id=eq.' + tid + '&order=number.asc');

  // Учасники — весь сезонний склад (серпень+вересень+жовтень), щоб усі три
  // місяці показували однакові колонки гравців. Інакше місяць, у якому ще
  // ніхто не зареєстрований, лишався б без колонок і таблиця ламалась.
  const seasonTours = await sbGet('tournaments?select=id&key=in.(aug2026,sep2026,oct2026)');
  const seasonIds = seasonTours.map(t => t.id).join(',');
  const people = await sbGet(
    'participants?select=display_name&tournament_id=in.(' + seasonIds + ')' +
    '&order=display_name.asc');

  const board = await sbGet(
    'match_board?select=gameweek_id,position,home_team,away_team,kickoff_at,' +
    'home_score,away_score,display_name,pred_home,pred_away,' +
    'pred_home_2,pred_away_2,boost_code');

  const boostTypes = await sbGet('boost_types?select=code,title,sort_order&order=sort_order.asc');

  // Рядок «Points» у місячній таблиці = загальні бали етапу (як у
  // Leaderboards): матчі + бонуси + дуелі. total_points уже містить
  // rival_points (файл 71). Бонуси показуються ще й у своїй вкладці.
  const totals = await sbGet(
    'leaderboard?select=display_name,total_points&tournament_id=eq.' + tid);

  // Дуелі Rivals цього етапу — для бейджа ⚔️ біля імені в рядку Points.
  // RLS сама ховає чужі пари до відкриття вікенда (той самий момент,
  // що й прогнози). status: pending / win / loss.
  const rivalRows = await sbGet(
    'rival_board?select=chooser_name,rival_name,gameweek_number,status,points' +
    '&tournament_id=eq.' + tid);
  const rivalsByName = {};
  rivalRows.forEach(r => {
    (rivalsByName[r.chooser_name] = rivalsByName[r.chooser_name] || []).push({
      rival: r.rival_name, status: r.status, gw: r.gameweek_number, points: r.points
    });
  });
  LIVE_RIVALS = rivalsByName;

  // MVP кожного вікенда цього етапу — для бейджа 🏆 біля імені.
  // RLS показує лише після відкриття вікенда (як дуелі).
  const mvpRows = await sbGet(
    'mvp_board?select=display_name,gameweek_number,points' +
    '&tournament_id=eq.' + tid);
  const mvpByName = {};
  mvpRows.forEach(r => {
    (mvpByName[r.display_name] = mvpByName[r.display_name] || []).push({
      gw: r.gameweek_number, points: r.points
    });
  });
  LIVE_MVP = mvpByName;

  // Тренерський почерк цього етапу — для бейджа 👔 біля імені.
  // RLS та сама, що й у дуелей: чужий стиль видно лише після
  // відкриття вікенда.
  const styleRows = await sbGet(
    'style_board?select=display_name,gameweek_number,style_title,style_icon,' +
    'style_photo,points,raw_points,capped,scored' +
    '&tournament_id=eq.' + tid);
  const stylesByName = {};
  styleRows.forEach(r => {
    (stylesByName[r.display_name] = stylesByName[r.display_name] || []).push({
      gw: r.gameweek_number, title: r.style_title, icon: r.style_icon,
      photo: r.style_photo, points: r.points, raw: r.raw_points,
      capped: r.capped, scored: r.scored
    });
  });
  LIVE_STYLES = stylesByName;

  const names = [...new Set(people.map(p => p.display_name))];
  registerPlayers(names);
  // Матчі — відкрита інформація: показуємо розклад завжди. Прогнози
  // ховаються окремо, тут лишаються порожні клітинки до дедлайну.

  const COL_DATE = 0, COL_GAME = 1, COL_RES = 2, COL_FIRST = 4;
  const cols = COL_FIRST + names.length;
  const out = [];

  // рядок тоталів
  const totalRow = Array(cols).fill('');
  totalRow[COL_DATE] = 'Points';
  const totalByName = {};
  totals.forEach(t => { totalByName[t.display_name] = t.total_points; });
  names.forEach((n, i) => {
    totalRow[COL_FIRST + i] = (totalByName[n] === undefined ? 0 : totalByName[n]);
  });
  out.push(totalRow);

  // рядок шапки з іменами
  const head = Array(cols).fill('');
  head[COL_DATE] = 'Date';
  head[COL_GAME] = 'Game';
  head[COL_RES]  = 'Result';
  names.forEach((n, i) => { head[COL_FIRST + i] = n; });
  out.push(head);

  // тіло: вікенд за вікендом
  for(const w of weeks){
    const sep = Array(cols).fill('');
    sep[COL_DATE] = w.title || ('Вікенд ' + w.number);
    out.push(sep);

    const inWeek = board.filter(b => b.gameweek_id === w.gameweek_id);
    const positions = [...new Set(inWeek.map(b => b.position))].sort((a, z) => a - z);

    for(const pos of positions){
      const cells = inWeek.filter(b => b.position === pos);
      const first = cells[0];
      const row = Array(cols).fill('');
      row[COL_DATE] = fmtDate(first.kickoff_at);
      row[COL_GAME] = first.home_team + ' — ' + first.away_team;
      row[COL_RES]  = fmtScore(first.home_score, first.away_score);
      names.forEach((n, i) => {
        const c = cells.find(x => x.display_name === n);
        row[COL_FIRST + i] = c ? fmtScore(c.pred_home, c.pred_away) : '';
      });
      out.push(row);
    }
  }

  /* ---- блок бустів під таблицею ----
     Рендер сам підсвітить клітинку матчу, на який поставлено буст: він
     звіряє назву гри з цього блоку з назвою в таблиці вище. Тобто список
     унизу й підсвітка робляться цим одним блоком. */
  const used = board.filter(b => b.boost_code);
  if(used.length){
    const titleRow = Array(cols).fill('');
    titleRow[COL_GAME] = 'Boosts';
    out.push(titleRow);

    const titleOf = {};
    boostTypes.forEach(t => { titleOf[t.code] = t.title; });
    const order = boostTypes.map(t => t.code).filter(c => used.some(u => u.boost_code === c));

    for(const code of order){
      const ofCode = used.filter(u => u.boost_code === code);
      const depth = Math.max(...names.map(n =>
        ofCode.filter(u => u.display_name === n).length));

      for(let k = 0; k < depth; k++){
        const row = Array(cols).fill('');
        row[COL_RES] = titleOf[code] || code;
        names.forEach((n, i) => {
          const mine = ofCode.filter(u => u.display_name === n);
          const u = mine[k];
          if(!u) return;
          let cell = u.home_team + ' — ' + u.away_team + '\n' +
                     fmtScore(u.pred_home, u.pred_away);
          const second = fmtScore(u.pred_home_2, u.pred_away_2);
          if(second) cell += ' / ' + second;
          row[COL_FIRST + i] = cell;
        });
        out.push(row);
      }
    }
  }
  return out;
}


/* ---------------------------------------------------------------------
   БОНУСНІ ПИТАННЯ окремою вкладкою — як «Bonus questions» на ЧС.

   Рендер шукає колонку з підписами Prediction / Points. Ліворуч від неї
   стоїть правильна відповідь, ще лівіше — текст питання, а імена гравців
   праворуч. Кожне питання займає два рядки: відповіді й бали.
   --------------------------------------------------------------------- */
async function buildSpecialRows(tournamentKey){
  const tours = await sbGet('tournaments?select=id&key=eq.' + tournamentKey);
  if(!tours.length) return [['Бонусні питання цього етапу ще не відкриті']];
  const tid = tours[0].id;

  const bets = await sbGet(
    'special_bets?select=id,position,question,correct_answer' +
    '&tournament_id=eq.' + tid + '&order=position.asc');
  if(!bets.length) return [['Бонусних питань поки немає']];

  const people = await sbGet(
    'participants?select=id,display_name&tournament_id=eq.' + tid +
    '&order=display_name.asc');
  const answers = await sbGet(
    'special_predictions?select=special_bet_id,participant_id,answer');
  const points = await sbGet(
    'special_points?select=special_bet_id,participant_id,points');

  const names = people.map(p => p.display_name);
  registerPlayers(names);

  const COL_Q = 0, COL_ACTUAL = 1, COL_MARK = 2, COL_FIRST = 3;
  const cols = COL_FIRST + names.length;
  const out = [];

  const head = Array(cols).fill('');
  head[COL_Q] = 'Question';
  head[COL_ACTUAL] = 'Final Result';
  names.forEach((n, i) => { head[COL_FIRST + i] = n; });
  out.push(head);

  for(const b of bets){
    const rowA = Array(cols).fill('');
    rowA[COL_Q] = b.question;
    rowA[COL_ACTUAL] = b.correct_answer || '';
    rowA[COL_MARK] = 'Prediction';

    const rowB = Array(cols).fill('');
    rowB[COL_MARK] = 'Points';

    people.forEach((p, i) => {
      const a = answers.find(x => x.special_bet_id === b.id && x.participant_id === p.id);
      const pt = points.find(x => x.special_bet_id === b.id && x.participant_id === p.id);
      rowA[COL_FIRST + i] = a ? a.answer : '';
      rowB[COL_FIRST + i] = pt ? pt.points : '';
    });
    out.push(rowA, rowB);
  }
  return out;
}

/* Точка входу: віддає те саме, що й fetchSheet для архівних турнірів */
async function fetchSupabaseTab(tab){
  LIVE_BOOSTS = true;              // див. boostKind: кольори EuroSeason
  LIVE_RIVALS = null;             // бейджі дуелей лише в місячній таблиці
  LIVE_MVP = null;                // бейдж MVP лише в місячній таблиці
  LIVE_STYLES = null;             // бейдж стилю лише в місячній таблиці
  if(tab.source === 'leaderboard') return { rows: await buildLeaderboardRows() };
  if(tab.source === 'month')       return { rows: await buildMonthRows(tab.monthKey) };
  if(tab.source === 'special')     return { rows: await buildSpecialRows(tab.monthKey) };
  if(tab.source === 'rules')       return { rows: buildRulesRows() };
  return { rows: [['Невідома вкладка']] };
}

function clubLogo(name){
  const key = cellStr(name).toLowerCase().replace(/\s+/g,' ').trim();
  const id = CLUB_ID[key];
  if(!id) return '';
  return `<img class="crest" src="https://media.api-sports.io/football/teams/${id}.png" alt="" loading="lazy" width="20" height="20">`;
}

// icon for any team: flag if it's a country, crest if it's a known club, else nothing
function teamIcon(name){
  return flagImg(name) || clubLogo(name);
}

// returns an <img> flag tag for a country name, or '' if not a known country
function flagImg(name){
  const iso = isoForName(name);
  if(!iso) return '';
  return `<img class="flag" src="https://flagcdn.com/24x18/${iso}.png" srcset="https://flagcdn.com/48x36/${iso}.png 2x" alt="" loading="lazy" width="24" height="18">`;
}

// wraps a single team name with its icon (flag or club crest, if known).
function withFlag(name){
  const s = cellStr(name);
  const icon = teamIcon(s);
  return icon ? `<span class="team">${icon}<span>${escapeHtml(s)}</span></span>` : escapeHtml(s);
}

/* Splits "Франція - Марокко" into two team names.
   Preferred form is a dash surrounded by spaces. Some rows come without spaces
   ("ЮАР-Канада") — then we try every dash position and keep the split where BOTH
   halves are recognised teams, so hyphenated names (Кот-д'Івуар, Кабо-Верде)
   stay intact. */
function splitGame(s){
  const spaced = s.split(/\s+[-–—]\s+/);
  if(spaced.length === 2) return [spaced[0].trim(), spaced[1].trim()];
  for(let i = 1; i < s.length - 1; i++){
    if(!'-–—'.includes(s[i])) continue;
    const a = s.slice(0, i).trim(), b = s.slice(i + 1).trim();
    if(a && b && teamIcon(a) && teamIcon(b)) return [a, b];
  }
  return null;
}

function gameWithFlags(game){
  const s = cellStr(game);
  const m = splitGame(s);
  if(m){
    const a = m[0], b = m[1];
    const ia = teamIcon(a), ib = teamIcon(b);
    if(ia || ib){
      return `<span class="game-teams">${ia}<span>${escapeHtml(a)}</span><span class="vs">–</span>${ib}<span>${escapeHtml(b)}</span></span>`;
    }
  }
  return escapeHtml(s);
}

/* ======== DATA (CSV — no type coercion, all cells come as displayed text) ========
   Two sources:
   - gviz (by sheet name): CORS-friendly, but coerces number-dominant columns to
     numeric and DROPS text cells in them (breaks tabs like Play-off bonus points).
   - /export?format=csv&gid=: exact WYSIWYG, no coercion. Used where a gid is set. */
function buildUrl(sheetId, sheetName, gid){
  if(gid !== undefined && gid !== null && gid !== ''){
    return `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
  }
  return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(sheetName)}`;
}

function parseCSV(text){
  const rows = [];
  let row = [], cur = '', inQ = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){
        if(text[i+1] === '"'){ cur += '"'; i++; }
        else inQ = false;
      } else cur += ch;
    } else {
      if(ch === '"') inQ = true;
      else if(ch === ','){ row.push(cur); cur = ''; }
      else if(ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
      else if(ch === '\r'){ /* skip */ }
      else cur += ch;
    }
  }
  row.push(cur);
  rows.push(row);
  return rows;
}
