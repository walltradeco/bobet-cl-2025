<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Squad Mode · борда (STAGE)</title>
<style>
:root{
  --bg:#1B1B1B; --panel:#151D17; --panel2:#182019; --line:#2A362B;
  --text:#EDEFE8; --text-dim:#8B9A8C;
  --gold:#F4C430; --teal:#6FAFAF; --blue:#5E97D0; --purple:#A98FDB;
  --green:#2E8B57; --green-soft:rgba(46,139,87,0.14); --red:#C75C4A;
  --up:#4ADE80; --down:#F87171;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:20px 16px 80px}
.stage-badge{position:fixed;top:0;left:0;right:0;z-index:50;
  background:var(--red);color:#fff;text-align:center;font-size:12px;
  font-weight:700;letter-spacing:.05em;padding:4px}
header{margin:40px 0 8px}
h1{font-size:26px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--text-dim);font-size:13px}

/* перемикач турів */
.tourbar{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text-dim);
  border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;
  user-select:none}
.chip.on{background:var(--gold);color:#1B1B1B;border-color:var(--gold)}
.chip.future{opacity:.4;cursor:default}

/* підвкладки */
.tabs{display:flex;gap:4px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tab{padding:9px 16px;font-size:14px;font-weight:600;color:var(--text-dim);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-bottom-color:var(--gold)}

/* таблиця */
.board{width:100%;border-collapse:separate;border-spacing:0 6px}
.board th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--text-dim);font-weight:600;text-align:left;padding:0 10px 4px}
.board td{background:var(--panel);padding:10px;vertical-align:middle;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.board td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}
.board td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.board td.n{white-space:nowrap;text-align:right}
.place{font-weight:800;font-size:17px;width:1%}
.delta{font-size:12px;margin-left:5px}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.eq{color:var(--text-dim)}
.pname{font-weight:700;cursor:pointer;width:100%}
.pname:hover{color:var(--gold)}
.pts-round{font-weight:700;color:var(--gold)}
.total{font-weight:800}
.price{color:var(--teal);font-variant-numeric:tabular-nums}
.vald.up{color:var(--up)} .vald.down{color:var(--down)} .vald{color:var(--text-dim)}

/* SQUAD-плитки */
.squad{display:flex;gap:4px}
.tile{width:42px;height:44px;border-radius:6px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:10px;font-weight:700;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);position:relative;overflow:hidden}
.tile .nm{max-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tile .tp{font-size:11px;font-weight:800}
.tile .cap{position:absolute;top:1px;right:2px;font-size:8px;background:var(--gold);
  color:#1B1B1B;border-radius:3px;padding:0 2px;font-weight:800}
.tile.empty{background:var(--panel2);border:1px dashed var(--line);color:var(--text-dim);
  text-shadow:none}

/* сітка «по турах» */
.grid{width:100%;border-collapse:collapse}
.grid th,.grid td{border:1px solid var(--line);padding:8px 10px;text-align:center;
  font-variant-numeric:tabular-nums}
.grid th{font-size:12px;color:var(--text-dim);font-weight:600}
.grid td.name{text-align:left;font-weight:700}

.empty-note{color:var(--text-dim);font-size:14px;padding:30px 4px;text-align:center}

/* модалка складу */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60;
  align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
.mask.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  max-width:640px;width:100%;padding:20px}
.modal h3{margin:0 0 4px;font-size:19px}
.modal .close{float:right;cursor:pointer;color:var(--text-dim);font-size:22px;line-height:1}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:14px}
.rcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.rcard .rn{font-weight:700;font-size:13px}
.rcard .rmeta{color:var(--text-dim);font-size:11px;margin-top:2px}
.hidden-note{color:var(--text-dim);font-size:13px;margin-top:12px;font-style:italic}
</style>
</head>
<body>
<div class="stage-badge">STAGE · squad_test · дані тестові</div>
<div class="wrap">
  <header>
    <h1>💱 Squad Mode</h1>
    <div class="sub" id="sub">завантаження…</div>
  </header>

  <div class="tourbar" id="tourbar"></div>

  <div class="tabs">
    <div class="tab on" data-tab="standings">🏆 Таблиця</div>
    <div class="tab" data-tab="byround">📊 Очки по турах</div>
  </div>

  <div id="pane-standings"></div>
  <div id="pane-byround" hidden></div>
</div>

<div class="mask" id="mask"><div class="modal">
  <span class="close" id="mclose">×</span>
  <h3 id="mtitle">Склад</h3>
  <div class="sub" id="msub"></div>
  <div class="roster" id="mroster"></div>
  <div class="hidden-note" id="mnote"></div>
</div></div>

<script>
const SB_URL = 'https://wsdamzcezumjmgxmvakw.supabase.co';
const SB_KEY = 'sb_publishable_bkXuSYswtmg4xCtecLb9cw_No0oCuSo';
async function sbGet(path){
  const res = await fetch(SB_URL + '/rest/v1/' + path, {
    headers:{ apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  });
  if(!res.ok) throw new Error('база ' + res.status);
  return res.json();
}

// ── стан ──
const S = { tour:null, rounds:[], lb:[], scores:[], players:[], clubs:{}, tournament:null };

// колір клубу — детермінований із назви (скелет; бойовий пул дасть логотипи)
function clubColor(name){
  let h=0; for(const c of (name||'')) h=(h*31+c.charCodeAt(0))>>>0;
  return `hsl(${h%360} 45% 32%)`;
}
function eur(v){ // EUR цілі → «€NNM»
  if(v==null) return '—';
  return '€'+(v/1e6).toFixed(v>=1e8?0:1)+'M';
}
function lastName(full){
  const p=(full||'').trim().split(/\s+/); return p[p.length-1]||full;
}

// ── завантаження ──
async function boot(){
  try{
    // тур/турнір із market_rounds (публічна); стейдж = один squad-турнір
    S.rounds = await sbGet('market_rounds?select=id,tournament_id,number,title,deadline_at,week_start,week_end&order=number.asc');
    if(!S.rounds.length){ document.getElementById('sub').textContent='турнір ще не заведено'; return; }
    S.tournament = S.rounds[0].tournament_id;
    const cs = await sbGet('market_clubs?select=id,name,league');
    cs.forEach(c=>S.clubs[c.id]=c);
    S.lb = await sbGet(`market_leaderboard?tournament_id=eq.${S.tournament}&select=participant_id,display_name,total_points,squad_price,place&order=place.asc`);
    S.scores = await sbGet(`market_round_scores?tournament_id=eq.${S.tournament}&select=round_id,round_number,participant_id,points`);
    // володіння публічне (дизайн H): гравці з власником → SQUAD-плитки
    S.players = await sbGet(`market_players?tournament_id=eq.${S.tournament}&owner_participant_id=not.is.null&select=id,name,position,club_id,owner_participant_id,market_value_current,season_avg_rating`);
    S.tour = S.rounds[0].number;

    document.getElementById('sub').textContent =
      `${S.lb.length} учасників · пул тестовий · Bank прихований (дизайн H)`;
    renderTours(); renderStandings(); renderByRound();
  }catch(e){
    document.getElementById('sub').textContent = 'помилка: ' + e.message;
  }
}

function renderTours(){
  const now = Date.now();
  document.getElementById('tourbar').innerHTML = S.rounds.map(r=>{
    const future = new Date(r.deadline_at).getTime() > now && r.number!==S.tour;
    const cls = 'chip'+(r.number===S.tour?' on':'')+(future?' future':'');
    return `<div class="${cls}" data-tour="${r.number}">Тур ${r.number}</div>`;
  }).join('');
  document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
    S.tour = +ch.dataset.tour; renderTours(); renderStandings();
  });
}

function squadTiles(pid){
  // склад учасника (володіння); ⚠️ лайнап/стартова-5/капітан — після дедлайну (крок лайнапу)
  const mine = S.players.filter(p=>p.owner_participant_id===pid);
  if(!mine.length) return '<span style="color:var(--text-dim);font-size:12px">склад ще не зібрано</span>';
  const tiles = mine.slice(0,5).map(p=>{
    const col = clubColor((S.clubs[p.club_id]||{}).name);
    return `<div class="tile" style="background:${col}"><span class="nm">${lastName(p.name)}</span><span class="tp">${p.season_avg_rating??'—'}</span></div>`;
  });
  while(tiles.length<5) tiles.push('<div class="tile empty">—</div>');
  return `<div class="squad">${tiles.join('')}</div>`;
}

function roundPts(pid){
  const rid = (S.rounds.find(r=>r.number===S.tour)||{}).id;
  const row = S.scores.find(s=>s.participant_id===pid && s.round_id===rid);
  return row? row.points : 0;
}

function renderStandings(){
  if(!S.lb.length){ document.getElementById('pane-standings').innerHTML='<div class="empty-note">Ще немає учасників.</div>'; return; }
  const rows = S.lb.map(p=>`
    <tr>
      <td class="place">${p.place}<span class="delta eq">=</span></td>
      <td><span class="pname" data-pid="${p.participant_id}">${p.display_name}</span></td>
      <td class="n pts-round">${roundPts(p.participant_id)}</td>
      <td class="n total">${p.total_points||0}</td>
      <td>${squadTiles(p.participant_id)}</td>
      <td class="n price">${eur(p.squad_price)}</td>
      <td class="n vald">—</td>
    </tr>`).join('');
  document.getElementById('pane-standings').innerHTML = `
    <table class="board">
      <thead><tr>
        <th>#</th><th>Учасник</th><th>Тур ${S.tour}</th><th>Total</th>
        <th>Склад (стартова 5)</th><th>Squad Price</th><th>Val Δ</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="empty-note" style="text-align:left;padding:14px 4px">
      ⚠️ Скелет: рух рангу ▲▼ і Val Δ — заглушки (наповняться після 1-го зіграного туру та рейтингів).
      Стартова 5 з капітаном ✕2 — після кроку лайнапу; поки показано володіння.
    </div>`;
  document.querySelectorAll('.pname').forEach(el=>el.onclick=()=>openSquad(el.dataset.pid));
}

function renderByRound(){
  const nums = S.rounds.map(r=>r.number);
  const head = `<tr><th class="name">Учасник</th>${nums.map(n=>`<th>Т${n}</th>`).join('')}<th>Total</th></tr>`;
  const body = S.lb.map(p=>{
    const cells = S.rounds.map(r=>{
      const row = S.scores.find(s=>s.participant_id===p.participant_id && s.round_id===r.id);
      return `<td>${row? row.points : '·'}</td>`;
    }).join('');
    return `<tr><td class="name">${p.display_name}</td>${cells}<td><b>${p.total_points||0}</b></td></tr>`;
  }).join('');
  document.getElementById('pane-byround').innerHTML =
    S.lb.length? `<table class="grid"><thead>${head}</thead><tbody>${body}</tbody></table>`
               : '<div class="empty-note">Ще немає учасників.</div>';
}

function openSquad(pid){
  const p = S.lb.find(x=>x.participant_id===pid); if(!p) return;
  const mine = S.players.filter(x=>x.owner_participant_id===pid);
  document.getElementById('mtitle').textContent = p.display_name;
  document.getElementById('msub').textContent = `Squad Price ${eur(p.squad_price)} · ${mine.length} гравців`;
  document.getElementById('mroster').innerHTML = mine.length? mine.map(x=>{
    const cl=(S.clubs[x.club_id]||{}).name||'';
    return `<div class="rcard"><div class="rn">${x.name}</div>
      <div class="rmeta">${x.position} · ${cl} · ${eur(x.market_value_current)} · ★${x.season_avg_rating??'—'}</div></div>`;
  }).join('') : '<div class="empty-note">Склад ще не зібрано.</div>';
  document.getElementById('mnote').textContent =
    'Виставлена стартова 5 / капітан / лавка — видно після дедлайну туру (крок лайнапу). Bank не показується нікому (дизайн H).';
  document.getElementById('mask').classList.add('on');
}
document.getElementById('mclose').onclick=()=>document.getElementById('mask').classList.remove('on');
document.getElementById('mask').onclick=(e)=>{ if(e.target.id==='mask') e.currentTarget.classList.remove('on'); };

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.getElementById('pane-standings').hidden = t.dataset.tab!=='standings';
  document.getElementById('pane-byround').hidden = t.dataset.tab!=='byround';
});

boot();
</script>
</body>
</html>
