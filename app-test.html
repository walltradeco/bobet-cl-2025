// Один виклик функції бази з однаковим показом помилки.
// Повертає текст відповіді або null, якщо база відмовила.
async function adminRpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) { alert('Помилка: ' + error.message); return null; }
  return data;
}

// ISO-час у формат, який розуміє <input type="datetime-local">.
// Через toISOString робити не можна: воно віддає UTC, і поле
// показало б час на три години раніше.
function toLocalInput(iso){
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`
       + `T${p(d.getHours())}:${p(d.getMinutes())}`;
}

const ANUM = "width:100%;padding:8px;background:var(--panel-3);border:1px solid var(--line);"
           + "border-radius:7px;color:var(--text);font-size:15px";

// ---------------------------------------------------------------------
//  Матчі вікенда: час, перенесення, скасування, видалення
//
//  Позиції матчів після видалення чи перенесення перенумеровуються
//  базою, тому після кожної дії список перечитуємо повністю.
// ---------------------------------------------------------------------
async function renderAdminMatches(){
  const host = $('match-admin');
  if (!host) return;

  const rows = await adminRpc('admin_match_list', {
    p_month: S.stage.key, p_gameweek: S.gw.number
  });
  if (rows === null) { host.innerHTML = '<p class="dim">Список не прочитався.</p>'; return; }
  if (!rows.length)  { host.innerHTML = '<p class="dim">У цьому вікенді матчів немає.</p>'; }

  // Форма «додати матч» живе в іншій картці, тож її треба підключити
  // навіть коли список порожній.
  const others = (S.gameweeks || []).filter(g => g.number !== S.gw.number);

  const again = async () => { await loadRefs(); await renderAdminMatches(); };

  if (rows.length) host.innerHTML = rows.map(r => {
    const pos  = r['матч'];
    const st   = r['статус'];
    const dead = st === 'СКАСОВАНО';
    const when = r['початок']
      ? new Date(r['початок']).toLocaleString('uk-UA',
          { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
      : 'час не вказано';

    return `<div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);
      ${dead ? 'opacity:.55' : ''}">
      <div style="font-size:15px;margin-bottom:4px">
        <span class="mono dim">№${pos}</span> ${esc(r['пара'])}</div>
      <div class="dim" style="font-size:13px;margin-bottom:9px">
        ${esc(when)} · ${esc(st)} · рахунок ${esc(r['рахунок'])}</div>

      <div style="display:flex;gap:7px;margin-bottom:7px">
        <input type="datetime-local" data-mtime="${pos}"
          value="${toLocalInput(r['початок'])}" style="${ANUM}">
        <button class="boost-chip" data-mtimego="${pos}" style="white-space:nowrap">Час</button>
      </div>

      ${others.length ? `<div style="display:flex;gap:7px;margin-bottom:7px">
        <select data-mto="${pos}" style="${ANUM}">
          ${others.map(g => `<option value="${g.number}">${
            esc(g.title || ('Вікенд ' + g.number))}</option>`).join('')}
        </select>
        <button class="boost-chip" data-mmove="${pos}" style="white-space:nowrap">Перенести</button>
      </div>` : ''}

      <div class="boost-row">
        ${dead
          ? `<button class="boost-chip" data-mrestore="${pos}">Відновити</button>`
          : `<button class="boost-chip" data-mcancel="${pos}">Скасувати</button>`}
        <button class="boost-chip" data-mclear="${pos}">Стерти рахунок</button>
        <button class="boost-chip" data-mdel="${pos}">Видалити</button>
      </div>
    </div>`;
  }).join('');

  const arg = pos => ({ p_month: S.stage.key, p_gameweek: S.gw.number, p_position: Number(pos) });

  host.querySelectorAll('[data-mtimego]').forEach(b => b.onclick = async () => {
    const pos = b.dataset.mtimego;
    const v = host.querySelector(`[data-mtime="${pos}"]`).value;
    if (!v) return alert('Вкажи час');
    const out = await adminRpc('admin_match_time',
      { ...arg(pos), p_kickoff: new Date(v).toISOString() });
    if (out !== null) { alert(out); await again(); }
  });

  host.querySelectorAll('[data-mmove]').forEach(b => b.onclick = async () => {
    const pos = b.dataset.mmove;
    const to  = host.querySelector(`[data-mto="${pos}"]`).value;
    if (!confirm(`Перенести матч №${pos} у вікенд ${to}?\n\n` +
                 'З обох вікендів зніметься фіксація — там, де дедлайн ще не минув.')) return;
    const out = await adminRpc('admin_match_move', { ...arg(pos), p_to: Number(to) });
    if (out !== null) { alert(out); await again(); }
  });

  host.querySelectorAll('[data-mcancel]').forEach(b => b.onclick = async () => {
    const pos = b.dataset.mcancel;
    if (!confirm(`Скасувати матч №${pos}?\n\n` +
                 'Прогнози лишаються, очок за нього не буде, ' +
                 'а витрачені на нього бусти база поверне сама.')) return;
    const out = await adminRpc('admin_match_cancel', arg(pos));
    if (out !== null) { alert(out); await again(); }
  });

  host.querySelectorAll('[data-mrestore]').forEach(b => b.onclick = async () => {
    const out = await adminRpc('admin_match_restore', arg(b.dataset.mrestore));
    if (out !== null) { alert(out); await again(); }
  });

  host.querySelectorAll('[data-mclear]').forEach(b => b.onclick = async () => {
    const pos = b.dataset.mclear;
    if (!confirm(`Стерти рахунок матчу №${pos}? Бали перерахуються.`)) return;
    const out = await adminRpc('admin_match_clear_result', arg(pos));
    if (out !== null) { alert(out); await again(); }
  });

  host.querySelectorAll('[data-mdel]').forEach(b => b.onclick = async () => {
    const pos = b.dataset.mdel;
    if (!confirm(`ВИДАЛИТИ матч №${pos} назовсім?\n\n` +
                 'Якщо на нього вже є прогнози, база відмовить — ' +
                 'тоді правильніше «Скасувати».')) return;
    const out = await adminRpc('admin_match_delete', arg(pos));
    if (out !== null) { alert(out); await again(); }
  });

  // --- додати матч у цей вікенд
  if ($('btn-madd')) {
    $('btn-madd').onclick = async () => {
      const h = $('m-home').value.trim();
      const a = $('m-away').value.trim();
      if (!h || !a) return alert('Потрібні обидві команди');
      const when = $('m-when').value;
      const out = await adminRpc('admin_match_add', {
        p_month: S.stage.key, p_gameweek: S.gw.number,
        p_home: h, p_away: a,
        p_kickoff: when ? new Date(when).toISOString() : null,
        // Порожнє поле віддаємо як 'league' — тригер у базі (файл 98)
        // побачить це значення й підставить лігу господарів сам.
        p_competition: $('m-comp').value.trim() || 'league'
      });
      if (out === null) return;
      $('madd-result').innerHTML = `<div class="msg ok" style="margin-top:12px">${esc(out)}</div>`;
      $('m-home').value = ''; $('m-away').value = ''; $('m-comp').value = '';
      await again();
    };
  }
}

    : weeks.map(g => `
      <div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)">
        <div style="font-size:15px;margin-bottom:7px">
          <span class="mono dim">№${g.number}</span> ${esc(g.title || ('Вікенд ' + g.number))}</div>
        <div style="display:flex;gap:7px;margin-bottom:7px">
          <input type="text" data-wt="${g.number}" value="${esc(g.title || '')}"
            placeholder="назва" style="${ANUM}">
          <button class="boost-chip" data-wtgo="${g.number}" style="white-space:nowrap">Назва</button>
        </div>
        <div style="display:flex;gap:7px;margin-bottom:7px">
          <input type="datetime-local" data-wd="${g.number}"
            value="${toLocalInput(g.deadline_at)}" style="${ANUM}">
          <button class="boost-chip" data-wdgo="${g.number}" style="white-space:nowrap">Дедлайн</button>
        </div>
        <div style="display:flex;gap:7px;margin-bottom:7px">
          <input type="number" data-wn="${g.number}" min="1" value="${g.number}"
            placeholder="місце" style="${ANUM}">
          <button class="boost-chip" data-wngo="${g.number}" style="white-space:nowrap">Місце</button>
        </div>
        <div class="boost-row">
          <button class="boost-chip" data-wdel="${g.number}">Видалити вікенд</button>
        </div>
      </div>`).join('');

  const again = async () => { await loadRefs(); go('admin'); };

  host.querySelectorAll('[data-wtgo]').forEach(b => b.onclick = async () => {
    const n = b.dataset.wtgo;
    const t = host.querySelector(`[data-wt="${n}"]`).value.trim();

  host.querySelectorAll('[data-wdgo]').forEach(b => b.onclick = async () => {
    const n = b.dataset.wdgo;
    const v = host.querySelector(`[data-wd="${n}"]`).value;
    if (!v) return alert('Вкажи дату');
    const why = prompt('Причина зсуву — її побачать усі учасники:', '');
    if (why === null) return;
    if (!why.trim()) return alert('Причина обов\'язкова');
    const out = await adminRpc('admin_gameweek_deadline',
      { p_month: S.stage.key, p_number: Number(n),
        p_new: new Date(v).toISOString(), p_reason: why.trim() });
    if (out !== null) { alert(out); await again(); }
  });

  // Переставити вікенд на інше місце (файл 62). Матчі, прогнози
  // й бусти прив'язані до id вікенда, а не до номера, тож їдуть
  // разом. Назва лишається старою — база про це нагадує.
  host.querySelectorAll('[data-wngo]').forEach(b => b.onclick = async () => {
    const n  = Number(b.dataset.wngo);
    const to = Number(host.querySelector(`[data-wn="${n}"]`).value);
    if (!to) return alert('Вкажи, яким за рахунком має стати вікенд');
    if (to === n) return alert('Він і так на цьому місці');
    if (!confirm(`Поставити вікенд №${n} на місце ${to}?\n\n` +
                 'Решта вікендів зсунеться. Назви не міняються — ' +
                 'якщо в назві є номер, поправ її кнопкою «Назва».')) return;
    const out = await adminRpc('admin_gameweek_move',
      { p_month: S.stage.key, p_number: n, p_to: to });
    if (out !== null) { alert(out); await again(); }
  });

  // Видалення вікенда. Другого заходу з p_force = true тут немає
  // НАВМИСНО: форс зносить разом із вікендом усі матчі, прогнози
  // й підтвердження, і відкотити це нічим. Реальний випадок
  // «тур скасували» правильно закривається скасуванням матчів —
  // там історія лишається, а бусти база повертає сама.
  host.querySelectorAll('[data-wdel]').forEach(b => b.onclick = async () => {
    const n = b.dataset.wdel;
    if (!confirm(`Видалити вікенд №${n}?\n\n` +
                 'Порожній вікенд зникне одразу. Якщо в ньому вже є матчі ' +
                 'або прогнози — база відмовить і скаже, що саме там лежить.')) return;
    const { data, error } = await sb.rpc('admin_gameweek_delete',
      { p_month: S.stage.key, p_number: Number(n), p_force: false });
    if (!error) { alert(data); await again(); return; }
    alert('База не віддала вікенд.\n\n' + error.message +
      '\n\nЩо робити замість цього:\n' +
      '• тур скасували — скасуй матчі в блоці «Матчі вікенда». ' +
      'Прогнози й історія лишаться, очки за них не нарахуються, ' +
      'а витрачені бусти повернуться самі.\n' +
      '• вікенд заведений помилково — спершу видали з нього матчі, ' +
      'тоді він прибереться звичайною кнопкою.\n\n' +
      'Видалення разом із чужими прогнозами навмисно лишене ' +
      'тільки для SQL-редактора: відкотити його вже нічим.');
  });

  if ($('btn-wadd')) {
    $('btn-wadd').onclick = async () => {
      const n = Number($('w-num').value);
      const d = $('w-dl').value;
      if (!n) return alert('Вкажи номер вікенда');
      if (!d) return alert('Вкажи дедлайн');
      const out = await adminRpc('admin_gameweek_add', {
        p_month: S.stage.key, p_number: n,
        p_deadline: new Date(d).toISOString(),
        p_title: $('w-title').value.trim() || null
      });
      if (out === null) return;
      $('wadd-result').innerHTML = `<div class="msg ok" style="margin-top:12px">${esc(out)}</div>`;
      await loadRefs(); go('admin');
    };
  }
}

// ---------------------------------------------------------------------
//  Перейменування учасника: одразу в усіх етапах
// ---------------------------------------------------------------------
async function renderAdminUnconfirm(){
  const selName = $('uc-name'), selGw = $('uc-gw');
  if (!selName || !selGw) return;   // етап General — вікендів немає

  const { data: parts } = await sb.from('participants')
    .select('display_name').eq('tournament_id', TOURNAMENT_ID).order('display_name');
  for (const p of (parts || [])) {
    const o = document.createElement('option');
    o.value = p.display_name; o.textContent = p.display_name;
    selName.appendChild(o);
  }

  for (const g of (S.gameweeks || [])) {
    const o = document.createElement('option');
    o.value = g.number;
    o.textContent = g.title || ('Вікенд ' + g.number);
    selGw.appendChild(o);
  }

  $('btn-unconf').onclick = async () => {
    const who = selName.value;
    const gw  = selGw.value;
    if (!who) return alert('Обери, кому зняти підтвердження');
    if (!gw)  return alert('Обери вікенд');
    if (!confirm(`Зняти підтвердження вікенда «${selGw.selectedOptions[0].textContent}» ` +
                 `в учасника «${who}»?\n\n` +
                 'Його прогнози лишаються на місці, але поля відкриються ' +
                 'назад і він зможе їх переробити.')) return;

    const out = await adminRpc('admin_unconfirm', {
      p_month: S.stage.key, p_name: who, p_gameweek: Number(gw)
    });
    if (out === null) return;
    $('unconf-result').innerHTML =
      `<div class="msg ok" style="margin-top:12px">${esc(out)}</div>`;
    await loadRefs(); go('admin');
  };
}

async function renderAdminRename(){
  const sel = $('pr-old');
  if (!sel) return;

  const { data: parts } = await sb.from('participants')
    .select('display_name').eq('tournament_id', TOURNAMENT_ID).order('display_name');
  for (const p of (parts || [])) {
    const o = document.createElement('option');
    o.value = p.display_name; o.textContent = p.display_name;
    sel.appendChild(o);
  }

  $('btn-prename').onclick = async () => {
    const from = sel.value;
    const to   = $('pr-new').value.trim();
    if (!from) return alert('Обери, кого перейменувати');
    if (!to)   return alert('Вкажи нове ім\'я');
    if (!confirm(`Перейменувати «${from}» на «${to}» в усіх етапах?`)) return;
    const out = await adminRpc('admin_rename_participant', { p_old: from, p_new: to });
    if (out === null) return;
    $('prename-result').innerHTML = `<div class="msg ok" style="margin-top:12px">${esc(out)}</div>`;
    $('pr-new').value = '';
    await loadRefs(); go('admin');
  };
}

// ---------------------------------------------------------------------
//  Бонусні питання етапу: внести правильну відповідь
// ---------------------------------------------------------------------
// Підказка, порахована резолвером (файл 114). Ключ — position питання.
// Тримаємо окремо від самих питань: підказка не змінює correct_answer,
// поки адмін не натиснув «Прийняти».
function bonusSugHtml(b, i){
  const s = (S.bonusSug || {})[b.position];
  if (!s) return '';
  const val = (s['кілька'] && s['кілька'].length) ? s['кілька'] : s['пропозиція'];
  if (!val || val === '—') {
    // резолвер є, але поки нема що запропонувати (немає даних)
    return `<div style="font-size:13px;color:var(--muted);margin:2px 0 9px;
        padding:8px 10px;background:var(--panel-3);border-radius:7px">
        🤖 ще нема підказки${s['підстава'] ? ' · ' + esc(s['підстава']) : ''}</div>`;
  }
  const done = s['завершено'];
  const badge = done
    ? '<span style="color:var(--green)">фінальна</span>'
    : '<span style="color:var(--gold)">проміжна</span>';
  return `<div style="margin:2px 0 10px;padding:9px 11px;border-radius:8px;
      background:rgba(232,178,60,0.10);border:1px solid rgba(232,178,60,0.35)">
      <div style="font-size:14px;margin-bottom:4px">
        🤖 підказка: <b>${esc(val)}</b> · ${badge}</div>
      ${s['підстава'] ? `<div class="dim" style="font-size:13px;margin-bottom:8px">${esc(s['підстава'])}</div>` : ''}
      <button class="ghost" data-asugtake="${i}" style="width:100%;padding:7px">
        Прийняти цю відповідь</button>
    </div>`;
}

// Порахувати підказки для поточного етапу й перемалювати блок бонусів.
async function loadBonusSug(){
  const btn = $('bonus-suggest-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'рахую…'; }
  const rows = await adminRpc('suggest_bonus_answers', { p_month: S.stage.key });
  if (btn) { btn.disabled = false; btn.textContent = '🤖 Порахувати підказки з результатів'; }
  if (rows === null) return;
  S.bonusSug = {};
  rows.forEach(r => { S.bonusSug[r['поз']] = r; });
  await renderAdminBonus();
}

async function renderAdminBonus(){
  const host = $('bonus-admin');
  if (!host) return;

  const { data: bets, error } = await sb.from('special_bets').select('*')
    .eq('tournament_id', TOURNAMENT_ID).order('position');
  if (error) { host.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }

  S.adminBets = bets || [];
  if (!S.adminBets.length) {
    host.innerHTML = '<p class="dim">У цьому етапі бонусних питань ще немає.</p>';
    return;
  }

  // Вид питання тепер лежить у стовпці answer_kind (файл 96). Раніше
  // його вгадували за наявністю points_yes — на двох видах це ще
  // працювало, на чотирьох стало неможливо.
  host.innerHTML = S.adminBets.map((b, i) => {
    const kind = b.answer_kind || (b.points_yes != null ? 'yesno' : 'text');
    const yn   = kind === 'yesno';
    const cur  = (b.correct_answer || '').trim();

    let ctrl;
    if (yn){
      ctrl = `<div class="boost-row">
           <button class="boost-chip ${cur.toLowerCase() === 'yes' ? 'on' : ''}"
             data-yn="${i}" data-val="YES">YES +${b.points_yes}</button>
           <button class="boost-chip ${cur.toLowerCase() === 'no' ? 'on' : ''}"
             data-yn="${i}" data-val="NO">NO +${b.points_no}</button>
         </div>`;
    } else if (kind === 'choice'){
      // Правильну відповідь адмін теж ОБИРАЄ, а не вписує — інакше
      // одрук у слові «Манчестер» зробив би всіх мимо.
      ctrl = `<div class="boost-row" style="flex-wrap:wrap">` +
        (b.options || []).map(o =>
          `<button class="boost-chip ${cur === o ? 'on' : ''}"
             data-yn="${i}" data-val="${esc(o)}">${esc(o)}</button>`).join('') + `</div>`;
    } else if (kind === 'number'){
      ctrl = `<input type="number" data-atext="${i}" value="${esc(cur)}" min="0"
           placeholder="правильне число" style="${AINP}">`;
    } else {
      ctrl = `<input type="text" data-atext="${i}" value="${esc(cur)}"
           placeholder="правильна відповідь" style="${AINP}">`;
    }

    const kindLabel =
      yn                ? 'YES/NO' :
      kind === 'choice' ? 'вибір: ' + (b.options || []).join(' / ') + ' · +' + b.points_if_correct :
      kind === 'number' ? 'число · +' + b.points_if_correct +
                          (b.points_near != null
                            ? ' · ±' + (b.near_window ?? 1) + ' → +' + b.points_near
                            : ' · тільки точно') :
                          'відповідь-ім\'я · +' + b.points_if_correct;

    return `<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)">
      <div style="font-size:15px;margin-bottom:5px">${esc(b.question)}</div>
      <div class="dim" style="font-size:13px;margin-bottom:9px">
        ${esc(kindLabel)}
        · <span data-astate="${i}">${cur ? 'зараз: ' + esc(cur) : 'відповіді ще немає'}</span></div>
      <div data-asug="${i}">${bonusSugHtml(b, i)}</div>
      ${ctrl}
      <button class="ghost" data-asave="${i}" style="margin-top:9px;width:100%">Внести відповідь</button>
      <div data-ares="${i}"></div>

      <details style="margin-top:10px">
        <summary class="dim" style="cursor:pointer;font-size:13px">правки самого питання</summary>
        <div style="margin-top:9px">
          <input type="text" data-btext="${i}" value="${esc(b.question)}"
            placeholder="текст питання" style="${AINP};margin-bottom:7px">
          <div class="rev-line"><span>Балів ${yn ? 'за правильний YES' : 'за влучну відповідь'}</span>
            <input type="number" data-bpts="${i}" value="${yn ? b.points_yes : b.points_if_correct}"
              style="width:90px;padding:7px;background:var(--panel-3);border:1px solid var(--line);
              border-radius:7px;color:var(--text);font-family:'IBM Plex Mono',monospace;text-align:right"></div>
          ${yn ? `<div class="rev-line"><span>Балів за правильний NO</span>
            <input type="number" data-bptsno="${i}" value="${b.points_no}"
              style="width:90px;padding:7px;background:var(--panel-3);border:1px solid var(--line);
              border-radius:7px;color:var(--text);font-family:'IBM Plex Mono',monospace;text-align:right"></div>` : ''}
          ${kind === 'number' ? `
          <div class="rev-line"><span>Балів за промах <span class="dim">(0 — тільки точно)</span></span>
            <input type="number" data-bnear="${i}" min="0" value="${b.points_near ?? 0}"
              style="width:90px;padding:7px;background:var(--panel-3);border:1px solid var(--line);
              border-radius:7px;color:var(--text);font-family:'IBM Plex Mono',monospace;text-align:right"></div>
          <div class="rev-line"><span>На скільки можна промахнутись <span class="dim">(±)</span></span>
            <input type="number" data-bwin="${i}" min="1" max="10" value="${b.near_window ?? 1}"
              style="width:90px;padding:7px;background:var(--panel-3);border:1px solid var(--line);
              border-radius:7px;color:var(--text);font-family:'IBM Plex Mono',monospace;text-align:right"></div>
          <button class="ghost" data-bnumsave="${i}" style="width:100%;margin-bottom:7px">
            Зберегти умову промаху</button>` : ''}
          <p class="dim" style="font-size:13px;margin:7px 0">
            Текст правиться завжди. Бали — тільки поки на питання ще ніхто не відповів.</p>
          <button class="ghost" data-bsave="${i}" style="width:100%">Зберегти правку</button>

          <div style="display:flex;gap:7px;margin-top:9px">
            <input type="datetime-local" data-bdl="${i}" value="${toLocalInput(b.deadline_at)}"
              style="${ANUM}">
            <button class="boost-chip" data-bdlgo="${i}" style="white-space:nowrap">Дедлайн</button>
          </div>

          <div class="boost-row" style="margin-top:9px">
            <button class="boost-chip" data-bdel="${i}">Видалити питання</button>
          </div>
        </div>
      </details>
    </div>`;
  }).join('');

  // --- умова промаху для питання-цифри (файл 99)
  host.querySelectorAll('[data-bnumsave]').forEach(btn => btn.onclick = async () => {
    const i = Number(btn.dataset.bnumsave);
    const b = S.adminBets[i];
    const nearRaw = Number(host.querySelector(`[data-bnear="${i}"]`).value);
    const near = nearRaw > 0 ? nearRaw : null;      // 0 = тільки точна відповідь
    const win  = Math.min(10, Math.max(1, Number(host.querySelector(`[data-bwin="${i}"]`).value) || 1));
    const out = await adminRpc('admin_bonus_number',
      { p_bet: b.id, p_near: near, p_window: win });
    if (out !== null) { alert(out); await renderAdminBonus(); }
  });

  // --- правки питання: текст і бали
  host.querySelectorAll('[data-bsave]').forEach(btn => btn.onclick = async () => {
    const i = Number(btn.dataset.bsave);
    const b = S.adminBets[i];
    const yn = (b.answer_kind || (b.points_yes != null ? 'yesno' : 'text')) === 'yesno';
    const txt = host.querySelector(`[data-btext="${i}"]`).value.trim();
    if (!txt) return alert('Текст порожній');
    // Бали шлемо ТІЛЬКИ якщо їх справді змінили. Інакше база
    // відмовить у правці тексту на питанні, де вже є відповіді:
    // вона не розрізняє «прислали те саме число» і «хочуть змінити».
    const ptsNow = Number(host.querySelector(`[data-bpts="${i}"]`).value);
    const noNow  = yn ? Number(host.querySelector(`[data-bptsno="${i}"]`).value) : null;
    const ptsWas = yn ? b.points_yes : b.points_if_correct;
    const pts = ptsNow === ptsWas ? null : ptsNow;
    const no  = (!yn || noNow === b.points_no) ? null : noNow;
    if (pts === null && no === null && txt === b.question) return alert('Нічого не змінилось');
    if (!confirm(`Зберегти правку питання?\n\n${txt}`)) return;
    const out = await adminRpc('admin_bonus_edit', {
      p_month: S.stage.key, p_question_like: b.question,
      p_new_text: txt === b.question ? null : txt,
      p_points: pts, p_points_no: no
    });
    if (out !== null) { alert(out); await renderAdminBonus(); }
  });

  // --- дедлайн питання
  host.querySelectorAll('[data-bdlgo]').forEach(btn => btn.onclick = async () => {
    const i = Number(btn.dataset.bdlgo);
    const v = host.querySelector(`[data-bdl="${i}"]`).value;
    if (!v) return alert('Вкажи дату');
    const out = await adminRpc('admin_bonus_deadline', {
      p_month: S.stage.key, p_question_like: S.adminBets[i].question,
      p_new: new Date(v).toISOString()
    });
    if (out !== null) { alert(out); await renderAdminBonus(); }
  });

  // --- видалення питання. Перший захід без force: якщо на питання вже
  //     відповідали, база відмовить, і аж тоді питаємо вдруге.
  host.querySelectorAll('[data-bdel]').forEach(btn => btn.onclick = async () => {
    const i = Number(btn.dataset.bdel);
    const q = S.adminBets[i].question;
    if (!confirm(`Видалити питання?\n\n${q}`)) return;
    const { data, error } = await sb.rpc('admin_bonus_delete', {
      p_month: S.stage.key, p_question_like: q, p_force: false
    });
    if (!error) { alert(data); await renderAdminBonus(); return; }
    if (!confirm('База відмовила:\n' + error.message +
                 '\n\nВидалити разом з усіма відповідями й очками?')) return;
    const out = await adminRpc('admin_bonus_delete',
      { p_month: S.stage.key, p_question_like: q, p_force: true });
    if (out !== null) { alert(out); await renderAdminBonus(); }
  });

  host.querySelectorAll('[data-yn]').forEach(btn => btn.onclick = () => {
    const i = btn.dataset.yn;
    host.querySelectorAll(`[data-yn="${i}"]`).forEach(x => x.classList.remove('on'));
    btn.classList.add('on');
    S.adminBets[i].__pick = btn.dataset.val;
  });

  host.querySelectorAll('[data-asave]').forEach(btn => btn.onclick = async () => {
    const i = Number(btn.dataset.asave);
    const b = S.adminBets[i];
    // ⚠️ Тут мусить бути саме answer_kind. Питання-вибір теж малює
    // кнопки (data-yn), але points_yes у нього порожній — і стара
    // перевірка по points_yes полізла б шукати текстове поле, якого
    // для вибору не існує, тобто впала б на .value від null.
    const kind = b.answer_kind || (b.points_yes != null ? 'yesno' : 'text');
    const byButtons = (kind === 'yesno' || kind === 'choice');
    const val = byButtons
      ? (b.__pick || (kind === 'yesno'
                        ? (b.correct_answer || '').toUpperCase()
                        : (b.correct_answer || '')))
      : (host.querySelector(`[data-atext="${i}"]`)?.value || '').trim();

    if (!val) return alert('Спершу вкажи відповідь');
    if (!confirm(`${b.question}\nПравильна відповідь: ${val}\n\nБали перерахуються одразу. Вносимо?`)) return;

    btn.disabled = true; btn.textContent = 'вношу…';
    const { data, error } = await sb.rpc('admin_bonus_answer', {
      p_month: S.stage.key, p_question_like: b.question, p_answer: val
    });
    btn.disabled = false; btn.textContent = 'Внести відповідь';
    if (error) return alert('Помилка: ' + error.message);

    // Перемальовувати список тут не можна — звіт одразу б зник.
    // Оновлюємо лише те, що змінилось.
    b.correct_answer = val;
    const st = host.querySelector(`[data-astate="${i}"]`);
    if (st) st.textContent = 'зараз: ' + val;

    const res = host.querySelector(`[data-ares="${i}"]`);
    res.innerHTML = `<div class="msg ok" style="margin-top:10px">Внесено: ${esc(val)}</div>` +
      (data || []).map(r => `<div class="rev-line">
        <span>${esc(r['учасник'])}</span>
        <span class="s">${esc(r['відповів'])} · ${r['очок']} оч.</span></div>`).join('');
  });

  // --- прийняти підказку резолвера. Одну відповідь вносимо через
  //     admin_bonus_answer, кілька (нічия між клубами) — через
  //     admin_bonus_answer_multi. Підтвердження — це і є «я перевірив».
  host.querySelectorAll('[data-asugtake]').forEach(btn => btn.onclick = async () => {
    const i = Number(btn.dataset.asugtake);
    const b = S.adminBets[i];
    const s = (S.bonusSug || {})[b.position];
    if (!s) return;
    const several = (s['кілька'] || '').split(' / ').map(x => x.trim()).filter(Boolean);
    const multi = several.length > 1;
    const shown = multi ? several.join(' / ') : s['пропозиція'];
    if (!confirm(`${b.question}\nПідказка: ${shown}\n${s['підстава'] || ''}` +
                 `\n\nВнести цю відповідь? Бали перерахуються одразу.`)) return;

    btn.disabled = true; btn.textContent = 'вношу…';
    const { data, error } = multi
      ? await sb.rpc('admin_bonus_answer_multi',
          { p_month: S.stage.key, p_question_like: b.question, p_answers: several })
      : await sb.rpc('admin_bonus_answer',
          { p_month: S.stage.key, p_question_like: b.question, p_answer: s['пропозиція'] });
    btn.disabled = false; btn.textContent = 'Прийняти цю відповідь';
    if (error) return alert('Помилка: ' + error.message);

    b.correct_answer = multi ? several.join(' / ') : s['пропозиція'];
    const st = host.querySelector(`[data-astate="${i}"]`);
    if (st) st.textContent = 'зараз: ' + b.correct_answer;
    const rr = host.querySelector(`[data-ares="${i}"]`);
    if (rr) rr.innerHTML = `<div class="msg ok" style="margin-top:10px">Внесено: ${esc(b.correct_answer)}</div>` +
      (data || []).map(r => `<div class="rev-line">
        <span>${esc(r['учасник'])}</span>
        <span class="s">${esc(r['відповів'])} · ${r['очок']} оч.</span></div>`).join('');
  });

  // кнопка «порахувати підказки» живе поза #bonus-admin, тому чіпляємось
  // тут (перемальовування host її не зачіпає)
  const sugBtn = $('bonus-suggest-btn');
  if (sugBtn) sugBtn.onclick = loadBonusSug;
}

// ---------------------------------------------------------------------
//  Склад етапу: хто зараз, кого прибрати
// ---------------------------------------------------------------------
async function renderAdminRoster(){
  const host = $('roster-admin');
  if (!host) return;

  // Пошти лежать в allowed_emails, читати її напряму кабінет не може —
  // гранта немає навмисно. Тому окрема функція (файл 52).
  const { data: parts, error } = await sb.rpc('admin_email_list', {
    p_tournament: TOURNAMENT_ID
  });
  if (error) { host.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }

  host.innerHTML = !parts || !parts.length
    ? '<p class="dim">У цьому етапі складу немає.</p>'
    : parts.map(p => {
        const nm = p["ім'я"], em = p['пошта'] || '';
        return `<div style="border-bottom:1px solid var(--line);padding:10px 0">
        <div class="rev-line" style="border:0;padding:0">
        <span>${esc(nm)}${p['адмін'] ? ' · адмін' : ''}${
          p['заходив'] ? '' : '<span class="dim" style="font-size:13px"> · ще не заходив</span>'}</span>
        <span style="display:flex;gap:6px">
        <button class="ghost" data-runlock="${esc(nm)}"
          style="width:auto;padding:6px 10px;font-size:14px">розфіксувати бусти</button>
        <button class="ghost" data-rrm="${esc(nm)}"
          style="width:auto;padding:6px 12px;font-size:14px">прибрати</button></span></div>
        <div style="display:flex;gap:6px;margin-top:7px">
        <input type="email" data-em="${esc(nm)}" value="${esc(em)}"
          placeholder="пошти немає" style="${AINP};flex:1">
        <button class="ghost" data-emsave="${esc(nm)}"
          style="width:auto;padding:6px 12px;font-size:14px;white-space:nowrap">зберегти</button>
        </div></div>`;
      }).join('');

  // Пошта пишеться одразу в усі етапи сезону — так обрано навмисно,
  // щоб людина не опинилась допущеною до половини етапів.
  host.querySelectorAll('[data-emsave]').forEach(btn => btn.onclick = async () => {
    const name = btn.dataset.emsave;
    const inp  = host.querySelector(`[data-em="${CSS.escape(name)}"]`);
    const val  = (inp?.value || '').trim();
    if (!val) return alert('Порожня пошта. Щоб прибрати людину — кнопка «прибрати».');
    if (!confirm(`Пошта «${name}» → ${val}\n\n` +
                 'Запишеться в УСІ етапи сезону. Якщо стара пошта була ' +
                 'і людина під нею заходила — прив’язку буде замінено. ' +
                 'Прогнози, очки й бусти лишаться на місці.')) return;
    btn.disabled = true;
    const { data, error } = await sb.rpc('admin_set_email', {
      p_name: name, p_email: val
    });
    btn.disabled = false;
    if (error) return alert('Помилка: ' + error.message);
    alert(data);
    await renderAdminRoster();
  });

  // Розфіксація складу бустів (файл 45). База сама відмовить, якщо
  // бусти вже розставлені по матчах — тоді спершу треба зняти їх.
  host.querySelectorAll('[data-runlock]').forEach(btn => btn.onclick = async () => {
    const name = btn.dataset.runlock;
    if (!confirm(`Розфіксувати Boosts «${name}» в етапі «${S.stage.title}»?\n\n` +
                 'Людина зможе обрати бусти наново. Якщо вона вже поставила ' +
                 'бусти на матчі, база відмовить.')) return;
    const { data, error } = await sb.rpc('admin_unlock_draft', {
      p_tournament: TOURNAMENT_ID, p_name: name
    });
    if (error) return alert('Помилка: ' + error.message);
    alert(data);
  });

  host.querySelectorAll('[data-rrm]').forEach(btn => btn.onclick = async () => {
    const name = btn.dataset.rrm;
    if (!confirm(`Прибрати ${name} з етапу «${S.stage.title}»?\n\n` +
                 'Людину, у якої вже є прогнози або нараховані очки, база не віддасть — ' +
                 'спершу треба вирішити, що робити з її результатами.')) return;
    const { data, error } = await sb.rpc('roster_remove_stage', {
      p_name: name, p_stage: S.stage.key
    });
    if (error) return alert('Помилка: ' + error.message);
    alert(data);
    await renderAdminRoster();
  });
}

// ---------------------------------------------------------------------
//  Адмінські екрани вікенда: дедлайн, доступ до прогнозу, прайс
//  Кожен блок може бути відсутній на екрані — тому перевіряємо.
// ---------------------------------------------------------------------
async function renderAdminExtras(){
  // --- U-11: зсув дедлайну
  if ($('btn-deadline')) {
    $('btn-deadline').onclick = async () => {
      const when = $('dl-new').value;
      const why  = $('dl-why').value.trim();
      if (!when) return alert('Вкажи нову дату');
      if (!why)  return alert('Причина обов\'язкова — її бачать усі учасники');
      const { error } = await sb.rpc('admin_shift_deadline', {
        p_gameweek: S.gw.gameweek_id,
        p_new: new Date(when).toISOString(),
        p_reason: why
      });
      if (error) return alert('Помилка: ' + error.message);
      alert('Дедлайн зсунуто, причина показана всім');
      await loadRefs(); go('admin');
    };
  }

  // --- U-17: доступ до чужого прогнозу через журнал
  if ($('ap-who')) {
    const { data: parts } = await sb.from('participants').select('*')
      .eq('tournament_id', TOURNAMENT_ID);
    const sel = $('ap-who');
    for (const p of (parts || [])) {
      if (p.id === S.me.participant_id) continue;
      const o = document.createElement('option');
      o.value = p.id; o.textContent = p.display_name;
      sel.appendChild(o);
    }

    $('btn-open').onclick = async () => {
      if (!sel.value) return alert('Обери учасника');
      if (!confirm('Це запишеться в журнал, який бачать усі. Продовжити?')) return;
      const { data, error } = await sb.rpc('admin_open_predictions', {
        p_gameweek: S.gw.gameweek_id,
        p_target: sel.value,
        p_reason: $('ap-why').value.trim() || null
      });
      if (error) return alert('Помилка: ' + error.message);
      $('open-result').innerHTML = `<div class="msg ok" style="margin-top:12px">
        Записано в журнал</div>` + (data || []).map(r =>
        `<div class="rev-line"><span>${esc(r.boost_code || '')}</span>
         <span class="s">${r.home_score ?? '—'}:${r.away_score ?? '—'}</span></div>`).join('');
    };
  }

  // --- U-8c: бюджет і прайс
  if ($('prices')) {
    const { data: t } = await sb.from('tournaments').select('*').eq('id', TOURNAMENT_ID).single();
    $('prices').innerHTML = `
      <div class="rev-line"><span><b>Бюджет турніру</b></span>
        <input type="number" id="pr-budget" value="${t.budget}" style="width:90px;padding:7px;
          background:var(--panel-3);border:1px solid var(--line);border-radius:7px;
          color:var(--gold);font-family:'IBM Plex Mono',monospace;text-align:right;font-weight:700"></div>` +
      S.boostTypes.map(b => `<div class="rev-line"><span>${esc(b.title)}</span>
        <input type="number" data-price="${b.code}" value="${priceOf(b.code)}" style="width:90px;padding:7px;
          background:var(--panel-3);border:1px solid var(--line);border-radius:7px;
          color:var(--text);font-family:'IBM Plex Mono',monospace;text-align:right"></div>`).join('');

    $('btn-prices').onclick = async () => {
      const b = Number($('pr-budget').value);
      const { error: e1 } = await sb.from('tournaments').update({ budget: b }).eq('id', TOURNAMENT_ID);
      if (e1) return alert('Помилка: ' + e1.message);
      for (const inp of $('view').querySelectorAll('[data-price]')) {
        await sb.from('boost_prices')
          .update({ price: Number(inp.value) })
          .eq('tournament_id', TOURNAMENT_ID)
          .eq('boost_code', inp.dataset.price);
      }
      alert('Збережено');
      await loadRefs(); go('admin');
    };
  }
}

// =====================================================================
//  Модальне вікно перевірки
// =====================================================================
function showModal(title, body, onConfirm){
  $('modal-host').innerHTML = `
    <div class="modal-bg" id="mbg"><div class="modal">
      <h2>${esc(title)}</h2>
      <div>${body}</div>
      <button class="primary" id="m-ok" style="margin-top:16px">Так, зберігаю</button>
      <button class="ghost" id="m-no" style="margin-top:9px;width:100%">Ще поправлю</button>
    </div></div>`;
  $('m-no').onclick = closeModal;
  $('m-ok').onclick = async () => {
    $('m-ok').disabled = true;
    $('m-ok').textContent = 'зберігаю…';
    try { await onConfirm(); }
    catch (e) {
      alert('Помилка: ' + (e.message || e));
      $('m-ok').disabled = false;
      $('m-ok').textContent = 'Так, зберігаю';
    }
  };
}
function closeModal(){ $('modal-host').innerHTML = ''; }

// =====================================================================
boot();
</script>
