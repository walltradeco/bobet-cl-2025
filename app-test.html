  // і головне в них — що прогноз на нарахування не впливає.
  inner += `
    <details class="bex">
      <summary>Як це рахується — приклади</summary>
      <div>${esc(
`Стиль — це ставка на те, ЯК складеться вікенд, а не на конкретні рахунки. Нараховується за фінальними результатами матчів; твої прогнози на нього не впливають ніяк.

Найпростіше запам'ятати так: поставив 3:0, матч закінчився 0:3 — за прогноз нуль, а стиль Flick усе одно дасть очко, бо хтось забив три.

За етап стилі дають щонайбільше ${styleMax} очок — по ${cap} за кожен із ${S.gameweeks.length} вікендів.

⚠️ Стеля ${cap} діє на вікенд: якщо умова спрацювала більше разів, зайве зрізається. У сумі за вікенд це видно рядком «(стеля N, сирих M)».

⚠️ Один стиль на вікенд, і той самий стиль двічі за етап узяти не можна — витрачені лишаються в списку сірими, з номером вікенда, де пішли.

⚠️ Не обрав до дедлайну — система кине випадковий із вільних.`)
      + (opts.length ? '\n\n— — —\n\n' + opts.map(o =>
          (o.icon || '👔') + ' ' + esc(o.title) + '\n' + esc(o.examples || o.description)).join('\n\n') : '')}</div>
    </details>`;

  // Чужі стилі — рівно після відкриття вікенда, як і прогнози
  if (open && (S.styleRows || []).length) {
    const rowsHtml = S.styleRows
      .slice()
      .sort((a, b) => esc(a.display_name).localeCompare(esc(b.display_name)))

        </div>`).join('');
    inner += `
      <div style="margin-top:12px">
        <div class="dim" style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:2px">Стилі вікенда</div>
        ${rowsHtml}
      </div>`;
  }

  box.innerHTML = `<div class="card tight">${inner}</div>`;

  box.querySelectorAll('[data-style]').forEach(b => {
    b.onclick = async () => {

      // Набране в полях, але ще не підтверджене, треба забрати ДО

function renderBreakdown(m, p){
  if (p.points == null) {
    return `<div class="actual">факт ${m.home_score}:${m.away_score}
      · <span class="dim">прогнозу не було</span></div>`;
  }
  const parts = [];
  const base = p.base ?? p.points;
  parts.push(`рахунок → ${ptsWord(base)}`);
  if (p.note) parts.push(esc(p.note));

  return `<div class="actual">факт ${m.home_score}:${m.away_score}
    · <span class="pts">${ptsWord(p.points)}</span>
    <div class="dim" style="font-size:13px;margin-top:3px">${parts.join(' · ')}</div></div>`;
}

// ---------------------------------------------------------------------
//  Автопілот: два матчі-кандидати замість одного (U-8)
// ---------------------------------------------------------------------
function renderAutopilotBar(){
  const host = $('ap-bar');
  if (!host) return;

  // Юніт Автопілота підходить сюди, тільки якщо він або ще вільний,
  // або вже розкладений саме на матчі ЦЬОГО вікенда. Витрачений
  // у минулому вікенді юніт більше не пропонуємо — раніше він
  // пролізав через запасний варіант «|| units[0]» і блок оживав.
  const here = (id) => S.matches.some(m => m.match_id === id);
  const mine = (u) => (u.autopilot_candidates || []).some(here);

  const units = S.stock.filter(u =>
    u.boost_code === 'autopilot' && (u.status === 'in_stock' || mine(u)));
  if (!units.length) { host.innerHTML = ''; return; }

  // Юніт беремо ЗАВЖДИ свіжий зі складу. Раніше тут лишався старий
  // знімок S.ap.unit, у якому autopilot_candidates ще порожні — через
  // це модалка казала «не заявлені» після успішного «Готово», а кнопка
  // «Зняти Автопілот» стирала вибір лише на екрані й до бази не йшла.
  const unit = (S.ap.unit &&
                units.find(u => u.boost_unit_id === S.ap.unit.boost_unit_id))
    || units.find(mine)
    || units.find(u => u.status === 'in_stock')
    || units[0];
  S.ap.unit = unit;

  // Кандидати з бази підтягуємо, лише поки людина сама нічого не чіпала.
  // Інакше зняття обох кандидатів руками одразу ж скасовувалось:
  // picks порожні -> перемалювання -> знову підтягнулись із бази.
  if (!S.ap.touched && !S.ap.picks.length && unit.autopilot_candidates) {
    S.ap.picks = unit.autopilot_candidates.filter(
      id => S.matches.some(m => m.match_id === id));
  }

  const n = S.ap.picks.length;
  // Заявка вже лежить у базі, якщо обидва кандидати збережені
  // саме за цим юнітом. Від цього залежить, чи достатньо стерти
  // місцевий вибір, чи треба ходити в базу.
  const savedIds = (unit.autopilot_candidates || []).filter(here);
  const saved = savedIds.length === 2;

  host.innerHTML = `
    <div class="card tight" style="border-color:var(--gold);background:var(--gold-soft)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div>
          <b style="color:var(--gold)">Автопілот</b>
          <div class="dim" style="margin-top:3px">
            Обери два матчі — система сама подвоїть той, де вийде більше очок.</div>
        </div>
        <div class="mono" style="font-size:20px;font-weight:700;color:var(--gold)">${n}/2</div>
      </div>
      <button class="ghost" id="ap-toggle" style="width:100%;margin-top:10px">
        ${S.ap.on ? 'Готово' : (n ? 'Змінити кандидатів' : 'Обрати кандидатів')}</button>
      ${(n || saved) ? `<button class="ghost" id="ap-off" style="width:100%;margin-top:8px">
        Зняти Автопілот</button>` : ''}
    </div>`;

  $('ap-toggle').onclick = () => {
    if (S.ap.on && S.ap.picks.length === 2) { saveAutopilot(); return; }
    S.ap.on = !S.ap.on;
    paintAutopilotTargets();
    renderAutopilotBar();
  };

  // Пункт 8: третя дія — відмовитись. Юніт повертається у склад
  // вільним, і його можна заявити в іншому вікенді етапу.
  if ($('ap-off')) $('ap-off').onclick = async () => {
    if (!confirm('Зняти Автопілот?\n\n' +
                 'Юніт повернеться у склад вільним — його можна буде ' +
                 'заявити в іншому вікенді.')) return;

    if (!saved) {                       // у базі нічого немає, досить стерти вибір
      S.ap.picks = [];
      S.ap.on = false;
      S.ap.touched = true;
      paintAutopilotTargets();
      renderAutopilotBar();
      return;
    }

    collectScores();
    const typed = S.myPred;
    const { data, error } = await sb.rpc('clear_autopilot', {
      p_boost_unit: unit.boost_unit_id
    });
    if (error) return alert('Помилка: ' + error.message);
    alert(data);
    S.ap = { unit: null, picks: [], touched: false };
    S.pending = typed;
    S.myPred = {};
    go('matches');
  };

  paintAutopilotTargets();
}

function paintAutopilotTargets(){
  for (const m of S.matches) {
    const card = $('view').querySelector(`[data-match="${m.match_id}"]`);
    if (!card) continue;
    const picked = S.ap.picks.includes(m.match_id);

    card.classList.toggle('autopilot', picked);
    card.classList.toggle('ap-pick', !!S.ap.on);

    card.onclick = null;
    if (!S.ap.on) continue;

    // Матч, на якому вже стоїть інший буст, кандидатом бути не може
    const busy = S.myPred[m.match_id]?.boost && S.myPred[m.match_id].boost !== 'autopilot';
    if (busy) { card.classList.add('ap-blocked'); continue; }
    card.classList.remove('ap-blocked');

    card.onclick = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
      const i = S.ap.picks.indexOf(m.match_id);
      if (i >= 0) S.ap.picks.splice(i, 1);
      else if (S.ap.picks.length < 2) S.ap.picks.push(m.match_id);
      else { alert('Уже обрано два матчі. Зніми один, щоб додати інший.'); return; }
      S.ap.touched = true;
      renderAutopilotBar();
    };
  }
}

async function saveAutopilot(){
  // Спершу знімаємо все, що набрано в полях. Далі йде go('matches'),
  // який перечитує прогнози з бази — а там цих рахунків ще немає,
  // бо вони зберігаються тільки кнопкою «Підтверджую».
  collectScores();
  const typed = S.myPred;

  const { error } = await sb.rpc('set_autopilot', {
    p_boost_unit: S.ap.unit.boost_unit_id,
    p_match_a: S.ap.picks[0],
    p_match_b: S.ap.picks[1]
  });
  if (error) return alert('Помилка: ' + error.message);
  S.ap.on = false;
  alert('Автопілот заявлено на два матчі');
  S.pending = typed;
  S.myPred = {};
  go('matches');
}

async function renderChecks(){
  // Дані вже прийшли в loadGameweek — другий запит лише плодив би
  // розбіжність між замком і галочками.
  const host = $('checks');
  if (!host) return;
  host.innerHTML = (S.checks || [])
    .sort((a, b) => Number(b.confirmed) - Number(a.confirmed))
    .map(c => `<div class="chk ${c.confirmed ? 'yes' : 'no'}">
      ${c.confirmed ? '✓' : '○'} ${esc(c.display_name)}
      ${c.confirmed && c.skipped_count ? `<span class="dim">(-${c.skipped_count})</span>` : ''}
    </div>`).join('');
}

// Склад бустів у розрізі цього вікенда.
//   free   — код -> вільні юніти, які ще можна кудись покласти
//   heldBy — match_id -> юніт, уже прикріплений до матчу цього вікенда
// Юніт, що стоїть на матчі, лишається за ним і у вільні не рахується.
function boostPool(){
  const free = {}, heldBy = {};
  for (const u of S.stock) {
    if (u.boost_code === 'autopilot') continue;
    if (u.match_id && S.matches.some(m => m.match_id === u.match_id)) {
      heldBy[u.match_id] = u;
    } else if (u.status === 'in_stock') {
      (free[u.boost_code] ||= []).push(u);
    }
  }
  return { free, heldBy };
}

// Бусти: показуємо лише те, що є в складі і ще не витрачено
function renderBoostPickers(){
  const { free, heldBy } = boostPool();

  // Скільки юнітів кожного коду вже розкладено по матчах прямо зараз.
  // Саме цього не було: вибір буста не зменшував залишок, і один
  // юніт лягав на скільки завгодно матчів.
  const used = {};
  for (const m of S.matches) {
    const b = S.myPred[m.match_id]?.boost;
    if (!b || b === 'autopilot') continue;
    if (heldBy[m.match_id]?.boost_code === b) continue;  // юніт уже за цим матчем
    used[b] = (used[b] || 0) + 1;
  }

  const codes = new Set([
    ...Object.keys(free),
    ...Object.values(heldBy).map(u => u.boost_code),
  ]);

  for (const m of S.matches) {
    const host = $('view').querySelector(`[data-boosts="${m.match_id}"]`);
    if (!host) continue;
    const cur = S.myPred[m.match_id]?.boost;

    let chips = '';
    for (const code of codes) {
      if (code === 'autopilot') continue;   // Автопілот ставиться окремо
      const t = typeOf(code);
      const on = cur === code;
      const c  = boostColor(code);
      const leftN = (free[code]?.length || 0) - (used[code] || 0);
      const out = !on && leftN <= 0;        // більше нема чого класти
      // Обраний буст заливається своїм кольором, необраний — лише обвід,
      // а той, що скінчився, гасне і не натискається
      const st = on
        ? `border-color:${c};color:#0b0b0f;background:${c};font-weight:700;`
        : out ? `border-color:#3a3a45;color:#6b6b78;opacity:0.5;cursor:not-allowed;`
              : `border-color:${c}80;color:${c};`;
      chips += `<button class="boost-chip" style="${st}"
        ${out ? 'data-out="1"' : `data-set-boost="${m.match_id}" data-code="${code}"`}
        title="${esc(t.description)}">${esc(t.title)}${on ? '' : ' ×' + Math.max(leftN, 0)}</button>`;
    }
    if (cur && cur !== 'autopilot') {
      chips += `<button class="boost-chip" data-set-boost="${m.match_id}" data-code="">зняти</button>`;
    }
    host.innerHTML = chips || '<span class="dim" style="font-size:13px">вільних Boosts немає</span>';
  }

  $('view').querySelectorAll('[data-set-boost]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.setBoost;

      // Пункт 7. Матч, уже обраний кандидатом Автопілота, не має
      // мовчки приймати інший буст. Якщо заявка вже в базі, її
      // все одно не пустить тригер boost_assignments_exclusive
      // (файл 02) — краще сказати це зараз, ніж на збереженні.
      if (b.dataset.code && S.ap.picks.includes(id)) {
        const savedHere = ((S.ap.unit && S.ap.unit.autopilot_candidates) || []).includes(id);
        if (savedHere) {
          alert('Цей матч — уже заявлений кандидат Автопілота.\n\n' +
                'Спершу зніми Автопілот або зміни кандидатів. ' +
                'Інакше база все одно не прийме другий буст на цей матч.');
          return;
        }
        if (!confirm('Цей матч обраний кандидатом Автопілота.\n\n' +
                     'Поставити сюди інший буст? Кандидатуру буде знято.')) return;
      }

      S.myPred[id] = S.myPred[id] || {};
      S.myPred[id].boost = b.dataset.code || null;
      collectScores();
      renderBoostPickers();

      const card = $('view').querySelector(`[data-match="${id}"]`);
      paintMatchCard(card, b.dataset.code || null);

      // Double Predict відкриває поля для другого рахунку
      const dp = card.querySelector('.dp-wrap');
      if (dp) dp.classList.toggle('hide', b.dataset.code !== 'double_predict');

      // Матч із бустом не може бути кандидатом Автопілота
      if (b.dataset.code) {
        const i = S.ap.picks.indexOf(id);
        if (i >= 0) { S.ap.picks.splice(i, 1); renderAutopilotBar(); }
      }
    };
  });
}

// Забрати набране в полях перед перемальовуванням екрана. loadGameweek
// поверне це з S.pending, тож рахунки переживають вибір стилю, суперника
// чи Автопілота.
function keepTyped(){
  collectScores();
  S.pending = S.myPred;
  S.myPred = {};
}

// Чого бракує для підтвердження вікенда. Порожній масив — можна.
//
// Рішення Богдана 27.07.2026: вікенд підтверджується цілим. Раніше
// підтвердити можна було з дірками, тому «підтвердив» і «заповнив»
// були різними станами — і в таблиці це виглядало однаково.
//
// ⚠️ Стиль вимагаємо лише там, де механіка ввімкнена для етапу
// (порожній styleOptions = рядка в manager_style_config немає).
function todo(){
  collectScores();   // до вставки HTML карток у DOM ще немає — тихо пропустить
  const gaps = [];

  const noScore = S.matches.filter(m => {
    const p = S.myPred[m.match_id];
    return !p || p.home == null || p.away == null;
  }).length;
  if (noScore) {
    gaps.push(`${noScore} ${noScore === 1 ? 'матч' :
      (noScore < 5 ? 'матчі' : 'матчів')} без прогнозу`);
  }
  if (!S.rivalPairs.some(r => r.chooser_id === S.me.participant_id)) {
    gaps.push('суперник у Rivals');
  }
  if ((S.styleOptions || []).length && !S.styleOptions.some(o => o.is_current)) {
    gaps.push('тренерський стиль');
  }
  return gaps;
}

// Кнопка підтвердження реагує на кожну цифру, а не лише на
// перемальовування: інакше людина заповнює останній матч і не розуміє,
// чому кнопка досі сіра.
function refreshConfirmState(){
  const btn = $('btn-confirm');
  if (!btn) return;
  const gaps = todo();
  btn.disabled = gaps.length > 0;
  const note = btn.nextElementSibling;
  if (note) {
    note.textContent = gaps.length
      ? `Щоб підтвердити, лишилось: ${gaps.join(', ')}.`
      : 'Перед збереженням покажемо, що саме ти обрав.';
  }

  // Лічильник у шапці рахується з тих самих даних, що й кнопка, і
  // мусить оновлюватись разом із нею — інакше він застигав на «0 з 3»,
  // поки людина заповнює поля, і суперечив підпису під кнопкою.
  const cnt = $('pred-count');
  if (cnt) {
    const total = S.matches.length;
    const filled = S.matches.filter(m => {
      const p = S.myPred[m.match_id];
      return p && p.home != null && p.away != null;
    }).length;
    cnt.textContent = `${filled} з ${total}`;
    cnt.style.color = filled < total ? 'var(--gold)' : 'var(--green)';
    const left = $('pred-left');
    if (left) {
      left.textContent = filled < total ? `лишилось заповнити ${total - filled}` : '';
    }
  }
}

function collectScores(){
  for (const m of S.matches) {
    const card = $('view').querySelector(`[data-match="${m.match_id}"]`);
    if (!card) continue;
    const h = card.querySelector('.sc-h').value;
    const a = card.querySelector('.sc-a').value;
    const h2 = card.querySelector('.sc-h2')?.value ?? '';
    const a2 = card.querySelector('.sc-a2')?.value ?? '';
    S.myPred[m.match_id] = S.myPred[m.match_id] || {};
    S.myPred[m.match_id].home = h === '' ? null : Number(h);
    S.myPred[m.match_id].away = a === '' ? null : Number(a);
    S.myPred[m.match_id].home2 = h2 === '' ? null : Number(h2);
    S.myPred[m.match_id].away2 = a2 === '' ? null : Number(a2);
  }
}

// Екран перевірки перед записом (U-5)
function reviewAndSave(){
  collectScores();

  // Страховка на випадок, коли кнопку натиснули в обхід disabled
  // (перемальовування, старий DOM, консоль). Правило одне й те саме:
  // вікенд підтверджується тільки цілим.
  const gaps = todo();
  if (gaps.length) {
    return alert('Вікенд ще не готовий. Лишилось: ' + gaps.join(', ') + '.');
  }

  const filled = S.matches.filter(m => {
    const p = S.myPred[m.match_id];
    return p && p.home != null && p.away != null;
  });

  // Стан Автопілота на момент підтвердження. Кандидати живуть
  // окремо від бустів: у p.boost вони не потрапляють, доки матч
  // не зіграний, тому в модалці їх треба підписувати самим.
  const apPicks   = S.ap.picks || [];
  const apSavedIds = ((S.ap.unit && S.ap.unit.autopilot_candidates) || [])
    .filter(id => S.matches.some(m => m.match_id === id));
  const apSaved = apSavedIds.length === 2 && apPicks.length === 2 &&
    apPicks.every(id => apSavedIds.includes(id));

  let body = filled.map(m => {
    const p = S.myPred[m.match_id];
    const apHere = apPicks.includes(m.match_id);
    const mark = (apHere || p.boost === 'autopilot')
      ? `<span style="color:${boostColor('autopilot')}">· Автопілот · кандидат</span>`
      : (p.boost
          ? `<span style="color:${boostColor(p.boost)}">· ${esc(typeOf(p.boost).title)}</span>`
          : '');
    return `<div class="rev-line">
      <span>${esc(m.home_team)} — ${esc(m.away_team)} ${mark}</span>
      <span class="s">${p.home}:${p.away}${
        p.boost === 'double_predict' && p.home2 != null
          ? ` / ${p.home2}:${p.away2}` : ''}</span></div>`;
  }).join('');

  // Rivals 2.0: суперника можна змінити й ПІСЛЯ підтвердження (аж до
  // дедлайну вікенда), тому це просто показ поточного вибору перед
  // збереженням прогнозів.
  const myRival = S.rivalPairs.find(r => r.chooser_id === S.me.participant_id);
  body += `<div class="rev-line" style="margin-top:12px">
    <span>⚔️ Суперник на вікенд</span>
    <span class="s">${myRival ? esc(myRival.rival_name) : '—'}</span></div>`;

  // Manager Style. На відміну від суперника, стиль ФІКСУЄТЬСЯ цим
  // підтвердженням і після нього не міняється — тому тут не просто
  // показ, а остання можливість передумати.
  const myStylePick = (S.styleOptions || []).find(o => o.is_current);
  if (myStylePick) {
    body += `<div class="rev-line">
      <span>👔 Стиль на вікенд</span>
      <span class="s">${esc(myStylePick.title)}</span></div>`;
  }

  // Автопілот увімкнений, але недороблений. Раніше тут же стояло
  // попередження «обрані, але не заявлені» — воно більше не потрібне:
  // заявка робиться сама, нижче, у момент підтвердження.
  if (apPicks.length === 1) {
    body += `<div class="msg err" style="margin-top:12px">
      Автопілот обрано лише на один матч. Йому потрібні два —
      якщо підтвердиш так, Автопілот не спрацює, а юніт лишиться
      вільним для іншого вікенда.</div>`;
  }
  const apNoScore = apPicks.filter(id => !filled.some(m => m.match_id === id));
  if (apNoScore.length) {
    body += `<div class="msg err" style="margin-top:12px">
      ${apNoScore.length === 1 ? 'Кандидат Автопілота без прогнозу' :
        'Кандидати Автопілота без прогнозу'} — подвоювати буде нічого.</div>`;
  }

  showModal('Перевір, що обрав', body, async () => {
    // ---- Автопілот вирішується саме тут ----
    // Кнопка «Готово» лишається робочою, але перестала бути
    // обов'язковою. Правило просте: два підсвічені матчі на момент
    // підтвердження — Автопілот заявлено; не два — не використано,
    // юніт повертається у склад вільним і доступний в іншому вікенді.
    //
    // Стару заявку знімаємо ДО збереження прогнозів: звільнений
    // з-під Автопілота матч може одразу отримати звичайний буст,
    // а тригер boost_assignments_exclusive не пускає їх на один матч.
    const apUnitId  = S.ap.unit && S.ap.unit.boost_unit_id;
    const apWantsTwo = apPicks.length === 2;
    const apSame     = apWantsTwo && apSaved;   // у базі вже рівно це

    if (apUnitId && apSavedIds.length && !apSame) {
      const { error } = await sb.rpc('clear_autopilot', { p_boost_unit: apUnitId });
      if (error) throw new Error(error.message);
    }

    // Кожному матчу — власний юніт. Раніше тут для всіх матчів
    // знаходився ОДИН і той самий вільний юніт (база його не пускала
    // двічі), а вже збережений буст не знаходився взагалі, бо мав
    // статус assigned — і тоді save_prediction його мовчки знімав.
    const { free, heldBy } = boostPool();
    const pool = {};
    for (const code of Object.keys(free)) pool[code] = free[code].slice();

    for (const m of filled) {
      const p = S.myPred[m.match_id];
      let unit = null;
      if (p.boost && p.boost !== 'autopilot') {
        const held = heldBy[m.match_id];
        unit = (held && held.boost_code === p.boost)
          ? held
          : (pool[p.boost] || []).shift() || null;
        if (!unit) {
          throw new Error('Не вистачає буста «' + typeOf(p.boost).title +
            '» серед куплених Boosts — зніми його з якогось матчу');
        }
      }
      const { error } = await sb.rpc('save_prediction', {
        p_match: m.match_id, p_home: p.home, p_away: p.away,
        p_home_2: p.boost === 'double_predict' ? (p.home2 ?? null) : null,
        p_away_2: p.boost === 'double_predict' ? (p.away2 ?? null) : null,
        p_boost_unit: unit ? unit.boost_unit_id : null
      });
      if (error) throw new Error(error.message);
    }
    // Заявка Автопілота — після прогнозів, щоб бусти вже стояли
    // на своїх матчах і тригер бачив справжню картину.
    if (apUnitId && apWantsTwo && !apSame) {
      const { error } = await sb.rpc('set_autopilot', {
        p_boost_unit: apUnitId,
        p_match_a: apPicks[0],
        p_match_b: apPicks[1]
      });
      if (error) throw new Error(error.message);
    }

    const { data, error } = await sb.rpc('confirm_gameweek', { p_gameweek: S.gw.gameweek_id });
    if (error) throw new Error(error.message);
    closeModal();
    S.ap = { unit: null, picks: [], touched: false };
    await loadRefs();
    await go('matches');
    alert(data.opened
      ? 'Збережено. Усі підтвердили — прогнози відкрились!'
      : `Збережено. Підтвердили ${data.confirmed} з ${data.total}.`);
  });
}

// ---------------------------------------------------------------------
//  Картка буста: назва, ціна, коротке правило і розгорнутий розбір.
//
//  Один вигляд на два стани вкладки: до фіксації праворуч стоїть
//  лічильник ±, після фіксації — скільки цього буста куплено. Раніше
//  після фіксації правила зникали зовсім, хоча саме тоді вони й
//  потрібні: розкладати куплене по матчах ще попереду.
//
//  Розбір із прикладами лежить у базі (`boost_types.examples`, файл
//  106) і схований у <details>: сім бустів × десять рядків зробили б
//  сторінку нечитабельною, а так кожен розгортає те, що йому треба.
//  ⚠️ Приклади в базі звірені прогоном через саме нарахування —
//  текст, не звірений із кодом, це тиха помилка.
// ---------------------------------------------------------------------
function boostCard(b, owned, controlHtml){
  const c = boostColor(b.code);
  const right = controlHtml != null
    ? controlHtml
    : `<div class="mono" style="font-size:16px;font-weight:700;white-space:nowrap;
         color:${owned ? c : 'var(--text-dim)'}">${owned ? '×' + owned : '—'}</div>`;
  return `
    <div class="card tight" style="border-left:3px solid ${c}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div style="flex:1">
          <div style="font-weight:700;font-size:16px;color:${c}">${esc(b.title)}
            <span class="mono" style="color:var(--gold);font-size:14px">${priceOf(b.code)}р</span></div>
          <div class="dim" style="margin-top:4px">${esc(b.description)}</div>
        </div>
        ${right}
      </div>
      ${b.examples ? `
        <details class="bex">
          <summary>Як це рахується — приклади</summary>
          <div>${esc(b.examples)}</div>
        </details>` : ''}
    </div>`;
}

// =====================================================================
//  BOOSTS — драфт і склади в одній вкладці
//
//  viewDraft і viewStock написані так, що самі пишуть у #view.
//  Щоб не переписувати їх, тимчасово перевішуємо id="view"
//  на потрібний контейнер: функція малює туди, а потім id
//  повертається на місце. Так обидва екрани лишаються цілими.
// =====================================================================
async function renderInto(hostId, fn){
  const outer = $('view');
  const host  = $(hostId);
  if (!host) return fn();
  outer.id = 'view-outer';
  host.id  = 'view';
  try   { await fn(); }
  finally {
    // host міг бути перемальований усередині fn, шукаємо по новому id
    const cur = document.getElementById('view');
    if (cur && cur !== outer) cur.id = hostId;
    outer.id = 'view';
  }
}

async function viewBoosts(){
  // Порядок панелей залежить від того, чи вже зафіксовано свій набір.
  // До фіксації головна дія — калькулятор (pane-draft), тож він іде
  // першим. Після — цікавіше подивитись, що взяли інші, тому pane-stock
  // піднімається над довідником власних Boosts (Богдан 28.07.2026).
  const { data: ds } = await sb.from('draft_submissions')
    .select('confirmed_at')
    .eq('tournament_id', TOURNAMENT_ID)
    .eq('participant_id', S.me.participant_id)
    .maybeSingle();
  const locked = !!(ds && ds.confirmed_at);

  $('view').innerHTML = locked
    ? '<div id="pane-stock"></div><div id="pane-draft"></div>'
    : '<div id="pane-draft"></div><div id="pane-stock"></div>';

  if (locked) {
    await renderInto('pane-stock', viewStock);
    await renderInto('pane-draft', viewDraft);
  } else {
    await renderInto('pane-draft', viewDraft);
    await renderInto('pane-stock', viewStock);
  }

  // Крапка «є оновлення» (файл 147). У Boosts немає чіпів по вікендах
  // (склад — один на весь етап, а «використано» видно тут же, без
  // навігації) — тому перегляд вкладки гасить дот стадії й дот
  // «результати відомі» одразу для всіх вікендів.
  const sd = S.stageDots || (S.stageDots = {});
  const hadDot = sd.boosts_draft_new || Object.values(S.gwDots).some(d => d.boosts_new);
  sd.boosts_draft_new = false;
  for (const k in S.gwDots) S.gwDots[k].boosts_new = false;
  if (hadDot) renderTabs();
  sb.rpc('mark_seen', { p_tournament: TOURNAMENT_ID, p_gameweek: null, p_kind: 'boosts_draft' }).then(() => {}, () => {});
  for (const g of S.gameweeks) {
    sb.rpc('mark_seen', { p_tournament: TOURNAMENT_ID, p_gameweek: g.gameweek_id, p_kind: 'boosts' }).then(() => {}, () => {});
  }
}

// =====================================================================
//  ДРАФТ БУСТІВ (U-8a)
// =====================================================================
async function viewDraft(){
  const { data: t } = await sb.from('tournaments').select('*').eq('id', TOURNAMENT_ID).single();
  const { data: stock } = await sb.from('my_boost_stock').select('*')
    .eq('participant_id', S.me.participant_id);

  // Чи вже зафіксовано склад (файл 45). Свій рядок драфту учасник
  // читає завжди, тож окремої функції для цього не треба.
  const { data: ds } = await sb.from('draft_submissions')
    .select('confirmed_at,total_spent')
    .eq('tournament_id', TOURNAMENT_ID)
    .eq('participant_id', S.me.participant_id)
    .maybeSingle();
  const lockedAt = ds && ds.confirmed_at ? ds.confirmed_at : null;

  const closed = new Date(t.draft_deadline) <= new Date() || !!lockedAt;
  const cur = {};
  for (const u of (stock || [])) cur[u.boost_code] = (cur[u.boost_code] || 0) + 1;

  const state = { ...cur };
  const budget = t.budget;

  function spent(){
    return Object.entries(state).reduce((s, [c, q]) => s + priceOf(c) * q, 0);
  }

  function draw(){
    // Після фіксації калькулятор зникає: міняти вже нічого не можна,
    // а кнопки ± лише плутають. Лишається сам факт фіксації, а нижче
    // на цьому ж екрані — блок чужих складів.
    // Це гілка від стану, а не «сховати назавжди»: після
    // admin_unlock_draft lockedAt стає порожнім і калькулятор
    // повертається сам.
    if (lockedAt) {
      // Раніше тут лишався самий факт фіксації — і правила бустів
      // ставали недоступні саме тоді, коли потрібні найбільше:
      // розкладати куплене по матчах ще попереду. Тепер лишається
      // повний довідник, з кількістю купленого у себе.
      // ⚠️ Рахуємо з локального stock цього екрана, а не з S.stock:
      // глобальний заповнює loadGameweek, а на вкладку Boosts можна
      // зайти, жодного разу не відкривши Матчі — і там було б порожньо.
      const mineByCode = {};
      for (const u of (stock || [])) {
        mineByCode[u.boost_code] = (mineByCode[u.boost_code] || 0) + 1;
      }
      $('view').innerHTML = `<div class="msg ok">Boosts зафіксовано ${fmtWhen(lockedAt)}
        · витрачено <b class="mono">${ds.total_spent}</b> з <b class="mono">${budget}</b> рексів.
        Змінити вже не можна — якщо це помилка, потрібен адмін.</div>
        <div class="dim" style="margin:14px 0 10px">Що саме куплено і як воно рахується:</div>
        ${activeBoosts().map(b => boostCard(b, mineByCode[b.code] || 0)).join('')}`;
      return;
    }

    const sp = spent();
    const left = budget - sp;
    const pct = Math.min(100, sp / budget * 100);

    $('view').innerHTML = `
      <div class="budget">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span class="dim">Витрачено</span>
          <span class="mono" style="font-size:20px;font-weight:700;color:${left < 0 ? 'var(--red)' : 'var(--gold)'}">
            ${sp} / ${budget}</span>
        </div>
        <div class="bar"><div class="fill ${left < 0 ? 'over' : ''}" style="width:${pct}%"></div></div>
        <div class="dim" style="margin-top:6px">Залишок: <b class="mono">${left}</b> рексів</div>
      </div>
      ${closed ? '<div class="msg err">Драфт закрито — Boosts більше не змінити</div>' : ''}
      ${activeBoosts().map(b => boostCard(b, null, `
            <div class="qty">
              <button data-m="${b.code}" ${closed ? 'disabled' : ''}>−</button>
              <span class="n">${state[b.code] || 0}</span>
              <button data-p="${b.code}" ${closed ? 'disabled' : ''}>+</button>
            </div>`)).join('')}
      ${lockedAt ? '' : `<button class="primary" id="btn-draft" ${closed || left < 0 || sp === 0 ? 'disabled' : ''}>
        ${left < 0 ? 'Перевитрата' : 'Підтвердити Boosts'}</button>`}
      <p class="dim" style="text-align:center;margin-top:10px">
        ${lockedAt
          ? 'Розфіксувати Boosts може лише адмін.'
          : 'Підтвердити можна один раз. Після цього Boosts не змінюються.'}</p>`;

    $('view').querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      state[b.dataset.p] = (state[b.dataset.p] || 0) + 1; draw();
    });
    $('view').querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
      state[b.dataset.m] = Math.max(0, (state[b.dataset.m] || 0) - 1); draw();
    });

    const db = $('btn-draft');
    if (db) db.onclick = () => {
      const items = Object.entries(state).filter(([, q]) => q > 0);
      const body = items.map(([c, q]) =>
        `<div class="rev-line"><span>${esc(typeOf(c).title)} × ${q}</span>
         <span class="s">${priceOf(c) * q}р</span></div>`).join('') +
        `<div class="rev-line" style="border:none;margin-top:8px">
          <span><b>Разом</b></span><span class="s">${spent()} з ${budget}</span></div>`;

      showModal('Підтвердити Boosts', body + `
        <p class="dim" style="margin-top:12px;color:var(--red)">
          Це остаточно. Після підтвердження змінити Boosts
          не можна — тільки через адміна.</p>`, async () => {
        const { error } = await sb.rpc('submit_draft', {
          p_tournament: TOURNAMENT_ID,
          p_items: items.map(([code, qty]) => ({ code, qty }))
        });
        if (error) throw new Error(error.message);

        // Друга дія — власне замок (файл 45)
        const { data: msg, error: e2 } = await sb.rpc('confirm_draft', {
          p_tournament: TOURNAMENT_ID
        });
        if (e2) throw new Error(e2.message);

        if (S.stageDots) S.stageDots.boosts_todo = false;
        closeModal();
        await go('draft');
        alert(msg || 'Boosts зафіксовано');
      });
    };
  }
  draw();
}

// =====================================================================
//  СКЛАДИ ВСІХ (U-8b, U-8d)
// =====================================================================
async function viewStock(){
  // boost_board (файл 45) замість my_boost_stock: «використаний»
  // тут береться з призначення на матч, а RLS вирішує, чиє видно.
  const [board, parts, allRes] = await Promise.all([
    sb.from('boost_board').select('*').eq('tournament_id', TOURNAMENT_ID),
    sb.from('participants').select('*').eq('tournament_id', TOURNAMENT_ID),
    sb.rpc('drafts_all_confirmed', { p_tournament: TOURNAMENT_ID })
  ]);
  const data  = board.data || [];
  const allOk = allRes && allRes.data === true;

  const byP = {};
  for (const u of data) (byP[u.participant_id] ||= []).push(u);

  let html = allOk
    ? `<div class="msg ok">Підтвердили всі — чужі Boosts відкриті.
         Використані бусти з'являються, щойно відкривається вікенд.</div>`
    : `<div class="msg">Чужі Boosts закриті, доки їх не підтвердять усі.</div>`;

  for (const p of (parts.data || []).sort((a, b) =>
        a.display_name.localeCompare(b.display_name, 'uk'))) {
    const units = byP[p.id] || [];
    const isMe = p.id === S.me.participant_id;

    if (!units.length) {
      html += `<div class="card tight"><b>${esc(p.display_name)}</b>
        <span class="dim"> — Boosts ще закриті</span></div>`;
      continue;
    }
    // Рахуємо окремо використані й вільні
    const counts = {};
    for (const u of units) {
      const k = u.boost_code + '|' + (u.used ? '1' : '0');
      counts[k] = (counts[k] || 0) + 1;
    }
    html += `<div class="card tight">
      <b style="color:${isMe ? 'var(--gold)' : 'var(--purple)'}">${esc(p.display_name)}</b>
      <div class="boost-row" style="margin-top:8px">
        ${Object.entries(counts).map(([k, n]) => {
          const [code, used] = k.split('|');
          const label = typeOf(code).title + ' ×' + n + (used === '1' ? ' — використано' : '');
          return boostChip(code, label, used === '1');
        }).join('')}
      </div></div>`;
  }
  $('view').innerHTML = html;
}

// =====================================================================
//  ЛІДЕРБОРД (U-14)
// =====================================================================

// Зміна місця з останнього знімку (файл 116/184). null/undefined —
// немає даних (в'юха ще не на проді, чи запит впав) — не показуємо
// нічого, а не «=», щоб не брехати «нуль змін», коли просто нема історії.
function lbDeltaHtml(d){
  if(d === null || d === undefined) return '';
  if(d > 0) return `<span style="color:var(--green)">▲${d}</span>`;
  if(d < 0) return `<span style="color:var(--red)">▼${-d}</span>`;
  return `<span class="dim">=</span>`;
}

async function viewBoard(){
  // ДВА РІЗНІ БОРДИ, КОЖЕН НА СВОЄМУ МІСЦІ (рішення Богдана 11.08.2026):
  //   • етап (August/September/October) — розклад ПО МЕХАНІКАХ:
  //     матчі, бонуси, ⚔️, 🏆, 👔. Перемикача на General тут немає —
  //     General має власну вкладку етапу.
  //   • General — розклад ПО ЕТАПАХ: August + September + October +
  //     власний General · Bonus. Механіки туди не дублюємо: вони вже
  //     сидять усередині кожного етапного числа.
  // ⚠️ `season2026` — контейнер без вікендів, тож місячний запит по
  // ньому віддав би рядки з самими нулями. Звідси прив'язка до
  // `bonusOnly`, а не до перемикача.
  const season = S.stage.bonusOnly;
  const { data } = season
    ? await sb.from('season_leaderboard').select('*').order('place')
    : await sb.from('leaderboard').select('*')
        .eq('tournament_id', TOURNAMENT_ID).order('place');

  // Для General — очки кожного етапу окремо. Зіставляємо за іменем:
  // двох однакових імен в етапі не буває (це стереже health_check),
  // а `season_leaderboard` віддає те саме `display_name`.
  const stageCols = STAGES.filter(s => !s.bonusOnly);
  let byName = {};
  if (season) {
    try {
      const { data: st } = await sb.from('leaderboard')
        .select('display_name,tournament_id,total_points,bonus_points');
      (st || []).forEach(r => {
        (byName[r.display_name] = byName[r.display_name] || {})[r.tournament_id] = r;
      });
    } catch(e) {}
  }
  // Бонуси самого General = усі бонуси людини мінус ті, що вже враховані
  // всередині етапних сум. Інакше та сама цифра рахувалась би двічі.
  const generalBonus = (r) => {
    const mine = byName[r.display_name] || {};
    const inStages = stageCols.reduce((s, st) => s + ((mine[st.id] || {}).bonus_points || 0), 0);
    return (r.bonus_points ?? 0) - inStages;
  };
  const stagePts = (r, st) => ((byName[r.display_name] || {})[st.id] || {}).total_points ?? 0;

  // Той самий косметичний принцип, що на test.html: якщо в'юха ще не
  // на проді чи запит впав — просто нічого не показуємо, борд і без
  // цього працює.
  let deltaByKey = {};
  try {
    const deltaRows = season
      ? (await sb.from('season_leaderboard_rank_delta').select('person_key,delta')).data
      : (await sb.from('leaderboard_rank_delta').select('participant_id,delta,tournament_key')
          .eq('tournament_key', S.stage.key)).data;
    (deltaRows || []).forEach(d => {
      deltaByKey[season ? d.person_key : d.participant_id] = d.delta;
    });
  } catch(e) {}

  // ⚠️ Кубок першому місцю ТІЛЬКИ в General — точно як на публічному
  // борді (`test.html`: «place === 0 && isGeneral`). Сенс той самий:
  // 🥇 за етап і 🥇 за весь сезон мають відрізнятись на око.
  const medal = (p) => p === 1 ? ('🥇' + (season ? '🏆' : '')) : p === 2 ? '🥈' : p === 3 ? '🥉' : '';
  // ⚠️ Окремої мапи назв тут НЕ ТРЕБА: `STAGES` (вгорі файлу) уже
  // тримає англійські титули — August / September / October / General,
  // ті самі, що борди на публічному сайті. Я був спробував завести
  // `stageLabel(key)` і продублював цим готовий список; прибрано.
  // Українською лишалась тільки кнопка «Сезон» і заголовок «Загальний
  // залік сезону» — саме вони й стали General.
  const boardName = season ? 'General' : S.stage.title;
  const th = (t) => `<th style="text-align:right">${t}</th>`;
  const td = (v, c) => `<td class="n" style="text-align:right${c ? ';color:' + c : ''}">${v}</td>`;

  const head = season
    ? th('Точних') + stageCols.map(s => th(esc(s.title))).join('') + th('Bonus')
    : th('Точних') + th('Матчі') + th('Бонуси') + th('⚔️') + th('🏆') + th('👔');

  const cells = (r) => season
    ? td(r.exact_count, 'var(--green)')
      + stageCols.map(s => td(stagePts(r, s), 'var(--teal)')).join('')
      + td(generalBonus(r))
    : td(r.exact_count, 'var(--green)')
      + `<td class="n dim" style="text-align:right">${r.match_points ?? 0}</td>`
      + `<td class="n dim" style="text-align:right">${r.bonus_points ?? 0}</td>`
      + td(r.rival_points ?? 0, 'var(--teal)')
      + td(r.mvp_points ?? 0, 'var(--teal)')
      + td(r.style_points ?? 0, 'var(--teal)');

  $('view').innerHTML = `
    <div class="card">
    <h2>${esc(boardName)}${season ? '' : ' 2026'}</h2>
    ${!data || !data.length ? '<p class="dim">Балів ще немає.</p>' : `
    <div style="overflow-x:auto">
    <table style="min-width:520px"><thead><tr><th>№</th><th></th><th>Учасник</th>${head}${th('Разом')}</tr></thead>
    <tbody>${data.map(r => `<tr>
      <td class="n">${r.place} <span class="medal">${medal(r.place)}</span></td>
      <td class="n" style="font-size:12px">${lbDeltaHtml(deltaByKey[season ? r.person_key : r.participant_id])}</td>
      <td style="color:var(--purple);font-weight:600">${esc(r.display_name)}</td>
      ${cells(r)}
      <td class="n" style="text-align:right;color:var(--gold);font-size:17px">${r.total_points}</td>
    </tr>`).join('')}</tbody></table></div>
    ${season ? `
    <p class="dim" style="margin:12px 0 0;font-size:12px">
      Разом = ${stageCols.map(s => esc(s.title)).join(' + ')} +
      <b style="color:var(--text)">Bonus</b> — це власні бонусні питання General,
      ті, що на сайті у вкладці <b style="color:var(--text)">General · Bonus</b>.
      Бонуси етапів сюди не додаються окремо: вони вже всередині кожного етапного числа.
    </p>
    <p class="dim" style="margin:8px 0 0;font-size:12px">
      Розклад по механіках (⚔️ 🏆 👔) — на вкладці Leaderboard кожного етапу.
      <b style="color:var(--text)">🥇🏆</b> — перше місце за весь сезон, а не за етап.
    </p>` : `
    <p class="dim" style="margin:12px 0 0;font-size:12px">
      <b style="color:var(--text)">Точних</b> — вгадані точні рахунки. Це тайбрейк у
      <b style="color:var(--text)">⚔️ Rivals</b> і <b style="color:var(--text)">🏆 MVP</b>:
      при рівності очок вікенда виграє той, у кого їх більше.
      У <b style="color:var(--text)">Разом</b> тайбрейків немає — однакові очки означають
      спільне місце, і точні рахунки на нього не впливають.
    </p>
    <p class="dim" style="margin:8px 0 0;font-size:12px">
      Разом = Матчі + Бонуси + ⚔️ + 🏆 + 👔. Це те саме число, що
      <b style="color:var(--text)">${esc(boardName)}</b> у Leaderboards на сайті.
    </p>`}`}</div>`;
}

// =====================================================================
//  MVP & RIVALS — дві окремі season-номінації призового фонду
//  (🏆 найбільше Weekend MVP 7%, ⚔️ найбільше перемог Rivals 6% — Rules).
//  Раніше лише текст у призовій таблиці, тепер рахує сама season_prize_board
//  (файл 181) — той самий person_key, що в season_leaderboard, тож людина
//  з кількох етапів рахується один раз. Той самий блок, що на test.html
//  (Leaderboards) — щоб цифри не розходились між кабінетом і бордом.
// =====================================================================
async function viewMvpRivals(){
  const { data } = await sb.from('season_prize_board').select('*');
  const rows = data || [];

  // Зміна рангу (файл 184) — той самий косметичний принцип, що в

  let deltaByPerson = {};
  try {
    const { data: deltaRows } = await sb.from('season_prize_rank_delta')
      .select('person_key,mvp_delta,rival_delta');
    (deltaRows || []).forEach(d => { deltaByPerson[d.person_key] = d; });
  } catch(e) {}

  const medal = (rank) => rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : String(rank);

  const board = (titleHtml, key, rankKey, deltaKey) => {

    return `

      <h2>${titleHtml}</h2>

      <tbody>${sorted.map(r => `<tr>
        <td class="n">${medal(r[rankKey])}</td>
        <td class="n" style="font-size:12px">${lbDeltaHtml(deltaByPerson[r.person_key] ? deltaByPerson[r.person_key][deltaKey] : null)}</td>
        <td style="color:var(--purple);font-weight:600">${esc(r.display_name)}</td>
        <td class="n" style="text-align:right;color:var(--gold);font-size:17px">${r[key] ?? 0}</td>
      </tr>`).join('')}</tbody></table>`}
    </div>`;
  };

  $('view').innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <h2>MVP & Rivals — за весь турнір</h2>
      <p class="dim">Дві окремі номінації призового фонду (Rules): найбільше нагород
      Weekend MVP і найбільше перемог у дуелях Rivals за August + September + October
      разом. Рахується само, оновлюється щовікенда.</p>
    </div>
    ${board('<span style="color:var(--gold);font-weight:700;letter-spacing:0.03em">MVP</span> — найбільше нагород', 'mvp_count', 'mvp_rank', 'mvp_delta')}
    ${board('⚔️ Rivals — найбільше перемог', 'rival_wins', 'rival_rank', 'rival_delta')}
  `;
}

// =====================================================================
//  BONUS — бонусні питання етапу (US-3, US-4)
//
//  Тип питання визначає база: 'yesno' — дві кнопки, 'text' —
//  поле для назви команди чи гравця. Відповідь зберігається одразу,
//  фіксація окремою кнопкою з перепитуванням. Після фіксації
//  все замкнено, а коли адмін внесе правильну відповідь —
//  показуються бали.
// =====================================================================
async function viewBonus(){
  const { data, error } = await sb.from('my_bonus_questions').select('*');
  if (error) throw error;

  // Фільтруємо на клієнті: рядків одиниці, а кириличні назви колонок
  // у фільтрах PostgREST — зайвий ризик.
  S.bonus = (data || [])
    .filter(q => q['етап'] === S.stage.key)
    .sort((a, b) => a['поз'] - b['поз']);

  if (!S.bonus.length){
    $('view').innerHTML = `<div class="card"><h2>Bonus</h2>
      <p class="dim">Для етапу «${esc(S.stage.title)}» бонусних питань ще немає.</p></div>`;
    return;
  }

  // Фіксація тепер поштучна. Питання, додане адміном ПІСЛЯ мого
  // підтвердження, лишається відкритим — на нього відповідають
  // і фіксують окремо, а старі відповіді не чіпаються.
  const isRO   = (q) => q['зафіксовано'] || !countdown(q['дедлайн']);
  const openQ  = S.bonus.filter(q => !isRO(q));
  const locked = S.bonus.every(q => q['зафіксовано']);

  const dl   = openQ.length
    ? openQ.map(q => q['дедлайн']).sort()[0]
    : S.bonus[0]['дедлайн'];
  const left = dl ? countdown(dl) : null;

  let html = '';

  if (!openQ.length && locked){
    html += `<div class="deadline closed"><span>Відповіді зафіксовано</span>
             <span class="t">замкнено</span></div>`;
  } else if (!openQ.length){
    html += `<div class="deadline closed"><span>Час вийшов</span>
             <span class="t">дедлайн минув</span></div>`;
  } else {
    html += `<div class="deadline"><span>До дедлайну</span>
             <span class="t">${esc(left)}</span></div>`;
  }

  // Хто вже здав бонуси (пункт 13). Показується всім, не лише адміну:
  // видно тільки факт «здав / не здав», самі відповіді лишаються
  // закритими, доки не здадуть усі. Лічильник і список беруться
  // з special_status і special_confirmation_board (файл 61) — вони
  // рахують запрошених однаково для всіх, а не правами того,
  // хто дивиться.
  try {
    const [stRes, cbRes] = await Promise.all([
      sb.from('special_status').select('*').eq('tournament_id', TOURNAMENT_ID).maybeSingle(),
      sb.from('special_confirmation_board').select('*').eq('tournament_id', TOURNAMENT_ID)
    ]);
    const bChecks = (cbRes && cbRes.data) || [];
    if (bChecks.length) {
      const bs = stRes && stRes.data;
      const done  = bs ? bs.confirmed_count   : bChecks.filter(c => c.confirmed).length;
      const total = bs ? bs.participant_count : bChecks.length;
      html += `<div class="card tight">
        <div class="dim" style="margin-bottom:8px">Відповіли ${done} з ${total}</div>
        <div class="checks">${bChecks
          .sort((a, b) => Number(b.confirmed) - Number(a.confirmed))
          .map(c => `<div class="chk ${c.confirmed ? 'yes' : 'no'}">
            ${c.confirmed ? '✓' : '○'} ${esc(c.display_name)}</div>`).join('')}</div>
        <div class="dim" style="font-size:13px;margin-top:8px">
          Видно лише, хто вже здав. Чужі відповіді відкриються всім,
          коли відповідять усі.</div></div>`;
    }
  } catch (e) { /* блок необовʼязковий: без нього вкладка має працювати */ }

  html += S.bonus.map(q => {
    const ro      = isRO(q);
    const id      = q['питання_id'];
    const type    = q['тип'];
    const mine    = q['моя_відповідь'];
    const correct = q['правильна'];
    const pts     = q['мої_бали'];
    const max     = q['максимум'];

    let control;
    if (type === 'yesno'){
      const on = (v) => (String(mine || '').toLowerCase() === v ? ' on' : '');
      control = `<div class="yn">
        <button data-yn="yes" data-bet="${id}" class="${on('yes').trim()}" ${ro ? 'disabled' : ''}>YES</button>
        <button data-yn="no"  data-bet="${id}" class="${on('no').trim()}"  ${ro ? 'disabled' : ''}>NO</button>
      </div>`;
    } else if (type === 'choice'){
      // Вибір зі списку, який задав адмін. Порядок навмисно НЕ
      // перемішуємо — щоб у всіх була однакова картинка. Кнопки ті
      // самі, що в YES/NO, лише більше й переносяться рядками.
      const opts = q['варіанти'] || [];
      control = `<div class="yn yn-wrap">` + opts.map(o =>
        `<button data-choice="${esc(o)}" data-bet="${id}"
                 class="${String(mine || '') === o ? 'on' : ''}"
                 ${ro ? 'disabled' : ''}>${esc(o)}</button>`).join('') + `</div>`;
    } else if (type === 'number'){
      control = `<input class="txt" data-num="${id}" inputmode="numeric"
                 value="${esc(mine || '')}" placeholder="число"
                 ${ro ? 'disabled' : ''}>`;
    } else {
      // Вільний текст. Лишився для сумісності — нових таких питань
      // адмінка більше не створює.
      control = `<input class="txt" data-txt="${id}" value="${esc(mine || '')}"
                 placeholder="назва команди або гравця" ${ro ? 'disabled' : ''}>`;
    }

    // Результат показуємо лише після фіксації і лише коли адмін
    // вніс правильну відповідь.
    let res = '';
    if (ro){
      if (correct == null || correct === ''){
        res = `<div class="res wait">результат ще не внесено</div>`;
      } else {
        const hit = String(mine || '').trim().toLowerCase()
                 === String(correct).trim().toLowerCase();
        res = `<div class="res ${hit ? 'ok' : 'no'}">
                 правильно: ${esc(correct)} · ${hit ? 'влучив' : 'мимо'}
                 ${pts == null ? '' : ' · +' + pts}
               </div>`;
      }
    }

    // Формат очок уніфіковано з MVP/Rivals/Manager Style — голе «+N»,
    // без слів «б»/«оч.» (рішення Богдана 30.07.2026).
    const cost = type === 'yesno'
      ? `YES +${q['очок_за_yes']} · NO +${q['очок_за_no']}`
      : type === 'number'
        ? (q['очок_за_близько'] != null
            ? `точно +${max} · помилка на 1 — +${q['очок_за_близько']}`
            : `+${max} за точне число`)
        : type === 'choice'
          ? `+${max} за правильний вибір`
          : `+${max} за влучну назву`;

    return `<div class="bq${ro ? ' locked' : ''}">
      <div class="q">${q['нове'] ? '<span style="color:var(--gold)">нове · </span>' : ''}${esc(q['питання'])}</div>
      <div class="meta">${cost}</div>
      ${control}
      ${res}
    </div>`;
  }).join('');

  if (openQ.length){
    const some = openQ.length < S.bonus.length;
    html += `<button class="primary" id="b-confirm" style="margin-top:14px">
             ${some ? 'Зафіксувати нові відповіді' : 'Зафіксувати відповіді'}</button>
             <p class="dim" style="margin-top:8px">${some
               ? 'Фіксуються лише відкриті питання. Раніше підтверджені лишаються як є.'
               : 'Після фіксації змінити не вийде.'}</p>`;
  }

  const tieNote = `<div class="card" style="border-left:3px solid var(--gold)">
    <div style="font-size:13px;line-height:1.6;color:var(--text-dim)">
      <b style="color:var(--gold)">Якщо вийде нічия чи кілька переможців:</b>
      у питаннях «хто кращий / хто переможе» є окремий варіант <b>«Нічия»</b> —
      обирай його, якщо думаєш, що буде рівно. А в питаннях «хто набере найбільше»
      серед клубів при рівності <b>правильні всі лідери одразу</b>: вгадав
      будь-кого з них — береш повні бали, бали не діляться.
    </div></div>`;

  $('view').innerHTML = `<div class="card"><h2>Bonus · ${esc(S.stage.title)}</h2></div>` + tieNote + html;

  if (!openQ.length) return;

  // YES / NO
  $('view').querySelectorAll('[data-yn]').forEach(b => {
    b.onclick = async () => {
      const bet = b.dataset.bet, val = b.dataset.yn;
      b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      const { error } = await sb.rpc('save_special_answer', { p_bet: bet, p_answer: val });
      if (error) { alert('Не збереглось: ' + error.message); await viewBonus(); }
      else { const q = S.bonus.find(x => x['питання_id'] === bet); if (q) q['моя_відповідь'] = val; }
    };
  });

  // Вибір зі списку — той самий механізм, що YES/NO
  $('view').querySelectorAll('[data-choice]').forEach(b => {
    b.onclick = async () => {
      const bet = b.dataset.bet, val = b.dataset.choice;
      b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      const { error } = await sb.rpc('save_special_answer', { p_bet: bet, p_answer: val });
      if (error) { alert('Не збереглось: ' + error.message); await viewBonus(); }
      else { const q = S.bonus.find(x => x['питання_id'] === bet); if (q) q['моя_відповідь'] = val; }
    };
  });

  // Число — зберігаємо на втраті фокуса, як і текст.
  // Перевірку дублює база (save_special_answer), тут лише щоб не
  // ходити на сервер із явно кривим значенням.
  $('view').querySelectorAll('[data-num]').forEach(inp => {
    inp.oninput = () => { inp.value = inp.value.replace(/[^\d]/g, ''); };
    inp.onblur = async () => {
      const bet = inp.dataset.num;
      const val = inp.value.trim();
      const q = S.bonus.find(x => x['питання_id'] === bet);
      if (q && String(q['моя_відповідь'] || '') === val) return;
      if (!val) return;
      const { error } = await sb.rpc('save_special_answer', { p_bet: bet, p_answer: val });
      if (error) { alert('Не збереглось: ' + error.message); await viewBonus(); }
      else if (q) q['моя_відповідь'] = val;
    };
  });

  // Текстова відповідь — зберігаємо, коли поле втрачає фокус
  $('view').querySelectorAll('[data-txt]').forEach(inp => {
    inp.onblur = async () => {
      const bet = inp.dataset.txt;
      const val = inp.value.trim();
      const q = S.bonus.find(x => x['питання_id'] === bet);
      if (q && String(q['моя_відповідь'] || '') === val) return;
      if (!val) return;
      const { error } = await sb.rpc('save_special_answer', { p_bet: bet, p_answer: val });
      if (error) { alert('Не збереглось: ' + error.message); await viewBonus(); }
      else if (q) q['моя_відповідь'] = val;
    };
  });

  // Фіксація
  $('b-confirm').onclick = async () => {
    // спершу дозберігаємо те, що в полі, але фокус ще не втрачено
    const act = document.activeElement;
    if (act && act.dataset && (act.dataset.txt || act.dataset.num)) {
      act.blur(); await new Promise(r => setTimeout(r, 250));
    }

    const missing = openQ.filter(q => !String(q['моя_відповідь'] || '').trim());
    const body = openQ.map(q =>
      `<div class="rev-line"><span>${esc(q['питання'])}</span>
       <span class="s">${esc(q['моя_відповідь'] || '—')}</span></div>`
    ).join('') + (missing.length
      ? `<div class="msg err" style="margin-top:12px">Без відповіді: ${missing.length}.
         Ці питання підуть як пропущені. Точно фіксуєш?</div>` : '');

    showModal('Фіксуємо відповіді', body, async () => {
      const { error } = await sb.rpc('confirm_special', { p_month: S.stage.key });
      closeModal();
      if (error) return alert('Не вийшло: ' + error.message);
      await viewBonus();
    });
  };
}

// =====================================================================
//  NEWS & PRESS — авто-новини (файл 117) + пресконференції (файл 118)
//
//  Один екран, два шари. Зверху — «мої питання» (press_prompts, на які
//  я ще можу відповісти); нижче — «стрічка» (press_feed: авто-новини
//  й відповіді всіх учасників разом, за вікендами, найновіше згори).
//  Бек рахує все сам; фронт лише читає в'юху й пише відповідь через
//  save_press_answer. Балів не дає, модерації немає — адмін лише може
//  видалити чужу відповідь (admin_delete_press_answer, id несе
//  press_feed.answer_id з файла 119).
// =====================================================================
const PRESS_SLOT = {
  intro:        'Знайомство',
  pre_shared:   'Спільне питання',
  pre_personal: 'Особисте питання',
  post:         'Після туру',
};

// Скільки невирішених питань показуємо одночасно. Богдан 30.07.2026:
// щоб не завалювати екран — не більше трьох, решта підтягнеться,
// щойно на ці відповіси або пропустиш.
const PRESS_OPEN_LIMIT = 3;
// Порядок слотів у списку: інтро — перше, з чим стикається гравець,
// далі передматчеві (є дедлайн), потім післяматчеві.
const PRESS_SLOT_RANK = { intro: -1, pre_shared: 0, pre_personal: 1, post: 2 };

async function viewPress(){
  const stageId = S.stage.id;

  // Крапка «є оновлення» (файл 147) — стрічка суцільна на весь етап,
  // без чіпів по вікендах, тож гасимо одразу при вході на вкладку.
  if (S.stageDots && S.stageDots.press_new) {
    S.stageDots.press_new = false;
    renderTabs();
  }
  sb.rpc('mark_seen', { p_tournament: stageId, p_gameweek: null, p_kind: 'press' }).then(() => {}, () => {});

  const [prRes, ansRes, skipRes, feedRes, rolloutRes, ivRes, stmtRes] = await Promise.all([
    sb.from('press_prompts').select('*').eq('tournament_id', stageId).order('created_at'),
    sb.from('press_answers').select('*').eq('participant_id', S.me.participant_id),
    sb.from('press_prompt_skips').select('*').eq('participant_id', S.me.participant_id),
    sb.from('press_feed').select('*').eq('tournament_id', stageId).order('created_at', { ascending: false }),
    sb.rpc('press_rollout_active', { p_tournament: stageId }),
    sb.from('press_interviewers').select('code,title'),
    sb.from('press_statement_feed').select('*').eq('tournament_id', stageId).order('created_at'),
  ]);

  const prompts = prRes.data || [];
  const myAns   = ansRes.data || [];
  const mySkips = skipRes.data || [];
  const feed    = feedRes.data || [];
  const statements = stmtRes.data || [];
  const rolloutActive = !!rolloutRes.data;
  const interviewers = new Map((ivRes.data || []).map(iv => [iv.code, iv.title]));
  const interviewerName = (code) => interviewers.get(code) || code;

  // Адаптивний ліміт (Богдан 31.07.2026, «балансуй»): хто НЕ жме жодної
  // кнопки поспіль (реальний ігнор, не «не хочу відповідати») — тому
  // менше питань одночасно; щойно почав реагувати — знову база.
  const myPressHistory = feed.filter(it => it.item_type === 'press' && it.author_id === S.me.participant_id);
  let ignoredStreak = 0;
  for (const it of myPressHistory){
    if (it.status === 'ignored') ignoredStreak++;
    else break;
  }
  const openLimit = ignoredStreak >= 3 ? 2 : PRESS_OPEN_LIMIT;

  const gwTitle = (id) => {
    const g = S.gameweeks.find(x => x.gameweek_id === id);
    return g ? (g.title || ('Вікенд ' + g.number)) : 'Вікенд';
  };
  const gwNum = (id) => {
    const g = S.gameweeks.find(x => x.gameweek_id === id);
    return g ? g.number : 0;
  };

  const isAnswered = (id) => myAns.some(a => a.prompt_id === id);
  const isSkipped  = (id) => mySkips.some(s => s.prompt_id === id);

  // Невирішені мої питання: спільні (participant_id null) + мої персональні,
  // без тих, на які вже відповів або які пропустив. Сортуємо за слотом
  // (передматчеві першими), потім за свіжістю вікенда.
  const openMine = prompts
    .filter(p => (p.participant_id == null || p.participant_id === S.me.participant_id)
              && !isAnswered(p.id) && !isSkipped(p.id))
    .sort((a, b) => (PRESS_SLOT_RANK[a.slot] - PRESS_SLOT_RANK[b.slot])
                 || (gwNum(b.gameweek_id) - gwNum(a.gameweek_id)));
  const shown  = openMine.slice(0, openLimit);
  const hidden = openMine.length - shown.length;

  // Крапка «є питання від репортера, на яке ще не відповів» (файл 147,
  // press_todo). Рахуємо тут з уже завантажених питань — так дот
  // оновлюється одразу після відповіді/скіпу (обидва кличуть viewPress),
  // а не лише при перезаході на етап. Гасне дією (відповів або пропустив),
  // не переглядом — як bonus/predictions todo.
  const pressTodo = openMine.length > 0;
  if (S.stageDots && S.stageDots.press_todo !== pressTodo) {
    S.stageDots.press_todo = pressTodo;
    renderTabs();
  }

  let html = `<div class="card"><h2>News & Press · ${esc(S.stage.title)}</h2>
    <p class="dim">Новини рахуються автоматично після кожного вікенда. Пресконференції —
    добровільні, балів не дають.</p>
    <p class="dim">Питання від репортерів приходять у три моменти: <b>знайомство</b> —
    коли заходиш у етап; <b>після прогнозів</b> — щойно підтвердиш свій вибір на вікенд;
    <b>після результатів</b> — коли підбито підсумки зіграного вікенда.</p></div>`;

  // ---------- 1. Стрічка (завжди згори) ----------
  const rolloutNote = rolloutActive
    ? `<p class="press-note">🟢 новини цього вікенда ще виходять — заходь протягом години</p>`
    : '';
  if (!feed.length && !statements.length){
    html += `<div class="card"><h2>Стрічка</h2>${rolloutNote}
      <p class="dim">Поки порожня — новини зʼявляться, щойно завершиться перший вікенд етапу,
      а відповіді пресконференцій — щойно хтось відповість.</p></div>`;
  } else {
    // Заяви репортерів (файл 137): топ-заяви + вкладені реакції-нитки.
    // Реакції групуємо під батьком; топ-заяви йдуть у стрічку нарівні
    // з новинами/питаннями, за часом.
    const reactionsByParent = new Map();
    for (const s of statements){
      if (!s.parent_id) continue;
      if (!reactionsByParent.has(s.parent_id)) reactionsByParent.set(s.parent_id, []);
      reactionsByParent.get(s.parent_id).push(s);
    }

    // Єдина стрічка: press_feed (news/press) + топ-заяви. Кожен елемент
    // з міткою kind, сортуємо разом за часом усередині вікенда.
    const groups = new Map();
    const push = (gid, item) => {
      if (!groups.has(gid)) groups.set(gid, []);
      groups.get(gid).push(item);
    };
    for (const it of feed) push(it.gameweek_id, { kind: 'feed', at: it.created_at, it });
    for (const s of statements){
      if (s.parent_id) continue;
      push(s.gameweek_id, { kind: 'statement', at: s.created_at, it: s });
    }
    const gwIds = [...groups.keys()].sort((a, b) => gwNum(b) - gwNum(a));

    const renderStatementLine = (s, extraClass = '') =>
      `<div class="stmt-line${extraClass}"><span class="who">🎤 ${esc(interviewerName(s.interviewer_code))}</span>: ${esc(s.body)}</div>`;

    html += `<div class="card"><h2>Стрічка</h2>${rolloutNote}` + gwIds.map(gid => {
      const items = groups.get(gid).sort((a, b) =>
        (new Date(b.at) - new Date(a.at)));
      const rows = items.map(row => {
        if (row.kind === 'statement'){
          const s = row.it;
          const reacts = (reactionsByParent.get(s.statement_id) || [])
            .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
            .map(r => renderStatementLine(r, ' reaction')).join('');
          return `<div class="feed-item statement">${renderStatementLine(s)}${reacts}</div>`;
        }
        const it = row.it;
        const isPress = it.item_type === 'press';
        if (!isPress){
          return `<div class="feed-item news"><div class="body">${esc(it.body)}</div></div>`;
        }
        const del = (S.me.is_admin && it.answer_id)
          ? `<button class="del" data-del="${it.answer_id}" title="видалити відповідь">✕</button>`
          : '';
        const statusClass = it.status ? ` status-${it.status}` : '';
        // Два рядки: бейдж-репортер + питання / ім'я друга + відповідь
        // (чи статус). Спільний груповий ігнор («не відповіли: X, Y») уже
        // містить усі імена в player_line — там ім'я не додублюємо.
        const repBadge = it.interviewer_code
          ? `<span class="rep">🎤 ${esc(interviewerName(it.interviewer_code))}</span>` : '';
        const line1 = `<div class="q">${repBadge}<span class="qtext">${esc(it.question || it.body)}</span></div>`;
        const isGroupIgnore = it.status === 'ignored' && it.author_id == null;
        const line2 = it.player_line
          ? (isGroupIgnore
              ? `<div class="a"><span class="qtext">${esc(it.player_line)}</span>${del}</div>`
              : `<div class="a"><span class="who">${esc(it.author_name || '')}:</span><span class="qtext">${esc(it.player_line)}</span>${del}</div>`)
          : '';
        return `<div class="feed-item press${statusClass}">${line1}${line2}</div>`;
      }).join('');
      return `<div class="gw-group"><h3>${esc(gwTitle(gid))}</h3>${rows}</div>`;
    }).join('') + `</div>`;
  }

  // ---------- 2. Твої питання (нижче, максимум openLimit) ----------
  if (shown.length){
    html += `<div class="card"><h2>Твої питання</h2>
      <div class="press-note">Пиши що хочеш — вільним текстом. Натиснеш «Відповісти» —
      відповідь одразу зʼявиться у стрічці вгорі, її бачитимуть усі. Не хочеш відповідати —
      «Не хочу відповідати» (це теж буде видно всім).${hidden > 0 ? ` Ще ${ptsQ(hidden)} — підтягнуться, коли розберешся з цими.` : ''}</div>` +
      shown.map(p => {
        const icLine = p.interviewer_code
          ? `<div class="interviewer">🎤 ${esc(interviewerName(p.interviewer_code))}</div>` : '';
        return `
        <div class="press-q" data-pwrap="${p.id}">
          <div class="slot">${esc(PRESS_SLOT[p.slot] || p.slot)} · ${esc(gwTitle(p.gameweek_id))}</div>
          ${icLine}
          <div class="q">${esc(p.body)}</div>
          <textarea data-prompt="${p.id}" rows="2" placeholder="пиши що хочеш…"></textarea>
          <div class="btns">
            <button class="confirm" data-confirm="${p.id}">Відповісти</button>
            <button class="skip" data-skip="${p.id}">Не хочу відповідати</button>
          </div>
          <div class="saved" data-saved="${p.id}"></div>
        </div>`;
      }).join('') + `</div>`;
  }

  $('view').innerHTML = html;

  const setNote = (id, txt, color) => {
    const n = $('view').querySelector(`[data-saved="${id}"]`);
    if (n){ n.textContent = txt; n.style.color = color; }
  };

  // Підтвердити: зберегти відповідь → вона летить у стрічку, список
  // перемальовується (питання зникає, підтягується наступне).
  $('view').querySelectorAll('[data-confirm]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.confirm;
      const ta = $('view').querySelector(`[data-prompt="${id}"]`);
      const val = (ta ? ta.value : '').trim();
      if (!val){ setNote(id, 'напиши відповідь або натисни «Пропустити»', 'var(--red)'); return; }
      btn.disabled = true;
      const { error } = await sb.rpc('save_press_answer', { p_prompt: id, p_body: val });
      if (error){ btn.disabled = false; setNote(id, 'не збереглось: ' + error.message, 'var(--red)'); return; }
      await viewPress();
    };
  });

  // Пропустити: позначаємо пропуск, питання зникає зі списку.
  $('view').querySelectorAll('[data-skip]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.skip;
      btn.disabled = true;
      const { error } = await sb.rpc('skip_press_prompt', { p_prompt: id });
      if (error){ btn.disabled = false; setNote(id, 'не вийшло: ' + error.message, 'var(--red)'); return; }
      await viewPress();
    };
  });

  // Адмін: видалення чужої відповіді зі стрічки.
  $('view').querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Видалити цю відповідь зі стрічки?')) return;
      const { error } = await sb.rpc('admin_delete_press_answer', { p_answer: btn.dataset.del });
      if (error) return alert('Не вийшло: ' + error.message);
      await viewPress();
    };
  });
}

// «1 питання / 2 питання / 5 питань» — відмінок для лічильника прихованих.
function ptsQ(n){
  const a = n % 100, b = a % 10;
  if (a > 10 && a < 20) return `${n} питань`;
  if (b === 1) return `${n} питання`;
  if (b >= 2 && b <= 4) return `${n} питання`;
  return `${n} питань`;
}

      <input type="text" id="r-name" placeholder="ім'я, як у таблиці" style="${AINP};margin-bottom:10px">
      <div class="boost-row" style="margin-bottom:10px">
        ${STAGES.filter(s => !s.bonusOnly).map(s => `<label class="boost-chip" style="cursor:pointer">
          <input type="checkbox" data-rstage="${s.key}" ${s.key === S.stage.key ? 'checked' : ''}
            style="margin-right:6px;vertical-align:middle">${esc(s.title)}</label>`).join('')}
      </div>
      <label class="dim" style="display:block;margin-bottom:10px;font-size:14px;cursor:pointer">

      <button class="ghost" id="btn-radd" style="width:100%">Додати в склад</button>
      <div id="radd-result"></div>
    </div>

  await renderAdminWeeks();
  await renderAdminUnconfirm();
  await renderAdminRename();
  await renderAdminBackup();
  await renderAdminBonus();
  await renderAdminRoster();

  if (hasGw) {
    $('view').querySelectorAll('[data-agw]').forEach(b => b.onclick = () => {
      S.gw = S.gameweeks.find(g => g.gameweek_id === b.dataset.agw);
      go('admin');
    });

    $('btn-results').onclick = async () => {
      const results = [];
      $('view').querySelectorAll('[data-am]').forEach(card => {
        const h = card.querySelector('.rs-h').value;
        const a = card.querySelector('.rs-a').value;
        if (h !== '' && a !== '') {
          results.push({ match_id: card.dataset.am, home: Number(h), away: Number(a) });
        }
      });
      if (!results.length) return alert('Нема що зберігати');
      const { error } = await sb.rpc('admin_save_results', {
        p_gameweek: S.gw.gameweek_id, p_results: results
      });
      if (error) return alert('Помилка: ' + error.message);
      alert(`Збережено ${results.length}. Бали перераховано.`);
      go('admin');
    };

    // Напівавтомат: показати зібрані автоматом рахунки (staging, файл 152)
    // і дати підтвердити одним кліком — той самий шлях, що email-кнопка.
    $('btn-pull-scores').onclick = async () => {
      const box = $('staged-box');
      box.innerHTML = '<div class="dim">читаю…</div>';
      const { data, error } = await sb.from('admin_staged_scores')
        .select('*').eq('month', S.stage.key);
      if (error) { box.innerHTML = `<div class="msg err">Помилка: ${esc(error.message)}</div>`; return; }
      if (!data || !data.length) {
        box.innerHTML = '<div class="dim">Зібраних рахунків поки немає — автомат нічого не підтягнув.</div>';
        return;
      }
      box.innerHTML =
        `<div class="msg ok" style="margin-bottom:8px">Автомат зібрав рахунки (${data.length}) — перевір і підтверди:</div>`
        + data.map(s => `<div style="padding:4px 0">${esc(s.home_team)}
             <b class="mono">${s.home_score}:${s.away_score}</b> ${esc(s.away_team)}
             <span class="dim">· ${esc(s.gameweek)}</span></div>`).join('')
        + `<button class="primary" id="btn-confirm-scores" style="width:100%;margin-top:10px">
             Підтвердити внесення (${data.length})</button>`;
      $('btn-confirm-scores').onclick = async () => {
        const res = await adminRpc('confirm_staged_scores', { p_month: S.stage.key });
        if (res === null) return;
        alert(`Внесено ${res.written ?? 0}. Бали перераховано.`);
        go('admin');
      };
    };

  }

  // тип питання перемикає підписи балів і показує потрібні поля
  $('q-type').onchange = () => {
    const t = $('q-type').value;
    $('q-pts-label').textContent =
      t === 'yesno'  ? 'Балів за правильний YES' :
      t === 'number' ? 'Балів за точне число'    : 'Балів за правильний вибір';
    $('q-no-row').style.display   = t === 'yesno'  ? '' : 'none';
    $('q-opts-row').style.display = t === 'choice' ? '' : 'none';
    $('q-near-row').style.display = t === 'number' ? '' : 'none';
    $('q-win-row').style.display  = t === 'number' ? '' : 'none';
    $('q-pts').value = 3;
  };

  $('btn-qadd').onclick = async () => {
    const q = $('q-text').value.trim();
    if (!q) return alert('Текст питання порожній');
    const type = $('q-type').value;
    const pts  = Number($('q-pts').value);
    if (!pts) return alert('Вкажи очки');

    const ptsNo = type === 'yesno' ? Number($('q-ptsno').value) : null;

    let opts = null;
    if (type === 'choice'){
      opts = $('q-opts').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (opts.length < 2) return alert('Потрібно щонайменше два варіанти, по одному на рядок');
      const dup = new Set(opts.map(s => s.toLowerCase()));
      if (dup.size !== opts.length) return alert('Варіанти повторюються');
    }

    // Порожнє поле = тільки точна відповідь. Нуль — це теж «тільки
    // точно», просто записаний інакше, тому зводимо до null.
    let near = null, win = 1;
    if (type === 'number'){
      const raw = $('q-near').value.trim();
      near = raw === '' || Number(raw) === 0 ? null : Number(raw);
      win  = Math.min(10, Math.max(1, Number($('q-win').value) || 1));
    }

    const what =
      type === 'yesno'  ? `YES ${pts} / NO ${ptsNo}` :
      type === 'choice' ? `вибір: ${opts.join(' / ')} — ${pts} б` :
                          `число, ${pts} б${near != null
                            ? `, промах до ±${win} — ${near} б` : ' (тільки точно)'}`;
    if (!confirm(`Додати в «${S.stage.title}» питання:\n${q}\n${what}`)) return;

    const { data, error } = await sb.rpc('admin_bonus_add', {
      p_month: S.stage.key, p_question: q, p_type: type,
      p_points: pts, p_points_no: ptsNo, p_options: opts,
      p_near: near, p_window: win
    });
    if (error) return alert('Помилка: ' + error.message);
    $('qadd-result').innerHTML = `<div class="msg ok" style="margin-top:12px">${esc(data)}</div>`;
    $('q-text').value = '';
    $('q-opts').value = '';
    await renderAdminBonus();
  };

  $('btn-radd').onclick = async () => {
    const mail = $('r-mail').value.trim();
    const name = $('r-name').value.trim();
    const asAdmin = $('r-admin').checked;
    const stages = [...$('view').querySelectorAll('[data-rstage]')]
      .filter(c => c.checked).map(c => c.dataset.rstage);

    if (!mail) return alert('Потрібна пошта');
    if (!name) return alert('Потрібне ім\'я');
    if (!stages.length) return alert('Познач хоча б один етап');

    const titles = stages.map(k => (STAGES.find(s => s.key === k) || {}).title || k);
    if (!confirm(`Додати ${name} (${mail})\nв етапи: ${titles.join(', ')}${
      asAdmin ? '\nз правами адміна' : ''}?`)) return;

    const out = [];
    for (const k of stages) {
      const { data, error } = await sb.rpc('roster_add_stage', {
        p_email: mail, p_name: name, p_stage: k, p_admin: asAdmin
      });
      out.push(error ? `⚠ ${k}: ${error.message}` : data);
    }
    $('radd-result').innerHTML = out.map(t =>
      `<div class="msg ${t.startsWith('⚠') ? 'err' : 'ok'}" style="margin-top:10px">${esc(t)}</div>`).join('');
    $('r-mail').value = ''; $('r-name').value = '';
    await renderAdminRoster();
  };
}

// ---------------------------------------------------------------------
//  Резервна копія: RPC віддає JSON, браузер зберігає його файлом
// ---------------------------------------------------------------------
async function renderAdminBackup(){
  if (!$('btn-backup')) return;
  $('btn-backup').onclick = async () => {
    $('backup-result').innerHTML = '<p class="dim" style="margin-top:10px">Збираю…</p>';
    const { data, error } = await sb.rpc('backup_json');
    if (error) {
      $('backup-result').innerHTML =
        `<div class="msg err" style="margin-top:12px">${esc(error.message)}</div>`;
      return;
    }
    const text = JSON.stringify(data, null, 1);
    const name = 'bobet-' + new Date().toISOString().slice(0, 10) + '.json';
    const url  = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    $('backup-result').innerHTML =
      `<div class="msg ok" style="margin-top:12px">Збережено: ${esc(name)} ·
       ${Math.round(text.length / 1024)} КБ</div>`;
  };
}
