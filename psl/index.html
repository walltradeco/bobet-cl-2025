<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSuper League — архів турнірів BoOrbit</title>

<link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
<!-- ⚠️ Типографіка PSL НАВМИСНО не збігається з BoBet. Там Montserrat +
     Onest + IBM Plex Mono; тут заголовки Clash Display, текст Satoshi,
     цифри JetBrains Mono. Жодного спільного шрифту, крім перемикача ліг
     нижче — він належить BoOrbit, а не лізі. -->
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=clash-display@600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<!-- ⚠️ Montserrat потрібен РІВНО для перемикача ліг. Він належить BoOrbit,
     а не лізі, тому має виглядати на обох сторінках однаково — а BoBet
     набраний саме Montserrat. Решта сторінки — Satoshi. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
/* ── Палітра PSuper League ─────────────────────────────────────────────
   Синя, задана Богданом 10.08.2026, і вона НАВМИСНО не схожа на зелену
   BoBet: перемикання ліги має читатись оком одразу, ще до того, як
   людина прочитає заголовок. */
:root{
  --bg:#0F172A; --panel:#14243F; --panel2:#1B3358; --line:#24476F;
  --blue:#0077CC; --sky:#0EA5E9; --deep:#004A80;
  --white:#FFFFFF; --grey:#F8FAFC; --muted:#8FA9C4;
  --gold:#F5C542; --silver:#C6D3E2; --bronze:#C98B4B; --red:#E4707A;
  --f-body:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-head:'Clash Display','Satoshi',-apple-system,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--grey);
  font-family:var(--f-body);
  font-size:16.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1560px; margin:0 auto; padding:0 16px 84px;}
a{color:var(--sky); text-decoration:none;}

/* ── шапка ─────────────────────────────────────────────────────────
   ⚠️ УСІ значення нижче списані з `test.html` (BoBet) один в один.
   Логотип і перемикач належать BoOrbit, а не лізі, тож при перемиканні
   вони НЕ ПОВИННІ ані стрибати в розмірі, ані міняти шрифт. Раніше
   логотип був 460 проти 500, відступи й падінги кнопок різні, а напис
   набраний Satoshi замість Montserrat — і перехід було видно оком. */
.boorbit-mark{display:flex; justify-content:center; padding:22px 16px 6px;}
.boorbit-mark img{width:100%; max-width:500px; height:auto; display:block;}

/* Перемикач ліг. ⚠️ Напис має збігатися зі сторінкою BoBet слово в
   слово І РЕГІСТРОМ: там «BoBet» стоїть капсом із розрядкою, а
   «PSuper League» — звичайним написанням. Інакше перемикач видно як
   дві різні кнопки, хоч це той самий елемент. */
.league-switch{display:flex; justify-content:center; padding:0 16px 20px;}
.league-track{
  position:relative; display:flex; width:100%; max-width:340px;
  border:1px solid var(--line); border-radius:24px;
  background:var(--panel); padding:3px;
}
.league-thumb{
  position:absolute; top:3px; bottom:3px; right:3px;
  width:calc(50% - 3px); background:var(--blue); border-radius:20px;
}
.league-opt{
  position:relative; flex:1 1 0; z-index:1;
  font-family:'Montserrat',sans-serif; font-size:13px; font-weight:700;
  text-transform:uppercase; letter-spacing:0.03em;
  padding:8px 12px; border:0; background:transparent; cursor:pointer;
  color:var(--muted); border-radius:20px; text-align:center; white-space:nowrap;
}
.league-opt.active{color:#fff; cursor:default; text-transform:none;}
.league-opt:not(.active):hover{color:#fff;}

.masthead{text-align:center; padding:4px 0 26px;}
.masthead .tag{
  font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--sky); margin:0 0 6px;
}
/* Заголовок показує, ДЕ ти зараз (SEASON 2, ЗАЛА СЛАВИ) — так само, як у
   BoBet там стоїть назва відкритого турніру. Статичного «Архіву турнірів»
   тут немає свідомо: Богдан сказав, що такої термінології в лізі не вживають. */
.masthead h1{
  font-family:var(--f-head); font-size:40px; font-weight:700; margin:0 0 8px;
  letter-spacing:.01em; color:#fff; text-transform:uppercase;
}
.masthead p{margin:0; color:var(--muted); font-size:15.5px;}

/* ── навігація ────────────────────────────────────────────────────── */
.nav{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px;}
.nav button{
  font-family:inherit; font-size:15.5px; font-weight:700;
  padding:11px 22px; border-radius:24px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--muted);
}
.nav button:hover{border-color:var(--blue); color:var(--grey);}
.nav button.on{background:var(--blue); border-color:var(--blue); color:#fff;}
.nav button.hof{border-color:var(--deep); color:var(--gold);}
.nav button.hof.on{background:var(--deep); border-color:var(--gold); color:var(--gold);}
.nav.sub button{font-size:14.5px; padding:9px 18px; font-weight:500;}
.nav.sub button.on{background:var(--deep); border-color:var(--sky); color:#fff; font-weight:700;}
.nav-sep{height:18px;}

/* ── панелі ───────────────────────────────────────────────────────── */
.panel{
  background:var(--panel); border:1px solid var(--line);
  border-radius:18px; padding:22px 24px; margin-bottom:22px;
}
.panel > h2{
  font-family:var(--f-head);
  margin:0 0 18px; font-size:17.5px; font-weight:700; color:#fff;
  letter-spacing:.04em; text-transform:uppercase;
}
.panel > h2 span{color:var(--muted); font-weight:500; text-transform:none; letter-spacing:0;}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}

/* ── таблиці ──────────────────────────────────────────────────────── */
table{border-collapse:collapse; width:100%;}
/* Цифри — окремим моношрифтом: колонки в таблицях стають рівними самі
   собою, і це ще одна межа між PSL і BoBet, де числа набрані IBM Plex. */
td{font-family:var(--f-num); font-variant-numeric:tabular-nums;}
td.name, th.name, tbody th{font-family:var(--f-body);}
th,td{padding:11px 12px; text-align:center; white-space:nowrap;}
thead th{
  font-size:12px; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:.06em;
  border-bottom:1px solid var(--line);
}
tbody tr{border-bottom:1px solid rgba(36,71,111,.45);}
tbody tr:last-child{border-bottom:0;}
tbody tr:hover{background:rgba(14,165,233,.06);}
td.name,th.name{text-align:left;}
.pos{font-weight:700; color:var(--muted); width:34px;}
.pos.p1{color:var(--gold);} .pos.p2{color:var(--silver);} .pos.p3{color:var(--bronze);}
.pts{font-weight:900; color:#fff;}
.gd.plus{color:var(--sky);} .gd.minus{color:var(--muted);}

/* Таблиця тягнеться на всю ширину: імена займають фіксовану частку,
   решту цифрові колонки ділять порівну — інакше вони збиваються
   докупи, а праворуч лишається порожньо. */
.standings{table-layout:fixed;}
.standings th,.standings td{padding:14px 8px; font-size:16px;}
.standings col.c-pos{width:54px;}
.standings col.c-name{width:22%;}
.standings col.c-num{width:auto;}
.standings thead th{font-size:11.5px; letter-spacing:.04em;}

/* ── ім'я гравця ──────────────────────────────────────────────────── */
.who{
  display:inline-flex; align-items:center; gap:8px;
  cursor:pointer; border:0; background:0; padding:0;
  font-family:inherit; font-size:15.5px; font-weight:700; color:var(--grey);
  border-bottom:1px dashed rgba(143,169,196,.5); max-width:100%;
}
.who:hover{color:#fff; border-bottom-color:var(--sky);}
.who span{overflow:hidden; text-overflow:ellipsis;}

/* ⚠️ Плашки під емблемами БІЛЬШЕ НЕМАЄ — і це наслідок зміни джерела.
   Логотипи з гугл-таблиці були різної яскравості й темні на темному
   фоні зникали (у Ювентуса середня яскравість 0), через що доводилось
   підкладати світле коло. Версії з api-football намальовані під темний
   фон — у Ювентуса, Тоттенгема, Наполі й Аякса білі елементи, — тож
   підкладка стала непотрібною. Повертати її не треба. */
.emb{width:26px; height:26px; object-fit:contain; flex:none;}
.emb.flag{font-size:21px; line-height:26px; text-align:center;}
.emb.big{width:46px; height:46px;}
.emb.big.flag{font-size:38px; line-height:46px;}
/* Прапор прямокутний: трохи вужчий і з легкою рамкою, щоб світлі смуги
   (Аргентина, Англія) не зливались із фоном. */
.emb.fl{
  width:30px; height:22px; object-fit:cover; border-radius:3px;
  outline:1px solid rgba(255,255,255,.16); outline-offset:-1px;
}
.emb.fl.big{width:52px; height:38px;}

/* ── іконки нагород (Noto Emoji, Apache 2.0) ──────────────────────── */
.ic{width:24px; height:24px; flex:none; vertical-align:-5px;}
.ic.lg{width:30px; height:30px; vertical-align:-7px;}
.ic.xl{width:40px; height:40px;}

/* ── крос-таблиця ─────────────────────────────────────────────────── */
.cross th,.cross td{padding:8px 11px; font-size:14.5px;}
.cross tbody th{
  text-align:left; font-weight:700; color:var(--grey);
  position:sticky; left:0; background:var(--panel); z-index:1;
  border-right:1px solid var(--line);
}
.cross td.self{background:rgba(36,71,111,.35);}
.cross td b{color:#fff; font-weight:700;}
.cross td s{color:var(--muted); text-decoration:none;}
.cross .leg{display:block; font-size:13.5px;}

/* ── кубкова сітка ────────────────────────────────────────────────── */
.rounds{display:flex; gap:14px; align-items:flex-start; min-width:min-content;}
.round{flex:1 1 0; min-width:240px;}
.round h3{
  font-family:var(--f-head);
  margin:0 0 12px; font-size:12.5px; font-weight:700; color:var(--sky);
  text-transform:uppercase; letter-spacing:.1em; text-align:center;
}
.tie{background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin-bottom:12px;}
.tie-row{display:flex; align-items:center; gap:8px; padding:3px 0;}
.tie-row .who{font-size:14.5px; border:0; flex:1 1 auto; min-width:0;}
/* ⚠️ Дві гри пари — це ДВА СТОВПЧИКИ, які читаються згори вниз, а не
   рахунок «3 · 4». Крапка між ними саме це й підказувала неправильно:
   у півфіналі «4 · 4» виглядало як нічия, хоча це два різні матчі,
   4:1 і 4:5. Тепер між ногами стоїть вертикальна риска, спільна на
   обидва рядки, і колонки вирівняні по ширині. */
.legs{display:inline-flex; color:var(--muted); font-size:14px; font-family:var(--f-num);}
.legs .lg{min-width:15px; text-align:center;}
.legs .lg + .lg{border-left:1px solid rgba(143,169,196,.32); margin-left:7px; padding-left:7px;}
.agg{font-family:var(--f-num); font-weight:800; font-size:17px; color:#fff; min-width:24px; text-align:right;}
.tie-row.lost .who{color:var(--muted); font-weight:500;}
.tie-row.lost .agg{color:var(--muted); font-weight:700;}
.tie-row.won .agg{color:var(--sky);}
.tie.single{background:linear-gradient(180deg,rgba(0,119,204,.22),rgba(0,74,128,.12));}

/* ── нагороди ─────────────────────────────────────────────────────── */
.awards{display:grid; grid-template-columns:repeat(auto-fill,minmax(262px,1fr)); gap:14px;}
.award{
  background:var(--panel2); border:1px solid var(--line); border-radius:14px;
  padding:17px 19px; display:flex; align-items:center; gap:15px;
}
.award .ico{font-size:26px; line-height:1; flex:none;}
.award .t{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em;}
.award .v{font-family:var(--f-head); font-size:20px; font-weight:600; color:#fff; margin-top:3px;}
.award .sub{font-size:13px; color:var(--muted); margin-top:2px;}
.award.gold{border-color:rgba(245,197,66,.5);}
.award.aim{border-color:rgba(14,165,233,.45);}

/* ── зала слави ─────────────────────────────────────────────────────
   Вітрина — головний екран Зали слави, тому масштаб у неї такий самий,
   як у турнірних таблиць, а не дрібніший. */
.shelf{border-bottom:1px solid rgba(36,71,111,.45); padding:21px 0; display:flex; gap:20px; align-items:center;}
.shelf:last-child{border-bottom:0;}
.shelf .nm{font-family:var(--f-head); width:186px; flex:none; font-weight:700; color:#fff; font-size:22px;}
.shelf .nm small{display:block; font-weight:500; color:var(--muted); font-size:13.5px; margin-top:4px;}
.medals{display:flex; flex-wrap:wrap; gap:9px;}
.medal{
  background:var(--panel2); border:1px solid var(--line); border-radius:22px;
  padding:9px 17px 9px 11px; font-size:15px; color:var(--grey); white-space:nowrap;
  display:inline-flex; align-items:center; gap:8px;
}
.medal b{font-weight:700;}
.medal small{color:var(--muted); font-size:13.5px;}
.medal.g1{border-color:rgba(245,197,66,.45); background:linear-gradient(180deg,rgba(245,197,66,.10),transparent);}
.medal.aim{border-color:rgba(14,165,233,.4);}
.h2h td{font-size:13.5px; padding:8px 10px;}
.h2h tbody th{text-align:left; position:sticky; left:0; background:var(--panel); font-weight:700; color:var(--grey); border-right:1px solid var(--line); font-size:14.5px;}
.h2h .bal{font-weight:700;} .h2h .bal.w{color:var(--sky);} .h2h .bal.l{color:var(--red);} .h2h .bal.e{color:var(--muted);}
.h2h .n{display:block; font-size:11.5px; color:var(--muted);}

/* ── картка гравця ────────────────────────────────────────────────── */
.pcard-head{display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
.pcard-head h2{font-family:var(--f-head); margin:0; font-size:30px; font-weight:700; color:#fff; text-transform:none; letter-spacing:-.01em;}
.chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip{background:var(--panel2); border:1px solid var(--line); border-radius:20px;
  padding:7px 14px; font-size:14px; color:var(--muted); display:inline-flex; align-items:center; gap:7px;}
.chip b{color:#fff; font-weight:700;}
.back{font-family:inherit; font-size:13px; font-weight:700; color:var(--muted); background:0; border:0; cursor:pointer; padding:0 0 12px;}
.back:hover{color:var(--sky);}
.res{font-weight:900; width:22px; display:inline-block;}
.res.W{color:var(--sky);} .res.D{color:var(--muted);} .res.L{color:var(--red);}
.score{font-family:var(--f-num); font-weight:800; color:#fff;}

/* Підказка «клік на ім'я» була дрібним сірим рядком, який ніхто не читав,
   тож і про картки гравців ніхто не дізнавався. Тепер це помітний блок. */
.note{color:var(--muted); font-size:15px; margin:14px 2px 0;}
.hint{
  display:flex; align-items:center; gap:10px; margin-top:14px;
  background:rgba(14,165,233,.10); border:1px solid rgba(14,165,233,.32);
  border-radius:12px; padding:13px 16px; font-size:15.5px; color:var(--grey);
}
.hint b{color:#fff;}
.hint .k{
  background:var(--panel2); border:1px solid var(--line); border-radius:6px;
  padding:2px 8px; font-size:13px; color:var(--sky); font-weight:700; white-space:nowrap;
}
.stage-badge{
  position:fixed; right:10px; bottom:10px; z-index:99;
  background:#B4232F; color:#fff; font-size:11px; font-weight:700;
  padding:5px 10px; border-radius:6px; letter-spacing:.08em;
}
@media (max-width:640px){
  .boorbit-mark{padding:14px 12px 2px;}
  .boorbit-mark img{max-width:280px;}
  .league-switch{padding:0 12px 14px;}
  .league-opt{font-size:12px; padding:7px 8px;}
  .masthead h1{font-size:25px;}
  .standings col.c-name{width:38%;}
  .shelf{flex-direction:column; gap:10px; align-items:flex-start;}
  .shelf .nm{width:auto;}
}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Роутер на хеші: #s2/cup, #s3/awards, #hof/h2h, #s1/liga/p/Ілля
   ═══════════════════════════════════════════════════════════════════ */
const S = PSL_DATA.seasons;
const EMB = PSL_DATA.emblems || {};
const FLAGS = PSL_DATA.flags || {};
const HONORS = PSL_DATA.honors || [];

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* Позначка гравця: емблема клубу або емодзі-прапор. Імен у кубкових
   сітках немає взагалі, тож позначка — єдине, що там було.
   ⚠️ Клуб НЕ закріплений за людиною назавжди (Арсенал: Микита у S2,
   Євген у S3), тому позначка завжди береться в межах СЕЗОНУ. */
function embHTML(season, name, big){
  const s = (season.sign || {})[name] || {};
  const cls = 'emb' + (big ? ' big' : '');
  /* Прапор збірної — намальованою іконкою, а не системним емодзі й не
     картинкою з таблиці: інакше на Windows і Android він виглядав би
     інакше за все решту. ⚠️ У Season 1 прапори лежать саме КАРТИНКАМИ,
     тому перевірка на 'fl' має стояти ПЕРЕД перевіркою на img. */
  if (s.fl && FLAGS[s.fl]) return `<img class="${cls} fl" src="${FLAGS[s.fl]}" alt="">`;
  if (s.img && EMB[s.img]) return `<img class="${cls}" src="${EMB[s.img]}" alt="">`;
  if (s.flag) return `<span class="${cls} flag">${s.flag}</span>`;
  return `<span class="${cls}"></span>`;
}
function whoHTML(season, name, big){
  return `<button class="who" data-p="${esc(name)}">${embHTML(season, name, big)}<span>${esc(name)}</span></button>`;
}

/* ── таблиця з матчів ────────────────────────────────────────────────
   ⚠️ Рахуємо САМІ, а не беремо готові цифри з гугл-таблиці: у Season 3
   формула підсумку обірвана (`Технічний!I4` = C1 замість C1:C11) і дає
   Вадиму 38 пропущених замість 68. Порядок місць лишаємо гуглівський —
   у ньому вже враховані тайбрейки (S3: Олександр і Гурген по 28). */
function standings(season){
  const t = {};
  season.players.forEach(p => t[p] = {p, m:0, w:0, d:0, l:0, gf:0, ga:0});
  season.matches.forEach(x => {
    [[x.a, x.ga, x.gb], [x.b, x.gb, x.ga]].forEach(([who, gf, ga]) => {
      const r = t[who];
      r.m++; r.gf += gf; r.ga += ga;
      if (gf > ga) r.w++; else if (gf === ga) r.d++; else r.l++;
    });
  });
  return season.players.map(p => {
    const r = t[p];
    return Object.assign(r, {gd: r.gf - r.ga, pts: r.w * 3 + r.d});
  });
}

const COLS = [['m','Матчі'],['w','Перемоги'],['d','Нічиї'],['l','Поразки'],
              ['gf','Забито'],['ga','Пропущено'],['gd','Різниця'],['pts','Очки']];

function renderLeague(season){
  const rows = standings(season);
  const hasGoal = season.players.some(p => (season.extra[p] || {})['Ціль']);
  const hasCup  = season.players.some(p => (season.extra[p] || {})['Кубок']);

  let h = `<div class="panel"><h2>Турнірна таблиця <span>· кожен з кожним двічі, 3 / 1 / 0</span></h2><div class="scroll">
    <table class="standings"><colgroup><col class="c-pos"><col class="c-name">`;
  h += COLS.map(() => '<col class="c-num">').join('');
  if (hasGoal) h += '<col class="c-num">';
  if (hasCup)  h += '<col class="c-num">';
  h += `</colgroup><thead><tr><th>#</th><th class="name">Гравець</th>`;
  h += COLS.map(c => `<th>${c[1]}</th>`).join('');
  h += `${hasGoal ? '<th>Ціль</th>' : ''}${hasCup ? '<th>Кубок</th>' : ''}</tr></thead><tbody>`;

  rows.forEach((r, i) => {
    const ex = season.extra[r.p] || {};
    /* 1-ше місце в лізі — це трофей, а не медаль (див. ICO вище). */
    const mark = i === 0 ? icon('league') : i === 1 ? icon('m2') : i === 2 ? icon('m3') : (i + 1);
    h += `<tr><td class="pos p${i + 1}">${mark}</td><td class="name">${whoHTML(season, r.p)}</td>`;
    h += COLS.map(([k]) => k === 'gd'
        ? `<td class="gd ${r.gd >= 0 ? 'plus' : 'minus'}">${r.gd > 0 ? '+' : ''}${r.gd}</td>`
        : `<td class="${k === 'pts' ? 'pts' : ''}">${r[k]}</td>`).join('');
    h += `${hasGoal ? `<td>${ex['Ціль'] === '✅' ? icon('yes')
                          : ex['Ціль'] === '❌' ? icon('no') : '—'}</td>` : ''}`;
    h += `${hasCup ? `<td style="color:var(--muted);font-size:12px">${ex['Кубок'] || '—'}</td>` : ''}</tr>`;
  });
  h += `</tbody></table></div>`;
  if (hasGoal) h += `<p class="note">${icon('aim')} «Ціль» — окрема нагорода сезону, вона є і в Залі слави.</p>`;
  h += clickHint();
  return h + `</div>`;
}

function clickHint(){
  return `<div class="hint"><span class="k">клік на ім'я</span>
    <span>відкриє <b>картку гравця</b> — усі його матчі сезону, а якщо був кубок, то й кубкові.</span></div>`;
}

/* ── усі зустрічі ─────────────────────────────────────────────────────
   ⚠️ «Дома / на виїзді» в даних НЕМАЄ — у гугл-таблиці кожен матч
   записаний двічі, і порядок імен у рядку означає лише те, чий це
   аркуш. Тому в комірці стоять просто дві зустрічі пари, з боку
   гравця в рядку. */
function renderMatches(season){
  const cell = {};
  season.matches.forEach(x => {
    (cell[x.a + '|' + x.b] = cell[x.a + '|' + x.b] || []).push([x.ga, x.gb]);
    (cell[x.b + '|' + x.a] = cell[x.b + '|' + x.a] || []).push([x.gb, x.ga]);
  });
  let h = `<div class="panel"><h2>Усі зустрічі <span>· дві гри в кожній парі</span></h2><div class="scroll">
    <table class="cross"><thead><tr><th></th>`;
  season.players.forEach(p => h += `<th title="${esc(p)}">${embHTML(season, p)}</th>`);
  h += `</tr></thead><tbody>`;
  season.players.forEach(a => {
    h += `<tr><th>${whoHTML(season, a)}</th>`;
    season.players.forEach(b => {
      if (a === b) { h += `<td class="self">—</td>`; return; }
      h += `<td>` + (cell[a + '|' + b] || []).map(([x, y]) =>
        `<span class="leg">${x > y ? `<b>${x}:${y}</b>` : `<s>${x}:${y}</s>`}</span>`).join('') + `</td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div><p class="note">Жирним — перемога гравця з рядка.</p>`
     + clickHint() + `</div>`;
  return h;
}

/* ── кубок ────────────────────────────────────────────────────────── */
function renderCup(season, only, n){
  const stages = season.cup.filter(s => only === 'super'
    ? s.stage === 'Суперкубок' : s.stage !== 'Суперкубок');
  if (!stages.length) return `<div class="panel"><p class="note">Немає даних.</p></div>`;

  if (only === 'super')
    return `<div class="panel"><h2>Суперкубок <span>· ${superSub(n)}</span></h2>
      <div style="max-width:430px">` + stageHTML(season, stages[0]) + `</div></div>`;

  let h = `<div class="panel"><h2>Кубок <span>· у ранніх стадіях по дві гри, фінал і матч за 3-тє місце — один</span></h2>
        <div class="scroll"><div class="rounds">`;
  stages.forEach(st => h += `<div class="round"><h3>${esc(st.stage)}</h3>` + stageHTML(season, st) + `</div>`);
  return h + `</div></div></div>`;
}

/* ⚠️ «Чемпіон ліги проти володаря кубка» — правда не завжди. У Season 2
   Іван виграв і лігу, і кубок, тож суперником став віцечемпіон ліги
   Максим. Тому підпис рахується з даних, а не стоїть текстом. */
function superSub(n){
  const hs = HONORS.filter(h => h.season === n + 1);
  const lg = hs.find(h => h.kind === 'league' && h.place === 1);
  const cp = hs.find(h => h.kind === 'cup' && h.place === 1);
  return (lg && cp && lg.who === cp.who)
    ? `один матч. ${esc(lg.who)} узяв і лігу, і кубок, тому грає з віцечемпіоном ліги`
    : 'чемпіон ліги проти володаря кубка, один матч';
}

/* Іконка переможцю стадії: фінал — кубок Кубка, матч за 3-тє — бронза,
   Super Cup — корона. Фіналіст отримує срібло. */
const STAGE_ICO = {'Фінал': ['cup', 'm2'], 'За 3-тє місце': ['m3', ''], 'Суперкубок': ['super', '']};

function stageHTML(season, st){
  const ico = STAGE_ICO[st.stage] || ['', ''];
  return st.ties.map(t => {
    const one = t.home.g.length === 1;
    const rows = [t.home, t.away].map(side => {
      const other = side === t.home ? t.away : t.home;
      const win = side.sum > other.sum, lose = side.sum < other.sum;
      const mark = icon(win ? ico[0] : lose ? ico[1] : '');
      /* Ноги — окремими клітинками з рискою між ними, а не «3 · 4»:
         інакше два різні матчі читаються як один рахунок. */
      const legs = one ? '' :
        `<span class="legs">${side.g.map(g => `<span class="lg">${g}</span>`).join('')}</span>`;
      return `<div class="tie-row ${win ? 'won' : lose ? 'lost' : ''}">${whoHTML(season, side.p)}
        ${mark}${legs}<span class="agg">${side.sum}</span></div>`;
    }).join('');
    return `<div class="tie${one ? ' single' : ''}">${rows}</div>`;
  }).join('');
}

/* ── нагороди сезону ──────────────────────────────────────────────────
   ⚠️ Дат і порядку матчів у даних немає взагалі, тому «серій», «форми»
   і «камбеків» тут бути не може в принципі — лише те, що не залежить
   від послідовності. */
/* ── іконки нагород ───────────────────────────────────────────────────
   ⚠️ МЕДАЛІ ЗА 1-ШЕ МІСЦЕ НЕМАЄ. У PSuper League перше місце — це
   трофей: кубок Ліги, кубок Кубка або корона Super Cup. Медалі
   лишаються тільки на 2-ге і 3-тє. Тому в кожному ряду нижче перший
   елемент — саме трофей, а не золота медаль.
   Набір — Noto Emoji (Apache 2.0), кубок Кубка — Noto Emoji v1: інший
   малюнок того самого автора, тож два трофеї помітно різні, а стиль
   лишається один. */
const ICO = {league:['','league','m2','m3'], cup:['','cup','m2','m3'],
             super:['','super'], goal:['aim']};
const KIND = {league:'Ліга', cup:'Кубок', super:'Суперкубок', goal:'Ціль'};

function icon(name, cls){
  return name ? `<svg class="ic ${cls || ''}" aria-hidden="true"><use href="#ic-${name}"/></svg>` : '';
}
function honIcon(h, cls){ return icon(ICO[h.kind][h.place], cls); }

/* Вага нагороди — порядок, який задав Богдан: перемога в Лізі, потім у
   Кубку, потім Super Cup, далі медалі (друге вище за третє), і аж потім
   Ціль. Тим самим числом сортуються і люди у вітрині, і чипи в межах
   людини — щоб порядок ніде не розходився. */
function weight(h){
  if (h.kind === 'goal') return 10;
  if (h.place === 1) return {league:1000, cup:900, super:800}[h.kind];
  return h.place === 2 ? 500 : 300;
}

function renderAwards(season, n){
  const mine = HONORS.filter(h => h.season === n + 1);
  const card = (ico, t, v, sub, cls) =>
    `<div class="award ${cls || ''}"><span class="ico">${ico}</span><div>
       <div class="t">${t}</div><div class="v">${esc(v)}</div>
       ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div></div>`;

  let h = `<div class="panel"><h2>Титули</h2><div class="awards">`;
  ['league', 'cup', 'super'].forEach(k => mine.filter(x => x.kind === k)
    .sort((a, b) => a.place - b.place)
    .forEach(x => h += card(honIcon(x, 'xl'), KIND[k], x.who,
      x.place === 1 ? 'переможець' : x.place === 2 ? 'фіналіст' : 'третє місце',
      x.place === 1 ? 'gold' : '')));
  h += `</div></div>`;

  const aims = mine.filter(x => x.kind === 'goal');
  if (aims.length) {
    h += `<div class="panel"><h2>${icon('aim')} Ціль <span>· ${aims.length} з ${season.players.length}</span></h2><div class="awards">`;
    aims.forEach(x => h += card(icon('aim', 'xl'), 'Ціль досягнута', x.who, '', 'aim'));
    h += `</div></div>`;
  }

  h += `<div class="panel"><h2>Рекорди сезону <span>· за матчами ліги</span></h2><div class="awards">`
     + recordCards(season.matches, standings(season)) + `</div></div>`;
  return h;
}

/* ⚠️ perMatch — не косметика, а виправлення несправедливості. У межах
   сезону всі грають однакову кількість матчів, тож «найменше пропущено»
   в абсолютних цифрах чесне. За всі три сезони — ні: Артур зіграв один
   сезон, пропустив 40 і формально ставав найкращим в обороні, хоча решта
   провела по 56 матчів. Тому наскрізні рекорди рахуються ЗА МАТЧ. */
function recordCards(matches, rows, label, perMatch){
  const best = (arr, f) => arr.reduce((a, b) => f(b) > f(a) ? b : a);
  const gf1 = r => r.gf / r.m, ga1 = r => r.ga / r.m;
  const atk = perMatch ? best(rows, gf1) : best(rows, r => r.gf);
  const def = perMatch ? rows.reduce((a, b) => ga1(b) < ga1(a) ? b : a)
                       : rows.reduce((a, b) => b.ga < a.ga ? b : a);
  const drw = best(rows, r => r.d);
  const one = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',');
  const rout = best(matches, m => Math.abs(m.ga - m.gb));
  const wild = best(matches, m => m.ga + m.gb);
  const sc = m => (m.ga > m.gb ? `${m.a} ${m.ga}:${m.gb} ${m.b}` : `${m.b} ${m.gb}:${m.ga} ${m.a}`);
  const tag = m => label && m.sn ? label[m.sn] : '';
  const card = (ico, t, v, sub) =>
    `<div class="award"><span class="ico">${ico}</span><div>
       <div class="t">${t}</div><div class="v">${esc(v)}</div>
       ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div></div>`;
  return card(icon('atk','xl'), 'Найкраща атака', atk.p,
              perMatch ? one(gf1(atk)) + ' гола за матч' : atk.gf + ' забито')
       + card(icon('def','xl'), 'Найкраща оборона', def.p,
              perMatch ? one(ga1(def)) + ' пропущеного за матч' : def.ga + ' пропущено')
       + card(icon('rout','xl'), 'Найбільший розгром', sc(rout),
              Math.abs(rout.ga - rout.gb) + ' різниці' + (tag(rout) ? ' · ' + tag(rout) : ''))
       + card(icon('wild','xl'), 'Найрезультативніший матч', sc(wild),
              (wild.ga + wild.gb) + ' голів' + (tag(wild) ? ' · ' + tag(wild) : ''))
       + card(icon('draw','xl'), 'Найбільше нічиїх', drw.p, drw.d + ' нічиїх');
}

/* ── картка гравця ────────────────────────────────────────────────── */
function renderPlayer(season, name){
  const r = standings(season).find(x => x.p === name);
  if (!r) return `<div class="panel"><p class="note">Такого гравця в цьому сезоні немає.</p></div>`;
  const place = season.players.indexOf(name) + 1;
  const mine = HONORS.filter(h => h.who === name && h.season === cur.s + 1);

  let h = `<button class="back" onclick="go(cur.s,cur.t)">← назад</button>`;
  h += `<div class="panel"><div class="pcard-head">
      ${embHTML(season, name, true)}<h2>${esc(name)}</h2>
      <div class="chips">
        <span class="chip">місце <b>${place}</b></span>
        <span class="chip">очки <b>${r.pts}</b></span>
        <span class="chip">${r.w}–${r.d}–${r.l}</span>
        <span class="chip">м'ячі <b>${r.gf}:${r.ga}</b></span>
        ${mine.map(x => `<span class="chip">${honIcon(x)} <b>${KIND[x.kind]}</b></span>`).join('')}
      </div></div>`;

  const ms = [];
  season.matches.forEach(x => {
    if (x.a === name) ms.push({o: x.b, gf: x.ga, ga: x.gb});
    else if (x.b === name) ms.push({o: x.a, gf: x.gb, ga: x.ga});
  });
  h += `<div class="scroll"><table><thead><tr><th></th><th class="name">Суперник</th><th>Рахунок</th></tr></thead><tbody>`;
  ms.forEach(m => {
    const res = m.gf > m.ga ? 'W' : m.gf === m.ga ? 'D' : 'L';
    h += `<tr><td><span class="res ${res}">${res === 'W' ? 'В' : res === 'D' ? 'Н' : 'П'}</span></td>
      <td class="name">${whoHTML(season, m.o)}</td><td class="score">${m.gf} : ${m.ga}</td></tr>`;
  });
  h += `</tbody></table></div></div>`;

  if (season.cup) {
    const cm = [];
    season.cup.forEach(st => st.ties.forEach(t => {
      const me = t.home.p === name ? t.home : t.away.p === name ? t.away : null;
      if (me) cm.push({st: st.stage, me, op: me === t.home ? t.away : t.home});
    }));
    if (cm.length) {
      h += `<div class="panel"><h2>Кубок</h2><div class="scroll"><table><thead><tr>
        <th class="name">Стадія</th><th class="name">Суперник</th><th>Ігри</th><th>Сума</th></tr></thead><tbody>`;
      cm.forEach(c => {
        const won = c.me.sum > c.op.sum;
        h += `<tr><td class="name" style="color:var(--muted);font-size:13px">${esc(c.st)}</td>
          <td class="name">${whoHTML(season, c.op.p)}</td>
          <td class="legs">${c.me.g.map((g, i) => g + ':' + c.op.g[i]).join(' · ')}</td>
          <td class="score" style="color:${won ? 'var(--sky)' : 'var(--muted)'}">${c.me.sum} : ${c.op.sum}</td></tr>`;
      });
      h += `</tbody></table></div></div>`;
    }
  }
  return h;
}

/* ═══════════════ ЗАЛА СЛАВИ — наскрізне, за всі три сезони ══════════
   ⚠️ Люди зводяться ПО ІМЕНІ, і це працює лише тому, що написання в
   усіх трьох таблицях однакове. Емблеми тут не показуємо: клуб у
   людини свій у кожному сезоні, спільної позначки не існує. */
function allPlayers(){
  const t = {};
  S.forEach((se, i) => se.players.forEach(p => {
    t[p] = t[p] || {p, seasons: [], m:0, w:0, d:0, l:0, gf:0, ga:0};
    t[p].seasons.push(i + 1);
  }));
  S.forEach(se => se.matches.forEach(x => {
    [[x.a, x.ga, x.gb], [x.b, x.gb, x.ga]].forEach(([who, gf, ga]) => {
      const r = t[who];
      r.m++; r.gf += gf; r.ga += ga;
      if (gf > ga) r.w++; else if (gf === ga) r.d++; else r.l++;
    });
  }));
  return Object.values(t).map(r => Object.assign(r, {
    gd: r.gf - r.ga, pts: r.w * 3 + r.d,
    wr: r.m ? Math.round(r.w * 100 / r.m) : 0,
  })).sort((a, b) => b.pts - a.pts || b.gd - a.gd);
}

function renderTrophies(){
  const by = {};
  HONORS.forEach(h => (by[h.who] = by[h.who] || []).push(h));
  const sum = a => a.reduce((s, h) => s + weight(h), 0);
  const people = Object.keys(by).sort((a, b) =>
    sum(by[b]) - sum(by[a]) || by[b].length - by[a].length || a.localeCompare(b));

  let h = `<div class="panel"><h2>Трофейна вітрина <span>· ${HONORS.length} нагород за три сезони</span></h2>`;
  people.forEach(who => {
    /* Чипи всередині людини впорядковані ТІЄЮ Ж вагою, що й самі люди —
       інакше порядок у рядку суперечив би порядку рядків. */
    const list = by[who].slice().sort((a, b) => weight(b) - weight(a) || a.season - b.season);
    const big = list.filter(x => x.kind !== 'goal').length;
    const word = big === 1 ? 'нагорода' : big < 5 ? 'нагороди' : 'нагород';
    h += `<div class="shelf"><div class="nm">${esc(who)}
        <small>${big ? big + ' ' + word : 'без нагород'}</small></div>
      <div class="medals">` + list.map(x =>
        `<span class="medal ${x.place === 1 && x.kind !== 'goal' ? 'g1' : ''} ${x.kind === 'goal' ? 'aim' : ''}">
           ${honIcon(x, 'lg')}<b>${KIND[x.kind]}</b> <small>Season ${x.season}</small></span>`).join('')
      + `</div></div>`;
  });
  return h + `</div>`;
}

function renderAllTable(){
  const rows = allPlayers();
  let h = `<div class="panel"><h2>Таблиця за три сезони <span>· тільки матчі ліги, 3 / 1 / 0</span></h2><div class="scroll">
    <table class="standings"><colgroup><col class="c-pos"><col class="c-name">`
    + '<col class="c-num">'.repeat(10) + `</colgroup>
    <thead><tr><th>#</th><th class="name">Гравець</th><th>Сезонів</th>`
    + COLS.map(c => `<th>${c[1]}</th>`).join('') + `<th>% перемог</th></tr></thead><tbody>`;
  rows.forEach((r, i) => {
    h += `<tr><td class="pos p${i + 1}">${i + 1}</td>
      <td class="name"><button class="who" data-hof="${esc(r.p)}"><span>${esc(r.p)}</span></button></td>
      <td style="color:var(--muted)">${r.seasons.join(', ')}</td>`;
    h += COLS.map(([k]) => k === 'gd'
      ? `<td class="gd ${r.gd >= 0 ? 'plus' : 'minus'}">${r.gd > 0 ? '+' : ''}${r.gd}</td>`
      : `<td class="${k === 'pts' ? 'pts' : ''}">${r[k]}</td>`).join('');
    h += `<td>${r.wr}%</td></tr>`;
  });
  return h + `</tbody></table></div><p class="note">У кожного сезону різна кількість турів (16 / 18 / 22),
    тож очки складаються, але порівнювати людей із різним числом сезонів варто за відсотком перемог.</p></div>`;
}

/* ⚠️ Ліга і кубки рахуються ОКРЕМО, і це не примха: у лізі кожна пара
   грає рівно двічі за сезон, тож матриця там щільна й порівнянна. У
   кубку пари складаються жеребом і вильотом — там сам факт зустрічі вже
   подія. Змішавши їх, ми б утопили десяток кубкових дуелей у трьох
   сотнях лігових. */
function h2hMap(kind){
  const t = {};
  const add = (A, B, gf, ga) => {
    const r = t[A + '|' + B] = t[A + '|' + B] || {n:0, w:0, d:0, l:0, gf:0, ga:0};
    r.n++; r.gf += gf; r.ga += ga;
    if (gf > ga) r.w++; else if (gf === ga) r.d++; else r.l++;
  };
  if (kind === 'cup') {
    /* Рахуємо ОКРЕМІ ІГРИ, не пари: у двоматчевих стадіях можна програти
       гру й усе одно пройти далі, тож «перемог» тут саме стільки, скільки
       виграних матчів. Super Cup входить сюди ж — це дві гри за три сезони,
       окрема матриця на них була б порожньою. */
    S.forEach(se => (se.cup || []).forEach(st => st.ties.forEach(tie => {
      const n = Math.min(tie.home.g.length, tie.away.g.length);
      for (let i = 0; i < n; i++) {
        add(tie.home.p, tie.away.p, tie.home.g[i], tie.away.g[i]);
        add(tie.away.p, tie.home.p, tie.away.g[i], tie.home.g[i]);
      }
    })));
  } else {
    S.forEach(se => se.matches.forEach(x => {
      add(x.a, x.b, x.ga, x.gb);
      add(x.b, x.a, x.gb, x.ga);
    }));
  }
  return t;
}

function h2hTable(t, order){
  let h = `<div class="scroll"><table class="h2h"><thead><tr><th></th>`;
  order.forEach(p => h += `<th>${esc(p)}</th>`);
  h += `</tr></thead><tbody>`;
  order.forEach(a => {
    h += `<tr><th>${esc(a)}</th>`;
    order.forEach(b => {
      if (a === b) { h += `<td class="self">—</td>`; return; }
      const r = t[a + '|' + b];
      if (!r) { h += `<td style="color:var(--line)">·</td>`; return; }
      const cls = r.w > r.l ? 'w' : r.w < r.l ? 'l' : 'e';
      h += `<td title="${esc(a)} — ${esc(b)}: ${r.n} матчів, м'ячі ${r.gf}:${r.ga}">
        <span class="bal ${cls}">${r.w}-${r.d}-${r.l}</span>
        <span class="n">${r.n} ${r.n === 1 ? 'гра' : r.n < 5 ? 'гри' : 'ігор'}</span></td>`;
    });
    h += `</tr>`;
  });
  return h + `</tbody></table></div>`;
}

function renderH2H(){
  const order = allPlayers().map(r => r.p);
  const lg = h2hMap('league'), cp = h2hMap('cup');

  let h = `<div class="panel"><h2>Ліга <span>· протистояння за всі три сезони</span></h2>`
    + h2hTable(lg, order)
    + `<p class="note">У комірці — перемоги-нічиї-поразки гравця з рядка, під ними кількість ігор.
       Крапка означає, що ці двоє не перетинались у жодному сезоні.</p></div>`;

  /* У матрицю кубків беремо ЛИШЕ тих, хто в кубках грав, — інакше
     половина таблиці була б порожня: у Season 1 кубка не було зовсім,
     а в Season 2 у сітку потрапили 8 із 10. */
  const played = order.filter(p => order.some(q => cp[p + '|' + q]));
  const games = Object.values(cp).reduce((s, r) => s + r.n, 0) / 2;
  h += `<div class="panel"><h2>Кубок і Суперкубок <span>· ${games} ігор на вибування, ${played.length} учасників</span></h2>`
    + h2hTable(cp, played)
    + `<p class="note">Рахуються окремі ігри, а не пари: у стадіях із двома матчами можна
       програти гру й усе одно пройти далі. Суперкубок входить сюди ж.
       ⚠️ У Season 1 кубка не було, тож ці цифри — лише за другий і третій сезони.</p></div>`;
  return h;
}

function renderRecords(){
  const all = [];
  S.forEach((se, i) => se.matches.forEach(m => all.push(Object.assign({sn: i + 1}, m))));
  const label = {1:'Season 1', 2:'Season 2', 3:'Season 3'};
  let h = `<div class="panel"><h2>Рекорди ліги <span>· за всі три сезони</span></h2><div class="awards">`
        + recordCards(all, allPlayers(), label, true)
        + `</div><p class="note">Атака й оборона — за матч, а не в сумі: сезони різної довжини,
           і хтось зіграв один, а хтось усі три. В абсолютних цифрах «найменше пропущено»
           виграв би той, хто просто менше грав.</p></div>`;

  /* найкращий і найгірший сезон окремо — вони не виводяться з allPlayers */
  const seas = [];
  S.forEach((se, i) => standings(se).forEach(r => seas.push(Object.assign({sn: i + 1}, r))));
  const bestPts = seas.reduce((a, b) => b.pts > a.pts ? b : a);
  const bestGf = seas.reduce((a, b) => b.gf > a.gf ? b : a);
  const bestGa = seas.reduce((a, b) => b.ga < a.ga ? b : a);
  const card = (ico, t, v, sub) => `<div class="award"><span class="ico">${ico}</span><div>
      <div class="t">${t}</div><div class="v">${esc(v)}</div><div class="sub">${esc(sub)}</div></div></div>`;
  h += `<div class="panel"><h2>Найкращі сезони окремих людей</h2><div class="awards">`
     + card(icon('pts','xl'), 'Найбільше очок за сезон', bestPts.p, `${bestPts.pts} очок · ${label[bestPts.sn]}`)
     + card(icon('fire','xl'), 'Найбільше забито за сезон', bestGf.p, `${bestGf.gf} голів · ${label[bestGf.sn]}`)
     + card(icon('ice','xl'), 'Найменше пропущено за сезон', bestGa.p, `${bestGa.ga} голів · ${label[bestGa.sn]}`)
     + `</div><p class="note">Сезони різної довжини (16 / 18 / 22 матчі), тож абсолютні цифри
        природно вищі у третьому.</p></div>`;
  return h;
}

/* ── роутер ───────────────────────────────────────────────────────── */
let cur = {s: 0, t: 'liga', p: null};
const HOF_TABS = [['trophies','Трофеї'],['table','Таблиця за 3 сезони'],
                  ['h2h','Протистояння'],['records','Рекорди']];

function tabsFor(s){
  if (s === 'hof') return HOF_TABS;
  const t = [['liga', 'Ліга'], ['matches', 'Матчі']];
  if (S[s].cup) { t.push(['cup', 'Кубок']); t.push(['super', 'Суперкубок']); }
  t.push(['awards', 'Нагороди']);
  return t;
}

function go(s, t, p){
  cur = {s, t, p: p || null};
  location.hash = (s === 'hof' ? 'hof' : 's' + (s + 1)) + '/' + t
    + (p ? '/p/' + encodeURIComponent(p) : '');
}

function draw(){
  const hof = cur.s === 'hof';
  document.getElementById('nav-season').innerHTML =
    S.map((x, i) => `<button class="${i === cur.s ? 'on' : ''}" onclick="go(${i},'liga')">${esc(x.title)}</button>`).join('')
    + `<button class="hof ${hof ? 'on' : ''}" onclick="go('hof','trophies')">Зала слави</button>`;

  /* Заголовок показує відкритий розділ — так само, як у BoBet там стоїть
     назва турніру. Підзаголовок рахується з даних, щоб не розійтись із
     ними після будь-якої правки архіву. */
  const se0 = hof ? null : S[cur.s];
  document.getElementById('head-title').textContent = hof ? 'Зала слави' : se0.title;
  document.getElementById('head-sub').textContent = hof
    ? `${allPlayers().length} гравців · ${HONORS.length} нагород за три сезони`
    : `${se0.players.length} гравців · ${se0.matches.length} матчів ліги`
      + (se0.cup ? ' · кубок і суперкубок' : ' · без кубка');
  document.getElementById('nav-stage').innerHTML = tabsFor(cur.s).map(([k, n]) =>
    `<button class="${k === cur.t && !cur.p ? 'on' : ''}" onclick="go(${hof ? "'hof'" : cur.s},'${k}')">${n}</button>`).join('');

  const v = document.getElementById('view');
  if (hof) {
    v.innerHTML = cur.t === 'table' ? renderAllTable()
      : cur.t === 'h2h' ? renderH2H()
      : cur.t === 'records' ? renderRecords() : renderTrophies();
  } else {
    const se = S[cur.s];
    v.innerHTML = cur.p ? renderPlayer(se, cur.p)
      : cur.t === 'matches' ? renderMatches(se)
      : cur.t === 'awards' ? renderAwards(se, cur.s)
      : (cur.t === 'cup' || cur.t === 'super') ? renderCup(se, cur.t, cur.s)
      : renderLeague(se);
  }

  v.querySelectorAll('.who').forEach(b => {
    if (b.dataset.hof) b.onclick = () => jumpToPerson(b.dataset.hof);
    else b.onclick = () => go(cur.s, cur.t === 'awards' ? 'liga' : cur.t, b.dataset.p);
  });
  window.scrollTo({top: cur.p ? 0 : Math.min(window.scrollY, 400)});
}

/* Із наскрізної таблиці ведемо в ОСТАННІЙ сезон, де людина грала. */
function jumpToPerson(name){
  for (let i = S.length - 1; i >= 0; i--)
    if (S[i].players.includes(name)) return go(i, 'liga', name);
}

function fromHash(){
  const m = /^#(hof|s(\d))\/([\w]+)(?:\/p\/(.+))?$/.exec(location.hash || '');
  if (!m) { cur = {s: 0, t: 'liga', p: null}; draw(); return; }
  const s = m[1] === 'hof' ? 'hof' : Math.min(Math.max(+m[2] - 1, 0), S.length - 1);
  const tabs = tabsFor(s).map(x => x[0]);
  cur = {s,
         t: tabs.includes(m[3]) ? m[3] : tabs[0],
         p: (s !== 'hof' && m[4]) ? decodeURIComponent(m[4]) : null};
  draw();
}

window.addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
</html>
