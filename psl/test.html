<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSuper League — архів турнірів BoOrbit</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
/* ── Палітра PSuper League ─────────────────────────────────────────────
   Синя, задана Богданом 10.08.2026, і вона НАВМИСНО не схожа на зелену
   BoBet: перемикання ліги має читатись оком одразу, ще до того, як
   людина прочитає заголовок. */
:root{
  --bg:#0F172A; --panel:#14243F; --panel2:#1B3358; --line:#24476F;
  --blue:#0077CC; --sky:#0EA5E9; --deep:#004A80;
  --white:#FFFFFF; --grey:#F8FAFC; --muted:#8FA9C4;
  --gold:#F5C542; --silver:#C6D3E2; --bronze:#C98B4B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--grey);
  font-family:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 16px 64px;}
a{color:var(--sky); text-decoration:none;}

/* ── шапка ───────────────────────────────────────────────────────── */
.boorbit-mark{display:flex; justify-content:center; padding:22px 16px 4px;}
.boorbit-mark img{width:100%; max-width:460px; height:auto; display:block;}
@media (max-width:640px){ .boorbit-mark img{max-width:260px;} }

/* Перемикач ліг — та сама механіка, що в BoBet (один трек, повзунок під
   активним сегментом), але дзеркально: тут активна PSL, а BoBet — живе
   посилання назад. */
.league-switch{display:flex; justify-content:center; padding:0 16px 22px;}
.league-track{
  position:relative; display:flex; width:100%; max-width:340px;
  border:1px solid var(--line); border-radius:24px;
  background:var(--panel); padding:3px;
}
.league-thumb{
  position:absolute; top:3px; bottom:3px; right:3px;
  width:calc(50% - 3px); background:var(--blue); border-radius:20px;
  transition:right .18s ease;
}
.league-opt{
  position:relative; flex:1 1 0; z-index:1;
  font-family:inherit; font-size:13px; font-weight:700;
  padding:9px 8px; border:0; background:transparent; cursor:pointer;
  color:var(--muted); border-radius:20px; text-align:center;
}
.league-opt.active{color:#fff;}
.league-opt:not(.active):hover{color:var(--grey);}

.masthead{text-align:center; padding:4px 0 26px;}
.masthead .tag{
  font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--sky); margin:0 0 6px;
}
.masthead h1{
  font-size:32px; font-weight:900; margin:0 0 8px; letter-spacing:-.02em; color:#fff;
}
.masthead p{margin:0; color:var(--muted); font-size:14px;}

/* ── навігація сезонів / етапів ───────────────────────────────────── */
.nav{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px;}
.nav button{
  font-family:inherit; font-size:14px; font-weight:700;
  padding:9px 18px; border-radius:22px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--muted);
}
.nav button:hover{border-color:var(--blue); color:var(--grey);}
.nav button.on{background:var(--blue); border-color:var(--blue); color:#fff;}
.nav.sub button{font-size:13px; padding:7px 15px; font-weight:500;}
.nav.sub button.on{background:var(--deep); border-color:var(--sky); color:#fff;}
.nav-sep{height:18px;}

/* ── картки/панелі ────────────────────────────────────────────────── */
.panel{
  background:var(--panel); border:1px solid var(--line);
  border-radius:16px; padding:18px; margin-bottom:18px;
}
.panel > h2{
  margin:0 0 14px; font-size:15px; font-weight:700; color:#fff;
  letter-spacing:.04em; text-transform:uppercase;
}
.panel > h2 span{color:var(--muted); font-weight:500; text-transform:none; letter-spacing:0;}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}

/* ── таблиці ──────────────────────────────────────────────────────── */
table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums;}
th,td{padding:8px 9px; text-align:center; white-space:nowrap;}
thead th{
  font-size:11px; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:.06em;
  border-bottom:1px solid var(--line);
}
tbody tr{border-bottom:1px solid rgba(36,71,111,.45);}
tbody tr:last-child{border-bottom:0;}
tbody tr:hover{background:rgba(14,165,233,.06);}
td.name,th.name{text-align:left;}
.pos{font-weight:700; color:var(--muted); width:28px;}
.pos.p1{color:var(--gold);} .pos.p2{color:var(--silver);} .pos.p3{color:var(--bronze);}
.pts{font-weight:900; color:#fff;}
.gd.plus{color:var(--sky);} .gd.minus{color:var(--muted);}

/* Ім'я гравця — завжди клікабельне: клік веде в його картку.
   Пунктир, а не колір, щоб у таблиці не рябіло. */
.who{
  display:inline-flex; align-items:center; gap:8px;
  cursor:pointer; border:0; background:0; padding:0;
  font-family:inherit; font-size:14px; font-weight:700; color:var(--grey);
  border-bottom:1px dashed rgba(143,169,196,.5);
}
.who:hover{color:#fff; border-bottom-color:var(--sky);}
.emb{width:22px; height:22px; object-fit:contain; flex:none;}
.emb.flag{font-size:18px; line-height:22px; text-align:center;}
.emb.big{width:34px; height:34px;} .emb.big.flag{font-size:28px; line-height:34px;}

/* ── крос-таблиця ─────────────────────────────────────────────────── */
.cross th, .cross td{padding:6px 7px; font-size:13px;}
.cross thead th{position:sticky; top:0; background:var(--panel);}
.cross tbody th{
  text-align:left; font-weight:700; color:var(--grey);
  position:sticky; left:0; background:var(--panel); z-index:1;
  border-right:1px solid var(--line);
}
.cross td.self{background:rgba(36,71,111,.35);}
.cross td b{color:#fff; font-weight:700;}
.cross td s{color:var(--muted); text-decoration:none;}
.cross .leg{display:block; font-size:12px;}

/* ── кубкова сітка ────────────────────────────────────────────────── */
.rounds{display:flex; gap:14px; align-items:flex-start; min-width:min-content;}
.round{flex:1 1 0; min-width:210px;}
.round h3{
  margin:0 0 10px; font-size:11px; font-weight:700; color:var(--sky);
  text-transform:uppercase; letter-spacing:.1em; text-align:center;
}
.tie{
  background:var(--panel2); border:1px solid var(--line);
  border-radius:12px; padding:8px 10px; margin-bottom:10px;
}
.tie-row{display:flex; align-items:center; gap:8px; padding:3px 0;}
.tie-row .who{font-size:13px; border:0; flex:1 1 auto; min-width:0;}
.tie-row .who span{overflow:hidden; text-overflow:ellipsis;}
.legs{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums;}
.agg{font-weight:900; color:#fff; min-width:20px; text-align:right;}
.tie-row.lost .who{color:var(--muted); font-weight:500;}
.tie-row.lost .agg{color:var(--muted); font-weight:700;}
.tie-row.won .agg{color:var(--sky);}
.tie.single{background:linear-gradient(180deg,rgba(0,119,204,.22),rgba(0,74,128,.12));}

/* ── картка гравця ────────────────────────────────────────────────── */
.pcard-head{display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
.pcard-head h2{margin:0; font-size:24px; font-weight:900; color:#fff; text-transform:none; letter-spacing:-.01em;}
.chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip{
  background:var(--panel2); border:1px solid var(--line); border-radius:20px;
  padding:5px 12px; font-size:12px; color:var(--muted);
}
.chip b{color:#fff; font-weight:700;}
.back{
  font-family:inherit; font-size:13px; font-weight:700; color:var(--muted);
  background:0; border:0; cursor:pointer; padding:0 0 12px;
}
.back:hover{color:var(--sky);}
.res{font-weight:900; width:22px; display:inline-block;}
.res.W{color:var(--sky);} .res.D{color:var(--muted);} .res.L{color:#E4707A;}
.score{font-weight:900; color:#fff; font-variant-numeric:tabular-nums;}

.note{color:var(--muted); font-size:13px; margin:10px 2px 0;}
.stage-badge{
  position:fixed; right:10px; bottom:10px; z-index:99;
  background:#B4232F; color:#fff; font-size:11px; font-weight:700;
  padding:5px 10px; border-radius:6px; letter-spacing:.08em;
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Роутер на хеші: #s2/cup, #s3/liga, #s1/p/Іван
   Адреса — щоб можна було кинути друзям посилання прямо на кубок
   третього сезону, і щоб «назад» у браузері працювало.
   ═══════════════════════════════════════════════════════════════════ */
const S = PSL_DATA.seasons;
const EMB = PSL_DATA.emblems || {};

/* Позначка гравця: емблема клубу або емодзі-прапор. Імен у кубкових
   сітках немає взагалі, тож позначка — єдине, що там було. */
function embHTML(season, name, big){
  const s = (season.sign || {})[name] || {};
  const cls = 'emb' + (big ? ' big' : '');
  if (s.img && EMB[s.img]) return `<img class="${cls}" src="${EMB[s.img]}" alt="">`;
  if (s.flag) return `<span class="${cls} flag">${s.flag}</span>`;
  return `<span class="${cls}"></span>`;
}
function whoHTML(season, name, big){
  return `<button class="who" data-p="${esc(name)}">${embHTML(season, name, big)}<span>${esc(name)}</span></button>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ── таблиця з матчів ────────────────────────────────────────────────
   ⚠️ Рахуємо САМІ, а не беремо готові цифри з гугл-таблиці: у Season 3
   формула підсумку обірвана (`Технічний!I4` = C1 замість C1:C11) і дає
   Вадиму 38 пропущених замість 68. Порядок місць лишаємо гуглівський —
   він уже враховує тайбрейки. */
function standings(season){
  const t = {};
  season.players.forEach(p => t[p] = {p, m:0, w:0, d:0, l:0, gf:0, ga:0});
  season.matches.forEach(x => {
    [[x.a, x.ga, x.gb], [x.b, x.gb, x.ga]].forEach(([who, gf, ga]) => {
      const r = t[who];
      r.m++; r.gf += gf; r.ga += ga;
      if (gf > ga) r.w++; else if (gf === ga) r.d++; else r.l++;
    });
  });
  return season.players.map(p => {
    const r = t[p];
    return Object.assign(r, {gd: r.gf - r.ga, pts: r.w * 3 + r.d});
  });
}

function renderLeague(season){
  const rows = standings(season);
  const hasGoal = season.players.some(p => (season.extra[p] || {})['Ціль']);
  const hasCup  = season.players.some(p => (season.extra[p] || {})['Кубок']);

  let h = `<div class="panel"><h2>Турнірна таблиця <span>· кожен з кожним двічі, 3 / 1 / 0</span></h2><div class="scroll"><table>
    <thead><tr><th>#</th><th class="name">Гравець</th><th>М</th><th>В</th><th>Н</th><th>П</th>
    <th>ЗБ</th><th>ПР</th><th>±</th><th>Очки</th>
    ${hasGoal ? '<th>Ціль</th>' : ''}${hasCup ? '<th>Кубок</th>' : ''}</tr></thead><tbody>`;
  rows.forEach((r, i) => {
    const ex = season.extra[r.p] || {};
    h += `<tr><td class="pos p${i + 1}">${i + 1}</td>
      <td class="name">${whoHTML(season, r.p)}</td>
      <td>${r.m}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
      <td>${r.gf}</td><td>${r.ga}</td>
      <td class="gd ${r.gd >= 0 ? 'plus' : 'minus'}">${r.gd > 0 ? '+' : ''}${r.gd}</td>
      <td class="pts">${r.pts}</td>
      ${hasGoal ? `<td>${ex['Ціль'] || '—'}</td>` : ''}
      ${hasCup ? `<td style="color:var(--muted);font-size:12px">${ex['Кубок'] || '—'}</td>` : ''}</tr>`;
  });
  h += `</tbody></table></div></div>`;

  /* ── крос-таблиця ──────────────────────────────────────────────────
     ⚠️ «Дома / на виїзді» в даних НЕМАЄ — у гугл-таблиці кожен матч
     записаний двічі, і порядок імен у рядку означає лише те, чий це
     аркуш. Тому в комірці стоять просто ДВІ зустрічі пари, з боку
     гравця в рядку. */
  const idx = {};
  season.players.forEach((p, i) => idx[p] = i);
  const cell = {};
  season.matches.forEach(x => {
    (cell[x.a + '|' + x.b] = cell[x.a + '|' + x.b] || []).push([x.ga, x.gb]);
    (cell[x.b + '|' + x.a] = cell[x.b + '|' + x.a] || []).push([x.gb, x.ga]);
  });

  h += `<div class="panel"><h2>Усі зустрічі <span>· дві гри в кожній парі</span></h2><div class="scroll"><table class="cross">
    <thead><tr><th></th>`;
  season.players.forEach(p => h += `<th title="${esc(p)}">${embHTML(season, p)}</th>`);
  h += `</tr></thead><tbody>`;
  season.players.forEach(a => {
    h += `<tr><th>${whoHTML(season, a)}</th>`;
    season.players.forEach(b => {
      if (a === b) { h += `<td class="self">—</td>`; return; }
      const g = cell[a + '|' + b] || [];
      h += `<td>` + g.map(([x, y]) =>
        `<span class="leg">${x > y ? `<b>${x}:${y}</b>` : `<s>${x}:${y}</s>`}</span>`).join('') + `</td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div><p class="note">Жирним — перемога гравця з рядка. Клік на ім'я відкриє його матчі.</p></div>`;
  return h;
}

/* ── кубок ────────────────────────────────────────────────────────── */
function renderCup(season, only){
  const stages = season.cup.filter(s => only === 'super'
    ? s.stage === 'Super Cup' : s.stage !== 'Super Cup');
  if (!stages.length) return `<div class="panel"><p class="note">Немає даних.</p></div>`;

  let h = '';
  if (only === 'super') {
    h += `<div class="panel"><h2>Super Cup <span>· чемпіон ліги проти володаря кубка, один матч</span></h2>`;
    h += stageHTML(season, stages[0], true);
    h += `</div>`;
    return h;
  }
  h += `<div class="panel"><h2>Кубок <span>· у ранніх стадіях по дві гри, далі один матч</span></h2>
        <div class="scroll"><div class="rounds">`;
  stages.forEach(st => {
    h += `<div class="round"><h3>${esc(st.stage)}</h3>` + stageHTML(season, st) + `</div>`;
  });
  h += `</div></div></div>`;
  return h;
}

function stageHTML(season, st, single){
  return st.ties.map(t => {
    const one = t.home.g.length === 1;
    const rows = [t.home, t.away].map(side => {
      const other = side === t.home ? t.away : t.home;
      const cls = side.sum > other.sum ? 'won' : (side.sum < other.sum ? 'lost' : '');
      const legs = one ? '' : `<span class="legs">${side.g.join(' · ')}</span>`;
      return `<div class="tie-row ${cls}">${whoHTML(season, side.p)}${legs}<span class="agg">${side.sum}</span></div>`;
    }).join('');
    return `<div class="tie${one || single ? ' single' : ''}">${rows}</div>`;
  }).join('');
}

/* ── картка гравця ────────────────────────────────────────────────── */
function renderPlayer(season, name){
  const r = standings(season).find(x => x.p === name);
  if (!r) return `<div class="panel"><p class="note">Такого гравця в цьому сезоні немає.</p></div>`;
  const place = season.players.indexOf(name) + 1;

  let h = `<button class="back" onclick="go(cur.s,cur.t)">← назад</button>`;
  h += `<div class="panel"><div class="pcard-head">
      ${embHTML(season, name, true)}
      <h2>${esc(name)}</h2>
      <div class="chips">
        <span class="chip">місце <b>${place}</b></span>
        <span class="chip">очки <b>${r.pts}</b></span>
        <span class="chip">${r.w}–${r.d}–${r.l}</span>
        <span class="chip">м'ячі <b>${r.gf}:${r.ga}</b></span>
      </div></div>`;

  /* матчі ліги */
  const mine = [];
  season.matches.forEach(x => {
    if (x.a === name) mine.push({o: x.b, gf: x.ga, ga: x.gb});
    else if (x.b === name) mine.push({o: x.a, gf: x.gb, ga: x.ga});
  });
  h += `<div class="scroll"><table><thead><tr>
      <th></th><th class="name">Суперник</th><th>Рахунок</th></tr></thead><tbody>`;
  mine.forEach(m => {
    const res = m.gf > m.ga ? 'W' : m.gf === m.ga ? 'D' : 'L';
    h += `<tr><td><span class="res ${res}">${res === 'W' ? 'В' : res === 'D' ? 'Н' : 'П'}</span></td>
      <td class="name">${whoHTML(season, m.o)}</td>
      <td class="score">${m.gf} : ${m.ga}</td></tr>`;
  });
  h += `</tbody></table></div></div>`;

  /* кубкові матчі того ж сезону */
  if (season.cup) {
    const cm = [];
    season.cup.forEach(st => st.ties.forEach(t => {
      const me = t.home.p === name ? t.home : t.away.p === name ? t.away : null;
      if (me) cm.push({st: st.stage, me, op: me === t.home ? t.away : t.home});
    }));
    if (cm.length) {
      h += `<div class="panel"><h2>Кубок</h2><div class="scroll"><table><thead><tr>
        <th class="name">Стадія</th><th class="name">Суперник</th><th>Ігри</th><th>Сума</th></tr></thead><tbody>`;
      cm.forEach(c => {
        const won = c.me.sum > c.op.sum;
        h += `<tr><td class="name" style="color:var(--muted);font-size:13px">${esc(c.st)}</td>
          <td class="name">${whoHTML(season, c.op.p)}</td>
          <td class="legs">${c.me.g.map((g, i) => g + ':' + c.op.g[i]).join(' · ')}</td>
          <td class="score" style="color:${won ? 'var(--sky)' : 'var(--muted)'}">${c.me.sum} : ${c.op.sum}</td></tr>`;
      });
      h += `</tbody></table></div></div>`;
    }
  }
  return h;
}

/* ── роутер ───────────────────────────────────────────────────────── */
let cur = {s: 0, t: 'liga', p: null};

function tabsFor(season){
  const t = [['liga', 'Ліга']];
  if (season.cup) { t.push(['cup', 'Кубок']); t.push(['super', 'Super Cup']); }
  return t;
}

function go(s, t, p){
  cur = {s, t, p: p || null};
  location.hash = 's' + (s + 1) + '/' + t + (p ? '/p/' + encodeURIComponent(p) : '');
}

function draw(){
  const season = S[cur.s];
  document.getElementById('nav-season').innerHTML = S.map((x, i) =>
    `<button class="${i === cur.s ? 'on' : ''}" onclick="go(${i},'liga')">${esc(x.title)}</button>`).join('');
  document.getElementById('nav-stage').innerHTML = tabsFor(season).map(([k, n]) =>
    `<button class="${k === cur.t && !cur.p ? 'on' : ''}" onclick="go(${cur.s},'${k}')">${n}</button>`).join('');

  const v = document.getElementById('view');
  v.innerHTML = cur.p ? renderPlayer(season, cur.p)
    : cur.t === 'liga' ? renderLeague(season)
    : renderCup(season, cur.t);

  v.querySelectorAll('.who').forEach(b =>
    b.onclick = () => go(cur.s, cur.t, b.dataset.p));
  window.scrollTo({top: cur.p ? 0 : window.scrollY > 400 ? 400 : window.scrollY});
}

function fromHash(){
  const m = /^#s(\d)\/(\w+)(?:\/p\/(.+))?$/.exec(location.hash || '');
  if (!m) { cur = {s: 0, t: 'liga', p: null}; draw(); return; }
  const s = Math.min(Math.max(+m[1] - 1, 0), S.length - 1);
  const tabs = tabsFor(S[s]).map(x => x[0]);
  cur = {s, t: tabs.includes(m[2]) ? m[2] : 'liga', p: m[3] ? decodeURIComponent(m[3]) : null};
  draw();
}

window.addEventListener('hashchange', fromHash);
fromHash();
</script>
