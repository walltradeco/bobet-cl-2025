<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Профіль · BoOrbit (STAGE)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<!-- шрифти BoBet — лише для екрана входу (вхід спільний для всіх ліг) -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1014; --panel:#15191e; --panel2:#1a1f25; --panel3:#20262d;
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.14);
  --text:#f2efe7; --copy:#a9adb0; --text-dim:#767c82;
  --gold:#d9b45b; --gold-rgb:217,180,91; --gold-d:#8a7228;
  --blue:#7e9dbb; --blue-rgb:126,157,187; --blue-d:#3a597e;
  --green:#18b47a; --green-soft:rgba(24,180,122,0.14);   /* лише екран входу */
  --red:#d87976;
  --mono:'Rajdhani',system-ui,sans-serif; --body:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 520px at 88% -12%, rgba(var(--blue-rgb),.09) 0%, transparent 40%), var(--bg)}
body:has(#screen-login:not(.hide)){background:radial-gradient(60% 60% at 50% -5%,rgba(46,139,87,.10),transparent 60%),#1B1B1B}
h1,h2,h3,h4{font-family:var(--mono);letter-spacing:.01em;margin:0}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--mono);cursor:pointer;color:inherit}
.hide{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.13em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:26px;border:1px dashed var(--line2);border-radius:14px;text-align:center;color:var(--text-dim);font-size:13px}
.sum{font-size:13px;color:var(--text-dim)}

/* топбар */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 0 8px}
.logo{display:flex;align-items:center;gap:11px}
.logo .sq{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#aac0d3;
  border:1px solid rgba(var(--blue-rgb),.28);background:linear-gradient(145deg,rgba(var(--blue-rgb),.15),rgba(var(--gold-rgb),.07))}
.logo h1{font-size:21px;line-height:1}
.logo .sub{font-size:11px;color:var(--text-dim);letter-spacing:.16em;text-transform:uppercase}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--copy)}
.stage-badge{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--red);border:1px solid rgba(201,108,105,.55);border-radius:6px;padding:2px 8px;letter-spacing:.1em}
.who b{color:var(--text)}
.abadge{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.1em}
button.ghost{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);padding:8px 13px;font-size:13px;color:var(--text)}
button.primary{background:var(--gold);color:#1a1206;border:none;border-radius:9px;padding:9px 16px;font-weight:700;font-size:13px}

/* герой профілю */
.hero{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;
  min-height:172px;padding:26px 28px;overflow:hidden;border:1px solid var(--line);border-radius:20px;margin-top:6px;
  background:linear-gradient(115deg,rgba(var(--blue-rgb),.08),transparent 42%),var(--panel)}
.hero.champ{border-color:rgba(var(--gold-rgb),.22);
  background:radial-gradient(circle at 80% 10%,rgba(var(--gold-rgb),.13),transparent 34%),linear-gradient(115deg,rgba(var(--blue-rgb),.10),transparent 38%),var(--panel)}
.hero.champ::before{content:"";position:absolute;left:-1px;top:20px;bottom:20px;width:4px;border-radius:0 5px 5px 0;
  background:linear-gradient(180deg,var(--gold),var(--blue));box-shadow:0 0 18px rgba(var(--gold-rgb),.28)}
.frame{position:relative;width:104px;height:104px;display:grid;place-items:center;border-radius:30px;flex:none}
.frame .av{font-family:var(--mono);font-weight:700;font-size:34px;color:#e9e4d8;letter-spacing:.02em;line-height:1}
.frame.plain{border:1px solid var(--line2);background:var(--panel2)}
.frame.champ{border:1px solid rgba(var(--gold-rgb),.76);background:linear-gradient(145deg,rgba(var(--gold-rgb),.18),rgba(var(--blue-rgb),.12));
  box-shadow:0 0 0 5px var(--panel),0 0 0 6px rgba(var(--gold-rgb),.28),0 14px 34px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.10)}
.frame.champ.glow{box-shadow:0 0 0 5px var(--panel),0 0 0 6px rgba(var(--gold-rgb),.28),0 14px 34px rgba(0,0,0,.30),0 0 26px rgba(var(--gold-rgb),.13),inset 0 1px 0 rgba(255,255,255,.10)}
.frame.champ::after{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.06);border-radius:23px}
.frame.psl{--gold-rgb:166,194,215}
.frame.squad{--gold-rgb:125,184,232}
.crown-seal{position:absolute;right:-9px;bottom:-8px;z-index:2;width:34px;height:34px;display:grid;place-items:center;
  border:3px solid var(--panel);border-radius:50%;color:#1a1b1c;background:var(--gold);box-shadow:0 5px 14px rgba(0,0,0,.3)}
.identity{min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.champ-label .cl-seal{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--gold);color:#1a1b1c;flex:none}
.champ-label .cl-seal .ic{width:11px;height:11px;stroke-width:2}
.champ-label{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border:1px solid rgba(var(--gold-rgb),.45);border-radius:20px;
  color:var(--gold);background:rgba(var(--gold-rgb),.08);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em}
.champ-season{color:var(--text-dim);font-size:10px;letter-spacing:.1em;font-family:var(--mono);text-transform:uppercase}
.identity h2{font-size:31px;line-height:1.05;letter-spacing:-.02em}
.who-sub{margin:6px 0 14px;color:var(--copy);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:20px}
.stat{display:flex;align-items:baseline;gap:5px}
.stat b{font-size:17px;font-weight:700;font-family:var(--mono)}
.stat span{color:var(--text-dim);font-size:11px}
.edit{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;
  background:rgba(255,255,255,.025);color:var(--copy);font-size:12px;font-weight:600;align-self:flex-start}
.edit .ic{width:14px;height:14px}
.hactions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

/* вкладки */
.tabs{display:flex;gap:3px;margin-top:17px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:0;background:transparent;color:var(--text-dim);padding:13px 15px 14px;white-space:nowrap;font-size:14px;font-weight:600}
.tab.on{color:var(--text)}
.tab.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;border-radius:2px;background:var(--gold);box-shadow:0 0 12px rgba(var(--gold-rgb),.18)}

/* сітка Огляду */
.ov{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,.72fr);gap:16px;align-items:start;margin-top:19px}
.col{display:grid;gap:14px;align-content:start}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:2px 2px 0}
.sec-head h3{font-size:18px}
.link{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}

/* трофейна вітрина */
.showcase{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(180px,.75fr);gap:12px}
.hero-tr{position:relative;min-height:250px;padding:22px;overflow:hidden;border:1px solid rgba(var(--gold-rgb),.26);border-radius:17px;
  background:radial-gradient(circle at 80% 16%,rgba(var(--gold-rgb),.15),transparent 38%),linear-gradient(135deg,rgba(var(--gold-rgb),.08),transparent 48%),var(--panel)}
.hero-tr::after{content:"";position:absolute;right:-42px;bottom:-68px;width:190px;height:190px;border:1px solid rgba(var(--gold-rgb),.11);border-radius:50%;
  box-shadow:0 0 0 25px rgba(var(--gold-rgb),.025),0 0 0 50px rgba(var(--gold-rgb),.018)}
.tr-top{display:flex;align-items:center;justify-content:space-between;color:var(--text-dim);font-size:10px;letter-spacing:.1em;font-family:var(--mono)}
.tr-mark{width:70px;height:70px;display:grid;place-items:center;margin:26px 0 18px;border:1px solid rgba(var(--gold-rgb),.30);border-radius:22px;
  color:var(--gold);background:rgba(var(--gold-rgb),.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);font-size:30px}
.hero-tr h4{position:relative;z-index:1;max-width:84%;font-size:22px;letter-spacing:-.01em}
.hero-tr p{position:relative;z-index:1;margin:8px 0 0;color:var(--copy);font-size:12px}
.mini-col{display:grid;grid-template-rows:1fr 1fr;gap:12px}
.mini-tr{display:flex;flex-direction:column;justify-content:space-between;padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.mini-ic{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:#a9bfd2;background:rgba(var(--blue-rgb),.12);font-size:16px}
.mini-tr strong{display:block;margin-top:15px;font-size:13px;font-weight:600}
.mini-tr span{display:block;margin-top:5px;color:var(--text-dim);font-size:10px}

/* картки-контейнери */
.card{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.card-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}
.collectible{position:relative;aspect-ratio:1024/1536;overflow:hidden;border-radius:12px;border:1px solid rgba(var(--blue-rgb),.19);background:#12161b;cursor:pointer}
.collectible.gold{border-color:rgba(var(--gold-rgb),.27)}
.collectible:hover{border-color:var(--blue)}
.collectible img{width:100%;height:100%;object-fit:contain;display:block}
.card-tag{position:absolute;left:8px;top:8px;z-index:2;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.13em;color:#9fc0da}
.gold .card-tag{color:var(--gold)}
.card-name{position:absolute;left:8px;right:8px;bottom:9px;z-index:2;font-size:9px;line-height:1.3;color:#dadddd;text-shadow:0 1px 3px rgba(0,0,0,.85)}

/* «де грає» */
.play-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.play-row:first-of-type{border-top:0}
.lg{font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:6px}
.lg.BoBet{background:rgba(var(--gold-rgb),.16);color:var(--gold);border:1px solid var(--gold-d)}
.lg.PSL{background:rgba(var(--blue-rgb),.16);color:var(--blue);border:1px solid var(--blue-d)}
.lg.Squad{background:rgba(125,184,232,.16);color:#8dc0ec;border:1px solid #3a5f8a}
.play-row .pn{flex:1;min-width:0;font-size:13px}
.play-row .pn small{color:var(--text-dim)}
.play-row .pp{font-family:var(--mono);font-weight:700;font-size:16px}
.play-row .pp small{font-size:11px;color:var(--text-dim);font-weight:500}

/* rail-картки */
.side{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.side-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.side-title>div{display:flex;align-items:center;gap:8px}
.side-title .ic{width:16px;height:16px;color:var(--blue)}
.side-title h4{font-size:15px}
.rec-list{display:grid;margin-top:12px}
.rec{padding:11px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec-h{display:flex;align-items:center;justify-content:space-between;gap:14px}
.rec span{color:var(--text-dim);font-size:11px}
.rec strong{font-size:15px;font-weight:600;font-family:var(--mono)}
.rec-n{color:var(--text-dim);font-size:11px;line-height:1.45;margin-top:5px}
.portrait-box{margin-top:12px;padding:15px;border-radius:13px;background:linear-gradient(135deg,rgba(var(--blue-rgb),.10),transparent),var(--panel2)}
.portrait-box strong{display:block;font-size:16px}
.portrait-box p{margin:6px 0 12px;color:var(--text-dim);font-size:11px;line-height:1.5}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.trait{padding:5px 8px;border:1px solid var(--line);border-radius:7px;color:#9da3a6;font-size:10px}
.comm-list{display:grid;gap:9px;margin-top:12px}
.comm{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.014)}
.comm-ic{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:rgba(var(--blue-rgb),.10);font-size:18px}
.comm-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600}
.comm-copy span{display:block;margin-top:3px;color:var(--text-dim);font-size:10px}
.owner{padding:3px 7px;border:1px solid rgba(var(--gold-rgb),.30);border-radius:6px;color:var(--gold);font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em}
.founder{padding:3px 9px;border:1px solid var(--line);border-radius:20px;color:var(--text-dim);font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.04em;white-space:nowrap}

/* окремі панелі вкладок */
.panel{padding:22px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}
.panel-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.panel-title h3{font-size:21px}
.panel-title p{margin:5px 0 0;color:var(--text-dim);font-size:11px}
.title-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.title-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid rgba(var(--gold-rgb),.32);border-radius:14px;
  background:radial-gradient(circle at 88% -10%,rgba(var(--gold-rgb),.14),transparent 60%),var(--panel2)}
.title-card .tc-ic{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:11px;font-size:20px;background:rgba(var(--gold-rgb),.14);border:1px solid rgba(var(--gold-rgb),.32)}
.title-card strong{display:block;font-size:14px;color:var(--gold);letter-spacing:.01em}
.title-card span{display:block;color:var(--text-dim);font-size:11px;margin-top:2px}
.tc-show{margin-left:auto;flex:none;background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--copy);border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.tc-show:hover{border-color:rgba(231,201,121,.6);color:#e7c979}
  /* ===== Вікно «Показати кубок» (сцена+трофей від ChatGPT, картинки в trophies/) ===== */
  #trophy-lb{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;
    background:rgba(5,8,7,.9);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);padding:3vh 3vw}
  #trophy-lb.open{display:flex}
  #trophy-lb .tl-stage{perspective:1500px;display:flex;align-items:center;justify-content:center}
  #trophy-lb .tl-frame{position:relative;display:inline-block;border-radius:18px;
    box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(214,175,86,.38),0 0 90px rgba(214,175,86,.16);
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .14s ease-out;will-change:transform}
  #trophy-lb img{display:block;max-width:94vw;max-height:92vh;width:auto;height:auto;border-radius:18px}
  /* текст на табличках: назва й ім'я підставляються з даних (rename-safe), розмір від ширини картинки (--fw) */
  #trophy-lb .tl-plate{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#2c1f07;
    text-shadow:0 1px 0 rgba(255,236,170,.65),0 -1px 0 rgba(60,38,6,.25);pointer-events:none}
  #trophy-lb .tl-plate b{display:block;font-weight:700;line-height:1.12;white-space:nowrap;letter-spacing:.02em;font-size:calc(var(--fw,600px)*var(--k2,.056))}
  #trophy-lb .tl-plate i{display:block;font-style:normal;font-weight:600;line-height:1.2;white-space:nowrap;letter-spacing:.12em;text-transform:uppercase;font-size:calc(var(--fw,600px)*var(--k1,.030))}
  #trophy-lb.gal .tl-plate i{letter-spacing:.05em}
  #trophy-lb.gal .tl-plate{--k1:.0078;--k2:.0138}
  #trophy-lb .tl-close{position:absolute;top:16px;right:18px;background:rgba(20,28,24,.85);color:#e9eadf;
    border:1px solid rgba(214,175,86,.4);border-radius:10px;font:600 14px/1 'IBM Plex Mono',monospace;
    padding:10px 14px;cursor:pointer}
  #trophy-lb .tl-close:hover{border-color:#e7c979;color:#e7c979}
  @media (prefers-reduced-motion:reduce){#trophy-lb .tl-frame{transition:none;transform:none!important}}

.cup-h{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin:0 0 11px}
.cup-h+.cup-h,.title-strip+.cup-h{margin-top:22px}
/* ── Огляд-конструктор ── */
.ovhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ovhead h3{font-size:21px}
.ovbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.03);color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.ovbtn:hover{border-color:var(--gold-d)}
.ovbtn.gold{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.ovbtn.reset{margin-right:auto}
.ovmod{margin-bottom:26px}
.ovmod:last-child{margin-bottom:0}
.ovmod-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.ovmod-h .t{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);display:flex;gap:7px;align-items:center}
/* редактор */
.ed-hint{color:var(--text-dim);font-size:12px;margin-bottom:16px}
.ed-mod{border:1px solid var(--line);border-radius:14px;background:var(--panel2);margin-bottom:12px;overflow:hidden}
.ed-mod.off{opacity:.55}
.ed-row{display:flex;gap:12px;align-items:center;padding:14px 16px}
.ed-name{flex:1;min-width:0;font-family:var(--mono);font-weight:700;font-size:15px;display:flex;gap:9px;align-items:center}
.ed-name .badge{font-family:var(--body);font-size:10px;font-weight:600;color:var(--text-dim);border:1px solid var(--line);border-radius:20px;padding:2px 8px;white-space:nowrap}
.sw{width:42px;height:24px;border-radius:20px;border:1px solid var(--line2);background:var(--panel3);position:relative;cursor:pointer;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-dim);transition:.15s}
.sw.on{background:rgba(24,180,122,.25);border-color:var(--green)}
.sw.on::after{left:20px;background:var(--green)}
.arrows{display:flex;gap:5px}
.colsw{display:flex;gap:0;margin-left:auto;margin-right:12px;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.cbtn{background:transparent;border:0;color:var(--copy);font-size:12px;padding:6px 12px;cursor:pointer}
.cbtn.on{background:rgba(214,175,86,.18);color:#e7c979;font-weight:700}
.colsw+.arrows{margin-left:0}
.arw{width:30px;height:30px;border:1px solid var(--line2);border-radius:8px;background:rgba(255,255,255,.03);color:var(--copy);cursor:pointer;font-size:15px;line-height:1}

.sqfull{position:fixed;inset:0;z-index:120;background:rgba(5,8,6,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.sqfull .sqx{position:absolute;top:20px;right:24px;width:40px;height:40px;border:1px solid #3a4550;border-radius:50%;background:#161b21;color:var(--text);font-size:20px;cursor:pointer;z-index:130}
.sqfull .stage{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background-size:cover;background-position:center;perspective:1500px}
.sqfull .glow{position:absolute;left:50%;top:36%;width:50%;height:64%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.10),transparent 66%);animation:sqglow 4s ease-in-out infinite}
@keyframes sqglow{0%,100%{opacity:.5}50%{opacity:1}}
.sqfull .contact{position:absolute;left:50%;bottom:12%;width:21%;height:2.4%;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(0,0,0,.4),transparent 72%);filter:blur(9px);z-index:1}
.sqfull .podium-card{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 26px 30px rgba(0,0,0,.5))}
.sqfull .tilt{position:relative;transform-origin:bottom center;transform:rotateX(3deg) rotateY(-10deg);transform-style:preserve-3d;animation:sqsway 6s ease-in-out infinite}
@keyframes sqsway{0%,100%{transform:rotateX(3deg) rotateY(-14deg)}50%{transform:rotateX(3deg) rotateY(-2deg)}}
.sqfull .podium-card img.rarepng{width:auto;height:min(72vh,140vw);display:block}
.sqfull .podium-card.mega{bottom:19%}   /* mega росте вниз (знизу є місце) — 04.10: rare 72% / mega 75% */
.sqfull .podium-card.mega img.rarepng{height:min(75vh,140vw)}
.sqfull .tilt.fx{-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}
.sqfull .tilt.fx::before{content:"";position:absolute;top:-20%;left:-70%;width:55%;height:150%;z-index:6;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.30),transparent);transform:skewX(-16deg);animation:sqglint 4.8s ease-in-out infinite}
@keyframes sqglint{0%,12%{left:-70%}60%{left:130%}100%{left:130%}}
.sqfull .stage.mega .tilt.fx::before{content:none}
.sqfull .stage.mega .glow{background:radial-gradient(ellipse at center,rgba(230,193,75,.16),transparent 66%)}
.sqfull .podium-card.mega{animation:sqmegafloat 4.6s ease-in-out infinite}
@keyframes sqmegafloat{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-2.4%)}}
.sqfull .podium-card.mega img.rarepng{animation:sqcolorpulse 2.5s ease-in-out infinite}
@keyframes sqcolorpulse{0%,100%{filter:saturate(1) brightness(1)}50%{filter:saturate(1.42) brightness(1.15)}}
@media(prefers-reduced-motion:reduce){.frame.champ.glow,.sqfull .tilt,.sqfull .glow,.sqfull .tilt.fx::before,.sqfull .podium-card.mega,.sqfull .podium-card.mega img.rarepng{animation:none}}

// ── boot ──
async function boot(){
  // ⚡ ШВИДКІСТЬ: дані чужого/запитаного профілю (?id=) тягнемо ПАРАЛЕЛЬНО з перевіркою сесії,
  // а не після неї (раніше: сесія → профіль юзера → overview → 7 RPC → layout → fallback → DNA — усе послідовно)
  const urlId0=new URLSearchParams(location.search).get('id');
  let pre = urlId0 ? fetchProfileData(urlId0) : null;
  const { data:{ session } } = await sb.auth.getSession();
  S.me = session ? session.user.id : null;
  if(S.me){
    try{
      const { data } = await sb.from('profiles').select('display_name,is_platform_admin').eq('id',S.me).maybeSingle();
      if(data){ S.name=data.display_name; S.isAdmin=!!data.is_platform_admin; }
    }catch(e){}
    $('who').classList.remove('hide');
    $('who').innerHTML=`<b>${esc(S.name||'ти')}</b>${S.isAdmin?' <span class="abadge">АДМІН</span>':''}`;
    $('btn-login').classList.add('hide'); $('btn-logout').classList.remove('hide');
  }
  const urlId=new URLSearchParams(location.search).get('id');
  S.view = urlId || S.me;
  S.isOwn = !!(S.view && S.view===S.me);

  if(!S.view){
    $('phead').innerHTML=`<section class="hero"><div class="frame plain"><span class="av">👤</span></div>
      <div class="identity"><h2>Твій профіль</h2><div class="who-sub">Увійди, щоб відкрити свій профіль, або відкрий чийсь за посиланням.</div>
      <button class="primary" id="go-login">Увійти</button></div></section>`;
    $('go-login').onclick=showLogin; $('ptabs').innerHTML=''; $('ptab').innerHTML='';
    return;
  }
  // свій профіль без ?id= — S.view відомий лише після сесії, тож запит стартує тут
  if(!pre || urlId0!==S.view) pre = fetchProfileData(S.view);
  await loadProfile(pre);
}

// усі дані профілю ОДНИМ паралельним залпом (overview + 7 RPC + розкладка вітрини)
function fetchProfileData(id){
  // ⚠️ 01.10: під паралельним залпом (9 запитів) база інколи віддає 57014 «statement timeout» на важких функціях
  // (profile_tournaments / nominations / portrait) — тоді блок «Зараз грає»/рекорди мовчки зникали. Повторюємо до 3 разів
  // із наростаючою паузою; після невдач — [] (профіль не ламається).
  const R=(fn,args)=>{
    const run=n=>sb.rpc(fn,args).then(r=>{
      if(r.error){ if(n<2) return new Promise(res=>setTimeout(res,400*(n+1))).then(()=>run(n+1)); return []; }
      return r.data||[];
    }).catch(()=>n<2?new Promise(res=>setTimeout(res,400*(n+1))).then(()=>run(n+1)):[]);
    return run(0);
  };
  const loadLay=cols=>sb.from('profile_layout').select(cols).eq('profile_id',id).maybeSingle()
    .then(r=>r.error?{fail:true}:{data:r.data}).catch(()=>({fail:true}));
  const layP=(async()=>{   // module_col (476) може ще не існувати → пробуємо з ним, далі без нього
    let lr=await loadLay('module_order,module_on,featured,module_col');
    if(lr.fail) lr=await loadLay('module_order,module_on,featured');
    return lr.data||null;
  })();
  return Promise.all([
    (async()=>{   // bio (478) може ще не існувати → пробуємо з нею, далі без неї (профіль не ламається)
      const base='profile_id,display_name,avatar_emoji,avatar_color,tournaments_count,cards_count,communities_count,medals_count,title_count,is_champion,champion_league,honor_name,show_champion';
      const q=async cols=>{ try{ return await sb.from('profile_overview').select(cols).eq('profile_id',id).maybeSingle(); }
        catch(e){ return { error:e }; } };
      // ⚠️ 01.10: разовий 57014 (statement timeout) на overview малював «Профіль не знайдено» — тепер до 4 спроб:
      // відсутня колонка bio → одразу без неї; будь-який інший збій (таймаут, мережа) → пауза 400/800/1200 мс і знову.
      let cols=base+',bio', r={ error:true };
      for(let n=0;n<4;n++){
        r=await q(cols);
        if(!r.error) break;
        if(cols!==base && /bio|column/i.test((r.error&&r.error.message)||'')){ cols=base; continue; }
        await new Promise(res=>setTimeout(res,400*(n+1)));
      }
      return (r&&r.data)||null;
    })(),
    R('profile_tournaments',{ p_profile:id }),
    sb.from('card_shop').select('card_key,tier,kind,png_path,owner_profile_id').eq('owner_profile_id',id).order('tier').order('card_key').then(r=>r.error?[]:(r.data||[])).catch(()=>[]),
    R('profile_communities',{ p_profile:id }),
    R('profile_trophies',{ p_profile:id }),
    R('profile_records',{ p_profile:id }),
    R('profile_portrait',{ p_profile:id }),
    R('profile_nominations',{ p_profile:id }),
    layP,
    R('profile_history',{ p_profile:id }),    // 489: «Де грав» (відсутня функція → [] → лише «Зараз грає»)
    BC?BC.load(sb,'profile',id):Promise.resolve(null)   // 492: рамка/ефект/скін/тема (немає таблиці → дефолт)
  ]);
}

async function loadProfile(pre){
  const [ov,t,c,m,tr,rec,por,nm,lay,hist,cos]=await pre;
  S.ov=ov; S.cos=cos||null;
  if(!ov){
    $('phead').innerHTML=`<section class="hero"><div class="frame plain"><span class="av">👤</span></div>
      <div class="identity"><h2>Профіль не знайдено</h2></div></section>`;
    $('ptabs').innerHTML=''; $('ptab').innerHTML=''; return;
  }
  S.tours=HIDE_TEST_TOURS?(t||[]).filter(x=>!isTestTour(x)):t; S.cards=c; S.comms=m; S.noms=nm;
  // 487: PSL-архів у трофеях. «Ціль» (phase_kind=psl_goal) — НЕ медаль: окремий список, у медалі/кубки не потрапляє
  S.trophies=(tr||[]).filter(x=>x.phase_kind!=='psl_goal'); S.goals=(tr||[]).filter(x=>x.phase_kind==='psl_goal');
  S.hist=hist||[];
  S.records=rec[0]||null; S.portrait=por[0]||null;
  // запрошення/заявки — лише на СВОЄМУ профілі (blocks у вкладці «Спільноти»)
  S.pending = S.isOwn ? await sb.rpc('my_community_pending',{}).then(r=>r.error?[]:(r.data||[])).catch(()=>[]) : [];
  // розкладка вітрини «Огляд» (конструктор, 465); немає → дефолт
  S.layout = lay ? { order:(lay.module_order||OV_ORDER_DEF.slice()),
                     on:(lay.module_on||{}), feat:(lay.featured||{}), cols:(lay.module_col||{}) } : null;
  S.dna=null; S.dnaLoaded=false;   // ⚡ DNA (11 запитів) — ліниво, при відкритті вкладки «Портрет»
  renderHead(); renderTabs(); renderTab();
}

// повний DNA-портрет (ті самі вьюхи, що на борді у «Портретах гравців»), по одній людині
async function loadDna(P){
  const g=(tbl,q)=>{ let r=sb.from(tbl).select('*').eq('person',P); if(q) r=q(r); return r.then(x=>x.error?[]:(x.data||[])).catch(()=>[]); };
  const [prof,arch,score,team,rhythm,bonus,pair,belief,shape,vs,skind]=await Promise.all([
    g('dna_profile'), g('dna_archetype'), g('dna_score',r=>r.order('rn')),
    g('dna_team',r=>r.gte('backed',4).order('weighted_pct',{ascending:false}).order('backed',{ascending:false})),
    g('dna_rhythm'), g('dna_bonus'),
    g('dna_pair',r=>r.order('same_pct',{ascending:false})),
    g('dna_belief',r=>r.gte('played',4).order('belief_diff',{ascending:false}).order('played',{ascending:false})),
    g('dna_shape'), g('dna_vs_league',r=>r.order('tournament_order')),
    g('dna_score_kind',r=>r.order('kind').order('rn'))
  ]);
  S.dna={ profile:prof[0]||null, arch:arch[0]||null, score, team, rhythm:rhythm[0]||null,
    bonus, pair, belief, shape:shape[0]||null, vs, scoreKind:skind };
}

function renderHead(){
  const ov=S.ov, name=ov.display_name||'Гравець';
  // чемпіонські відзнаки (корона+рамка+бейдж) — ОПЦІЯ: показуються лише якщо чемпіон І не вимкнув їх
  const champ=!!ov.is_champion && ov.show_champion!==false, theme=CHAMP_THEME[ov.champion_league]||'';
  const col = (ov.avatar_color && /^#[0-9a-fA-F]{6}$/.test(ov.avatar_color)) ? ov.avatar_color : null;
  const avInner = esc(initials(name));                        // емодзі-аватар прибрано — лише ініціали
  const avStyle = '';                                         // аватар БЕЗ кольору (колір лише на шапці)
  // 492 фаза 3 + 493: серверні чемпіонські шари (лише ліга BoBet): 1 титул → supreme, 2+ → dynasty. Показуються, коли людина чемпіон
  // і НЕ вимкнула відзнаки (champ). КОЖЕН елемент (badge/caption/crown/frame/rays/hall) чемпіон вмикає окремо (cfg.parts, SQL 493):
  // вимкнений → власний стиль у власному кольорі; «золота рамка» разом з власною формою/скіном = ця форма у золоті.
  const bobetChamp = !!(BC && champ && (!ov.champion_league || ov.champion_league==='bobet'));
  const nTitles = Math.max(1, ov.title_count||0);
  const tier = bobetChamp ? (bcSafe('champTier',nTitles)||null) : null;
  const legacyChamp = champ && !tier;                          // чемпіон без нових шарів (нема cosmetics-файла / не BoBet) — старий вигляд
  const own = (BC && S.cos) ? S.cos : null;                    // власний вибір: рамка/скін, ефект, тема, елементи
  const parts = tier ? ((own && own.parts) || (BC.PARTS_ALL||['badge','caption','crown','frame','hall','rays'])) : [];
  const has = k => parts.indexOf(k)>=0;
  const GOLD = (BC && BC.CHAMP_GOLD) || '#d9b45b';
  const hdrCfg = tier ? own : (champ ? null : own);            // що малювати на шапці (champ без tier → як раніше, нічого)
  const goldFrame = !!(tier && has('frame'));
  const chosenShape = !!(hdrCfg && (hdrCfg.frame!=='default' || hdrCfg.skin!=='default'));
  const classicGold = !!(goldFrame && !chosenShape);           // стандартна золота чемпіонська рамка (supreme/dynasty)
  const framed = chosenShape;                                  // власна рамка/скін замінює градієнт кольору шапки
  const crownInFrame = legacyChamp || (classicGold && has('crown'));
  const frame = (legacyChamp || classicGold)
    ? `<div class="frame champ glow ${theme}"><span class="av"${avStyle}>${avInner}</span>${crownInFrame?`<span class="crown-seal">${crownIc(19)}</span>`:''}</div>`
    : `<div class="frame plain"><span class="av"${avStyle}>${avInner}</span></div>`;
  // корона для решти випадків — окремо на шапці (рамка аватара з clip-path обрізала б її всередині)
  const heroSeal = (tier && has('crown') && !classicGold) ? `<span class="crown-seal hero-seal">${crownIc(19)}</span>` : '';
  const heroStyle = (col && !framed) ? ` style="background:linear-gradient(115deg,${col}59,${col}2e 55%,${col}17)"` : '';

  // чемпіонський бейдж + титули
  let eyebrow='';
  if(legacyChamp || (tier && has('badge'))){
    eyebrow=`<div class="eyebrow"><span class="champ-label"><span class="cl-seal">${crownIc(13)}</span>${CHAMP_LEAGUE[ov.champion_league]||'BOBET'} CHAMPION</span></div>`;
  }
  // підзаголовок — лише ДЕВІЗ власника (478); архетип/«учасник ліги» прибрано (дублюють Портрет/Рекорди)
  const bio=(ov.bio||'').trim();

  const stat=`<div class="stats">
    <div class="stat"><b>${num(ov.medals_count)}</b><span>медал${ov.medals_count===1?'ь':(ov.medals_count>=2&&ov.medals_count<=4?'і':'ей')}</span></div>
    <div class="stat"><b>${num(ov.tournaments_count)}</b><span>${plural(ov.tournaments_count||0,'турнір','турніри','турнірів')}</span></div>
    ${HIDE_CARDS?'':`<div class="stat"><b>${num(ov.cards_count)}</b><span>карток</span></div>`}
    <div class="stat"><b>${num(ov.communities_count)}</b><span>спільнот${ov.communities_count===1?'а':''}</span></div>
  </div>`;

  // підпис «переможець …» — лише чемпіон ліги BoBet з увімкненим елементом «Підпис»; імена титулів — із трофеїв (isTitle = перемога загального заліку)
  let titleLine='';
  if(tier && has('caption')){
    const names=[...new Set((S.trophies||[]).filter(isTitle).map(t=>t.tournament))].slice(0,3);
    titleLine=`<div class="title-list"><b>${nTitles>1?`Переможець ${nTitles} турнірів`:'Переможець турніру'}</b>${names.length?' · '+names.map(esc).join(' · '):''}</div>`;
  }

  let actions='';
  if(S.isOwn){
    actions=`<div class="hactions">
      <button class="edit" id="a-edit">${ic('sliders')}Керувати профілем</button>
      <div class="launch">${HIDE_CARDS?'':`<a href="shop-stage.html">${ic('layers',13)}Крамниця</a>`}<a href="community-stage.html">👥 Спільноти</a></div>
    </div>`;
  }
  $('phead').innerHTML=`<section class="hero${(legacyChamp||classicGold)?' champ':''}"${heroStyle}>${frame}
    <div class="identity">${eyebrow}<h2>${esc(name)}</h2>${bio?`<div class="who-sub">${esc(bio)}</div>`:''}${stat}${titleLine}</div>
    ${actions}${heroSeal}</section>`;
  const hero=$('phead').querySelector('.hero');
  // золота рамка → власна форма/скін/ефект у ЗОЛОТІ; інакше — у власному кольорі. Dynasty із золотом: більший аватар (124px)
  const hdrAccent = goldFrame ? GOLD : (col||'#7e9dbb');
  const avSize = (tier==='dynasty' && goldFrame) ? 124 : 104;
  if(hdrCfg) bcSafe('apply',hero,hdrCfg,{avatar:'.frame',identity:'.identity',accent:hdrAccent,size:avSize,pad:28});
  if(BC){
    bcSafe('applyChamp',hero,tier,{size:avSize,pad:28,gold:goldFrame,rays:has('rays')});
    // сторінка: «Зал чемпіона» (золото) → champion_hall або власна тема у золоті; без залу — власна тема у власному кольорі
    if(tier){
      const c=own||BC.none();
      if(has('hall')){
        if(c.theme==='default') bcSafe('applyChampEnv',$('screen-profile'),{content:'#ptab',effect:c.effect});
        else bcSafe('applyEnv',$('screen-profile'),c,{accent:GOLD,content:'#ptab'});
      } else bcSafe('applyEnv',$('screen-profile'),c,{accent:col||'#7e9dbb',content:'#ptab'});
    } else bcSafe('applyEnv',$('screen-profile'),hdrCfg||BC.none(),{accent:col||'#7e9dbb',content:'#ptab'});
  }
  if(S.isOwn){ const e=$('a-edit'); if(e) e.onclick=openEdit; }
}

function renderTabs(){
  $('ptabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${l}</button>`).join('');
  $('ptabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; renderTabs(); renderTab(); });
}
function goTab(k){ S.tab=k; renderTabs(); renderTab(); window.scrollTo({top:0,behavior:'smooth'}); }

// ── головний трофей + міні ──
function trophyMain(){                                  // головний трофей: general спершу, вища медаль, при рівності — за ОЧКАМИ
  if(!S.trophies.length) return null;
  return S.trophies.slice().sort((a,b)=>
    (a.phase_kind==='general'?0:1)-(b.phase_kind==='general'?0:1) || a.place-b.place || b.points-a.points
  )[0];
}
function trophyTitle(t){
  const medalWord = t.place===1?'Чемпіон':t.place===2?'Віце-чемпіон':t.place===3?'Бронза':t.place+' місце';
  return t.phase_kind==='general' ? `${medalWord} · ${t.tournament}` : `${t.medal} ${t.tournament} · ${t.phase}`;
}
// Титул (перемога загального заліку) = КУБОК 🏆, а не медаль; решта — медаль
function isTitle(t){ return !!(t && t.phase_kind==='general' && t.place===1); }
function trophyMark(t){ return isTitle(t) ? '🏆' : (t ? t.medal : ''); }

function renderTab(){
  const box=$('ptab');
  if(S.tab!=='overview') S.ovEdit=null;   // редактор вітрини живе лише на Огляді
  if(S.tab==='overview') return renderOverview(box);
  if(S.tab==='trophies') return renderTrophies(box);
  if(S.tab==='collection') return renderCollection(box);
  if(S.tab==='records') return renderRecords(box);
  if(S.tab==='portrait') return renderPortrait(box);

// ── ОГЛЯД (конструктор із модулів) ──
function ovEffLayout(){                                   // ефективна розкладка (збережена або дефолт)
  if(S.layout){
    const order=(S.layout.order||[]).filter(k=>OVMODS[k]);
    OV_ORDER_DEF.forEach(k=>{ if(!order.includes(k)) order.push(k); });  // нові модулі майбутнього
    const on={}; OV_ORDER_DEF.forEach(k=>{ on[k]=(S.layout.on&&k in S.layout.on)?!!S.layout.on[k]:true; });
    return { order, on, cols:Object.assign({},S.layout.cols||{}) };
  }
  return { order:OV_ORDER_DEF.slice(), on:Object.fromEntries(OV_ORDER_DEF.map(k=>[k,true])), cols:{} };
}
function ovItems(k){                                      // усі елементи модуля
  if(k==='cups')       return S.trophies.filter(isTitle).slice().sort((a,b)=>a.tournament_order-b.tournament_order);
  if(k==='medals')     return S.trophies.slice().sort((a,b)=>a.place-b.place||a.tournament_order-b.tournament_order);
  if(k==='records')    return S.noms;
  if(k==='collection') return S.cards;
  return [];
}
function ovId(k,it){                                      // стабільний id елемента
  if(k==='cups'||k==='medals') return it.tournament_order+'|'+it.phase;
  if(k==='records')            return String(it.sort_order);
  if(k==='collection')         return it.card_key;
  return '';
}
function ovPick(k){                                       // обрані елементи (порожньо → авто топ-N)
  const items=ovItems(k); if(!OVMODS[k].pick) return items;
  const f=(S.layout&&S.layout.feat&&S.layout.feat[k])||[];
  if(f.length) return items.filter(it=>f.includes(ovId(k,it)));
  const n=OV_AUTO_N[k]; return n?items.slice(0,n):items;
}
function ovChipLabel(k,it){
  if(k==='cups')       return '🏆 '+esc(it.tournament);
  if(k==='medals')     return esc(it.medal+' '+it.tournament+' · '+it.phase);
  if(k==='records')    return esc(it.nomination+' · '+it.value);
  if(k==='collection') return esc((RAR[it.tier]||it.tier)+' '+it.card_key.replace(/_/g,' '));
  return '';
}

}

function openTrophy(key,name){
  let lb=document.getElementById('trophy-lb');
  if(!lb){
    lb=document.createElement('div'); lb.id='trophy-lb';
    lb.innerHTML='<button class="tl-close" type="button">Закрити ✕</button><div class="tl-stage"><div class="tl-frame"><img alt="Кубок"></div></div>';
    document.body.appendChild(lb);
    const img=lb.querySelector('img'), fr=lb.querySelector('.tl-frame');
    const close=()=>{ lb.classList.remove('open'); img.removeAttribute('src'); fr.querySelectorAll('.tl-plate').forEach(n=>n.remove()); };
    const fit=()=>fr.style.setProperty('--fw',img.clientWidth+'px');
    img.addEventListener('load',fit); window.addEventListener('resize',fit);
    lb.addEventListener('click',e=>{ if(e.target===lb||e.target.closest('.tl-close')) close(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&lb.classList.contains('open')){ e.stopPropagation(); close(); } },true);
    lb.addEventListener('mousemove',e=>{            // легкий нахил за курсором
      const r=fr.getBoundingClientRect(), dx=(e.clientX-(r.left+r.width/2))/(r.width/2), dy=(e.clientY-(r.top+r.height/2))/(r.height/2);
      fr.style.setProperty('--ry',(Math.max(-1,Math.min(1,dx))*6)+'deg'); fr.style.setProperty('--rx',(Math.max(-1,Math.min(1,dy))*-4)+'deg'); });
    lb.addEventListener('mouseleave',()=>{ fr.style.setProperty('--ry','0deg'); fr.style.setProperty('--rx','0deg'); });
  }
  const fr=lb.querySelector('.tl-frame'), gal=key==='gallery';
  fr.querySelectorAll('.tl-plate').forEach(n=>n.remove());
  const plate=(k,x0,w,y0,h)=>{ const p=TROPHY_PLATE[k]; if(!p) return;
    const d=document.createElement('div'); d.className='tl-plate';
    d.style.cssText=`left:${x0}%;width:${w}%;top:${y0}%;height:${h}%`;
    const who=(k==='euroseason2026'||!name)?p[2]:name;                 // у профілі — актуальне ім'я власника (не міняється з rename)
    d.innerHTML='<b></b><i></i>'; d.firstChild.textContent=who; d.lastChild.textContent=gal?p[1]:p[0];
    if(gal&&p[1].length>12) d.style.setProperty('--k1','.0064');

  else plate(key,26.2,48.2,70.4,9.4);

function ovStartEdit(){
  const eff=ovEffLayout();
  S.ovEdit={ order:eff.order.slice(), on:Object.assign({},eff.on), cols:Object.assign({},eff.cols),
    feat:JSON.parse(JSON.stringify((S.layout&&S.layout.feat)||{})) };

function ovCancelEdit(){ S.ovEdit=null; renderTab(); }
function ovResetEdit(){ S.ovEdit={ order:OV_ORDER_DEF.slice(),
  on:Object.fromEntries(OV_ORDER_DEF.map(k=>[k,true])), cols:{}, feat:{} }; renderTab(); }
function ovSetCol(k,c){ S.ovEdit.cols[k]=c; renderTab(); }
function ovToggle(k){ S.ovEdit.on[k]=!S.ovEdit.on[k]; renderTab(); }
function ovMove(k,dir){                                     // рух ↑↓ у межах СВОЄЇ колонки
  const o=S.ovEdit.order, myc=ovColOf(k,S.ovEdit.cols);
  const col=o.filter(x=>ovColOf(x,S.ovEdit.cols)===myc);
  const idxs=o.map((x,i)=>col.includes(x)?i:-1).filter(i=>i>=0);   // позиції цієї колонки в order
  const pos=idxs.findIndex(i=>o[i]===k), j=pos+dir;
  if(j<0||j>=idxs.length) return;
  const a=idxs[pos], b=idxs[j]; [o[a],o[b]]=[o[b],o[a]]; renderTab();
}
function ovToggleFeat(k,id){ const f=S.ovEdit.feat[k]||(S.ovEdit.feat[k]=[]); const i=f.indexOf(id);
  if(i>=0) f.splice(i,1);
  else { const cap=OVMODS[k].cap; if(cap&&f.length>=cap){ alert('Максимум '+cap+' у модулі «'+OVMODS[k].name+'»'); return; } f.push(id); }
  renderTab(); }
async function ovSave(){

  if(error && /p_cols|PGRST202|Could not find/i.test((error.code||'')+(error.message||''))){
    // 476 ще не залитий — зберігаємо без колонок (вони не запамʼятаються)
    ({ error }=await sb.rpc('set_profile_layout',{ p_order:d.order, p_on:d.on, p_featured:d.feat }));
  }
  if(error){ alert('Не вдалось зберегти вітрину: '+(error.message||'')); return; }
  S.layout={ order:d.order.slice(), on:Object.assign({},d.on), feat:JSON.parse(JSON.stringify(d.feat)), cols };

}

      <div class="chips">${chips||'<span class="pl">Немає елементів для цього модуля</span>'}</div></div>`;

      <button class="arw" data-mod="${k}" data-dir="1" ${idx===colKeys.length-1?'disabled':''}>↓</button></div>
  </div>${picker}</div>`;
}

function renderTrophies(box){
  const goals=(S.goals||[]).slice().sort((a,b)=>a.tournament_order-b.tournament_order);
  if(!S.trophies.length && !goals.length){ box.innerHTML=`<section class="panel"><div class="empty">Нагороди зʼявляться після завершення турнірів. Медалі й рекорди підтягнуться автоматично.</div></section>`; return; }
  const medalCls=t=>t.place===1?'':t.place===2?'silver':'bronze';
  const awardCard=t=>`<article class="award ${medalCls(t)}"><span class="aw-ic">${esc(t.medal)}</span>
    <h4>${esc(t.tournament)} · ${esc(t.phase)}</h4><p>${esc(trophyLeagueLabel(t))} · ${esc(trophyPlaceLabel(t))}</p></article>`;
  const byPlace=(a,b)=>a.place-b.place||a.tournament_order-b.tournament_order;   // від золота до бронзи (як на борді)
  const bo=S.trophies.filter(t=>t.league!=='PSL'), ps=S.trophies.filter(t=>t.league==='PSL');
  // BOBET: КУБКИ — перемоги загального заліку (титули; чемпіон бере кубок, не медаль) + МЕДАЛІ
  const titles=bo.filter(isTitle).sort((a,b)=>a.tournament_order-b.tournament_order);
  const cupSec = titles.length ? `<h4 class="cup-h">🏆 Кубки</h4><div class="title-strip">${titles.map(cupCardHTML).join('')}</div>` : '';
  const boMedals=bo.slice().sort(byPlace);

  // PSuper League (487): МЕДАЛІ + «Ціль» окремою позначкою (це не медаль, у лічильник медалей не входить)
  const psMedals=ps.slice().sort(byPlace);
  const psSec = psMedals.length ? `${goals.length?'<h4 class="cup-h">Медалі</h4>':''}<div class="tr-grid">${psMedals.map(awardCard).join('')}</div>` : '';
  const goalSec = goals.length ? `<h4 class="cup-h"${psMedals.length?' style="margin-top:22px"':''}>🎯 Цілі</h4><div class="tr-grid">${goals.map(g=>`<article class="award goal"><span class="aw-ic">🎯</span>
    <h4>${esc(g.tournament)} · Ціль</h4><p>PSL · ціль досягнута</p></article>`).join('')}</div>` : '';
  // є PSL → ділимо вітрину на два блоки-ліги; немає — як було (без зайвого заголовка)

// ── СПІЛЬНОТИ ──
// Відповісти на запрошення (invite → прийняти/відхилити) або заявку
// (request → схвалити/відхилити), тоді освіжити pending + список спільнот.
async function respondPending(id, kind, ok){
  const fn  = kind==='invite' ? 'community_respond_invite' : 'community_respond_request';
  const arg = kind==='invite' ? { p_invite:id, p_accept:ok } : { p_invite:id, p_approve:ok };
  const { error }=await sb.rpc(fn, arg);
  if(error){ alert('Спільноти: '+(error.message||'не вдалось')); return; }
  const R=(f,a)=>sb.rpc(f,a).then(r=>r.error?[]:(r.data||[])).catch(()=>[]);
  S.pending = await R('my_community_pending',{});
  S.comms   = await R('profile_communities',{ p_profile:S.view });
  renderTab();
}

const _ord={BoBet:0,PSL:1,Squad:2};
function sortTours(a,b){ return (_ord[a.league]??9)-(_ord[b.league]??9); }
// ── «Історія турнірів» (489): «Зараз грає» (profile_tournaments, не завершені) + «Де грав» (profile_history + завершені живі) ──
// Рішення Богдана 01.10: ПРОСТИЙ ПЕРЕЛІК назв, без місць і без нагород. Число в заголовку = «Турніри» в шапці.
function histRow(lg,name,note){
  return `<div class="play-row"><span class="lg ${esc(lg)}">${esc(lg)}</span>
    <div class="pn">${esc(name)}${note?` <small>· ${note}</small>`:''}</div></div>`;
}
function historyBlock(){
  const tours=S.tours||[];
  const cur=tours.filter(x=>x.status!=='finished').sort(sortTours);
  const seen=new Set(), past=[];
  const addPast=(lg,name)=>{ const key=lg+'|'+name; if(!seen.has(key)){ seen.add(key); past.push({lg,name}); } };
  (S.hist||[]).forEach(h=>addPast(h.league,h.tournament));                           // архів: BoBet за часом, потім PSL (порядок із сервера)
  tours.filter(x=>x.status==='finished').sort(sortTours).forEach(x=>addPast(x.league,x.tournament_name));   // завершені живі (без дублю з архівом)
  if(!cur.length && !past.length) return '';
  const grp=(title,n,rows)=> n ? `<h4 class="cup-h">${title} <span style="opacity:.7">· ${n}</span></h4><div class="hist-grp">${rows}</div>` : '';
  return grp('Зараз грає',cur.length,cur.map(x=>histRow(x.league,x.tournament_name,STATUS_LABEL[x.status]||esc(x.status||''))).join(''))
       + grp('Де грав',past.length,past.map(x=>histRow(x.lg,x.name,'')).join(''));
}

// ── Вітрина: швидке відкриття (02.10), БЕЗ втрати якості ──
// А) прогресивний показ: миттєво мініатюра _sm.webp (малий файл), далі підміна на ПОВНИЙ арт, щойно він завантажений і декодований.
// Б) прогрів: сцена (+ повний арт) вантажаться, поки користувач лише наводить/торкається «Показати картку».
const showThumb=p=>String(p||'').replace(/\.png$/i,'_sm.webp');
const _warmRefs=[], _warmSet=new Set();
function warmUrl(u){ if(!u||_warmSet.has(u)) return; _warmSet.add(u); const im=new Image(); im.decoding='async'; im.src=u; _warmRefs.push(im); }
function warmScene(scene){ if(scene) warmUrl('scenes/'+scene+'.webp'); }
function hookWarm(btn,png,scene){ if(!btn) return; const go=()=>{ warmScene(scene); warmUrl(png); };
  ['pointerenter','focus','touchstart'].forEach(ev=>btn.addEventListener(ev,go,{once:true,passive:true})); }
function upgradeArt(el,full){   // el = .sqfull; thumb → повний арт (мініатюра лишається, якщо повний не завантажився)
  const im=el.querySelector('img.rarepng'), tilt=el.querySelector('.tilt'); if(!im||!full) return;
  im.addEventListener('error',()=>{ if(im.src.indexOf('_sm.webp')>=0) im.src=full; },{once:true});
  const big=new Image(); big.decoding='async'; try{ big.fetchPriority='high'; }catch(e){}
  let done=false;
  const swap=()=>{ if(done) return; done=true; if(!el.isConnected) return; im.src=full; if(tilt) tilt.style.setProperty('--m',"url('"+full+"')"); };
  // підміна по onload (надійно); decode() лише згладжує момент, а якщо він завис — через 400мс підміняємо все одно
  big.onload=()=>{ if(!big.decode){ swap(); return; } const t=setTimeout(swap,400); big.decode().then(()=>{ clearTimeout(t); swap(); },()=>{ clearTimeout(t); swap(); }); };
  big.src=full;
}
// ── showFullCard (порт shop-stage) ──
function showFullCard(c){
  const scene=SCENE[c.tier]||'rare', mega=(c.tier==='mega_rare');
  const el=document.createElement('div'); el.className='sqfull';
  el.innerHTML=`<button class="sqx" aria-label="закрити">✕</button>
    <div class="stage${mega?' mega':''}" style="background-image:url('scenes/${scene}.webp')">
      <div class="glow"></div><div class="contact"></div>
      <div class="podium-card${mega?' mega':''}"><div class="tilt fx" style="--m:url('${esc(showThumb(c.png_path))}')">
        <img class="rarepng" src="${esc(showThumb(c.png_path))}" alt="${esc(c.card_key.replace(/_/g,' '))}"></div></div>
    </div>`;
  el.onclick=e=>{ if(e.target===el||e.target.classList.contains('sqx')) el.remove(); };
  document.body.appendChild(el);
  upgradeArt(el,c.png_path);
  const stage=el.querySelector('.stage'), tilt=stage.querySelector('.tilt');
  stage.addEventListener('pointermove',e=>{
    const r=stage.getBoundingClientRect(), dx=(e.clientX-r.left)/r.width-.5, dy=(e.clientY-r.top)/r.height-.5;
    tilt.style.animation='none'; tilt.style.transform=`rotateX(${(-dy*14+3).toFixed(1)}deg) rotateY(${(dx*20).toFixed(1)}deg)`;
  });
  stage.addEventListener('pointerleave',()=>{ tilt.style.animation=''; tilt.style.transform=''; });
}

// ── керування профілем (перейменування + аватар в одній модалці) ──
function openEdit(){
  const host=$('mhost');
  const col=(S.ov.avatar_color&&/^#[0-9a-fA-F]{6}$/.test(S.ov.avatar_color))?S.ov.avatar_color:'#7e9dbb';
  const isChamp=!!S.ov.is_champion;
  let showChamp=S.ov.show_champion!==false;                  // локальний стан перемикача
  // 493: чемпіон ліги BoBet обирає окремі чемпіонські елементи (потрібен оновлений cosmetics-файл → feature-detect)
  const champEd=!!(isChamp && BC && BC.PARTS_ALL && (!S.ov.champion_league || S.ov.champion_league==='bobet'));
  const chBlock=isChamp?`
      <label>Відзнаки чемпіона</label>
      <div class="chrow"><div class="sw ${showChamp?'on':''}" id="ch-sw" role="switch"></div>
        <span>${champEd?'Головний перемикач. Вимкни, і не буде жодного чемпіонського елемента (бейдж, підпис, корона, золото) — лише твій стиль. Окремі елементи обираєш вище.':'Золота рамка й корона на аватарі, бейдж <b>BOBET CHAMPION</b>, підпис про перемоги, золоті промені й «Зал чемпіона» на сторінці — усе разом. Вимкни, і побачиш своє оформлення (рамка або скін, ефект, тема).'}</span></div>`:'';
  host.innerHTML=`<div class="mhost"><div class="modal">
    <div class="mhead"><h3>Керувати профілем</h3><button class="mx">✕</button></div>
    <div class="mbody">
      <label>Імʼя</label>
      <input type="text" id="rn-name" maxlength="24" value="${esc(S.ov.display_name||'')}">
      <label>Девіз / про себе <span style="color:var(--text-dim);font-weight:400">· необовʼязково, до 80 символів</span></label>
      <input type="text" id="ed-bio" maxlength="80" placeholder="Напр.: Грай на виграш, не на красу" value="${esc(S.ov.bio||'')}">
      <label>Колір шапки</label>
      <input type="color" id="av-col" value="${esc(col)}" style="width:100%;height:44px;padding:4px;border:1px solid var(--line2);border-radius:10px;background:none;cursor:pointer">
      ${BC?BC.editorHtml({cfg:S.cos||BC.none(),name:S.ov.display_name||'',initials:initials(S.ov.display_name),sub:(S.ov.bio||'').trim()||'Так виглядатиме шапка',
        champ:champEd,
        note:isChamp?(champEd?'Ти чемпіон: обирай, які чемпіонські елементи показувати. Вимкнений елемент замінюється твоїм стилем у твоєму кольорі.':'Ти чемпіон: коли «Відзнаки чемпіона» ввімкнені, вони мають пріоритет над оформленням. Вимкни їх нижче, щоб бачити своє.'):''}):''}
      ${chBlock}
      <div class="msg" id="ed-msg" style="display:none"></div>
    </div>
    <div class="mfoot"><button class="ghost" data-x>Скасувати</button><button class="primary" id="ed-save">Зберегти</button></div>
  </div></div>`;
  wireModal(host);
  const bcEd=BC?BC.wireEditor(host.querySelector('#bc-ed'),{cfg:S.cos||BC.none(),getAccent:()=>$('av-col').value,colorInput:$('av-col'),size:64,pad:22,champ:champEd,masterOn:()=>showChamp}):null;
  if(isChamp){ $('ch-sw').onclick=()=>{ showChamp=!showChamp; $('ch-sw').classList.toggle('on',showChamp); $('av-col').dispatchEvent(new Event('input')); }; }   // перемальовує превʼю (золото ↔ власний колір)
  $('ed-save').onclick=async()=>{
    const m=$('ed-msg'); m.style.display='block'; m.className='msg'; m.textContent='…';
    const newName=$('rn-name').value.trim();
    if(newName && newName!==(S.ov.display_name||'')){
      const { error }=await sb.rpc('rename_profile',{ p_new_name:newName });
      if(error){ m.className='msg err'; m.textContent=error.message||'Не вдалось перейменувати'; return; }
    }
    const newBio=$('ed-bio').value.trim();
    if(newBio!==(S.ov.bio||'')){
      const { error:eb }=await sb.rpc('set_profile_bio',{ p_bio:newBio });
      if(eb){ m.className='msg err'; m.textContent=eb.message||'Не вдалось зберегти девіз'; return; }
    }
    const { error:e2 }=await sb.rpc('set_profile_avatar',{ p_emoji:null, p_color:$('av-col').value });
    if(e2){ m.className='msg err'; m.textContent=e2.message||'Не вдалось зберегти колір'; return; }
    if(bcEd && !BC.same(bcEd.get(),S.cos||BC.none())){   // 492: рамка/ефект/тема (лише якщо змінились)
      const { error:e4 }=await BC.save(sb,'profile',S.me,bcEd.get());
      if(e4){ m.className='msg err'; m.textContent=e4.message||'Не вдалось зберегти оформлення'; return; }
    }
    if(isChamp){
      const { error:e3 }=await sb.rpc('set_profile_show_champion',{ p_on:showChamp });
      if(e3){ m.className='msg err'; m.textContent=e3.message||'Не вдалось зберегти відзнаки'; return; }
    }
    host.innerHTML=''; await boot();
  };
}
function wireModal(host){
  const close=()=>host.innerHTML='';
  // 02.10: закриття по підкладці лише коли і натискання почалось на ній (виділення тексту з поля за межі форми не вбиває форму)
  const bd=host.querySelector('.mhost'); let down=false;
  bd.onpointerdown=e=>{ down=(e.target===bd); };
  bd.onclick=e=>{ const ok=down&&e.target===bd; down=false; if(ok) close(); };
  host.querySelector('.mx').onclick=close;
  const x=host.querySelector('[data-x]'); if(x) x.onclick=close;
}

// ── логін (OTP) ──
function showLogin(){ $('screen-profile').classList.add('hide'); $('screen-login').classList.remove('hide'); }
function showProfile(){ $('screen-login').classList.add('hide'); $('screen-profile').classList.remove('hide'); }
$('btn-login').onclick=showLogin;
$('lnk-back').onclick=e=>{ e.preventDefault(); showProfile(); };
$('btn-logout').onclick=async()=>{ await sb.auth.signOut(); location.href='profile-stage.html'; };
$('btn-send').onclick=async()=>{
  const email=$('in-email').value.trim(); if(!email) return;
  $('login-msg').textContent='Надсилаю…';
  const { error }=await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
  if(error){ $('login-msg').textContent='Помилка: '+error.message; return; }
  window.__email=email; $('step-email').classList.add('hide'); $('step-code').classList.remove('hide'); $('login-msg').textContent='';
};
$('btn-back').onclick=()=>{ $('step-code').classList.add('hide'); $('step-email').classList.remove('hide'); };
$('btn-verify').onclick=async()=>{
  const token=$('in-code').value.trim(); if(!token) return;
  $('login-msg').textContent='Перевіряю…';
  let res=await sb.auth.verifyOtp({ email:window.__email, token, type:'email' });
  if(res.error) res=await sb.auth.verifyOtp({ email:window.__email, token, type:'magiclink' });
  if(res.error){ $('login-msg').textContent='Помилка: '+res.error.message; return; }
  location.href='profile-stage.html';
};

boot().catch(e=>{ $('phead').innerHTML='<div class="empty" style="margin-top:20px">Помилка завантаження: '+esc(e.message)+'</div>'; });
</script>
