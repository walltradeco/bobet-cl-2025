<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Профіль · BoOrbit (STAGE)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<!-- шрифти BoBet — лише для екрана входу (вхід спільний для всіх ліг) -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1310; --panel:#132019; --panel2:#18271f; --line:#243a30;
  --text:#e9f1ec; --text-dim:#8ba297;
  --gold:#e6c14b; --teal:#6fb0c9; --blue:#7fbcff; --purple:#a98fdb;
  --green:#18b47a; --green-soft:rgba(24,180,122,0.14); --red:#e2585f;
  --accent:#18b47a; --accent-d:#0e6f4c;
  --mono:'Rajdhani',system-ui,sans-serif; --body:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 480px at 80% -10%, #12261c 0%, transparent 58%),
    radial-gradient(900px 400px at 0% 0%, #10201a 0%, transparent 50%),
    var(--bg)}
h1,h2,h3{font-family:var(--mono);letter-spacing:.01em}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 60px}
a{color:var(--accent);text-decoration:none}
button{font-family:var(--mono);cursor:pointer}
.hide{display:none!important}

/* шапка сторінки */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 10px}
.logo{display:flex;align-items:center;gap:10px}
.logo .sq{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#18b47a,#0e6f4c);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:16px;color:#04120c}
.logo h1{font-size:20px;margin:0;line-height:1}
.logo .sub{font-size:11px;color:var(--text-dim);letter-spacing:.14em;text-transform:uppercase}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.stage-badge{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--red);border:1px solid var(--red);
  border-radius:6px;padding:2px 8px;letter-spacing:.08em}
.who{font-size:13px;color:var(--text-dim)}.who b{color:var(--text)}
.abadge{font-size:10px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:5px;padding:1px 6px;letter-spacing:.08em}
button.primary{background:var(--gold);color:#1a1206;border:none;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px}
button.act{background:var(--green-soft);color:var(--green);border:1px solid var(--accent-d);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}

/* картка профілю (шапка) */
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:20px 22px;margin-top:6px}
.avatar{width:88px;height:88px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:46px;line-height:1;background:var(--panel2);border:1px solid var(--line)}
.pinfo{flex:1;min-width:220px}
.pinfo h2{font-size:26px;margin:0 0 4px}
.pstat{display:flex;gap:16px;flex-wrap:wrap;color:var(--text-dim);font-size:13px;margin-top:4px}
.pstat b{color:var(--text);font-size:16px;font-family:var(--mono)}
.pstat .u{display:flex;flex-direction:column;line-height:1.15}
.pacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;width:100%}
.launch{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.launch a{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;
  color:var(--text);font-family:var(--mono);font-weight:600}
.launch a:hover{border-color:var(--accent)}

/* секції */
.sec{margin:28px 0 8px}
.sec h2{font-size:17px;margin:0 0 12px}
.sec .empty{font-size:13px;color:var(--text-dim)}

/* турніри «де грає» */
.tgrid{display:flex;flex-wrap:wrap;gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:210px;flex:1;max-width:320px}
.tcard .lg{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  padding:2px 8px;border-radius:6px;display:inline-block}
.lg.BoBet{background:rgba(230,193,75,.16);color:var(--gold);border:1px solid #8a7228}
.lg.PSL{background:rgba(111,176,201,.18);color:var(--teal);border:1px solid #3d6d7e}
.lg.Squad{background:rgba(127,188,255,.16);color:var(--blue);border:1px solid #3a5f8a}
.tcard .nm{font-size:15px;font-weight:600;margin:8px 0 2px}
.tcard .pl{font-family:var(--mono);font-size:22px;font-weight:700}
.tcard .pl small{font-size:12px;color:var(--text-dim);font-weight:500}
.tcard .stt{font-size:11px;color:var(--text-dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}

/* колекція карток */
.grid{display:flex;flex-wrap:wrap;gap:16px}
.card{width:150px;cursor:pointer}
.card .art{position:relative;width:150px;aspect-ratio:1024/1536;border-radius:10px;overflow:hidden;background:#0a120e;border:1px solid var(--line)}
.card .art img{width:100%;height:100%;object-fit:contain;display:block}
.card:hover .art{outline:2px solid var(--accent)}
.card .rar{position:absolute;top:6px;left:6px;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.rar.rare{background:rgba(111,176,201,.2);color:#bfe0ee;border:1px solid #3d6d7e}
.rar.mega_rare{background:rgba(230,193,75,.18);color:#f0d98a;border:1px solid #8a7228}
.card .cn{margin-top:6px;text-align:center;font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* спільноти */
.ccard{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;min-width:240px;flex:1;max-width:340px}
.ccard .em{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.ccard .cinfo{flex:1;min-width:0}
.ccard .cn{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .cr{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ownb{font-size:10px;font-weight:700;color:var(--gold);border:1px solid #8a7228;border-radius:5px;padding:1px 6px;letter-spacing:.06em;margin-left:6px}

/* трофеї-плейсхолдер */
.trophies{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--text-dim)}

/* модалка (аватар/перейменування) */
.mhost{position:fixed;inset:0;z-index:100;background:rgba(5,8,6,.72);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel2);border:1px solid var(--line);border-radius:16px;max-width:420px;width:100%;padding:0}
.modal .mhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mhead h3{margin:0;font-size:18px;flex:1}
.modal .mx{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font-size:16px}
.modal .mbody{padding:18px 20px}
.modal label{display:block;font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px}
.modal input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit}
.modal .emrow{display:flex;gap:10px;align-items:center}
.modal .emrow input[type=text]{flex:1;text-align:center;font-size:24px}
.modal input[type=color]{width:52px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px}
.modal .prev{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;border:1px solid var(--line);margin:12px auto 0}
.modal .mfoot{display:flex;gap:8px;justify-content:flex-end;padding:0 20px 18px}
.msg{font-size:13px;padding:8px 10px;border-radius:8px;margin-top:10px}
.msg.err{background:rgba(226,88,95,.14);color:#f2b0b3}
.msg.ok{background:var(--green-soft);color:var(--green)}

/* showFullCard — арт на сцені (порт shop-stage; ефекти = КАНОН) */
.sqfull{position:fixed;inset:0;z-index:120;background:rgba(5,8,6,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.sqfull .sqx{position:absolute;top:20px;right:24px;width:40px;height:40px;border:1px solid #355445;border-radius:50%;background:#111b16;color:var(--text);font-size:20px;cursor:pointer;z-index:130}
.sqfull .stage{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background-size:cover;background-position:center;perspective:1500px}
.sqfull .glow{position:absolute;left:50%;top:36%;width:50%;height:64%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.10),transparent 66%);animation:sqglow 4s ease-in-out infinite}
@keyframes sqglow{0%,100%{opacity:.5}50%{opacity:1}}
.sqfull .contact{position:absolute;left:50%;bottom:12%;width:21%;height:2.4%;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(0,0,0,.4),transparent 72%);filter:blur(9px);z-index:1}
.sqfull .podium-card{position:absolute;left:50%;bottom:26%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 26px 30px rgba(0,0,0,.5))}
.sqfull .tilt{position:relative;transform-origin:bottom center;transform:rotateX(3deg) rotateY(-10deg);transform-style:preserve-3d;animation:sqsway 6s ease-in-out infinite}
@keyframes sqsway{0%,100%{transform:rotateX(3deg) rotateY(-14deg)}50%{transform:rotateX(3deg) rotateY(-2deg)}}
.sqfull .podium-card img.rarepng{width:auto;height:62vh;display:block}
.sqfull .tilt.fx{-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}
.sqfull .tilt.fx::before{content:"";position:absolute;top:-20%;left:-70%;width:55%;height:150%;z-index:6;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.30),transparent);transform:skewX(-16deg);animation:sqglint 4.8s ease-in-out infinite}
@keyframes sqglint{0%,12%{left:-70%}60%{left:130%}100%{left:130%}}
.sqfull .stage.mega .tilt.fx::before{content:none}
.sqfull .stage.mega .glow{background:radial-gradient(ellipse at center,rgba(230,193,75,.16),transparent 66%)}
.sqfull .podium-card.mega{animation:sqmegafloat 4.6s ease-in-out infinite}
@keyframes sqmegafloat{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-2.4%)}}
.sqfull .podium-card.mega img.rarepng{animation:sqcolorpulse 2.5s ease-in-out infinite}
@keyframes sqcolorpulse{0%,100%{filter:saturate(1) brightness(1)}50%{filter:saturate(1.42) brightness(1.15)}}
@media(prefers-reduced-motion:reduce){.sqfull .tilt,.sqfull .glow,.sqfull .tilt.fx::before,.sqfull .podium-card.mega,.sqfull .podium-card.mega img.rarepng{animation:none}}

/* ── ЕКРАН ВХОДУ = BoBet/ЄвроСезон (спільна брама) ── */
.login{max-width:380px;margin:9vh auto 0;text-align:center;font-family:'Onest',system-ui,sans-serif}
.login h1{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;color:var(--green);font-size:22px;letter-spacing:.04em}
.login .stage-badge{font-family:'IBM Plex Mono',monospace}
.login p{color:var(--text-dim);font-size:14px}
.login input{width:100%;background:#1B251D;border:1px solid #2A362B;color:#EDEFE8;border-radius:8px;
  padding:11px 12px;font-size:15px;margin:8px 0;font-family:'Onest',system-ui,sans-serif;text-align:center}
.login input.code{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.2em}
.login button.primary{width:100%;font-family:'Montserrat',sans-serif}
#login-msg{font-size:13px;color:var(--text-dim);margin-top:8px;min-height:18px}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="logo">
      <div class="sq">BO</div>
      <div><h1>Профіль</h1><div class="sub">BoOrbit</div></div>
    </div>
    <div class="right">
      <span class="stage-badge">STAGE</span>
      <span id="who" class="who hide"></span>
      <button id="btn-login" class="ghost">Увійти</button>
      <button id="btn-logout" class="ghost hide">Вийти</button>
    </div>
  </div>

  <!-- ПРОФІЛЬ -->
  <div id="screen-profile">
    <div id="phead"></div>

    <div class="sec"><h2>🎯 Де грає</h2><div id="play" class="tgrid"></div></div>
    <div class="sec"><h2>🎴 Колекція</h2><div id="coll" class="grid"></div></div>
    <div class="sec"><h2>🍻 Спільноти</h2><div id="comm" class="tgrid"></div></div>
    <div class="sec"><h2>🏆 Трофеї</h2>
      <div class="trophies">Медалі, рекорди й DNA з’являться після завершення сезону.</div>
    </div>
  </div>

  <!-- ЕКРАН ВХОДУ -->
  <div id="screen-login" class="login hide">
    <h1>BoOrbit <span class="stage-badge">STAGE</span></h1>
    <div id="step-email">
      <p>Увійди своєю поштою, щоб відкрити свій профіль.</p>
      <input id="in-email" type="email" placeholder="твоя пошта" autocomplete="email">
      <button id="btn-send" class="primary">Надіслати код</button>
    </div>
    <div id="step-code" class="hide">
      <p>Введи код із листа.</p>
      <input id="in-code" class="code" inputmode="numeric" placeholder="000000">
      <button id="btn-verify" class="primary">Увійти</button>
      <button id="btn-back" class="ghost" style="margin-top:8px">Назад</button>
    </div>
    <div id="login-msg"></div>
    <p style="margin-top:18px"><a href="#" id="lnk-back">← назад</a></p>
  </div>
</div>

<div id="mhost"></div>

<script type="module">
const SUPABASE_URL  = 'https://wsdamzcezumjmgxmvakw.supabase.co';
const SUPABASE_ANON = 'sb_publishable_bkXuSYswtmg4xCtecLb9cw_No0oCuSo';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cardThumb=p=>String(p||'').replace(/\.png$/i,'_sm.webp');   // легка webp-мініатюра для сітки Колекції; повний PNG — у showFullCard

const RAR={rare:'Rare',mega_rare:'Mega Rare'};
const SCENE={rare:'rare',mega_rare:'mega_rare'};
const KIND_EMOJI={bar:'🍺',club:'🛡',vip:'🎩',locker:'🚪'};
const KIND_LABEL={bar:'Бар',club:'Клуб',vip:'VIP Ложа',locker:'Роздягальня'};
const STATUS_LABEL={active:'триває',finished:'завершено',draft:'чернетка'};

const S={ me:null, name:null, isAdmin:false, view:null, isOwn:false,
          ov:null, tours:[], cards:[], comms:[] };

// ── boot ──
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  S.me = session ? session.user.id : null;
  if(S.me){
    try{
      const { data } = await sb.from('profiles').select('display_name,is_platform_admin').eq('id',S.me).maybeSingle();
      if(data){ S.name=data.display_name; S.isAdmin=!!data.is_platform_admin; }
    }catch(e){}
    $('who').classList.remove('hide');
    $('who').innerHTML=`<b>${esc(S.name||'ти')}</b>${S.isAdmin?' <span class="abadge">адмін</span>':''}`;
    $('btn-login').classList.add('hide'); $('btn-logout').classList.remove('hide');
  }
  const urlId=new URLSearchParams(location.search).get('id');
  S.view = urlId || S.me;
  S.isOwn = !!(S.view && S.view===S.me);

  if(!S.view){
    $('phead').innerHTML=`<div class="phead"><div class="avatar">👤</div>
      <div class="pinfo"><h2>Твій профіль</h2>
      <p class="empty">Увійди, щоб відкрити свій профіль, або відкрий чийсь за посиланням.</p>
      <div class="pacts"><button class="primary" id="go-login">Увійти</button></div></div></div>`;
    $('go-login').onclick=showLogin;
    ['play','coll','comm'].forEach(id=>$(id).innerHTML='');
    document.querySelectorAll('#screen-profile .sec').forEach(s=>s.classList.add('hide'));
    return;
  }
  await loadProfile();
}

async function loadProfile(){
  // шапка
  const { data:ov } = await sb.from('profile_overview')
    .select('profile_id,display_name,avatar_emoji,avatar_color,tournaments_count,cards_count,communities_count')
    .eq('profile_id',S.view).maybeSingle();
  S.ov=ov;
  if(!ov){
    $('phead').innerHTML=`<div class="phead"><div class="avatar">👤</div>
      <div class="pinfo"><h2>Профіль не знайдено</h2></div></div>`;
    document.querySelectorAll('#screen-profile .sec').forEach(s=>s.classList.add('hide'));
    return;
  }
  renderHead();

  // паралельно: де грає / колекція / спільноти
  const [t,c,m]=await Promise.all([
    sb.rpc('profile_tournaments',{ p_profile:S.view }),
    sb.from('card_shop').select('card_key,tier,kind,png_path,owner_profile_id').eq('owner_profile_id',S.view).order('tier').order('card_key'),
    sb.rpc('profile_communities',{ p_profile:S.view })
  ]);
  S.tours = t.error?[]:(t.data||[]);
  S.cards = c.error?[]:(c.data||[]);
  S.comms = m.error?[]:(m.data||[]);
  renderPlay(); renderColl(); renderComm();
}

function renderHead(){
  const ov=S.ov, name=ov.display_name||'Гравець';
  const av = ov.avatar_emoji
    ? `<div class="avatar" style="background:${cssColor(ov.avatar_color)}">${esc(ov.avatar_emoji)}</div>`
    : `<div class="avatar">${esc((name[0]||'👤').toUpperCase())}</div>`;
  const stat = `
    <div class="pstat">
      <span class="u"><b>${ov.tournaments_count}</b>турнірів</span>
      <span class="u"><b>${ov.cards_count}</b>карток</span>
      <span class="u"><b>${ov.communities_count}</b>спільнот</span>
    </div>`;
  let actions='';
  if(S.isOwn){
    actions=`
      <div class="pacts">
        <button class="ghost" id="a-rename">✎ Перейменувати</button>
        <button class="ghost" id="a-avatar">🎨 Аватар</button>
      </div>
      <div class="launch">
        <a href="shop-stage.html">🏪 Моя Крамниця</a>
        <a href="community-stage.html">🍻 Мої Спільноти</a>
        <a href="#" id="a-tours">🎯 Мої турніри</a>
      </div>`;
  }
  $('phead').innerHTML=`<div class="phead">${av}
    <div class="pinfo"><h2>${esc(name)}</h2>${stat}${actions}</div></div>`;
  if(S.isOwn){
    $('a-rename').onclick=openRename;
    $('a-avatar').onclick=openAvatar;
    $('a-tours').onclick=e=>{ e.preventDefault(); document.querySelector('#screen-profile .sec').scrollIntoView({behavior:'smooth'}); };
  }
}
function cssColor(c){ return (c && /^#[0-9a-fA-F]{6}$/.test(c)) ? c : 'var(--panel2)'; }

function renderPlay(){
  if(!S.tours.length){ $('play').innerHTML='<div class="empty">Ще ніде не грає.</div>'; return; }
  const order={BoBet:0,PSL:1,Squad:2};
  const l=S.tours.slice().sort((a,b)=>(order[a.league]??9)-(order[b.league]??9));
  $('play').innerHTML=l.map(t=>`
    <div class="tcard">
      <span class="lg ${esc(t.league)}">${esc(t.league)}</span>
      <div class="nm">${esc(t.tournament_name)} · ${esc(t.kind)}</div>
      <div class="pl">${t.place!=null?t.place:'—'} <small>${t.place!=null?'місце':''}</small></div>
      <div class="stt">${STATUS_LABEL[t.status]||esc(t.status||'')}</div>
    </div>`).join('');
}

function renderColl(){
  if(!S.cards.length){ $('coll').innerHTML='<div class="empty">Колекція порожня.</div>'; return; }
  $('coll').innerHTML=S.cards.map(c=>`
    <div class="card" data-k="${esc(c.card_key)}">
      <div class="art"><span class="rar ${c.tier}">${RAR[c.tier]||c.tier}</span>
        <img src="${esc(cardThumb(c.png_path))}" alt="${esc(c.card_key.replace(/_/g,' '))}" loading="lazy" decoding="async"
          onerror="this.onerror=null;this.src='${esc(c.png_path)}'"></div>
      <div class="cn">${esc(c.card_key.replace(/_/g,' '))}</div></div>`).join('');
  [...$('coll').querySelectorAll('.card')].forEach(el=>el.onclick=()=>{
    const c=S.cards.find(x=>x.card_key===el.dataset.k); if(c) showFullCard(c);
  });
}

function renderComm(){
  if(!S.comms.length){ $('comm').innerHTML='<div class="empty">Ще не в жодній спільноті.</div>'; return; }
  $('comm').innerHTML=S.comms.map(c=>{
    const roles=(c.roles&&c.roles.length)?c.roles.join(', '):(c.is_owner?'':'учасник');
    return `<a class="ccard" href="community-stage.html?id=${esc(c.community_id)}">
      <div class="em" style="background:${cssColor(c.accent_color)}">${esc(c.emoji||KIND_EMOJI[c.kind]||'🍻')}</div>
      <div class="cinfo">
        <div class="cn">${esc(c.name)}${c.is_owner?'<span class="ownb">власник</span>':''}</div>
        <div class="cr">${esc(KIND_LABEL[c.kind]||c.kind)}${roles?' · '+esc(roles):''}</div>
      </div></a>`;
  }).join('');
}

// ── showFullCard (порт shop-stage) ──
function showFullCard(c){
  const scene=SCENE[c.tier]||'rare', mega=(c.tier==='mega_rare');
  const el=document.createElement('div'); el.className='sqfull';
  el.innerHTML=`<button class="sqx" aria-label="закрити">✕</button>
    <div class="stage${mega?' mega':''}" style="background-image:url('scenes/${scene}.webp')">
      <div class="glow"></div><div class="contact"></div>
      <div class="podium-card${mega?' mega':''}"><div class="tilt fx" style="--m:url('${esc(c.png_path)}')">
        <img class="rarepng" src="${esc(c.png_path)}" alt="${esc(c.card_key.replace(/_/g,' '))}"></div></div>
    </div>`;
  el.onclick=e=>{ if(e.target===el||e.target.classList.contains('sqx')) el.remove(); };
  document.body.appendChild(el);
  const stage=el.querySelector('.stage'), tilt=stage.querySelector('.tilt');
  stage.addEventListener('pointermove',e=>{
    const r=stage.getBoundingClientRect(), dx=(e.clientX-r.left)/r.width-.5, dy=(e.clientY-r.top)/r.height-.5;
    tilt.style.animation='none'; tilt.style.transform=`rotateX(${(-dy*14+3).toFixed(1)}deg) rotateY(${(dx*20).toFixed(1)}deg)`;
  });
  stage.addEventListener('pointerleave',()=>{ tilt.style.animation=''; tilt.style.transform=''; });
}

// ── перейменування ──
function openRename(){
  const host=$('mhost');
  host.innerHTML=`<div class="mhost"><div class="modal">
    <div class="mhead"><h3>Перейменувати</h3><button class="mx">✕</button></div>
    <div class="mbody">
      <label>Нове ім’я</label>
      <input type="text" id="rn-name" maxlength="24" value="${esc(S.ov.display_name||'')}">
      <div class="msg" id="rn-msg" style="display:none"></div>
    </div>
    <div class="mfoot"><button class="ghost" data-x>Скасувати</button><button class="primary" id="rn-save">Зберегти</button></div>
  </div></div>`;
  wireModal(host);
  $('rn-save').onclick=async()=>{
    const name=$('rn-name').value.trim();
    const m=$('rn-msg'); m.style.display='block'; m.className='msg'; m.textContent='…';
    const { error }=await sb.rpc('rename_profile',{ p_new_name:name });
    if(error){ m.className='msg err'; m.textContent=error.message||'Не вдалось'; return; }
    host.innerHTML=''; await boot();
  };
}

// ── аватар ──
function openAvatar(){
  const host=$('mhost');
  const em=S.ov.avatar_emoji||'', col=cssColor(S.ov.avatar_color)==='var(--panel2)'?'#18b47a':S.ov.avatar_color;
  host.innerHTML=`<div class="mhost"><div class="modal">
    <div class="mhead"><h3>Аватар</h3><button class="mx">✕</button></div>
    <div class="mbody">
      <label>Емодзі</label>
      <div class="emrow">
        <input type="text" id="av-em" maxlength="4" value="${esc(em)}" placeholder="напр. 🦁">
        <input type="color" id="av-col" value="${esc(col)}">
      </div>
      <div class="prev" id="av-prev" style="background:${esc(col)}">${esc(em||'👤')}</div>
      <div class="msg" id="av-msg" style="display:none"></div>
    </div>
    <div class="mfoot"><button class="ghost" data-x>Скасувати</button><button class="primary" id="av-save">Зберегти</button></div>
  </div></div>`;
  wireModal(host);
  const upd=()=>{ $('av-prev').textContent=$('av-em').value||'👤'; $('av-prev').style.background=$('av-col').value; };
  $('av-em').oninput=upd; $('av-col').oninput=upd;
  $('av-save').onclick=async()=>{
    const emoji=$('av-em').value.trim()||null, color=$('av-col').value;
    const m=$('av-msg'); m.style.display='block'; m.className='msg'; m.textContent='…';
    const { error }=await sb.rpc('set_profile_avatar',{ p_emoji:emoji, p_color:color });
    if(error){ m.className='msg err'; m.textContent=error.message||'Не вдалось'; return; }
    host.innerHTML=''; await boot();
  };
}

function wireModal(host){
  const close=()=>host.innerHTML='';
  host.querySelector('.mhost').onclick=e=>{ if(e.target.classList.contains('mhost')) close(); };
  host.querySelector('.mx').onclick=close;
  const x=host.querySelector('[data-x]'); if(x) x.onclick=close;
}

// ── логін (OTP) ──
function showLogin(){ $('screen-profile').classList.add('hide'); $('screen-login').classList.remove('hide'); }
function showProfile(){ $('screen-login').classList.add('hide'); $('screen-profile').classList.remove('hide'); }
$('btn-login').onclick=showLogin;
$('lnk-back').onclick=e=>{ e.preventDefault(); showProfile(); };
$('btn-logout').onclick=async()=>{ await sb.auth.signOut(); location.href='profile-stage.html'; };
$('btn-send').onclick=async()=>{
  const email=$('in-email').value.trim(); if(!email) return;
  $('login-msg').textContent='Надсилаю…';
  const { error }=await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
  if(error){ $('login-msg').textContent='Помилка: '+error.message; return; }
  window.__email=email; $('step-email').classList.add('hide'); $('step-code').classList.remove('hide'); $('login-msg').textContent='';
};
$('btn-back').onclick=()=>{ $('step-code').classList.add('hide'); $('step-email').classList.remove('hide'); };
$('btn-verify').onclick=async()=>{
  const token=$('in-code').value.trim(); if(!token) return;
  $('login-msg').textContent='Перевіряю…';
  let res=await sb.auth.verifyOtp({ email:window.__email, token, type:'email' });
  if(res.error) res=await sb.auth.verifyOtp({ email:window.__email, token, type:'magiclink' });
  if(res.error){ $('login-msg').textContent='Помилка: '+res.error.message; return; }
  location.href='profile-stage.html';
};

boot().catch(e=>{ $('phead').innerHTML='<div class="empty" style="padding:20px">Помилка завантаження: '+esc(e.message)+'</div>'; });
</script>
</body>
</html>
