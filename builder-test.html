// зсув Києва відносно UTC у хвилинах на момент ms (120 взимку, 180 влітку)
function kyivOffsetMin(ms) {

// «16.02.2027 22:00» за Києвом → ISO з поясом. Неіснуючий час (перехід на літній) і неоднозначний (на зимовий) — помилка.
function kyivToIso(y, mo, d, h, mi) {

  if (ok.length === 0) return { error: 'Цього часу не існує в Києві (перехід на літній час) — вкажи інший' };
  if (ok.length === 2) return { error: 'Цей час трапляється двічі (перехід на зимовий час) — вкажи інший' };
  return { iso: y + '-' + p2(mo) + '-' + p2(d) + 'T' + p2(h) + ':' + p2(mi) + ':00' + (ok[0] === 120 ? '+02:00' : '+03:00') };

function parseKyivText(s) {

// Один рядок списку матчів: «Команда А — Команда Б; 16.02.2027 22:00; день=2; ET; фінал; ліга=ucl»
function parseMatchLine(line) {
  const raw = String(line == null ? '' : line).trim();
  if (!raw || raw.charAt(0) === '#') return null;
  const segs = raw.split(';').map((x) => x.trim());
  const teams = segs[0].split(/\s+(?:—|–|-|vs\.?|VS)\s+/);
  if (teams.length !== 2 || !teams[0].trim() || !teams[1].trim()) return { error: 'Очікую «Команда А — Команда Б»' };
  const out = { home: teams[0].trim(), away: teams[1].trim() };
  let kick = null;
  for (let i = 1; i < segs.length; i++) {
    const s = segs[i];
    if (!s) continue;

    if ((m = low.match(/^(?:день|day|d)\s*=\s*(\d+)$/))) out.day = +m[1];

    else if (/^(?:фінал|final|finale)$/.test(low)) out.is_final = true;
    else if ((m = low.match(/^(?:ліга|змагання|comp|competition)\s*=\s*([a-z_]+)$/))) out.competition = m[1];

}
// Весь текст → { rows (для RPC), errors [{line, text, error}] }

    const r = parseMatchLine(ln);

    rows.push(r);

function validRoot(s) { return /^[a-z][a-z0-9_]{1,24}$/.test(String(s == null ? '' : s)); }

  if (!taken || taken.indexOf(base) < 0) return base;

// «Імʼя; email; адмін» по рядку → [{name,email,is_admin}]
function parseRoster(text) {
  const people = [];

  const seen = {};
  String(text == null ? '' : text).split(/\r?\n/).forEach((ln, i) => {
    const t = ln.trim();

    const parts = t.split(';').map((x) => x.trim());
    if (!parts[0]) { errors.push('Рядок ' + (i + 1) + ': порожнє імʼя'); return; }
    const key = parts[0].toLowerCase();
    if (seen[key]) { errors.push('Рядок ' + (i + 1) + ': «' + parts[0] + '» вже є'); return; }
    seen[key] = 1;
    const email = parts[1] && parts[1].indexOf('@') > 0 ? parts[1] : null;

    const adm = parts.slice(1).some((x) => /^(?:адмін|admin|a)$/i.test(x));

    $app.innerHTML = '';

    shell('<div class="card errbox"><h2>Лише адмін платформи</h2><p class="dim">Конструктор турнірів доступний лише суперадмінам. Поточний акаунт не має цього доступу.</p></div>');

function readRoster(W) {
  if (W.rosterMode === 'list') {
    const r = parseRoster(W.rosterText);
    if (r.errors.length) return { error: r.errors.join('; ') };
    if (!r.people.length) return { error: 'Склад порожній' };
    return { roster: { mode: 'list', people: r.people } };
  }
  return { roster: { mode: 'copy', from: W.rosterFrom } };
}
function buildParams(W) {
  const par = {};
  const base = W.tplSpec || {};
  if (W.title && W.title !== (base.title || '')) par.title = W.title;
  if (+W.shift) par.date_shift_days = +W.shift;
  par.modules = Object.assign({}, W.modules);
  if (W.isTest) par.is_test = true;
  par.freeze_after_deadline = !!W.freeze;
  if (W.mode === 'tpl' && base.prizes) {
    const cur = { fund_uah: W.fund === '' ? null : +W.fund, pools: {}, stage_weights: {}, places: {} };
    Object.keys(W.pools).forEach((k) => { cur.pools[k] = +W.pools[k]; });
    Object.keys(W.weights).forEach((k) => { cur.stage_weights[k] = +W.weights[k]; });
    Object.keys(W.places).forEach((k) => { const a = parsePlaces(W.places[k]); cur.places[k] = a || W.places[k]; });
    const d = diffPrizes(base.prizes, cur);
    if (Object.keys(d).length) par.prizes = d;
  }
  if (W.mode === 'tpl') { const r = readRoster(W); if (r.error) return { error: r.error }; par.roster = r.roster; }
  return { params: par };
}

  const pc = (k) => (pz[k] != null ? pz[k] + '%' : '—');
  return '<p>Фонд: <b>' + esc(pz.fund_uah) + '</b> грн · очки ' + pc('pct_points') + ' · точні рахунки ' + pc('pct_exact') + ' · місця ' + pc('pct_places') +
    ' · Rivals ' + pc('pct_rivals') + ' · MVP ' + pc('pct_mvp') + ' · 1/2/3 місце: ' + esc(pz.place1_pct) + '/' + esc(pz.place2_pct) + '/' + esc(pz.place3_pct) + '%</p>';
}

async function tabTeams() {
  const T = S.T;
  if (!T.teams) {
    const { data, error } = await sb.from('teams').select('name,short_name,league').order('name');
    if (error) throw new Error(error.message);
    T.teams = data || [];
  }
  const q = (T.teamQ || '').toLowerCase();
  const rows = T.teams.filter((x) => !q || (x.name || '').toLowerCase().indexOf(q) >= 0 || (x.short_name || '').toLowerCase().indexOf(q) >= 0).slice(0, 300);
  return '<div class="card"><h2>Додати команди</h2><p class="hint">По одній у рядку: «Назва» або «Назва; Скорочення». Існуючі пропускаються. До 200 за раз.</p>' +
    '<textarea id="teamsText" placeholder="Real Madrid; RMA&#10;Manchester City; MCI&#10;Inter">' + esc(T.teamsText || '') + '</textarea>' +
    '<div class="row" style="margin-top:8px"><button class="btn primary" data-act="addTeams">Додати</button></div>' + msgBox('m_teams') + '</div>' +
    '<div class="card"><h2>Команди в базі (' + T.teams.length + ')</h2><input id="teamQ" placeholder="пошук…" value="' + esc(T.teamQ || '') + '" style="max-width:300px;margin-bottom:8px">' +
    '<div class="tbl-wrap"><table><tr><th>Назва</th><th>Скорочення</th><th>Ліга</th></tr>' + rows.map((x) =>

async function tabMatches() {
  const T = S.T;
  if (!T.stage) return '<div class="card"><p>У Турніру нема етапів з матчами.</p></div>';
  const [days, ms] = await Promise.all([rpc('admin_tournament_days', { p_root: T.root }), rpc('admin_tournament_matches', { p_stage: T.stage })]);
  T.days = days; T.ms = ms;
  const stages = (T.info.stages || []).filter((s) => !s.is_general);
  const sd = days.filter((d) => d.stage_key === T.stage);
  const exDay = sd[0];
  const ex = exDay && exDay.deadline_at ? fmtKyiv(Date.parse(exDay.deadline_at) + 86400000).replace(/ \d\d:\d\d$/, ' 22:00') : '16.02.2027 22:00';
  const o = T.impOpts;
  let h = '<div class="chips">' + stages.map((s) => '<button class="chip ' + (s.key === T.stage ? 'on' : '') + '" data-act="pickStage" data-stage="' + esc(s.key) + '">' + esc(s.title) + '</button>').join('') + '</div>';
  h += '<div class="card"><h2>Вставити список матчів</h2>' +
    '<p class="hint">По одному в рядку: <span class="mono">Команда А — Команда Б; ' + esc(ex) + '</span>. Час — за Києвом. Додатково через «;»: <span class="mono">день=2</span>, <span class="mono">ET</span> (можливий екстратайм), <span class="mono">фінал</span>, <span class="mono">ліга=ucl</span>. Назви команд — як у вкладці «Команди».</p>' +
    '<textarea id="impText" placeholder="Real Madrid — Inter; ' + esc(ex) + '">' + esc(T.impText) + '</textarea>' +
    '<div class="grid g3" style="margin-top:10px"><label class="f">Пари «хто пройде далі»<select id="impTies">' +
    [['spec', 'За шаблоном етапу'], ['two_leg', 'Двоматчеві'], ['single', 'Одноматчеві'], ['none', 'Без пар']].map((x) =>
      '<option value="' + x[0] + '"' + (o.ties === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></label>' +
    '<label class="f">Змагання (код)<input id="impComp" placeholder="з шаблону" value="' + esc(o.comp) + '"></label>' +
    '<label class="chk" style="align-self:end"><input type="checkbox" id="impEt"' + (o.et ? ' checked' : '') + '>ET можливий за замовчуванням</label></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn" data-act="impCheck">Перевірити</button><button class="btn primary" data-act="impGo">Внести</button></div>' +
    msgBox('m_imp') + '<div id="impRes">' + impResultHtml() + '</div></div>';
  // таблиця днів і матчів
  h += '<div class="card"><h2>Дні й матчі етапу</h2>';
  if (!sd.length) h += '<p class="dim">У етапу нема ігрових днів.</p>';
  sd.forEach((d) => {
    const dm = ms.filter((m) => m.day === d.day);
    h += '<h3>День ' + d.day + ': ' + esc(d.title) + ' <span class="dim">· дедлайн ' + esc(fmtKyiv(d.deadline_at)) + ' · матчів ' + d.matches + '</span></h3>';
    if (!dm.length) { h += '<p class="msg warn">Матчі ще не внесено</p>'; return; }
    h += '<div class="tbl-wrap"><table><tr><th>#</th><th>Матч</th><th>Початок (Київ)</th><th>Прапори</th><th>Статус</th></tr>' + dm.map((m) =>
      '<tr><td>' + m.position + '</td><td class="nw">' + esc(m.home) + ' — ' + esc(m.away) + '</td><td>' + esc(fmtKyiv(m.kickoff_at)) + '</td><td>' +
      (m.et_possible ? 'ET ' : '') + (m.is_final ? 'фінал ' : '') + '</td><td>' + esc(m.status) + (m.home_score != null ? ' ' + m.home_score + ':' + m.away_score : '') + '</td></tr>').join('') + '</table></div>';
  });
  return h + '</div>';
}
function impResultHtml() {
  const r = S.T.imp;
  if (!r) return '';
  if (r.fatal) return '<div class="msg err">' + esc(r.fatal) + '</div>';
  let h = '';
  if (r.parseErrors && r.parseErrors.length) h += '<div class="msg err">Рядки з помилками (не відправлено):</div>' + listHtml(r.parseErrors.map((x) => 'Рядок ' + x.line + ': ' + x.error + ' — «' + x.text + '»'));
  const d = r.data;
  if (d) {
    h += '<div class="msg ' + (d.ok === false || (d.errors || []).length ? 'err' : 'ok') + '">' +
      (d.dry_run ? 'Перевірка (нічого не записано): ' : 'Внесено: ') + (d.ok === false || (d.errors || []).length ? 'є помилки' : 'без помилок') +
      (d.rows != null ? ' · рядків ' + d.rows : '') + (d.imported != null ? ' · внесено ' + d.imported : '') + '</div>';
    if ((d.errors || []).length) h += '<div class="msg err">Помилки:</div>' + listHtml(d.errors);
    if ((d.warnings || []).length) h += '<div class="msg warn">Попередження:</div>' + listHtml(d.warnings);
    if ((d.notes || []).length) h += listHtml(d.notes);
    if (d.per_day) h += '<p class="mono dim">по днях: ' + esc(fmtAny(d.per_day)) + '</p>';
    if (d.ties_plan) h += '<p class="mono dim">пари (план): ' + esc(fmtAny(d.ties_plan)) + '</p>';
    if (d.ties) h += '<p class="mono dim">пари: ' + esc(fmtAny(d.ties)) + '</p>';
  }
  return h;
}

async function tabJournal() {
  const T = S.T;
  T.journal = await rpc('admin_tournament_journal', { p_root: T.root, p_limit: 100 });
  const names = {};
  try {
    const { data } = await sb.from('profiles').select('id,display_name');
    (data || []).forEach((x) => { names[x.id] = x.display_name; });
  } catch (e) { /* імен не видно — покажемо короткий id */ }
  const who = (id) => (id ? (names[id] || String(id).slice(0, 8)) : '—');
  const j = (v) => {
    if (v == null) return '';
    const t = JSON.stringify(v);
    return t.length > 170 ? '<span title="' + esc(t) + '">' + esc(t.slice(0, 170)) + '…</span>' : esc(t);
  };
  return '<div class="card"><h2>Журнал змін (останні 100)</h2>' + (T.journal.length ? '<div class="tbl-wrap"><table><tr><th>Час (Київ)</th><th>Дія</th><th>Етап</th><th>Обʼєкт</th><th>Хто</th><th>Причина</th><th>Було → стало</th></tr>' +
    T.journal.map((r) => '<tr><td>' + esc(fmtKyiv(r.created_at)) + '</td><td>' + esc(r.action) + '</td><td class="mono">' + esc(r.stage_key || '') + '</td><td>' + esc((r.entity || '') + (r.ref ? ' ' + r.ref : '')) +

}

const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
async function afterAction(text) { S.flash = text; await loadTourney(); await renderTourney(); }
async function cycleOp(op, btn) {
  const T = S.T;
  const box = { open: 'm_open', hide: 'm_hide', finish: 'm_fin', reset: 'm_rst', test: 'm_test' }[op];
  const reason = { open: 'r_open', hide: 'r_hide', finish: 'r_fin', reset: 'r_rst' }[op];
  btn.disabled = true;
  try {
    if (op === 'open') await rpc('admin_tournament_open', { p_root: T.root, p_reason: val(reason) });
    else if (op === 'hide') await rpc('admin_tournament_hide', { p_root: T.root, p_reason: val(reason) });
    else if (op === 'finish') await rpc('admin_tournament_finish', { p_root: T.root, p_confirm: val('w_fin'), p_reason: val(reason) });
    else if (op === 'reset') await rpc('admin_tournament_test_reset', { p_root: T.root, p_confirm: val('w_rst'), p_reason: val(reason) });
    else if (op === 'test') await rpc('admin_tournament_set_test', { p_root: T.root, p_test: !T.chk.is_test });
    await afterAction({ open: 'Турнір відкрито.', hide: 'Турнір схований.', finish: 'Турнір завершено.', reset: 'Тест скинуто.', test: 'Тест-режим змінено.' }[op]);
  } catch (e) { btn.disabled = false; say(box, errText(e), 'err'); }
}
async function importRun(dry) {
  const T = S.T;
  T.impText = document.getElementById('impText').value;
  const tiesSel = val('impTies');
  T.impOpts = { ties: tiesSel, comp: val('impComp'), et: document.getElementById('impEt').checked };
  const b = buildImport(T.impText);
  if (b.errors.length) { T.imp = { parseErrors: b.errors }; document.getElementById('impRes').innerHTML = impResultHtml(); return; }
  if (!b.rows.length) { T.imp = { fatal: 'Список порожній' }; document.getElementById('impRes').innerHTML = impResultHtml(); return; }
  const opts = { dry_run: !!dry };
  if (tiesSel === 'none') opts.ties = false;
  else if (tiesSel === 'two_leg') opts.ties = { mode: 'two_leg' };
  else if (tiesSel === 'single') opts.ties = { mode: 'single' };
  if (T.impOpts.comp) opts.competition = T.impOpts.comp;
  if (T.impOpts.et) opts.default_et_possible = true;
  say('m_imp', dry ? 'Перевіряю…' : 'Вношу…');
  try {
    const d = await rpc('admin_matches_import', { p_stage: T.stage, p_matches: b.rows, p_options: opts });
    T.imp = { data: d };
    say('m_imp', '');
    if (!dry) { T.impText = ''; S.flash = 'Матчі внесено: ' + (d.imported != null ? d.imported : b.rows.length) + '.'; await loadTourney(); await renderTourney(); return; }
    document.getElementById('impRes').innerHTML = impResultHtml();
  } catch (e) {
    T.imp = { fatal: errText(e) };
    say('m_imp', '');
    document.getElementById('impRes').innerHTML = impResultHtml();
  }
}

// ---------------------------------------------------------------------
//  Події (делегування)
// ---------------------------------------------------------------------
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || !S.me && el.dataset.act !== 'logout') return;
  const a = el.dataset.act;
  const T = S.T;
  try {
    if (a === 'home') return go('#/');
    if (a === 'logout') { await sb.auth.signOut(); S.me = null; S.T = null; return boot(); }
    if (a === 'newT') return go('#/new');
    if (a === 'openT') return go('#/t/' + encodeURIComponent(el.dataset.root));
    if (a === 'tab') return go('#/t/' + encodeURIComponent(T.root) + '/' + el.dataset.tab);
    if (a === 'pickTpl') return pickTemplate(el.dataset.code);
    if (a === 'pickClone') return pickClone();
    if (a === 'wizBack') { S.W.step = 1; return renderWizard(); }
    if (a === 'wizToParams') { S.W.step = 2; return renderWizard(); }
    if (a === 'wizPreview') return wizPreview();
    if (a === 'wizCreate') return wizCreate();
    if (a === 'confirmNums') {
      el.disabled = true;
      try { await rpc('admin_tournament_confirm_numbers', { p_root: T.root, p_reason: val('r_conf') }); await afterAction('Числа затверджено.'); }
      catch (e) { el.disabled = false; say('m_conf', errText(e), 'err'); }
      return;
    }
    if (a === 'unfreeze' || a === 'refreeze') {
      el.disabled = true;
      try {
        if (a === 'unfreeze') await rpc('admin_tournament_unfreeze', { p_root: T.root, p_confirm: val('w_unfz'), p_reason: val('r_unfz'), p_hours: +val('h_unfz') || 2 });
        else await rpc('admin_tournament_refreeze', { p_root: T.root, p_reason: val('r_unfz') || null });
        await afterAction(a === 'unfreeze' ? 'Розморожено.' : 'Заморожено знову.');
      } catch (e) { el.disabled = false; say('m_fz', errText(e), 'err'); }
      return;
    }
    if (a === 'addTeams') {
      const lines = document.getElementById('teamsText').value.split(/\r?\n/).map((x) => x.trim()).filter((x) => x && x.charAt(0) !== '#');
      const arr = lines.map((ln) => { const p = ln.split(';').map((x) => x.trim()); return p[1] ? { name: p[0], short: p[1] } : p[0]; });
      if (!arr.length) return say('m_teams', 'Список порожній', 'err');
      el.disabled = true;
      try {
        const r = await rpc('admin_teams_add', { p_teams: arr });
        T.teams = null; T.teamsText = '';
        S.flash = 'Додано: ' + ((r.added || []).length) + (r.skipped && r.skipped.length ? ' · пропущено (вже є): ' + r.skipped.length : '') + '.';
        await renderTourney();
      } catch (e) { el.disabled = false; say('m_teams', errText(e), 'err'); }
      return;
    }
    if (a === 'pickStage') { T.stage = el.dataset.stage; T.imp = null; return renderTourney(); }
    if (a === 'impCheck') return importRun(true);
    if (a === 'impGo') return importRun(false);
    if (a === 'cyc') return cycleOp(el.dataset.op, el);
    if (a === 'mvPick') { T.mv = { i: +el.dataset.i }; return renderTourney(); }
    if (a === 'mvCancel') { T.mv = null; return renderTourney(); }
    if (a === 'mvGo') {
      const d = T.days[T.mv.i];
      const k = parseKyivText(val('mvDl'));
      if (k.error) return say('m_mv', k.error, 'err');
      el.disabled = true;
      try {
        const r = await rpc('admin_stage_day_move', { p_stage: d.stage_key, p_day: d.day, p_new_deadline: k.iso, p_reason: val('mvReason'), p_shift_matches: document.getElementById('mvShift').checked });
        T.mv = null;
        await afterAction('День перенесено: матчів зсунуто ' + r.matches_shifted + ', питань вирівняно ' + r.special_bets_aligned + '.');
      } catch (e) { el.disabled = false; say('m_mv', errText(e), 'err'); }
      return;
    }
  } catch (e) { alert(errText(e)); }
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.w) onWizField(el);
  if (el.id === 'teamQ') { S.T.teamQ = el.value; const pos = el.selectionStart; renderTourney().then(() => { const n = document.getElementById('teamQ'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); }
  if (el.id === 'teamsText') S.T.teamsText = el.value;
});
document.addEventListener('change', (ev) => { const el = ev.target; if (el.dataset && el.dataset.w && el.type !== 'text') onWizField(el); });

boot();
</script>
