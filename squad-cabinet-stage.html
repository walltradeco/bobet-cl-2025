<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Squad Mode · кабінет (STAGE)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<!-- шрифти BoBet — ЛИШЕ для екрана входу (вхід спільний для всіх ліг) -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1310; --panel:#132019; --panel2:#18271f; --line:#243a30;
  --text:#e9f1ec; --text-dim:#8ba297;
  --gold:#e6c14b; --teal:#6fb0c9; --blue:#7fbcff; --purple:#a98fdb;
  --green:#18b47a; --green-soft:rgba(24,180,122,0.14); --red:#e2585f;
  --up:#26c281; --down:#e2585f;
  --accent:#18b47a; --accent-d:#0e6f4c; --dim:#5f7469;
  --mono:'Rajdhani',system-ui,sans-serif; --body:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 480px at 80% -10%, #12261c 0%, transparent 58%),
    radial-gradient(900px 400px at 0% 0%, #10201a 0%, transparent 50%),
    var(--bg)}
h1,h2,h3{font-family:var(--mono);letter-spacing:.01em}
.tnum,table.t td.n,.stat span,.lrt,.lmv,.mprice,.rpill,.mbig .n,.mstats div b{font-variant-numeric:tabular-nums}
.stage-badge{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--red);
  color:#fff;text-align:center;font-size:12px;font-weight:700;letter-spacing:.05em;padding:4px}
.wrap{max-width:1440px;margin:0 auto;padding:34px 16px 80px}
.hide{display:none!important}
h1{font-size:24px;margin:0}
h2{font-size:19px;margin:0 0 10px}
.dim{color:var(--text-dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:12px 0}
.msg{padding:10px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.msg.err{background:var(--red);color:#fff}
.msg.ok{background:var(--green);color:#fff}
input{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:9px 11px;font-size:15px;width:100%;max-width:320px}
button{background:var(--accent);color:#06120c;border:1px solid var(--accent-d);border-radius:9px;padding:10px 17px;
  font-family:var(--mono);font-size:14.5px;font-weight:700;letter-spacing:.03em;cursor:pointer}
button.ghost{background:none;color:var(--text);border:1px solid var(--line)}
button:disabled{background:var(--panel2);color:var(--dim);border-color:var(--line);opacity:1;cursor:not-allowed}

/* шапка застосунку (F1-макет) */
#screen-app{padding-top:26px}
header{border-bottom:1px solid var(--line);background:rgba(12,19,16,.86);backdrop-filter:blur(10px)}
.hbar{max-width:1440px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.hbox{display:flex;align-items:flex-end;gap:6px 22px;flex-wrap:wrap;padding:8px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
.hcol{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.hcol .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono);font-weight:600;white-space:nowrap}
.hcol .k i{font-style:normal;color:var(--text-dim);margin-right:3px}
.hcol .v{font-family:var(--mono);font-weight:700;font-size:15px;margin-top:3px;white-space:nowrap}
.hcol.main .v{font-size:23px;margin-top:2px}
.hbox.bank .hcol.main .v{color:var(--gold)}
.hparts{display:flex;gap:6px 20px;align-items:flex-end;flex-wrap:wrap;padding-left:20px;border-left:1px solid var(--line)}
.hstats{display:flex;gap:12px 16px;flex-wrap:wrap;flex:1 1 auto}   /* 11.10: бренд «Squad Mode» прибрано — шапка = лише картки Мій Банк і Squad Price; профіль/кнопки — у рядку вкладок */
.hstat{display:flex;flex-direction:column;line-height:1.15}
.hstat .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono);font-weight:600}
.hstat .v{font-family:var(--mono);font-weight:700;font-size:18px}
.hstat.bank .v{color:var(--gold)}
.hstat .bk-parts{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:3px;letter-spacing:.01em;max-width:330px}
.hstat .bk-parts b{color:var(--text-dim);font-weight:600}
.me{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 5px;border:1px solid var(--line);border-radius:22px;background:var(--panel);margin-left:auto;flex:0 1 auto;flex-wrap:wrap;max-width:100%;justify-content:flex-end}   /* на вузькому екрані кнопки переносяться, а не виходять за межі */
.me .btn{margin-left:0!important}
.me .av{width:26px;height:26px;border-radius:50%;background:var(--accent-d);display:grid;place-items:center;
  font-family:var(--mono);font-weight:700;font-size:13px;color:#dff5ea}
.priv{font-size:9.5px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px;letter-spacing:.04em}
.tabrow{max-width:1440px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;border-bottom:1px solid var(--line)}   /* вкладки зліва, профіль/кнопки справа; на вузькому вікні кнопки переносяться під вкладки */
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;min-width:0;flex:0 1 auto;margin:0;padding:0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:none;color:var(--text-dim);font-family:var(--mono);font-weight:600;
  font-size:14.5px;letter-spacing:.02em;padding:13px 12px 11px;cursor:pointer;border-bottom:2px solid transparent;
  white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.tab .ic{font-size:15px}
#screen-app .wrap{padding-top:18px}
.spin{color:var(--text-dim);padding:30px 4px}

/* статус-панель (Bank / Squad Price / дедлайн) */
.statbar{display:flex;gap:20px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:14px 18px;margin-bottom:14px}
.stat b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
  font-family:var(--mono);font-weight:600}
.stat span{font-family:var(--mono);font-size:19px;font-weight:700}
.stat .bank{color:var(--gold)} .stat .price{color:var(--teal)}

/* пре-маркет банер (§L) */
.premkt{background:linear-gradient(90deg,rgba(244,196,48,.12),rgba(244,196,48,.03));
  border:1px solid rgba(244,196,48,.35);border-radius:12px;padding:12px 16px;margin-bottom:12px;
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
.premkt b{color:var(--gold)}
.premkt .pm-prog{color:var(--text-dim)} .premkt .pm-prog b{color:var(--text)}
.premkt .pm-bank{margin-left:auto;color:var(--text-dim)}

/* бейдж позиції у лайнапі («Мій склад») */
.pos{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:4px;
  border:1px solid var(--line);background:none;color:var(--text-dim);flex:none}
.pos.G{color:#f0c14b;border-color:#5a4a1c} .pos.D{color:#7fbcff;border-color:#274a63}
.pos.M{color:#8be3b0;border-color:#255a3e} .pos.F{color:#ff9d7a;border-color:#5e3423}

/* лайнап */
.vbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.vchip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.vchip.ok{color:var(--up);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.vchip.bad{color:var(--down);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
.lzone{margin-bottom:12px}
.lzt{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);font-weight:700;margin:10px 0 4px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin-bottom:5px;flex-wrap:wrap}
.lrow .lnm{font-weight:700;flex:1;min-width:140px}
.lrow .lclub{color:var(--text-dim);font-weight:400;font-size:12px;margin-left:6px}
.lrow .lrt{color:var(--gold);font-weight:700;width:46px;text-align:right}
.lrow .lmv{color:var(--teal);width:64px;text-align:right;font-variant-numeric:tabular-nums}
.lrow .lctrl{display:flex;gap:4px}
.lrow .capb{color:var(--gold)} .lrow .viceb{color:var(--teal)}
.benchord{flex:none;width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  color:var(--text-dim);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
button.mini{padding:4px 9px;font-size:12px;font-weight:700;border-radius:6px}
button.mini.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.mini.on{background:var(--gold);color:#1B1B1B}
button.mini.sell{color:var(--text-dim);font-weight:400}

/* таблиці */
table.t{width:100%;border-collapse:collapse}
.t th,.t td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;font-variant-numeric:tabular-nums}
.t th{font-size:11px;text-transform:uppercase;color:var(--text-dim);font-weight:600;letter-spacing:.03em}
.t th.n,.t td.n{text-align:right}   /* 20.10: заголовок числової колонки вирівняно разом зі значеннями */
.t td.n{white-space:nowrap}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.subtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{background:var(--panel);color:var(--text-dim);border:1px solid var(--line);
  border-radius:9px;padding:7px 14px;font-family:var(--mono);font-size:13.5px;font-weight:600}
.subtabs button.on{background:var(--accent-d);color:#dff5ea;border-color:var(--accent-d)}
/* 🎯 підказка «Челенджі» на Ринку (19.10): наведення/фокус/клік (дотик) показує список; рядок вкладок + підказка в одному flex */
.subbar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.subbar .subtabs{margin-bottom:0}
.chtipw{position:relative;margin-left:auto}
.chtipbtn{background:var(--panel);color:var(--gold);border:1px solid var(--line);border-radius:9px;padding:7px 14px;font-family:var(--mono);font-size:13.5px;font-weight:600;cursor:help}
.chtipw:hover .chtipbtn,.chtipw.open .chtipbtn{border-color:var(--gold)}
.chtip{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:min(440px,88vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:13px;line-height:1.4}
.chtipw:hover .chtip,.chtipw:focus-within .chtip,.chtipw.open .chtip{display:block}
.chth{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.chtip p{margin:0 0 8px;color:var(--text-dim)}
.chtr{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.chtr.done{opacity:.72}
.chtn small{display:block;color:var(--text-dim)} .chtn i{color:var(--gold);font-style:normal;font-weight:700} .chtn u{color:var(--accent);text-decoration:none}
.chtip .chtf{margin:8px 0 0;font-family:var(--mono);color:var(--text)}
.soon{border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--text-dim)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:var(--text-dim)}

/* ── РИНОК за макетом (фільтри-ряд + сітка плиток + модалка) ── */
.mfilters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 16px}
.mf{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:6px 11px;font-size:13px}
.mf label{color:var(--text-dim);text-transform:uppercase;font-size:10px;letter-spacing:.05em;font-weight:700}
.mf select,.mf input{background:transparent;border:0;color:var(--text);font-size:13px;font-weight:600;
  padding:0;width:auto;max-width:none;-webkit-appearance:none}
.mf select{cursor:pointer}
.mf.search input{min-width:150px}
.mf.range .rng{position:relative;height:22px;width:128px}
.mf.range .rng .track{position:absolute;top:9px;left:0;right:0;height:4px;border-radius:3px;background:var(--line)}
.mf.range .rng .fill{position:absolute;top:9px;height:4px;border-radius:3px;background:var(--gold)}
.mf.range input[type=range]{position:absolute;top:0;left:0;width:100%;height:22px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.mf.range input[type=range]::-webkit-slider-runnable-track{height:4px;background:none;border:none}
.mf.range input[type=range]::-moz-range-track{height:4px;background:none;border:none}
.mf.range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:15px;height:15px;margin-top:-5.5px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.5);cursor:pointer}
.mf.range input[type=range]::-moz-range-thumb{pointer-events:auto;width:15px;height:15px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);cursor:pointer}
.mf .rv{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.msort{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);
  display:flex;align-items:center;gap:7px;font-weight:700}
.msort select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:6px 9px;font-weight:700;font-size:13px;text-transform:none;letter-spacing:0}
.msec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:700;
  border-bottom:1px solid var(--line);padding-bottom:8px;margin:6px 0 14px;display:flex;justify-content:space-between}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
/* 514: нагадування DEF/GK */
.dgbanner{margin:10px 0;padding:9px 14px;border-radius:10px;font-size:13px;line-height:1.4;border:1px solid var(--line);background:var(--panel)}
.dgbanner.dgb-ok{color:var(--up,#6fcf8f);border-color:rgba(111,207,143,.35)}
.dgbanner.dgb-warn{color:var(--gold);border-color:var(--gold);background:rgba(212,175,55,.08)}
.dgbanner.dgb-bad{color:#ff8a80;border-color:rgba(255,138,128,.5);background:rgba(255,138,128,.08)}
.mtile.dgblock{opacity:.55}
.mdgb{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);margin:-2px 0 4px}
.mtile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;
  cursor:pointer;transition:border-color .12s,transform .12s;text-align:center;display:flex;flex-direction:column}   /* 20.10: статус притиснуто донизу — без порожнього місця під ним */
.mtile:hover{border-color:var(--gold);transform:translateY(-1px)}
.mtile.mine{border-color:rgba(244,196,48,.45)}
.mtop{display:flex;justify-content:flex-start;gap:8px;align-items:center;margin-bottom:8px}
.pbadge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:5px;border:1px solid transparent}
.pbadge.G{background:rgba(240,193,75,.14);color:#f0c14b;border-color:#5a4a1c}
.pbadge.D{background:rgba(127,188,255,.12);color:#7fbcff;border-color:#274a63}
.pbadge.M{background:rgba(24,180,122,.16);color:#8be3b0;border-color:#255a3e}
.pbadge.F{background:rgba(255,157,122,.14);color:#ff9d7a;border-color:#5e3423}
.injb{font-size:12px;line-height:1;cursor:help;vertical-align:middle}
.vdelta{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.vdelta.up{color:var(--up)} .vdelta.down{color:var(--down)} .vdelta.flat{color:var(--text-dim)}
.mav{width:76px;height:76px;border-radius:50%;margin:0 auto 8px;background:var(--panel2);
  border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:800;color:var(--text-dim);overflow:hidden;flex:none}
.mav img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.mtile .mnm{font-weight:700;font-size:14px;line-height:1.2}
.mtile .mclub{font-size:12px;color:var(--text-dim);margin-top:2px}
.mtile .mlg{font-size:10.5px;color:var(--text-dim);opacity:.7;margin-top:1px}
.mrow{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:9px}
.mtrow{display:flex;justify-content:center;align-items:center;gap:6px 9px;flex-wrap:wrap;margin-top:9px}   /* окремий клас: .mrow ще й рядок матчів (grid + hover-підсвітка) */
.rpill{background:var(--panel2);border-radius:7px;padding:2px 9px;font-weight:800;color:var(--up);font-size:14px}
.mprice{color:var(--text);font-weight:700;font-size:14px}
.mstatus{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-size:12px;
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;gap:5px}
.mlistb{display:inline-block;margin:0 0 6px;padding:2px 8px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);font-family:var(--mono);font-size:11px;font-weight:700;white-space:nowrap}
.shoprow.mine td{background:rgba(244,196,48,.05)}
.mstatus.free{color:var(--up)} .mstatus.mine{color:var(--gold);font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.g{background:var(--up)} .dot.o{background:var(--text-dim)}

/* модалка гравця / дій */
.modal-host{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.modal .mx{position:absolute;top:12px;right:14px;color:var(--text-dim);background:none;border:0;
  font-size:20px;cursor:pointer;padding:2px 6px;font-weight:400}
.modal h3{margin:0;font-size:22px}
/* 20.10: модалка «Підтвердити склад» — широка, 2 колонки (ліворуч склад і бусти, праворуч челенджі/Rivals/порушення), кнопки внизу на всю ширину; на вузьких екранах — 1 колонка */
.modal.cfmodal{max-width:min(1040px,96vw)}
.cfgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;align-items:start}
.cfcol{min-width:0}
@media(max-width:860px){.cfgrid{grid-template-columns:1fr}}
.cfbottom{margin-top:14px;padding-top:4px;border-top:1px solid var(--line)}
.mhead{display:flex;gap:14px;align-items:center}
.mmeta{font-size:13px;color:var(--text-dim);margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mbig{margin-left:auto;text-align:right}
.mbig .n{font-size:30px;font-weight:800;color:var(--up);line-height:1}
.mbig .l{font-size:10px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.05em}
.mstats{display:flex;gap:24px;flex-wrap:wrap;margin:18px 0 4px}
.mstats div b{display:block;font-size:20px;font-weight:800}
.mstats div span{font-size:10px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.04em}
.mchart{margin:14px 0 4px}
.macts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.macts button{flex:1;min-width:130px;padding:11px 14px}
.mamt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mamt input{max-width:110px}
.mamt .dim{flex:1;min-width:150px}
.mnote{font-size:12px;color:var(--text-dim);margin-top:9px}
.clen{margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.clen .clab{font-size:12px;color:var(--text-dim);margin-bottom:7px}
.clen-row{display:flex;gap:6px;flex-wrap:wrap}
.clen-chip{flex:1;min-width:40px;padding:8px 0;text-align:center;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;color:var(--text);cursor:pointer;font-family:var(--mono);font-weight:700;font-size:14px}
.clen-chip.on{background:var(--accent);border-color:var(--accent-d);color:#06120c}
.clen-chip:disabled{opacity:.38;cursor:not-allowed}
/* 539 ролі: вибір «Основний/Лавка» у пікері контракту, чип ролі в складі */
.crole{margin:0 0 9px}
.crole-row{display:flex;gap:6px}
.crole-chip{flex:1;padding:8px 6px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);cursor:pointer;font-weight:700;font-size:13px;line-height:1.25}
.crole-chip small{display:block;font-weight:500;font-size:11px;color:var(--text-dim);margin-top:2px;font-family:var(--mono)}
.crole-chip.on{background:var(--accent);border-color:var(--accent-d);color:#06120c}.crole-chip.on small{color:#06120c}
.crole-chip:disabled{opacity:.42;cursor:not-allowed}
.crole-need{font-size:12px;color:var(--warn,#f5b84d);margin-top:6px}
.crole-note{font-size:11.5px;color:var(--text-dim);margin-top:7px;line-height:1.4}.crole-note b{color:var(--text)}
.rolechip{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.02em;vertical-align:middle;border:1px solid var(--line)}
.rolechip.mn{background:rgba(120,200,160,.14);color:#9fe3c0}.rolechip.bn{background:rgba(255,255,255,.06);color:var(--text-dim)}
.rolechip.mis{border-color:var(--warn,#f5b84d);color:var(--warn,#f5b84d)}
.rolechip.mk{background:rgba(235,87,87,.12);color:var(--down);border-color:rgba(235,87,87,.45)}   /* 542: позначка «порушив» */
.clen-info{font-size:12px;color:var(--text-dim);margin-top:8px}
.clen-info .cw{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.clen-info .cw-main{font-size:21px;line-height:1.1;color:var(--gold);font-weight:700}
.clen-info .cw-main small{font-size:12px;font-weight:600;color:var(--text-dim)}
.clen-info .cw-sum{font-size:13px;color:var(--text)}
.clen-info .cw-note{font-size:12px;color:var(--text-dim);flex:0 1 auto;padding-left:16px;border-left:1px solid var(--line)}   /* 20.10: нотатка в одному рядку з вартістю */
.clen-info .cw-sub{margin-top:4px;font-size:11.5px}
.clen-info .cw-free{font-size:12.5px;color:var(--text);padding-left:16px;border-left:1px solid var(--line)}
.clen-info.bad .cw-main,.clen-info.bad .cw-sum,.clen-info.bad .cw-free{color:var(--red)}
.clen-info.bad{color:var(--red)}
.budg{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;margin-bottom:14px}
.budg-card{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.bc-h{font-size:12px;color:var(--text-dim);font-weight:700;letter-spacing:.02em}
.bc-row{display:flex;align-items:center;gap:4px 16px;flex-wrap:wrap;margin-top:4px}   /* велика сума зліва, «Заморожено»/«Запас» — праворуч у тому ж рядку (11.10) */
.bc-main{font-family:var(--mono);font-size:26px;font-weight:700;margin:0}
.bc-subs{display:flex;flex-direction:column;gap:1px;font-size:12px;color:var(--text-dim);line-height:1.35;min-width:0}
.bc-subs b{color:var(--text)}
.rt .when.dgr{margin-top:2px;margin-left:auto;line-height:1.4;white-space:nowrap}   /* 21.10 (Богдан): «мін 5 ✓ · ≥1 DEF/GK … ✓» — один рядок, не 3 */
@media(max-width:720px){.rt .when.dgr{white-space:normal;max-width:340px}}
.budg-pour{align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
.budg-pour small{font-weight:600;font-size:10px;opacity:.75}
.pour-dir{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pd{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-family:var(--mono);font-weight:700;font-size:13px;border-radius:9px;padding:10px;cursor:pointer}
.pd.on{background:var(--accent);border-color:var(--accent-d);color:#06120c}
.pour-info{font-size:13px;color:var(--text-dim);margin-top:10px}
.pour-info.bad{color:var(--red)}
.ctr{font-size:11px;color:var(--text-dim);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.ctr.low{color:var(--red);border-color:var(--red);font-weight:700}
.warnc{color:var(--red)}
/* 📊 Статистика */
.statboards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:12px}
.statcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.statcard .sthead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.statcard .sthead b{font-size:14px}
.statcard .sthead span{font-size:11px;color:var(--text-dim)}
.strow{display:grid;grid-template-columns:26px 1fr auto auto;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.strow:last-child{border-bottom:0}
.strow:hover{background:var(--accent-d);color:#dff5ea}
.strow .rk{font-family:var(--mono);font-weight:700;color:var(--text-dim);font-size:12px}
.strow .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strow .cl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dim);white-space:nowrap}
.strow:hover .cl{color:#bfe8d3}
.strow .cl .crest{width:12px;height:12px;border-radius:3px;flex:none}
.strow .vv{font-family:var(--mono);font-weight:700;font-size:13px}

/* 📇 Колекція */
.col-filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.col-filters input,.col-filters select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
.col-filters input{flex:1;min-width:160px}
.col-grid{display:flex;flex-wrap:wrap;gap:14px}
.colcard{width:150px;cursor:pointer}
.colc-wrap{position:relative;width:150px;height:225px;overflow:hidden;border-radius:8px}
.colc-wrap .sqcard{position:absolute;top:0;left:0;transform-origin:top left;transform:scale(.5)}  /* 150/300 */
.colcard:hover .colc-wrap{outline:2px solid var(--accent)}
.colc-own{margin-top:6px;text-align:center;font-size:11px;font-weight:700;border-radius:6px;padding:3px 6px;
  color:var(--text-dim);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colc-own.mine{background:var(--green-soft);color:var(--up);border-color:var(--accent-d)}
/* 📰 News-стрічка */
.nrow{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
.nrow .nico{font-size:15px;flex:none;width:20px;text-align:center}
.nrow .ntxt{flex:1;font-size:13.5px;line-height:1.35}
.nrow .ntime{flex:none;font-size:11px;color:var(--text-dim);font-family:var(--mono);white-space:nowrap}
.news-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.news-filters select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px}
.mnote.warn{color:var(--down);font-weight:600}

/* рядки трансферів */
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.trow .tinfo{flex:1;min-width:230px;font-size:14px}
.trow .tctrl{display:flex;gap:6px;flex-wrap:wrap}
.trow.wev{border-left:3px solid var(--gold);background:rgba(230,193,75,.07)}
.wpct{margin-top:8px}
.agbox{margin-top:12px}
.agrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.pm-xinfo{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.pm-xinfo .agbox{margin:0} .pm-xinfo .agres{margin:0}
/* 20.10: вкладки вікна гравця («Купити | Обмін», «Купити зараз | Аукціон») + порівняння в обміні */
.ptab-bar{display:flex;gap:6px;margin:12px 0 10px;border-bottom:1px solid var(--line)}
.ptab{flex:1;padding:9px 12px;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text-dim);font-weight:700;font-size:14px;cursor:pointer;border-radius:0}
.ptab:hover{color:var(--text)} .ptab.on{color:var(--text);border-bottom-color:var(--accent)}
.ptab-body{display:none} .ptab-body.on{display:block}
.ptabs.stack{display:grid;grid-template-columns:minmax(0,1fr)} .ptabs.stack .ptab-bar{grid-row:1}
.ptabs.stack .ptab-body{display:block;grid-row:2;grid-column:1;visibility:hidden;pointer-events:none} .ptabs.stack .ptab-body.on{visibility:visible;pointer-events:auto}
.xor{text-align:center;color:var(--text-dim);font-size:12px;margin:10px 0 0}
.vcard{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;margin-top:10px}
.xcmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xc{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;min-width:0}
.xc-h{font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim)}
.xc-name{font-weight:700;font-size:15px;margin:6px 0 6px;padding:8px 0;line-height:1.25}
.xr{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.xr:last-child{border-bottom:0} .xr span{color:var(--text-dim)} .xr b{font-weight:600;text-align:right} .xr .up{color:var(--up)} .xr .down{color:var(--down)}
.xdelta{margin-top:8px;font-size:12.5px;color:var(--text-dim)} .xdelta b{color:var(--text)}
/* 21.10 (Богдан): обмін компактніше — порівняння ліворуч + «Доплата» праворуч; контракт ліворуч + статус/підсумок/кнопка праворуч (раніше все розтягувалось на всю ширину) */
.xbox{container-type:inline-size}
.xtop,.xbot{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:10px;align-items:stretch}
@container (min-width:720px){ .xtop,.xbot{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)} .xbot{align-items:start} }
.xcmp .xr b{min-width:0;overflow-wrap:anywhere}
.xpay{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.xpay .xdelta{margin:0;line-height:1.35}
.xpay .xprow{display:flex;gap:8px;align-items:center}
.xpay .xprow select{flex:1 1 auto;min-width:0} .xpay .xprow input{flex:0 0 84px;width:84px}
.xpay .xcorr{font-size:12.5px;line-height:1.45;color:var(--text-dim)} .xpay .xcorr b{color:var(--text)}
.xpay .xcorr .xfrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.xbot .clen{margin-top:6px} .xbot .xact{display:flex;flex-direction:column;gap:8px;min-width:0} .xbot .xact .mnote,.xbot .xact .psum,.xbot .xact .macts{margin:0} .xbot .xact .macts button{width:100%}
.psum{flex:1 1 100%;margin-top:10px;padding:10px 12px;border:1px solid var(--accent-d,var(--line));border-radius:10px;background:rgba(38,194,129,.06);font-size:12.5px;line-height:1.55}
.psum .ph{font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:0 8px 0 0;display:inline-block} .psum .psep{color:var(--text-dim)} .infoi{cursor:help;color:var(--text-dim);white-space:nowrap}
.psum:empty{display:none} .mamt .wpct{display:contents} .mamt .wmodes{flex:1 1 auto;margin:0} .mamt .wm-player{flex:1 1 100%} .vcard .mamt .dim{flex:0 1 auto;min-width:0} .mamt .psum{flex:1 1 320px;margin-top:0} .mamt .fbreak{flex:1 1 100%;height:0;margin-top:-8px}   /* 21.10 (Богдан): підсумок «Твоя пропозиція» + OK — завжди окремий рядок на всю ширину (раніше при вужчому вікні підсумок стискався праворуч і переносився на 3–4 рядки) */ .mamt>button[data-do="amt"]{flex:none;align-self:flex-end;min-width:70px}
.vhead{display:flex;gap:4px 14px;align-items:center;flex-wrap:wrap} .vhead .msec{margin:0} .vhead .mnote{margin:0;flex:1 1 260px;line-height:1.35} .vhead .vbtn{flex:none;margin-left:auto;padding:9px 16px}
@media(max-width:560px){.xcmp{grid-template-columns:1fr}}
.agres{margin:4px 0 8px;padding:8px 10px;border-left:3px solid var(--teal);background:rgba(111,176,201,.08);border-radius:6px;font-size:13px}
.wpct select{margin-left:6px}
/* 556: два режими пропозиції («Домовитись з учасником» / «Домовитись з гравцем») і форма аукціону */
.wmodes{display:flex;gap:6px 10px;margin:6px 0;align-items:center;flex-wrap:wrap}
.wmodes .wm-member{flex:1 1 260px;margin:0;line-height:1.35}
.wm-player{display:flex;gap:6px 14px;align-items:flex-start;flex-wrap:wrap} .wm-player .wm-pnote{flex:1 1 300px;margin:0;line-height:1.4}
.wmode{flex:0 0 auto;padding:8px 16px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);cursor:pointer;font-weight:700;font-size:13px;line-height:1.25}
.wmode.on{background:var(--accent);border-color:var(--accent-d);color:#06120c}
.wpct .hide{display:none!important}
.aucf{margin-top:10px}
.aucf input#aucAmt{width:150px;flex:none}
.aucf .aquick{display:flex;gap:6px;flex-wrap:wrap;margin:0}
.aucf .arow{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;margin-top:6px}   /* 20.10: підписи, поле й кнопки — в один рядок (вікно нижче) */
.aucf .ahint{flex:1 1 280px;margin:0;line-height:1.4}
.aucf .aucmsg{margin:5px 0 0;line-height:1.35}   /* 21.10: повідомлення про ставку — окремий рядок під елементами (було в тому ж рядку й лишало порожнечу) */
.aucrule{color:var(--text);font-size:12.5px;line-height:1.45;margin-top:7px}   /* 21.10: правило аукціону — помітніше, бо є місце */
.aucf .arow button[data-do="aucgo"]{flex:none;margin-left:auto;min-width:170px;padding:11px 20px}
.aucmsg.warn{color:var(--gold)}
.trow .tctrl button{padding:6px 12px;font-size:13px}

/* ── ЕКРАН ВХОДУ = BoBet/ЄвроСезон (спільна брама всіх ліг, НЕ дизайн турніру) ──
   Колори тут ЗАШИТІ під палітру BoBet, а не F1-токени: вхід має бути однаковий
   скрізь. In-app лишається F1. Перемикання фону — через :has(), JS не чіпаємо. */
body:has(#screen-login:not(.hide)){
  background:
    repeating-linear-gradient(0deg, rgba(237,239,232,.06) 0px, rgba(237,239,232,.06) 1px, transparent 1px, transparent 64px),
    #1B1B1B;
}
/* верхня червона смуга Squad — сховати на вході (у BoBet бейдж дрібний, у заголовку) */
body:has(#screen-login:not(.hide)) .stage-badge{display:none;}
.login{max-width:380px;margin:8vh auto 0;text-align:center;font-family:'Onest',sans-serif;}
.login h1{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;
  letter-spacing:.14em;text-transform:uppercase;color:#2E8B57;margin:0 0 24px;line-height:1.4;}
.login .badge{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;
  letter-spacing:.08em;color:#C75C4A;border:1px solid #C75C4A;border-radius:5px;padding:2px 7px;
  text-transform:none;vertical-align:middle;}
.login p.dim{color:#8B9A8C;font-size:15px;margin:0 0 14px;}
.login input{width:100%;max-width:none;padding:15px;margin:8px 0;background:#1B251D;
  border:1px solid #2A362B;border-radius:10px;color:#EDEFE8;font-size:17px;
  font-family:'Onest',sans-serif;text-align:center;}
.login input.code{font-family:'IBM Plex Mono',monospace;font-size:25px;letter-spacing:.18em;font-weight:700;}
.login input:focus{outline:none;border-color:#F4C430;}
.login button.primary{width:100%;background:#F4C430;color:#1a1206;border:none;border-radius:10px;
  padding:15px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;
  letter-spacing:0;cursor:pointer;}
.login button.primary:disabled{background:#212D23;color:#8B9A8C;cursor:not-allowed;}
.login button.ghost{background:transparent;border:1px solid #2A362B;color:#8B9A8C;
  border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer;font-family:'Onest',sans-serif;
  margin-top:10px;width:100%;}
.login #login-msg .msg{text-align:left;}

/* ── F1 компоненти (макет squad_cabinet_mockup) ── */
.rndbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 16px;margin:4px 0 16px}
.rndbar .pill{font-family:var(--mono);font-weight:700;background:var(--accent-d);color:#dff5ea;padding:3px 11px;
  border-radius:20px;font-size:13px;letter-spacing:.03em}
.rndbar .txt{color:var(--text-dim);font-size:13px}
.confbar{align-items:flex-start}
.cfchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cfchip{font-family:var(--mono);font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);display:inline-flex;align-items:center;gap:6px}
.cfchip.ok{color:var(--up);border-color:#1f4d38}.cfchip.wait{color:var(--gold);border-color:rgba(244,196,48,.4)}
.cfchip .mini{padding:0 6px;line-height:1.5}
.lockedn{margin:10px 0;padding:10px 12px;border:1px solid #1f4d38;border-radius:10px;background:var(--panel2);color:var(--up);font-size:13px;font-weight:600}
.rndbar .cd{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold);font-size:15px}
/* 15.10: єдиний блок стану туру (рішення Богдана — як у «Predictions & Results» ЄвроСезону): hero «до дедлайну» + «склад n з 8», зелена смужка, «підтвердили» з чіпами */
.stbox{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(244,196,48,.12),rgba(244,196,48,.03));border:1px solid rgba(244,196,48,.32);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.stbox.closed{background:rgba(226,88,95,.10);border-color:rgba(226,88,95,.35)}
.stbox.off{background:var(--panel);border-color:var(--line)}
.stbox .cap,.stconf .cap{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}

 'Chelsea':'#034694','Dortmund':'#b8a300','Dynamo Kyiv':'#0d47a1','Inter':'#0068a8',

 'Brentford':'#e30613','Everton':'#274488','Tottenham':'#3a4f94','Betis':'#0bb363','Athletic':'#ee2523','Polissya':'#2e9b4f'};
function clubName(cid){ return (S.clubs[cid]||{}).name||''; }
// 20.10 (Богдан): ліги скрізь англійською, біля клубу; у БД значення українські (АПЛ, Бундесліга, Ла Ліга, Ліга 1, Серія А, УПЛ) — міняємо лише показ
const LEAGUE_EN={'АПЛ':'Premier League','Бундесліга':'Bundesliga','Ла Ліга':'La Liga','Ліга 1':'Ligue 1','Серія А':'Serie A','УПЛ':'UPL'};
const SEASON_LABEL='26/27';   // сезон сезонної статистики (SofaScore, ліга клубу) — змінити при новому сезоні
function leagueEn(l){ return LEAGUE_EN[l]||l||''; }
function clubLeague(cid){ return leagueEn((S.clubs[cid]||{}).league); }
function clubWithLeague(cid){ const n=clubName(cid), l=clubLeague(cid); return l?`${n} · ${l}`:n; }
function clubCol(cid){ return CLUB[clubName(cid)]||'var(--line)'; }
// зворотний відлік до дедлайну: «Nд ГГ:ХХ»
function countdown(iso){ const ms=new Date(iso)-new Date(); if(ms<=0) return 'дедлайн минув';
  const m=Math.floor(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  return (d?d+'д ':'')+String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }

$('btn-send').onclick = async () => {
  const email = $('in-email').value.trim().toLowerCase();
  if(!email) return msg($('login-msg'),'Вкажи пошту');
  $('btn-send').disabled=true; $('btn-send').textContent='надсилаю…';
  const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
  $('btn-send').disabled=false; $('btn-send').textContent='Надіслати код';
  if(error){ const t=/не.*доступ|not allowed|Database error/i.test(error.message)
    ? 'Немає доступу — цієї пошти немає в списку учасників' : error.message;
    return msg($('login-msg'),t); }
  window.__email=email; $('step-email').classList.add('hide'); $('step-code').classList.remove('hide');
  $('login-msg').innerHTML=''; $('in-code').focus();
};
$('btn-verify').onclick = async () => {
  const token=$('in-code').value.trim();
  if(token.length<4) return msg($('login-msg'),'Код закороткий');
  $('btn-verify').disabled=true;
  let error=null;
  for(const type of ['email','signup','magiclink']){
    const res=await sb.auth.verifyOtp({ email:window.__email, token, type });
    if(!res.error){ error=null; break; } error=res.error;
  }
  $('btn-verify').disabled=false;
  if(error){ return msg($('login-msg'),'Не вийшло: '+(error.message||'')); }
  await boot();
};
$('btn-back').onclick=()=>{ $('step-code').classList.add('hide'); $('step-email').classList.remove('hide'); $('login-msg').innerHTML=''; };
$('btn-logout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };

// ── СТАРТ ──
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('screen-login').classList.remove('hide'); $('screen-app').classList.add('hide'); return; }
  try{ await sb.rpc('bind_me'); }catch(e){ /* самолікування, ковтаємо */ }

  // squad-турнір (mode='squad', активний). Стейдж = squad_test єдиний.
  const { data:tt } = await sb.from('tournaments')
    .select('id,title,key,mode,status').eq('mode','squad').eq('status','active').order('starts_at',{ascending:false});
  S.tour = (tt&&tt[0])||null;
  if(!S.tour){
    $('screen-login').classList.add('hide'); $('screen-app').classList.remove('hide');
    $('tabs').innerHTML=''; $('view').innerHTML=`<div class="card"><h2>Squad-турнір ще не відкрито</h2><p class="dim">Активного Squad-турніру немає.</p></div>`;
    return;
  }
  // я в цьому турнірі?
  const { data:me } = await sb.rpc('me', { p_tournament:S.tour.id });
  if(!me || !me.length){
    $('screen-login').classList.remove('hide');
    return msg($('login-msg'),'Тебе немає серед учасників цього турніру');
  }
  S.me = me[0];
  S.me.id = S.me.participant_id;   // ⚠️ me() віддає колонку participant_id; увесь код кабінету чекає .id
  S.myProfile = session.user.id;   // = profiles.id (auth.uid) — для карток/рамок (акаунт-рівень, крос-ліга)

  $('screen-login').classList.add('hide'); $('screen-app').classList.remove('hide');
  $('my-name').textContent = S.me.display_name;
  // страховка: помилка завантаження показується, а не зависає «завантаження…»
  try {
    await loadRefs();
    renderTabs();
    go(S.tab);
  } catch(e){
    $('view').innerHTML = '<div class="soon">Не вдалось завантажити дані: '
      + esc(e && e.message ? e.message : e) + '</div>';
  }
}

// виклик дії ринку: RPC → показати результат → перезавантажити
async function act(fn, args, okMsg, opts){
  const { data, error } = await sb.rpc(fn, args);
  if(error){ alert('⛔ ' + (error.message||'').replace(/^.*?(Squad: )/, '$1')); return; }
  if(okMsg) alert('✅ ' + okMsg);
  await loadRefs(); go(S.tab, !!(opts&&opts.quiet));   // quiet (21.10, Rivals): без «завантаження…» і без стрибка прокрутки — як в ЄвроСезоні
}
// EUR ↔ млн у діалогах (зручніше вводити млн)
function askM(label, minEur){
  const v = prompt(label + ' (у €млн, мін ' + (minEur/1e6).toFixed(1) + ')', (minEur/1e6).toFixed(1));
  if(v==null) return null;
  const eurv = Math.round(parseFloat(v.replace(',','.')) * 1e6);
  if(!eurv || eurv < minEur){ alert('Замало — мінімум ' + eur(minEur)); return null; }
  return eurv;
}

  document.querySelectorAll('[data-bid]').forEach(b=>b.onclick=()=>{

// шапка: Банк (сума + розклад; публічна лише сума) + Squad Price (з Val Δ) + аватар/ім'я
function renderHeader(){
  if(!S.me) return;
  const mine=S.players.filter(p=>p.owner_participant_id===S.me.id);
  const price=mine.reduce((s,p)=>s+(p.market_value_current||0),0);
  const start=mine.reduce((s,p)=>s+(p.market_value_start||0),0);
  // зміна вартості складу від старту: у € (скільки грошей) і в % = СУМА відсотків зміни вартості гравців (ціна гравця не впливає — як Val Δ на борді)
  // 16.10: «Зміна» = € і справжній % вартості складу (€ ÷ старт); окремо «Σ % гравців» = сума відсотків кожного гравця (вона завжди більша за % складу — це не помилка)
  const dEur=price-start, dpSum=mine.reduce((s,p)=>s+(p.market_value_start? (p.market_value_current-p.market_value_start)/p.market_value_start*100 : 0),0);
  const dPct=start? dEur/start*100 : 0;
  const sgn=n=>n>0?'+':n<0?'−':'', eAbs=v=>'€'+(Math.abs(v)/1e6).toFixed(1)+'M';
  const moved=!!(start && (Math.abs(dEur)>=50000 || Math.abs(dpSum)>=0.05));
  const e1=v=>'€'+(v/1e6).toFixed(1)+'M';
  // Мій Банк (510) = Squad Price + трансферний + зарплатний (повні баланси, разом із замороженим). Свій — наживо.
  const tr=S.bank, wg=S.wageBank, ok=(tr!=null);
  const col=(k,v,cls,title)=>`<div class="hcol"${title?` title="${esc(title)}"`:''}><span class="k">${k}</span><span class="v tnum ${cls||''}">${v}</span></div>`;
  const bk=$('h-bank'); if(bk) bk.textContent= ok? e1(price+tr+(wg||0)) : '—';
  const bp=$('h-bank-parts'); if(bp) bp.innerHTML= ok
    ? col('<i>=</i> Squad Price', e1(price), '', 'Поточна вартість усіх твоїх гравців')
      + col('<i>+</i> Трансферний бюджет', e1(tr), '', `Гроші на купівлі/ставки. Доступно зараз: ${eur(S.spendable)}`)
      + col('<i>+</i> Зарплатний бюджет', e1(wg||0), '', `Гроші на зарплати контрактів. Доступно зараз: ${S.wageFree!=null?eur(S.wageFree):'—'}`)
    : '';
  const bb=$('h-bank-box'); if(bb) bb.title= ok? 'Мій Банк = Squad Price + Трансферний бюджет + Зарплатний бюджет (повні, разом із замороженим). Публічна лише сума Банку (вкладка «🏦 Банк» на борді); розклад балансів бачиш лише ти.' : '';
  const pr=$('h-price'); if(pr) pr.textContent=eur(price);
  const pp=$('h-price-parts'); if(pp) pp.innerHTML = start
    ? col('Старт', e1(start), '', 'Вартість гравців твого нинішнього складу на старті турніру (зафіксована; до першого матчу = поточна)')
      + col('Зміна від старту', moved? `${dEur>=0?'▲':'▼'} ${sgn(dEur)}${eAbs(dEur)} · ${sgn(dPct)}${Math.abs(dPct).toFixed(1)}%` : 'без змін', moved? (dEur>=0?'up':'down') : '',
            `Зміна вартості складу від старту: ${eur(start)} → ${eur(price)}. % — частка від вартості складу на старті`)
      + (moved? col('Σ % гравців', `${dpSum>=0?'▲':'▼'} ${ppSgn(dpSum)}`, dpSum>=0?'up':'down',
            'Сума відсотків зміни вартості кожного з твоїх гравців від старту (ціна гравця не впливає; дешевий гравець зі стрибком важить стільки ж, скільки дорогий). Це НЕ % складу — тому цифра більша. Те саме, що Σ % гравців на борді') : '')
      + (()=>{ const ms=(S.mgStand||[]).find(x=>x.participant_id===S.me.id); if(!ms) return '';
          const n=(S.mgStand||[]).length, d=+ms.delta_eur||0, hyb=(ms.final_metric==='hybrid'), roi=(hyb && ms.roi_sum!=null)? +ms.roi_sum : null;
          const tip = hyb
            ? 'Скільки € додав (або втратив) твій склад по ЗАКРИТИХ турах — сума приросту вартості складу за кожен тур, коли гравці були в твоєму лайнапі. ROI — сума по турах від «приріст ÷ вартість складу на старті туру» (скільки % складу ти виростив). 💼 «Менеджер турніру» (20/14/8/4/2 очок за місце наприкінці 6 турів) рахується з обох показників порівну: і € приросту, і ROI порівнюються з іншими учасниками. Місце «N з M» — за цим комбінованим показником на цей момент. Покупки й продажі вже закритих турів його не змінюють. Поточний тур сюди додається після закриття.'
            : 'Скільки € додав (або втратив) твій склад по ЗАКРИТИХ турах — сума приросту вартості складу за кожен тур, коли гравці були в твоєму лайнапі. Це те число, за яким рахується 💼 «Менеджер турніру» (20/14/8/4/2 очок за місце наприкінці 6 турів). Покупки й продажі вже закритих турів його не змінюють. Поточний тур сюди додається після закриття.';
          return col('💼 Приріст за тури', ms.rounds_done? `${d>=0?'▲':'▼'} ${sgn(d)}${eAbs(d)}${roi!=null? ` · ROI ${roi>=0?'+':'−'}${Math.abs(roi*100).toFixed(1)}%` : ''} · ${ms.place} з ${n}` : 'після 1-го туру', ms.rounds_done? (d>=0?'up':'down') : '', tip); })()
    : '';
  const nm=S.me.display_name||'—';
  const mn=$('my-name'); if(mn) mn.textContent=nm;
  const av=$('h-av'); if(av) av.textContent=(nm.trim()[0]||'—').toUpperCase();
}
async function go(tab, quiet){
  if(S.tab!==tab){ S.ctour=null; S.rrp=null; }   // 15.10: нова вкладка — чіп туру знову за замовчуванням (відкритий тур)
  S.tab=tab; renderTabs(); renderHeader();
  // quiet (21.10, Богдан: вибір суперника Rivals «оновлював сторінку»): старий вміст лишається, доки не готовий новий; прокрутка зберігається

// 535: тур «у грі» (дедлайн минув, результатів нема) — сервер морозить ПРИЙНЯТТЯ/ВИКУП/ставки/продаж, але дозволяє СТВОРЮВАТИ лот, пропозицію трансферу й обмін
const roundStarted=(r,n)=>!r.results_entered_at && (new Date(r.deadline_at)<=(n||new Date()) || !!r.opened_at);   // 545: тур почався = дедлайн минув АБО усі підтвердили (склади відкрито)
const inPlayRound=()=>{ const n=new Date(); return (S.rounds||[]).find(r=>roundStarted(r,n))||null; };
const prevOpenRound=(round)=>round?((S.rounds||[]).filter(r=>r.number<round.number && !r.results_entered_at).sort((a,b)=>a.number-b.number)[0]||null):null;   // 544: склад на тур підтверджується лише ПІСЛЯ закриття попереднього
const myConfirmedUpcoming=()=>!!(S.myConfLn && S.myConfLn.size>0);                                                                                       // 545: після власного підтвердження склад і ролі заморожені
const expiringP=p=>!!(p && p.owner_participant_id && p.contract_rounds_left!=null && p.contract_rounds_left<=1);
const EXPIRING_TXT='⏳ Контракт добігає (лишився 1 тур): після закриття туру гравець автоматично стане вільним (власник отримає повну вартість), тож угоду під час туру запропонувати не можна. Хочеш його продати чи обміняти — <b>продовж контракт до дедлайну</b>.';
// ── 🧭 ЄДИНИЙ БЛОК СТАНУ ТУРУ (15.10; рішення Богдана — як у «Predictions & Results» ЄвроСезону). Один над «Мій склад» і «Ринок»:
//    hero «ДО ДЕДЛАЙНУ» (або «тур у грі» / «ринок зачинено») + «СКЛАД n з 8», зелена смужка «склад підтверджено», «ПІДТВЕРДИЛИ n з m» з чіпами (лише «Мій склад»).
//    Замінив: «Трансферне вікно відкрито…», «Доступно €…» (дублювало Трансферний бюджет), «Тур N · дедлайн», «Підтвердили…», довге «Склад підтверджено…». Бюджети — budgetPanel() окремо ──
function countdownLong(iso){ const ms=new Date(iso)-new Date(); if(ms<=0) return 'дедлайн минув';
  const m=Math.floor(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  return d? d+' дн '+h+' год' : h? h+' год '+mm+' хв' : mm+' хв'; }
function dlFmt(iso){ const d=new Date(iso); return d.toLocaleDateString('uk',{weekday:'short'})+' '+d.toLocaleString('uk',{day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString('uk',{hour:'2-digit',minute:'2-digit'}); }
function stateBlock(mine, mode){   // mode: 'squad' (з чіпами підтверджень) | 'market'
  const cfg=S.cfg||{}, min=cfg.squad_min||5, max=cfg.squad_max||8, need=cfg.defgk_full_min||2;
  const rsAll=S.rounds||[], nowD=new Date();
  const firstFut=rsAll.find(r=>new Date(r.deadline_at)>nowD && !r.results_entered_at);
  // сервер (_market_trade_open) морозить ринок, щойно ХОЧА Б ОДИН тур «у грі» (дедлайн минув, результатів нема) — навіть коли вже заведено наступний тур; блок каже те саме
  const inplay=rsAll.find(r=>roundStarted(r,nowD));
  const n=mine.length, dgOk=mine.filter(isDG).length>=need;
  const right=`<div class="rt"><div class="cap">склад</div><div class="t" style="color:${n>=min?'var(--green)':'var(--gold)'}">${n} з ${max}</div>
    <div class="when dgr">${n<min?`ще мін ${min-n} до старту`:`мін ${min} ✓`} · ≥${cfg.defgk_start_min||1} DEF/GK в основі · ≥${need} DEF/GK у складі (основа або лавка)${n?(n>=max?` ${dgOk?'✓':'✕'}`:`, є ${mine.filter(isDG).length}${dgOk?' ✓':''}`):''}</div></div>`;
  const a=inplay?(S.attn||{})[inplay.number]:null;
  const why=!inplay?'':(!a?'':(a.state==='blocked' ? `⚠️ Чекає рішення адміна: ${esc(a.reason||'проблема з матчем')}.`
            : a.state==='closing' ? 'Усі матчі завершені — розрахунок за ~1 год.'
            : `Матчів завершено ${a.played||0} з ${a.fixtures||0} — рейтинги збираються самі, розрахунок після останнього матчу.`));
  let hero;
  if(firstFut){
    hero=`<div class="stbox"><div><div class="cap">до дедлайну · Тур ${firstFut.number}</div><div class="t">${countdownLong(firstFut.deadline_at)}</div>
      <div class="when">склад · бусти · К/V — до ${dlFmt(firstFut.deadline_at)}</div></div>${right}</div>`;
  }else if(inplay){
    hero=`<div class="stbox closed"><div><div class="cap">тур ${inplay.number}</div><div class="t">у грі</div>
      <div class="when">${why||'матчі тривають — розрахунок після останнього'}</div></div>${right}</div>`;
  }else{
    let t;
    if(!rsAll.length) t='відкриється, коли буде заведено тур.';
    else{ const si=stageInfo();
      t = si.left>0 ? 'усі створені тури зіграні — ринок відкриється, коли буде заведено наступний тур.'
        : ((si.stage===1 && S.cfg && S.cfg.stage2_last_round) ? `етап 1 завершено. Пре-маркет етапу 2 (з нуля) відкриється, коли адмін заведе тур ${si.last+1} і запустить старт етапу.`
                                                              : 'усі тури турніру зіграні — турнір завершено.'); }   // формат «1 етап» (stage2_last_round не задано): другого етапу нема
    hero=`<div class="stbox off"><div><div class="cap">ринок зачинено</div><div class="t">${rsAll.length?'тур не очікується':'турів нема'}</div><div class="when">${t}</div></div>${right}</div>`;
  }
  // тур у грі: що закрито/відкрито на ринку (текст як був у банері)
  const inplayMsg = inplay ? `<div class="stmsg warn"><b>Тур ${inplay.number} почався${(inplay.opened_at && new Date(inplay.deadline_at)>nowD)?' — усі підтвердили склад, склади відкрито':' — дедлайн минув'}. Ринок повністю закритий:</b> купівля, ставки, продаж, угоди, продовження контрактів і зміна ролей неможливі до закриття туру. Угоди, створені ДО старту, виконаються після закриття.${(firstFut&&why)?' '+why:''}</div>` : '';
  // мій склад підтверджено (фінально) на найближчий тур
  const locked=!!(firstFut && !inplay && S.confOK && S.me && confOf(S.me.id, firstFut.id));   // 545: коли тур почався, замість «поза складом можна…» діє банер «ринок повністю закритий»
  const lockedMsg = locked ? `<div class="stmsg ok">🔒 Склад на Тур ${firstFut.number} підтверджено — змінити склад і бусти не можна; гравців зі складу не можна ні продати, ні обміняти, ні продовжити, а ролі всіх твоїх гравців заморожені. Поза складом можна купувати, продавати й продовжувати контракти — до старту туру (лише адмін може розблокувати склад).</div>` : '';
  // хто підтвердив (лише «Мій склад»; як «Підтвердили» в Predictions & Results)
  let conf='';
  const cr=firstFut||inplay;
  if(mode==='squad' && S.confOK && cr){
    const pids=Object.keys(S.names), done=pids.filter(id=>confOf(id,cr.id)).length, all=pids.length>0 && done===pids.length;
    const chips=pids.map(id=>{ const ok=confOf(id,cr.id); return `<span class="cfchip ${ok?'ok':'wait'}">${ok?'✓':'○'} ${esc(S.names[id])}</span>`; }).join('');
    const note = all ? '🔓 Усі підтвердили — склади, капітани й бусти відкрито.'
                : (new Date(cr.deadline_at)<=nowD ? 'Дедлайн минув — склади, капітани й бусти відкрито.' : 'Щойно підтвердять усі — склади, капітани й бусти стануть видні кожному.');
    conf=`<div class="stconf"><div class="cap">підтвердили <b>${done} із ${pids.length}</b></div><div class="cfchips">${chips}</div><div class="when">${note}</div></div>`;
  }
  return hero + inplayMsg + lockedMsg + penBanners() + evBanners() + dealBanners() + outbidBanners() + agBanners() + conf;
}
// 542: банери штрафів ролей — МІЙ борг / склад «не зараховано» / вихід гравця (приватне, лише власнику)
// 555: «Поговорити з агентом» — блок у картці ЧУЖОГО гравця (кнопка, квота вікна, остання відповідь агента)
function agentUI(p){
  if(!S.agReady || (S.cfg && S.cfg.agent_enabled===false) || !S.agq) return '';
  const q=S.agq, per=+q.per_round||3, left=Math.max(0,per-(+q.used||0));
  const last=(S.agi||[]).find(x=>x.player_id===p.id && (!q.round_id || x.round_id===q.round_id)) || (S.agi||[]).find(x=>x.player_id===p.id);
  let info='';
  if(last){ const r=last.result||{}, d=new Date(last.created_at).toLocaleString('uk',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    info=`<p class="agres">🕵️ <b>Агент</b> <span class="dim">(${d})</span>: ${r.role?`роль <b>${roleLabel(r.role)}</b> · `:''}контракт <b>${r.contract_rounds_left}</b> з <b>${r.contract_length}</b> ${turW(r.contract_length)} · зарплата <b>${eur(r.wage_per_round)}</b>/тур${r.marked?' · <b class="warnc">🚩 порушив</b>':''}</p>`; }
  // 20.10: один компактний рядок (повний текст — у підказці), щоб не займати пів вікна
  return `<div class="agbox agrow" title="Дізнатись точно: роль, залишок контракту, зарплату, позначку «порушив». Власник побачить, що про його гравця питали (без імені). Невикористані запити не переносяться на наступне вікно туру.">🕵️ <b>Агент</b> <span class="dim">· лишилось ${left} з ${per} запитів</span>
    <button type="button" class="ghost mini" data-do="agent" ${left<1?'disabled title="Ліміт запитів на це вікно вичерпано"':''}>Поговорити з агентом</button></div>${info}`;
}
// 555: власник — «про твого гравця питали» (без імені запитувача)
function agPingNote(p){

function tourDates(r){   // «17–19 жовт.» / «30 жовт.–1 лист.» — за матчами туру (Київ)
  const fx=((S.rr&&S.rr.fix)||[]).filter(f=>f.round_id===r.id); if(!fx.length) return '';
  const ky=iso=>new Date(new Date(iso).toLocaleString('en-US',{timeZone:'Europe/Kyiv'}));
  const ts=fx.map(f=>ky(f.kickoff_at)).sort((a,b)=>a-b), a=ts[0], b=ts[ts.length-1];
  if(a.getMonth()===b.getMonth()) return a.getDate()===b.getDate() ? a.getDate()+' '+MON_UK[a.getMonth()] : a.getDate()+'–'+b.getDate()+' '+MON_UK[a.getMonth()];
  return a.getDate()+' '+MON_UK[a.getMonth()]+'–'+b.getDate()+' '+MON_UK[b.getMonth()];
}
// «нове» для закритих турів — що я ще не відкривав (лише цей браузер; localStorage може бути недоступний)
function seenKey(){ return 'sqseen:'+(S.tour&&S.tour.id)+':'+(S.me&&S.me.id); }
function seenGet(){ try{ return new Set(JSON.parse(localStorage.getItem(seenKey())||'[]')); }catch(e){ return new Set(); } }
function seenAdd(id){ try{ const st=seenGet(); if(!st.has(id)){ st.add(id); localStorage.setItem(seenKey(), JSON.stringify([...st])); } }catch(e){} }
function tourChipsHtml(){
  const total=Math.max((S.cfg&&S.cfg.mgmt_total_rounds)||6, (S.rounds||[]).length), nowD=new Date();
  const edit=(S.rounds||[]).find(r=>new Date(r.deadline_at)>nowD && !r.results_entered_at) || (S.rounds||[]).find(r=>new Date(r.deadline_at)>nowD);
  const seen=seenGet(), sel=S.ctour, chips=[];
  for(let n=1;n<=total;n++){
    const r=(S.rounds||[]).find(x=>x.number===n);
    if(!r){ chips.push(`<button class="tchip off" disabled title="Тур ще не створено"><b>Тур ${n}</b><small>—</small></button>`); continue; }
    const closed=!!r.results_entered_at, started=new Date(r.deadline_at)<=nowD, isEdit=!!(edit && edit.id===r.id);
    const mk = closed ? ' ✔' : (started ? ' ⏳' : ((isEdit && S.confOK && S.me && confOf(S.me.id,r.id)) ? ' 🔒' : ''));
    const dot = (isEdit && S.confOK && S.me && !confOf(S.me.id,r.id)) || (closed && !seen.has(r.id));
    chips.push(`<button class="tchip ${r.id===sel?'on':''}" data-tchip="${r.id}" title="${closed?'Тур закрито':started?'Тур у грі':isEdit?'Відкритий для виставлення складу':'Ще не відкрито для виставлення'}"><b>Тур ${n}${mk}${dot?'<span class="dot"></span>':''}</b><small>${esc(tourDates(r)||'—')}</small></button>`);
  }
  return `<div class="trow">${chips.join('')}</div>`;
}
function bindTourChips(){

const eurSgn=d=>(d>0?'+':d<0?'−':'')+'€'+(Math.abs(d)/1e6).toFixed(1)+'M';
const eurSgn2=d=>(d>0?'+':d<0?'−':'')+'€'+(Math.abs(d)/1e6).toFixed(2)+'M';   // зміна ціни одного гравця — копійки важливі (+€0.26M)
const ppSgn=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1)+' п.п.';
// стан гравця в лайнапі → очки в суму (та сама логіка, що плитки борди: ×2 лише коли dbl і не «бонусний» запасний Автопілота)
function rrMath(l){
  const raw=l.points, bonusOnly=!!(l.dbl && l.role==='bench' && !l.counted);
  const pts = raw==null ? null : ((l.dbl && !bonusOnly) ? raw*2 : raw);
  const inSum = l.role==='start' ? l.state==='played' : (!!l.counted || bonusOnly);
  return {raw, pts, bonusOnly, inSum};
}

async function viewSquad(){
  const mine = S.players.filter(p=>p.owner_participant_id===S.me.id);
  // тур для виставлення = найближчий із дедлайном попереду (лок після дедлайну)
  const round = S.rounds.find(r => new Date(r.deadline_at) > new Date()) || null;
  clearTimeout(S.rrTimer);
  await loadRR();
  await loadChallenges();
  await loadRivals();
  // вибраний чіп туру (15.10): за замовчуванням — відкритий тур для виставлення; тури без виставлення — результат; коли відкритого нема — останній створений
  let cur = S.rounds.find(r=>r.id===S.ctour) || null;
  if(!cur && !round && S.rounds.length) cur = S.rounds.slice().sort((a,b)=>b.number-a.number)[0];
  if(cur && (!round || cur.id!==round.id)){ S.ctour=cur.id; return viewRoundView(cur, round); }
  S.ctour = round ? round.id : null;
  let lu = [];
  if(round){
    try{ lu = await sbSel(`market_lineup?round_id=eq.${round.id}&participant_id=eq.${S.me.id}&select=player_id,role,bench_order,is_captain,is_vice`); }catch(e){}
  }
  // чернетка лайнапу: player_id → {role:'start'|'bench'|'out', cap, vice, ord}
  // бусти туру (501): свої рядки видно завжди; немає таблиці (501 не залито) → блок ховається
  S.myBoosts = []; S.boostsOK = true;
  try{ S.myBoosts = await sbSel(`market_round_boosts?participant_id=eq.${S.me.id}&select=round_id,boost`); }catch(e){ S.boostsOK=false; }
  S.boost = (round && (S.myBoosts.find(b=>b.round_id===round.id)||{}).boost) || null;
  // позиційні бусти (532): свої рядки видно завжди; немає таблиці (532 не залито) → блок ховається
  S.myPosBoosts = []; S.posOK = true;
  try{ S.myPosBoosts = await sbSel(`market_round_pos_boosts?participant_id=eq.${S.me.id}&select=round_id,kind,player_id`); }catch(e){ S.posOK=false; }
  S.pos = { fwd:null, mid:null, dg:null };
  if(round) S.myPosBoosts.filter(b=>b.round_id===round.id).forEach(b=>{ if(b.kind in S.pos) S.pos[b.kind]=b.player_id; });
  S.lineup = {}; S.lineupRound = round;
  mine.forEach(p => S.lineup[p.id] = { role:'out', cap:false, vice:false, ord:99 });
  lu.forEach(r => { if(S.lineup[r.player_id]) S.lineup[r.player_id] = { role:r.role, cap:r.is_captain, vice:r.is_vice, ord:r.bench_order||99 }; });
  // збережений на сервері склад (для стану кнопки): null = ще нічого не підтверджено на цей тур
  S.lnSaved = lu.length ? lnSigOf(lu.map(r=>({id:r.player_id, role:r.role, ord:r.bench_order||99, cap:r.is_captain, vice:r.is_vice})), S.boost, S.pos) : null;
  renderLineup(mine, round);
}

function bindRival(round){
  const box=document.querySelector('.rvbox'); if(!box) return;

  const call=(id)=>act('market_set_rival',{p_round:round.id,p_participant:S.me.id,p_opponent:id==='nobody'?null:id,p_nobody:id==='nobody'},null,{quiet:true});
  if(ph==='free'){ box.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{ if(!b.disabled) call(b.dataset.rv); }); }
  else if(ph==='switch'){
    let pending=my?(my.is_nobody?'nobody':my.opponent_participant):null; const btn=box.querySelector('#rv-change');
    box.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{ if(b.disabled) return; pending=b.dataset.rv;

      if(btn) btn.disabled=(pending===(my?(my.is_nobody?'nobody':my.opponent_participant):null)); });
    if(btn) btn.onclick=()=>confirmModal(`Новий суперник: <b>${pending==='nobody'?'Нікого':esc(S.names[pending]||'?')}</b>.<br>Це остання зміна цього туру — після підтвердження суперника більше не можна буде переобрати.`, 'Підтвердити зміну', ()=>call(pending));
  }
}

const stageOfNum = n => n <= ((S.cfg && S.cfg.stage1_last_round) || 5) ? 1 : 2;
function boostUsedElsewhere(key, round){   // уже використано/заплановано в ІНШОМУ турі цього ж етапу?

function lnState(mine){
  const st = mine.filter(p=>S.lineup[p.id].role==='start');
  const bn = mine.filter(p=>S.lineup[p.id].role==='bench').sort((a,b)=>S.lineup[a.id].ord-S.lineup[b.id].ord);
  const out= mine.filter(p=>S.lineup[p.id].role==='out');
  const min5 = S.cfg?S.cfg.squad_min:5, benchMax=(S.cfg?S.cfg.squad_max-S.cfg.squad_min:3), dgMin=S.cfg?S.cfg.defgk_start_min:1;
  const defgk = st.filter(p=>p.position==='D'||p.position==='G').length;
  const auto = S.boost==='squad_autopilot';           // Автопілот замінює Капітана/Віце
  const cap = auto ? null : st.find(p=>S.lineup[p.id].cap);
  const vice= auto ? null : st.find(p=>S.lineup[p.id].vice);
  const errs=[];
  if(st.length<1||st.length>min5) errs.push(`основа 1..${min5}`);
  if(bn.length>benchMax) errs.push(`лавка ≤${benchMax}`);
  if(defgk<dgMin) errs.push(`≥${dgMin} DEF/GK в основі`);
  if(!auto && !cap) errs.push('обери капітана');
  if(!auto && st.length>=2 && !vice) errs.push('обери віце');   // віце обов'язковий (потребує ≥2 в основі)
  return { st, bn, out, defgk, dgMin, min5, benchMax, cap, vice, auto, ok: errs.length===0, errs };
}

// перемістити лавкового вгору/вниз (порядок = пріоритет автозаміни)
function moveBench(mine, pid, dir){
  const bn = mine.filter(p=>S.lineup[p.id].role==='bench').sort((a,b)=>S.lineup[a.id].ord-S.lineup[b.id].ord);
  bn.forEach((p,i)=>S.lineup[p.id].ord=i+1);          // нормалізувати 1..n
  const i = bn.findIndex(p=>p.id===pid), j = i+dir;
  if(i<0 || j<0 || j>=bn.length) return;
  const a=bn[i].id, b=bn[j].id, t=S.lineup[a].ord; S.lineup[a].ord=S.lineup[b].ord; S.lineup[b].ord=t;
}

         ${zoneBlock('Поза складом', s.out, 'out')}
         ${challengesBlock(s, round)}
       </div>
     </div>`;

  if(round) bindRival(round);
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
    const [pid,role]=b.dataset.role.split(':');

      if(cnt>=(S.cfg?S.cfg.squad_min:5)) return alert('В основі вже максимум');
    }
    if(role==='bench'){
      const cnt=mine.filter(p=>S.lineup[p.id].role==='bench').length;
      if(cnt>=(S.cfg?S.cfg.squad_max-S.cfg.squad_min:3)) return alert('Лавка повна');
      S.lineup[pid].ord = 1+Math.max(0,...mine.map(p=>S.lineup[p.id].role==='bench'?S.lineup[p.id].ord:0));
    }
    if(role!=='start'){ S.lineup[pid].cap=false; S.lineup[pid].vice=false; clearPosFor(pid); }
    S.lineup[pid].role=role;
    renderLineup(mine, round);
  });
  document.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>{
    const pid=b.dataset.cap; mine.forEach(p=>S.lineup[p.id].cap=false);
    S.lineup[pid].cap=true; S.lineup[pid].vice=false; clearPosFor(pid); renderLineup(mine, round);
  });
  document.querySelectorAll('[data-vice]').forEach(b=>b.onclick=()=>{
    const pid=b.dataset.vice; mine.forEach(p=>S.lineup[p.id].vice=false);
    if(!S.lineup[pid].cap){ S.lineup[pid].vice=true; clearPosFor(pid); } renderLineup(mine, round);
  });
  document.querySelectorAll('[data-boost]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.boost;
    S.boost = (S.boost===k) ? null : k;                       // клік = увімкнути/вимкнути; інший буст заміняє
    if(S.boost==='squad_autopilot') mine.forEach(p=>{ S.lineup[p.id].cap=false; S.lineup[p.id].vice=false; });   // Кап/Віце більше не потрібні
    if(S.boost) S.pos={ fwd:null, mid:null, dg:null };                                                         // 532: позиційні бусти не поєднуються з Автопілотом/All-in
    renderLineup(mine, round);
  });
  document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{ const pid=b.dataset.pos, p=mine.find(x=>x.id===pid), k=p&&posKindOf(p); if(!k) return; S.pos[k]=(S.pos[k]===pid)?null:pid; renderLineup(mine, round); });
  document.querySelectorAll('[data-posclear]').forEach(b=>b.onclick=()=>{ S.pos[b.dataset.posclear]=null; renderLineup(mine, round); });
  document.querySelectorAll('[data-benchup]').forEach(b=>b.onclick=()=>{ moveBench(mine,b.dataset.benchup,-1); renderLineup(mine,round); });
  document.querySelectorAll('[data-benchdown]').forEach(b=>b.onclick=()=>{ moveBench(mine,b.dataset.benchdown,1); renderLineup(mine,round); });
  $('view').querySelectorAll('.pcard[data-pc]').forEach(el=>el.onclick=(e)=>{ if(e.target.closest('button,.lctrl,a,input,select')) return; openPlayerModal(el.dataset.pc); });
  bindActions();  // кнопки «продати»
  bindTourChips();   // чіпи турів (15.10)
  const pb=$('view').querySelector('[data-do="pour"]'); if(pb) pb.onclick=pourModal;   // переливання бюджетів
  const save=$('ln-save');
  if(save) save.onclick=()=>{ const s2=lnState(mine); if(s2.ok) openLineupReview(mine, round); };
}

// модалка-огляд складу перед підтвердженням (капітан/віце + порядок лавки)

        + viol.map(x=>`<p class="mnote">• <b>${esc(x.name)}</b> — борг ≈ ${eur(Math.round(x.wage_per_round*debtPct()))}${x.marked?' · <b class="warnc">🚩 вже порушував — гравця буде АВТОМАТИЧНО ПРОДАНО відразу після туру</b>':''}</p>`).join('')
        + `<p class="mnote">Не рахується: травма чи дискваліфікація (навіть «під питанням») або перенесений/скасований матч клубу. Не хочеш порушувати — постав «Основного» в основу або переведи його на «Лавку» у картці гравця (+${Math.round(benchPrem()*100)}% до зарплати).</p>`;
    }
    if(exempt.length) penBlk+=`<p class="mnote">ℹ️ Зараз не рахуються через травму/дискваліфікацію: ${exempt.map(x=>esc(x.name)).join(', ')} — якщо до дедлайну одужають, це знову порушення.</p>`;
    if(debtSum()>0){ blockDebt=true; penBlk=`<p class="mnote warn" style="margin-top:14px">💸 Є несплачений борг ${eur(debtSum())} — спершу сплати його (кнопка «Сплатити борг» над складом), інакше склад підтвердити не можна.</p>`+penBlk; }
  }
  modalOpen(`<h3>Підтвердити склад · тур ${round.number}</h3>

    <div class="msec" style="margin-top:12px">Основа (${s.st.length})</div>${starters}

    <p class="mnote">Незіграний основний → замінить ПЕРШИЙ зіграний з лавки за цим порядком (без звірки позиції). Перевір порядок!</p>
    ${bench}
    ${posPayload()?`<div class="msec" style="margin-top:14px">⚡ Позиційні бусти</div>${Object.entries(posPayload()).map(([k,id])=>{ const pl=s.st.find(p=>p.id===id); return `<p class="mnote">⚡ <b>${POSB[k].name}</b> → ${pl?esc(pl.name):'—'} · ×2, якщо зіграє (інакше згорає). Кожен буст — раз за турнір.</p>`; }).join('')}`:''}
    ${S.boost?`<div class="msec" style="margin-top:14px">Буст туру</div><p class="mnote">${BOOSTS[S.boost].ico} <b>${BOOSTS[S.boost].name}</b> — ${BOOSTS[S.boost].desc} Після дедлайну він спишеться назавжди (Автопілот і All-in — по одному разу за турнір).</p>`:''}
    </div><div class="cfcol">
    ${challengesModalHtml(s, round)}
    ${rivalsModalHtml(round)}
    ${penBlk}
    </div></div>
    <div class="cfbottom">
    ${S.confOK?'<p class="mnote warn" style="margin-top:14px">⚠️ Підтвердження ФІНАЛЬНЕ: змінити склад і бусти після нього не вийде (лише адмін розблокує). Коли підтвердять усі учасники, склади й бусти всіх відкриються.</p>':''}
    <div class="macts" style="margin-top:16px"><button data-do="lnyes"${blockDebt?' disabled title="Спершу сплати борг"':''}>Підтвердити склад</button><button class="ghost" data-do="lnno">Назад</button></div></div>`);
  { const cfm=$('mhost').querySelector('.modal'); if(cfm) cfm.classList.add('cfmodal'); }
  $('mhost').querySelector('[data-do="lnyes"]').onclick=async()=>{ modalClose(); await act('market_set_lineup', {
    p_round:round.id, p_participant:S.me.id, p_starters:s.st.map(p=>p.id),
    p_bench:s.bn.map(p=>p.id), p_captain:s.cap?s.cap.id:null, p_vice:s.vice?s.vice.id:null, p_boost:S.boost||null, p_pos_boosts:posPayload()
  }, S.boost?('Склад підтверджено · '+BOOSTS[S.boost].name):'Склад підтверджено'); };
  $('mhost').querySelector('[data-do="lnno"]').onclick=()=>modalClose();
}
// ── дрібні хелпери плитки/картки ──
const POS = { G:'GK', D:'DEF', M:'MID', F:'FWD' };
function posCat(p){ return POS[p]||p; }
// 561: чи можу скасувати свою лідерську ставку: лот активний, ще не завершується, інших ставок нема (без даних про ставки — показуємо, сервер вирішить)
function canCancelBid(a){ if(!a||!S.me||a.leader_participant_id!==S.me.id) return false; if(new Date(a.ends_at)<=new Date()) return false;
  if(!S.bidsReady) return true; const st=S.bidsBy[a.id]; return !st||![...st].some(x=>x!==S.me.id); }
function cancelBidModal(auId,nm,back){ confirmModal(`Скасувати свою ставку на <b>${esc(nm)}</b>? Лот зніметься, гроші й зарплатний резерв звільняться; гравець знову стане вільним.`, 'Скасувати ставку',
  ()=>act('market_cancel_bid',{p_auction:auId},'Ставку скасовано'), back); }
function clubPos(p){ return `${clubWithLeague(p.club_id)} · ${posCat(p.position)}`; }   // 21.10: «Клуб · Ліга · Позиція» скрізь, де гравець у списку/рядку угоди
// зафіксована початкова вартість під поточною: показуємо лише коли ціна вже зрушила (до першого матчу поточна = початкова — один рядок)
function startWas(p,align){
  const s=p.market_value_start, c=p.market_value_current;
  if(s==null || c==null || s===c) return '';
  return `<small class="was"${align?` style="text-align:${align}"`:''} title="Вартість на старті турніру (зафіксована)">старт ${eur(s)}</small>`;
}
function vDelta(p){
  const s=p.market_value_start||0, c=p.market_value_current||0;
  if(!s) return { pct:0, dir:'flat' };
  const d=(c-s)/s;
  return { pct:d, dir: d>0.0005?'up':(d<-0.0005?'down':'flat') };
}
// один знак після коми без зайвого «.0» — як на борді (раніше цілі: −0.25% показувалось «▼ 0%», а на борді «−0.3%»)
function fmtDelta(d){ return (d.dir==='up'?'▲ ':d.dir==='down'?'▼ ':'– ')+Math.abs(d.pct*100).toFixed(1).replace(/\.0$/,'')+'%'; }
function avatar(p,size){
  const s=size||76;
  const init=(p.name||'?').split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
  const th = poolThumb(p.photo_url);
  const inner = p.photo_url ? `<img src="${esc(th)}" alt="" loading="lazy" decoding="async"${th!==p.photo_url?imgFallback(p.photo_url):''}>` : esc(init);
  return `<div class="mav" style="width:${s}px;height:${s}px;font-size:${Math.round(s/3)}px">${inner}</div>`;
}
function ownerInfo(p){
  if(p.owner_participant_id===S.me.id) return { cls:'mine', txt:'★ У твоєму складі', dot:'' };
  if(p.owner_participant_id) return { cls:'', txt:'у складі · '+esc(S.names[p.owner_participant_id]||'—'), dot:'<span class="dot o"></span>' };
  const au=S.auctions.find(a=>a.player_id===p.id);
  if(au) return { cls:'free', txt:'аукціон · '+eur(au.current_bid), dot:'<span class="dot g"></span>' };
  return { cls:'free', txt:'Вільний', dot:'<span class="dot g"></span>' };
}
function formChart(p){
  const last=(S.form[p.id]||[]).filter(v=>v!=null).slice(-5);
  if(!last.length) return `<p class="mnote">Форма зʼявиться після зіграних турів.</p>`;
  const W=320,H=64,pad=8, mn=Math.min(...last,6), mx=Math.max(...last,9);
  const pts=last.map((v,i)=>{
    const x=pad+i*(W-2*pad)/Math.max(1,last.length-1);
    const y=H-pad-((v-mn)/Math.max(0.1,mx-mn))*(H-2*pad);
    return x.toFixed(0)+','+y.toFixed(0);
  }).join(' ');
  return `<div class="mchart"><div class="msec" style="border:0;margin:0 0 4px">Форма · рейтинги за останні тури</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
      <polyline fill="none" stroke="var(--gold)" stroke-width="2" points="${pts}"/></svg></div>`;
}
// пре-чек лімітів складу при набутті (дублює тригер 398 — тут для UX, блокуємо заздалегідь §K)
// ── DEF/GK: «досяжність» (SQL 514, рішення Богдана 09.10) ──
// після набуття слотів до squad_max має вистачати, щоб добрати defgk_full_min DEF/GK: D/G + (max − гравців) ≥ min.
const isDG = x => x && (x.position==='D' || x.position==='G');
// 16.10 (відгук Богдана): просте пояснення правила для «Мій склад» і «Ринок» — ≥2 DEF/GK потрібні лише для складу 8/8
// 20.10 (відгук Богдана): новачок має знати правило DEF/GK з першої секунди — і «у складі (основа або лавка)», і «≥1 в основі»
const dgFrag = () => { const c=S.cfg||{}; return `≥${c.defgk_full_min||2} DEF/GK у складі (основа або лавка), з них ≥${c.defgk_start_min||1} в основі`; };
const dgNote = () => { const c=S.cfg||{}, mx=c.squad_max||8; return `щоб мати ${mx}/${mx}, потрібно ${dgFrag()}`; };
function dgRule(total, dg){                       // → null (ок) або текст причини; total/dg — ПІСЛЯ набуття
  const cfg=S.cfg||{}, max=cfg.squad_max||8, need=cfg.defgk_full_min||2;
  if(dg + (max-total) >= need) return null;
  if(total===max) return `На повному складі потрібно ≥${need} DEF/GK`;
  return `Далі лише DEF/GK: у складі з ${max} потрібно ≥${need} DEF/GK, а слотів після цієї купівлі лишиться ${max-total}, коли DEF/GK бракує ще ${need-dg}`;
}
// нагадування про DEF/GK на «Мій склад» і «Ринок» (стани: ок / потрібно ще / решта слотів лише DEF/GK / недосяжно)
function defgkBanner(mine){
  const cfg=S.cfg||{}, max=cfg.squad_max||8, need=cfg.defgk_full_min||2;
  const n=mine.length; if(!n) return '';
  const d=mine.filter(isDG).length, slots=max-n, lack=Math.max(0,need-d);
  let cls='dgb-info', txt;
  if(lack===0) return '';   // ок — показано як «DEF/GK ✓» у блоці стану (stateBlock); окремий банер лише коли є що виправляти
  else if(lack>slots){ cls='dgb-bad'; txt=`✕ DEF/GK: <b>${d}</b> з ${need}, вільних слотів <b>${slots}</b> — склад із ${max} недосяжний. Продай не-DEF/GK або обміняй його на DEF/GK.`; }
  else if(lack===slots){ cls='dgb-warn'; txt=`⚠️ Решта <b>${slots}</b> ${slots===1?'слот':'слоти'} — <b>лише DEF/GK</b> (потрібно ще ${lack}).`; }
  else { txt=`DEF/GK у складі: <b>${d}</b> з ${need}. Для повного складу з ${max} потрібно ще <b>${lack}</b> · вільних слотів: ${slots}.`; }
  return `<div class="dgbanner ${cls}">${txt}</div>`;
}
// 20.10 (відгук Богдана): при купівлі нагадуємо правило DEF/GK, якщо в складі їх ще бракує (щоб новачок не помилився)
function dgWarn(p){
  const cfg=S.cfg||{}, max=cfg.squad_max||8, need=cfg.defgk_full_min||2;
  const mine=S.players.filter(x=>x.owner_participant_id===S.me.id), n=mine.length, d=mine.filter(isDG).length, lack=Math.max(0,need-d);
  if(lack<=0) return '';
  if(isDG(p)) return `<p class="mnote" style="margin:6px 0 0">🛡 У складі DEF/GK: <b>${d}</b> з ${need} — цей гравець допоможе виконати правило: ${dgFrag()}.</p>`;
  const slotsAfter=max-n-1;
  return `<p class="mnote warn" style="margin:6px 0 0">⚠️ У складі DEF/GK: <b>${d}</b> з ${need}. Щоб мати ${max}/${max}, потрібно ${dgFrag()}. Після цієї купівлі вільних слотів: <b>${slotsAfter}</b>${slotsAfter===lack?' — решта слотів тільки для DEF/GK':''}.</p>`;
}
function acquireBlock(p){
  const cfg=S.cfg||{}, mine=S.players.filter(x=>x.owner_participant_id===S.me.id);
  if(mine.length >= (cfg.squad_max||8)) return `Склад повний (${cfg.squad_max||8}) — спершу звільни місце`;
  if(mine.filter(x=>x.club_id===p.club_id).length >= (cfg.max_per_club||3)) return `Уже ${cfg.max_per_club||3} з цього клубу`;
  if(p.position==='G' && mine.some(x=>x.position==='G'&&x.club_id===p.club_id)) return 'Уже є воротар з цього клубу';
  // 514: досяжність 2 DEF/GK уже з 7-го гравця (раніше лише на 8-му)
  return dgRule(mine.length+1, mine.filter(isDG).length + (isDG(p)?1:0));
}

// ── плитка гравця (сітка ринку, за макетом) ──
function mtile(p){
  const cl=(S.clubs[p.club_id]||{}), d=vDelta(p), o=ownerInfo(p);
  // 514: вільний не-DEF/GK, якого вже не можна взяти через правило DEF/GK → приглушуємо й підписуємо
  let dgb=''; if(S.me && !p.owner_participant_id && !isDG(p)){ const mine=S.players.filter(x=>x.owner_participant_id===S.me.id);
    // 16.10: на повному складі (8/8) купити нікого не можна — підпис «лише DEF/GK» там вводив в оману; показуємо лише коли ще є вільні слоти
    if(mine.length && mine.length<((S.cfg&&S.cfg.squad_max)||8) && dgRule(mine.length+1, mine.filter(isDG).length)) dgb='<div class="mdgb" title="Решта слотів — лише DEF/GK">лише DEF/GK</div>'; }
  return `<div class="mtile ${o.cls==='mine'?'mine':''}${dgb?' dgblock':''}" data-p="${p.id}">
    <div class="mtop"><span class="pbadge ${p.position}">${posCat(p.position)}</span>${injuryBadge(p)}</div>
    ${S.listingsReady && S.listings[p.id] ? `<div class="mlistb" title="Виставлений на вітрину: ${S.listings[p.id].seller_participant===S.me.id?'твій лот':'викупити можна миттєво'}">🏷 вітрина ${eur(S.listings[p.id].ask_price)}</div>` : ''}
    ${avatar(p,76)}
    <div class="mnm">${esc(p.name)}</div>
    <div class="mclub">${esc(cl.name||'')}</div>
    <div class="mlg">${esc(leagueEn(cl.league))}</div>
    ${dgb}
    <div class="mtrow"><span class="rpill">${p.season_avg_rating??'—'}</span><span class="mprice">${eur(p.market_value_current)}</span><span class="vdelta ${d.dir}">${fmtDelta(d)}</span></div>
    ${startWas(p,'center')}
