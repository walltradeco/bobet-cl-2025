// ── фільтрація + сортування ──
// картки: ефективний дизайн гравців (market_player_card) + каталог (card_key→колекції) +
// реєстр колекцій. Один лінивий запит на все, graceful-degrade (потребує 422/430/437).
// Спільний для Колекції й Ринку — щоб два місця не розійшлись.
async function loadCardMeta(){
  if(!Object.keys(S.cards).length){
    try{ (await sbSel(`market_player_card?tournament_id=eq.${S.tour.id}&select=id,goals,assists,country,val_delta_tour_pct,current_tier,current_card_key,current_card_png`)).forEach(c=>S.cards[c.id]=c); }catch(e){}
  }
  if(!S.cardMeta){
    S.cardMeta={}; S.collReg=[];
    try{ (await sbSel(`card_items?select=card_key,tier,collections`)).forEach(c=>S.cardMeta[c.card_key]=c); }catch(e){}
    try{ S.collReg=await sbSel(`card_collections?select=key,title&order=sort_order`); }catch(e){ S.collReg=[]; }
  }
}
function marketList(){
  const f=S.f; let list=S.players.slice();
  if(f.status==='free')  list=list.filter(p=>!p.owner_participant_id);
  else if(f.status==='owned') list=list.filter(p=>p.owner_participant_id);
  else if(f.status==='mine')  list=list.filter(p=>p.owner_participant_id===S.me.id);
  if(f.league) list=list.filter(p=>(S.clubs[p.club_id]||{}).league===f.league);
  if(f.club)   list=list.filter(p=>p.club_id===f.club);
  if(f.pos)    list=list.filter(p=>p.position===f.pos);
  // рарність/колекція — це косметика, у Ринку не фільтруємо (лише в Колекції/Крамниці)
  if(f.q){ const q=f.q.toLowerCase(); list=list.filter(p=>(p.name||'').toLowerCase().includes(q)); }
  // немає рейтингу (не грав/травма) ≠ рейтинг 0 — такий гравець не ріжеться слайдером рейтингу
  if(f.rMin!=null) list=list.filter(p=>p.season_avg_rating==null || p.season_avg_rating >= f.rMin);
  if(f.rMax!=null) list=list.filter(p=>p.season_avg_rating==null || p.season_avg_rating <= f.rMax);
  if(f.pMin!=null) list=list.filter(p=>(p.market_value_current||0) >= f.pMin);
  if(f.pMax!=null) list=list.filter(p=>(p.market_value_current||0) <= f.pMax);
  const s=f.sort;
  const scoredOf=p=>{ const st=S.stats[p.id]; return st&&st.rounds_played>0?st.scored_points:-1; };
  list.sort((a,b)=>{
    if(s==='points') return scoredOf(b)-scoredOf(a);
    if(s==='price') return (b.market_value_current||0)-(a.market_value_current||0);
    if(s==='val')   return vDelta(b).pct - vDelta(a).pct;
    if(s==='name')  return (a.name||'').localeCompare(b.name||'');
    return (b.season_avg_rating||0)-(a.season_avg_rating||0);
  });
  return list;
}

  return `<div class="mfilters">
    <div class="mf search"><input id="f-q" placeholder="Пошук по імені (англ.)" value="${esc(f.q)}"></div>
    <div class="mf"><select id="f-league"><option value="">Ліга: усі (${leagues.length})</option>${leagues.map(l=>opt(l,leagueEn(l),f.league)).join('')}</select></div>
    <div class="mf"><select id="f-club"><option value="">Клуб: усі (${clubs.length})</option>${clubs.map(c=>opt(c.id,c.name,f.club)).join('')}</select></div>
    <div class="mf"><select id="f-pos"><option value="">Позиція: усі</option>${['G','D','M','F'].map(x=>opt(x,posCat(x),f.pos)).join('')}</select></div>
    <div class="mf range"><label>Рейтинг</label><div class="rng">
      <span class="track"></span><span class="fill" id="fill-r"></span>
      <input type="range" id="f-rmin" min="${rB[0]}" max="${rB[1]}" step="0.1" value="${f.rMin}">
      <input type="range" id="f-rmax" min="${rB[0]}" max="${rB[1]}" step="0.1" value="${f.rMax}"></div>
      <span class="rv" id="rv-r">${(+f.rMin).toFixed(1)}–${(+f.rMax).toFixed(1)}</span></div>
    <div class="mf range"><label>Ціна</label><div class="rng">
      <span class="track"></span><span class="fill" id="fill-p"></span>
      <input type="range" id="f-pmin" min="${pB[0]}" max="${pB[1]}" step="1000000" value="${f.pMin}">
      <input type="range" id="f-pmax" min="${pB[0]}" max="${pB[1]}" step="1000000" value="${f.pMax}"></div>
      <span class="rv" id="rv-p">${eur(f.pMin)}–${eur(f.pMax)}</span></div>
    <div class="msort"><span>Сортувати</span><select id="f-sort">${[['rating','за рейтингом'],['points','за очками'],['price','за ціною'],['val','за Val Δ'],['name','за іменем']].map(([v,t])=>opt(v,t,f.sort)).join('')}</select></div>
  </div>`;
}
function renderGrid(){
  const grid=$('mgrid'); if(!grid) return;
  const list=marketList(), cap=80;
  const cnt=$('mcount'); if(cnt) cnt.textContent=list.length+' гравців';
  grid.innerHTML = list.length
    ? list.slice(0,cap).map(mtile).join('') + (list.length>cap?`<p class="dim" style="grid-column:1/-1;margin:6px 0 0">показано ${cap} з ${list.length} — звузь фільтром</p>`:'')
    : '<div class="soon" style="grid-column:1/-1">Немає гравців під фільтри</div>';
  grid.querySelectorAll('.mtile').forEach(t=>t.onclick=()=>openPlayerModal(t.dataset.p));
}
function bindFilters(){
  const q=$('f-q'); if(q) q.oninput=()=>{ S.f.q=q.value; renderGrid(); };
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onchange=e=>{ fn(e.target.value); renderGrid(); }; };
  bind('f-league',v=>S.f.league=v); bind('f-club',v=>S.f.club=v);
  bind('f-pos',v=>S.f.pos=v); bind('f-sort',v=>S.f.sort=v);
  const paint=(el,inp,a,b)=>{ if(!el||!inp) return; const lo=+inp.min,hi=+inp.max,pc=v=>hi>lo?((v-lo)/(hi-lo))*100:0; el.style.left=pc(a)+'%'; el.style.width=Math.max(0,pc(b)-pc(a))+'%'; };
  const rmin=$('f-rmin'), rmax=$('f-rmax');
  const syncR=()=>{ let a=+rmin.value,b=+rmax.value; if(a>b){[a,b]=[b,a];} S.f.rMin=a;S.f.rMax=b; $('rv-r').textContent=a.toFixed(1)+'–'+b.toFixed(1); paint($('fill-r'),rmin,a,b); renderGrid(); };
  if(rmin) rmin.oninput=syncR; if(rmax) rmax.oninput=syncR;
  const pmin=$('f-pmin'), pmax=$('f-pmax');
  const syncP=()=>{ let a=+pmin.value,b=+pmax.value; if(a>b){[a,b]=[b,a];} S.f.pMin=a;S.f.pMax=b; $('rv-p').textContent=eur(a)+'–'+eur(b); paint($('fill-p'),pmin,a,b); renderGrid(); };
  if(pmin) pmin.oninput=syncP; if(pmax) pmax.oninput=syncP;
  paint($('fill-r'),rmin,+S.f.rMin,+S.f.rMax); paint($('fill-p'),pmin,+S.f.pMin,+S.f.pMax);
}

    ${rows}<p class="chtf">Ще можна взяти: <b>+${left}</b> ${pOchk(left)}</p></div></span>`;

  }
  const ofTag = (!iAmSeller && ofT) ? ` <span class="pill" title="Надбавка до зарплати заморожена з твого зарплатного бюджету до відповіді">🤝 Домовитись з гравцем · надбавка +${Math.round((+ofT.surcharge_pct||0)*100)}% · заморожено ${eur(ofT.frozen_wage)}</span>` : '';

// 553: «Утримати» гравця, який просить піти: (а) контракт можна подовжити → продовж ≥1 тур, надбавка на нові тури; (б) контракт до кінця турніру → перепідписати той самий залишок з надбавкою на ВСІ тури
function openHoldModal(tid,kind){
  const isX=kind==='x';
  const ev=(S.wev||[]).find(e=>isX?e.exchange_id===tid:e.transfer_id===tid); if(!ev) return;
  const p=S.players.find(x=>x.id===ev.player_id)||{}, ci=contractInfo(p), mv=p.market_value_current||0;
  const pct=Math.round((+ev.surcharge_pct||0)*100), left=+ev.contract_rounds_left||0, stage=+ev.stage_left||0, canExt=left<stage;
  const minMain=ev.offered_role==='main';   // 556: пропонують «Основного» — утримати можна лише «Основним»
  const head=`<h3>🗣 ${esc(p.name||'?')} хоче піти</h3>
    <p class="mnote"><b>${esc(ev.offerer_name)}</b> домовляється з гравцем: пропонує ${isX?`обмін на свого <b>${esc(ev.offered_player_name||'гравця')}</b>`:`<b>${eur(ev.amount)}</b>`} і надбавку до зарплати <b>+${pct}%</b>${ev.offered_role?` (обіцяє роль «${roleLabel(ev.offered_role)}»)`:''}. Щоб утримати гравця:</p>
    ${minMain?`<p class="mnote warn">Пропонують роль «Основний» — утримати гравця можна лише з роллю «Основний» (не нижчою за запропоновану).</p>`:''}`;
  let body;
  if(canExt){
    body=`<p class="mnote">Контракт можна подовжити — обери, на скільки турів (мінімум 1). Надбавка <b>+${pct}%</b> піде на <b>нові</b> тури (×${S.cfg?.contract_ext_mult??1} + ${pct}%), старі лишаються по-старому.</p>`
      + contractPicker(mv,0,p.id,{extend:true,left,oldWage:ci.wage||0,max:Math.max(1,stage-left),minRole:minMain?'main':'',surch:+ev.surcharge_pct||0})
      + `<div class="macts"><button data-do="hold">Утримати</button></div>`;
  } else {
    const nw=ci.wage?Math.ceil(ci.wage*(1+(+ev.surcharge_pct||0))):0;
    body=`<p class="mnote">Контракт уже до кінця турніру (лишилось <b>${left}</b> ${turW(left)}) — подовжувати нікуди. Щоб утримати, <b>перепідпиши</b> ті самі ${left} ${turW(left)} із зарплатою <b>+${pct}%</b> на <b>всі</b> ці тури${ci.wage?`: ${eur(ci.wage)} → <b>${eur(nw)}</b>/тур (різниця ${eur((nw-ci.wage)*left)} має бути у вільному зарплатному)`:''}.</p>`
      + (rolesOn()?`<div class="clen" data-len="1" data-ext="1" data-pid="${p.id}" data-mv="${mv}" data-left="${left}" data-oldwage="${ci.wage||0}"${minMain?' data-minrole="main"':''}>${roleChips()}<div class="clen-info"></div></div>`:'')
      + `<div class="macts"><button data-do="hold">Перепідписати з +${pct}%</button></div>`;
  }
  modalOpen(head+body);
  wireClen($('mhost'));
  $('mhost').querySelector('[data-do="hold"]').onclick=async()=>{
    if(needRole()) return; const ra=roleArgs(), len=canExt?selectedLen():0;
    modalClose();
    await act(isX?'market_event_hold_x':'market_event_hold',isX?{p_exchange:tid,p_length:len,...ra}:{p_transfer:tid,p_length:len,...ra},canExt?'Контракт продовжено, гравця утримано':'Контракт перепідписано, гравця утримано');
  };
}
function openCounterModal(tid,min0){
  // 21.10 (Богдан): у контрпропозиції показуємо мінімум і МАКСИМУМ (вікно ціни від поточної вартості; сервер перевіряє те саме), стартова сума — поточна пропозиція;
  // вкладки «Гроші | Обмін»: обмін замість грошей = обираєш гравця суперника → готова форма обміну → після успішного надсилання цю пропозицію автоматично відхиляємо (без нового SQL)
  const t=(S.transfers||[]).find(x=>x.id===tid)||{}, p=S.players.find(x=>x.id===t.player_id)||{}, mv=p.market_value_current||0;
  const min=mv?Math.ceil(mv*winMinPct()):min0, max=mv?winMaxEur(mv):0;
  const start=Math.min(Math.max(t.amount||min,min),max||Infinity);
  const isEv=!!(S.wev||[]).find(e=>e.transfer_id===tid);   // подію «гравець хоче піти» відхилити не можна → обмін-заміна недоступна
  const iOwn=p.owner_participant_id===S.me.id, other=(t.from_participant===S.me.id)?t.to_participant:t.from_participant;
  const cashBody=`<p class="mnote">Своя сума. Вартість <b>${eur(mv)}</b> · вікно ${winTxt()}: <b>від ${eurUp(min)}${max?` до ${eurDown(max)}`:''}</b>.</p>
    <div class="mamt" data-ref="${tid}" data-min="${min}" data-max="${max}">
      <span class="dim">Контрсума · €млн (мін ${mCeil(min)}${max?` · макс ${mFloor(max)}`:''})</span>
      <input id="amtInp" inputmode="decimal" value="${mCeil(start)}">
      <button data-do="counter">Надіслати</button></div>`;
  let body=cashBody;
  if(S.exchangesReady && !isEv){
    const theirs=S.players.filter(x=>x.owner_participant_id===other).sort((a,b)=>(b.market_value_current||0)-(a.market_value_current||0));
    const exBody = iOwn
      ? `<p class="mnote">Замість грошей — обмін 1↔1 з доплатою: твій <b>${esc(p.name)}</b> іде до <b>${esc(S.names[other]||'—')}</b>, а ти обираєш, кого забрати. Далі — умови (доплата, контракт, роль). Після надсилання обміну ця пропозиція (${eur(t.amount)}) <b>відхиляється автоматично</b>.</p>
         <div class="mamt"><span class="dim">Гравець суперника</span><select id="cxPick" style="min-width:240px">${theirs.map(x=>`<option value="${x.id}">${esc(x.name)} · ${posCat(x.position)} · ${eur(x.market_value_current)}</option>`).join('')}</select><button data-do="cxgo">Далі: умови обміну →</button></div>`
      : `<p class="mnote">Замість грошей — обмін 1↔1 з доплатою: ти віддаєш свого гравця за <b>${esc(p.name)}</b>. Далі — вибір гравця й умови. Після надсилання обміну ця пропозиція (${eur(t.amount)}) <b>відхиляється автоматично</b>.</p>
         <div class="mamt"><button data-do="cxgo">Далі: умови обміну →</button></div>`;
    body=ptabs([['cash','💶 Гроші',cashBody],['ex','🔄 Обмін',exBody]],'cash');
  }
  modalOpen(`<h3>Контрпропозиція</h3>${body}`);
  const box=$('mhost').querySelector('[data-ref="'+tid+'"]');
  $('mhost').querySelector('[data-do="counter"]').onclick=async()=>{
    const eurv=Math.round(parseFloat((box.querySelector('#amtInp').value||'').replace(',','.'))*1e6);
    if(!eurv||eurv<min){ alert('Замало — мінімум '+eurUp(min)); return; }
    if(max && eurv>max){ alert('Забагато — максимум '+eurDown(max)+' ('+winTxt()+')'); return; }
    modalClose();
    await act('market_respond_transfer',{p_transfer:tid,p_action:'counter',p_amount:eurv},'Контрпропозицію надіслано');
  };
  const cx=$('mhost').querySelector('[data-do="cxgo"]');
  if(cx) cx.onclick=async()=>{
    const wantId = iOwn ? $('mhost').querySelector('#cxPick').value : p.id, offId = iOwn ? p.id : null;
    if(!wantId) return alert('Немає гравця для обміну');
    modalClose(); await openPlayerModal(wantId);
    const h=$('mhost'), tb=h.querySelector('.ptab[data-pt="ex"]'); if(tb) tb.click();
    const xb=h.querySelector('.xbox'), xo=h.querySelector('#xOff');
    if(!xb) return;
    if(offId && xo){ xo.value=offId; if(xo.value!==offId){ alert('Твій '+(p.name||'гравець')+' зараз не може брати участь в обміні (підтверджений склад) — обмін-заміна недоступна.'); return; } xRefresh(); }
    xb.dataset.cx=tid;   // маркер живе лише в цьому вікні: закрив — зник (інакше наступний звичайний обмін відхилив би чужу пропозицію)
    xb.insertAdjacentHTML('afterbegin',`<p class="mnote warn" style="margin:0 0 8px">↩ Це контрпропозиція обміном: після успішного надсилання пропозицію «${esc(p.name||'')} · ${eur(t.amount)}» буде відхилено.</p>`);
  };
}
// контр-обмін: спершу створюємо обмін (він валідується сервером), потім відхиляємо стару пропозицію; збій відхилення не ховаємо
async function actCounterExchange(tid,args){
  const r=await sb.rpc('market_propose_exchange',args);
  if(r.error){ alert('⛔ '+(r.error.message||'').replace(/^.*?(Squad: )/,'$1')); return; }
  const r2=await sb.rpc('market_respond_transfer',{p_transfer:tid,p_action:'reject'});
  alert(r2.error ? '✅ Обмін запропоновано, але стару пропозицію відхилити не вдалось ('+((r2.error.message||'').replace(/^.*?(Squad: )/,'$1'))+') — відхили її у «Мої угоди».' : '✅ Обмін запропоновано; попередню пропозицію відхилено');
  await loadRefs(); go(S.tab);
}

// ── рядок обміну + дії (Прийняти/Відхилити/Контр/Відкликати) ──
function xCashLine(x, iAmFrom){
  if(x.cash_delta===0) return '<span class="dim">без доплати</span>';
  const payFrom = x.cash_delta>0;                 // true: ініціатор(from) доплачує; false: власник(to) доплачує
  const iPay = (payFrom && iAmFrom) || (!payFrom && !iAmFrom);
  return `<b class="mprice">${iPay?'ти доплачуєш':'тобі доплачують'} ${eur(Math.abs(x.cash_delta))}</b>`;
}
function exchangeRow(x){
  const off=S.players.find(p=>p.id===x.offered_player)||{}, want=S.players.find(p=>p.id===x.wanted_player)||{};
  const offCl=clubPos(off), wantCl=clubPos(want);
  const iAmFrom=x.from_participant===S.me.id;
  const other=iAmFrom?x.to_participant:x.from_participant, otherName=esc(S.names[other]||'—');
  const mine=x.awaiting_participant===S.me.id;
  const evX=(S.wev||[]).find(e=>e.exchange_id===x.id), ofX=(S.wof||[]).find(e=>e.exchange_id===x.id);   // 554: подія (я власник wanted) / моя пропозиція з надбавкою
  const info = iAmFrom
    ? `🔄 Твій <b>${esc(off.name||'?')}</b> <span class="dim">${esc(offCl)}</span> ↔ <b>${esc(want.name||'?')}</b> <span class="dim">${esc(wantCl)}</span> · <b>${otherName}</b> · ${xCashLine(x,iAmFrom)}`
    : `🔄 <b>${otherName}</b>: <b>${esc(off.name||'?')}</b> <span class="dim">${esc(offCl)}</span> ↔ твій <b>${esc(want.name||'?')}</b> <span class="dim">${esc(wantCl)}</span> · ${xCashLine(x,iAmFrom)}`;
  if(!iAmFrom && evX){   // 554: «гравець просить піти» в обміні — відхилити не можна

      : `<div class="tctrl"><span class="pill">чекає ${otherName}</span></div>`;

  }
  const ofXTag = (iAmFrom && ofX) ? ` <span class="pill" title="Надбавка до зарплати заморожена з твого зарплатного бюджету до відповіді">🤝 Домовитись з гравцем · надбавка +${Math.round((+ofX.surcharge_pct||0)*100)}% · заморожено ${eur(ofX.frozen_wage)}</span>` : '';
  const ctrl = mine
    ? `<div class="tctrl"><button data-xc-acc="${x.id}" ${inPlayRound()?'disabled title="Прийняти можна після закриття туру"':''}>Прийняти</button>

  return `<div class="trow"><span class="tinfo">${info}${ofXTag}</span>${ctrl}</div>`;

// прийняти обмін — обрати контракт для гравця, якого ОТРИМУЄШ (offered якщо ти to / wanted якщо from)
function openExchangeAcceptModal(xid){
  const x=(S.exchanges||[]).find(e=>e.id===xid);
  if(!x){ if(rolesOn()) return alert('Обмін не знайдено — онови сторінку.'); return act('market_respond_exchange',{p_exchange:xid,p_action:'accept'},'Обмін завершено'); }
  const recvId = (x.to_participant===S.me.id) ? x.offered_player : x.wanted_player;
  if(lnBlocked(recvId===x.offered_player? x.wanted_player : x.offered_player)) return alert(lnMsg());   // 534: мій гравець у підтвердженому складі
  const recv = S.players.find(pl=>pl.id===recvId)||{};
  modalOpen(`<h3>Прийняти обмін</h3>
    <p class="mnote">Гравці й доплата переходять одразу. Обери контракт для <b>${esc(recv.name||'гравця')}</b> (ти його отримаєш).</p>
    ${contractPicker(recv.market_value_current||0, 0, recv.id)}
    <div class="macts"><button data-do="xacc-go">Прийняти</button><button class="ghost" data-do="xacc-no">Скасувати</button></div>`);
  const h=$('mhost'); wireClen(h);
  h.querySelector('[data-do="xacc-no"]').onclick=modalClose;
  h.querySelector('[data-do="xacc-go"]').onclick=async()=>{ if(needRole()) return; const ra=roleArgs(); const len=selectedLen(); modalClose();
    await act('market_respond_exchange',{p_exchange:xid,p_action:'accept',p_length:len,...ra},'Обмін завершено'); };
}
// контр обміну — доплата + контракт для гравця, якого ОТРИМАЄШ; напрямок → знак cash_delta (>0 from, <0 to)
function openExchangeCounterModal(xid, iAmFrom){
  const pct=Math.round((S.cfg?.transfer_min_pct??0.75)*100);
  const x=(S.exchanges||[]).find(e=>e.id===xid)||{};
  const recvId = iAmFrom ? x.wanted_player : x.offered_player;
  const recv = S.players.find(pl=>pl.id===recvId)||{};
  modalOpen(`<h3>Контрпропозиція</h3>
    <p class="mnote">Гравці ті самі, ти міняєш доплату й контракт для <b>${esc(recv.name||'гравця')}</b> (ти його отримаєш). Обмін мусить лишатись чесним (кожен віддає ≥${pct}% отриманого).</p>
    <div class="mamt" data-ref="${xid}">
      <span class="dim">Напрямок доплати</span>
      <select id="xcDir" style="width:100%;padding:8px;border-radius:8px;background:var(--panel-2,#122);color:inherit;border:1px solid var(--line,#333);margin:4px 0 8px">
        <option value="pay">Я доплачую</option><option value="ask">Я прошу доплату</option></select>
      <span class="dim">Сума · €млн (0 = без доплати)</span>
      <input id="amtInp" inputmode="decimal" value="0"></div>
    ${contractPicker(recv.market_value_current||0, 0, recv.id)}
    <div class="macts"><button data-do="xcounter">Надіслати</button></div>`);
  const h=$('mhost'); wireClen(h);
  h.querySelector('[data-do="xcounter"]').onclick=async()=>{
    const iPay=h.querySelector('#xcDir').value==='pay';
    const raw=Math.round((parseFloat((h.querySelector('#amtInp').value||'0').replace(',','.'))||0)*1e6);
    const cash=(iPay?1:-1)*(iAmFrom?1:-1)*Math.abs(raw);   // >0 from доплачує, <0 to доплачує
    if(needRole()) return; const ra=roleArgs();
    const len=selectedLen();
    modalClose();
    await act('market_respond_exchange',{p_exchange:xid,p_action:'counter',p_cash_delta:cash,p_length:len,...ra},'Контрпропозицію надіслано');
  };
}

}
function modalClose(){ const h=$('mhost'); h.classList.add('hide'); h.innerHTML=''; }
// Esc закриває відкриту модалку — так само, як ✕ і клік повз вікно (на борді вже було; рішення Богдана 11.10)
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('mhost').classList.contains('hide')) modalClose(); });
document.addEventListener('click',e=>{ document.querySelectorAll('.chtipw.open').forEach(w=>{ if(!w.contains(e.target)) w.classList.remove('open'); }); });   // підказка «Челенджі» на Ринку

// ── 556 АУКЦІОН = ЄДИНА ПРОПОЗИЦІЯ: сума · довжина · роль · надбавка. Недозволені комбінації блокуємо інлайн (сервер перевіряє те саме) ──
function aucCeil(mv){ return Math.round((mv||0)*(1+((S.cfg&&S.cfg.buynow_pct!=null)?+S.cfg.buynow_pct:0.15))); }              // стеля = викуп
function aucFloor(mv){ return Math.ceil((mv||0)*((S.cfg&&S.cfg.auction_start_min_pct!=null)?+S.cfg.auction_start_min_pct:0.95)); }   // мін. старт (95% вартості)
function aucStep(){ return (S.cfg&&S.cfg.wage_offer_step_pct!=null)?+S.cfg.wage_offer_step_pct:0.05; }
function aucPctOn(){ return !(S.cfg && S.cfg.wage_events_enabled===false); }
function roleRank(r){ return r==='main'?1:0; }
function aucPctUI(){
  if(!aucPctOn()) return '';
  const step=Math.round(aucStep()*100), max=Math.round((+(S.cfg&&S.cfg.wage_offer_max_pct)||0.5)*100);
  let opts='<option value="0">без надбавки</option>'; for(let v=step; v<=max; v+=step) opts+=`<option value="${v}">+${v}%</option>`;
  return `<label class="dim" style="white-space:nowrap">🤝 Надбавка до зарплати <select id="aucPct">${opts}</select></label>`;
}
// 21.10 (Богдан): текст про аукціон — скільки триває, що буде, якщо ніхто не перебʼє / якщо перебʼють; підказка про надбавку (раніше стояла окремим рядком над формою)
function aucPctNote(){ return aucPctOn()?'Надбавка — ще один аргумент у торгах: +X% до зарплати гравця на весь контракт (на ставці-викупі не діє).':''; }
function aucTimerNote(){ const h=(S.cfg&&S.cfg.auction_timer_hours!=null)?+S.cfg.auction_timer_hours:12, st=(S.cfg&&S.cfg.auction_stop_hours!=null)?+S.cfg.auction_stop_hours:12;
  return `<p class="mnote aucrule">⏱ <b>Аукціон ${h} год:</b> лот стоїть ${h} год після останньої ставки (але не пізніше ніж за ${st} год до дедлайну туру). <b>Якщо ніхто не перебʼє — гравець твій.</b> Якщо перебʼють — ти про це дізнаєшся: зʼявиться банер «Тебе перебили» і група «Мене перебили» у «Мої угоди».</p>`; }
// чому ця пропозиція НЕ сильніша за лідерову (та сама сума); null — сильніша. Роль лідера знають лише ті, хто вже ставив на лот (приватна вьюха)
function aucWeak(au,len,role,pct){
  const L=+au.leader_length||1, P=+au.leader_wage_pct||0, st=aucStep();
  const my=(S.myAuc||[]).find(x=>x.auction_id===au.id);
  if(my && my.leader_role && roleRank(role)<roleRank(my.leader_role)) return `роль нижча за лідерову («${roleLabel(my.leader_role)}»)`;
  if(len<L) return `контракт коротший за лідерів (${L} ${turW(L)})`;
  if(pct<P-1e-6) return `надбавка менша за лідерову (+${Math.round(P*100)}%)`;
  if(!(len>=L+1 || pct>=P+st-1e-6)) return `потрібна краща надбавка (+${Math.round(st*100)} п.п.) або довший контракт (+1 тур) — лише роль не рахується`;
  return null;
}
function auctionForm(p,au,mv){
  const ceil=aucCeil(mv), floor=aucFloor(mv), st=S.cfg?.bid_step_pct??0.05;
  const minNext=au?Math.min(Math.ceil(au.current_bid*(1+st)),ceil):floor;
  const quick=au
    ? `<button type="button" class="mini ghost" data-aamt="${minNext}">мін. +${Math.round(st*100)}% · ${eurUp(minNext)}</button><button type="button" class="mini ghost" data-aamt="${au.current_bid}">та сама · ${eurUp(au.current_bid)}</button><button type="button" class="mini ghost" data-aamt="${ceil}">викуп · ${eurUp(ceil)}</button>`
    : `<button type="button" class="mini ghost" data-aamt="${floor}">мін. · ${eurUp(floor)}</button><button type="button" class="mini ghost" data-aamt="${ceil}">викуп · ${eurUp(ceil)}</button>`;
  return `<div class="aucf" data-pid="${p.id}" data-au="${au?au.id:''}" data-mv="${mv}">
    <div class="arow">${aucPctUI()}<span class="dim">${au?'Перебити':'Стартова ставка'} · €млн (від ${mCeil(minNext)} до ${mFloor(ceil)})</span>
      <input id="aucAmt" inputmode="decimal" value="${(minNext/1e6).toString()}">
      <div class="aquick">${quick}</div>
      <button data-do="aucgo" disabled>Поставити</button></div>
    <div class="aucmsg mnote"></div></div>`;   // 21.10: надбавка, ставка, швидкі суми й кнопка — один рядок; повідомлення про ставку — окремий рядок під ним
}
function aucRefresh(){
  const h=$('mhost'); const f=h&&h.querySelector('.aucf'); if(!f) return;
  const mv=+f.dataset.mv, pid=f.dataset.pid, au=f.dataset.au?(S.auctions||[]).find(a=>a.id===f.dataset.au):null;
  const clen=h.querySelector('.clen'), len=clen?(+clen.dataset.len||1):1, role=rolesOn()?((clen&&clen.dataset.prole)||''):'main';
  const pctEl=f.querySelector('#aucPct');
  const raw=Math.round((parseFloat((f.querySelector('#aucAmt').value||'0').replace(',','.'))||0)*1e6);
  const ceil=aucCeil(mv), floor=aucFloor(mv), atCeil=raw>0&&raw===ceil;
  if(pctEl){ pctEl.disabled=atCeil; if(atCeil && pctEl.value!=='0') pctEl.value='0'; }   // на ставці-викупі надбавка не діє
  const pct=pctEl?(+pctEl.value||0)/100:0, pr=[];
  if(rolesOn() && !role) pr.push('обери роль гравця');
  if(!raw) pr.push('введи суму');
  else if(!au){
    if(raw<floor) pr.push(`стартова ставка — не менше ${eurUp(floor)} (${Math.round(((S.cfg&&S.cfg.auction_start_min_pct!=null)?+S.cfg.auction_start_min_pct:0.95)*100)}% вартості)`);
    else if(raw>ceil) pr.push(`не більше стелі ${eurDown(ceil)} (викуп)`);
  } else {
    const cur=+au.current_bid, st=S.cfg?.bid_step_pct??0.05, minNext=Math.min(Math.ceil(cur*(1+st)),ceil);
    if(raw>ceil) pr.push(`не більше стелі ${eurDown(ceil)} (викуп)`);
    else if(raw<minNext){
      if(raw===cur){ const why=aucWeak(au,len,role,pct); if(why) pr.push(`та сама сума ${eurUp(cur)} — лише з сильнішою пропозицією: ${why}`); }
      else pr.push(`мінімум ${eurUp(minNext)} — або та сама сума ${eurUp(cur)} з не гіршими умовами й кращою надбавкою (+${Math.round(aucStep()*100)} п.п.) чи довшим контрактом (+1 тур)`);
    }
  }
  if(raw && (S.spendable??0)<raw) pr.push(`доступно ${eur(S.spendable||0)}, а потрібно ${eur(raw)}`);
  if(raw && S.wageFree!=null && role){ const w=Math.round(qWageR(pid,len,mv,role)*(1+pct))*len; if(w>S.wageFree) pr.push(`не вистачає зарплатного бюджету: резерв ${eur(w)}, вільно ${eur(S.wageFree)}`); }
  const btn=f.querySelector('[data-do="aucgo"]'), msg=f.querySelector('.aucmsg');
  if(pr.length){ msg.className='aucmsg mnote warn'; msg.innerHTML='⛔ '+pr.join(' · '); btn.disabled=true; btn.textContent=au?'Перебити':'Поставити'; }
  else{
    msg.className='aucmsg mnote';
    const e2=v=>'€'+(v/1e6).toFixed(2)+'M', per=Math.round(qWageR(pid,len,mv,role)*(1+pct));   // сума як у полі (до 0,01M); контракт — зарплата/тур з надбавкою
    msg.innerHTML=atCeil?`✅ Це <b>викуп</b>: лот закриється одразу, гравець стане твоїм за ${e2(raw)}.`
      :`✅ Ставка <b>${e2(raw)}</b> · ${len} ${turW(len)}${rolesOn()?' · '+roleLabel(role):''}${pct>0?` · надбавка +${Math.round(pct*100)}%`:''} · контракт <b>${eur(per)}</b>/тур × ${len} = резерв <b>${eur(per*len)}</b>${au&&raw===+au.current_bid?' · <b>перебиває без підвищення суми</b>':''}`;
    // 21.10 (Богдан): роль лідера приватна — тому для того, хто ще не ставив на лот, клієнт не може сам перевірити «роль не гірша»; попереджаємо, коли це єдине, що може зірвати рівну суму
    if(au && !atCeil && raw===+au.current_bid && rolesOn() && role==='bench' && !(S.myAuc||[]).find(x=>x.auction_id===au.id)){
      msg.innerHTML+=`<br><span class="warnc">⚠️ Роль лідера прихована. Якщо він обіцяє «Основний», рівна сума з «Лавкою» не пройде (роль не може бути гіршою) — обери «Основний» або додай +5% до суми.</span>`; }
    btn.disabled=false; btn.textContent=atCeil?'Викупити':(au?'Перебити':'Поставити');
  }
}

// 556: пропозиція на чужого гравця має ДВА режими: «Домовитись з учасником» (звичайна, без надбавки; власник може відхилити) і

// коридор доплати (дзеркало SQL market_exchange_corridor; точні межі — з RPC, кеш S.corr)
function exCorridor(a,b,p){
  const posLo=Math.max(0,Math.ceil(p*b-a)), posHi=Math.floor(b/p-a), negLo=Math.ceil(-(a/p-b)), negHi=Math.min(0,Math.floor(b-p*a));
  let lo=null,hi=null; if(posLo<=posHi){lo=posLo;hi=posHi;}
  if(negLo<=negHi){ lo=(lo==null)?negLo:Math.min(lo,negLo); hi=(hi==null)?negHi:Math.max(hi,negHi); }
  return { lo, hi, fair:b-a };
}

// ── контракт (505): ПРОГРЕСИВНА зарплата (wage_brackets) · floor ДО множників · націнка[len] · множник режиму ──
//    first ×1 · extend (продовження безперервного контракту) ×contract_ext_mult · rebuy (перевикуп проданого) ×contract_rebuy_mult.
//    Єдине джерело правди — RPC market_wage_quotes (кеш S.quotes); JS-формула лише миттєвий попередній розрахунок.
S.quotes = S.quotes || {}; S.corr = S.corr || {};
function stageInfo(){            // дзеркало market_current_stage / market_stage_rounds_left
  const c=S.cfg||{}, s1=c.stage1_last_round||5, s2=c.stage2_last_round||2*s1;
  const rs=(S.rounds||[]).slice().sort((x,y)=>x.number-y.number);
  const open=rs.find(r=>!r.results_entered_at), lastNo=rs.length?rs[rs.length-1].number:1;
  const cur=((open?open.number:lastNo)<=s1)?1:2, first=cur===1?1:s1+1, last=cur===1?s1:s2;
  const done=rs.filter(r=>r.number>=first&&r.number<=last&&r.results_entered_at).length;
  return { stage:cur, first, last, len:last-first+1, left:(last-first+1)-done };

function winMaxPct(){ return (S.cfg&&S.cfg.transfer_max_pct!=null)?+S.cfg.transfer_max_pct:null; }
// 527: верх вікна = max(вартість·pct ; вартість+add) — «+25% або +8M, що більше»; add береться з market_config.transfer_max_add_eur (немає → 0, як до 527)
function winAddEur(){ return (S.cfg&&S.cfg.transfer_max_add_eur!=null)?+S.cfg.transfer_max_add_eur:0; }

function defMode(pid){ const p=(S.players||[]).find(x=>x.id===pid); return (p&&S.me&&p.owner_participant_id===S.me.id)?'extend':'first'; }
function wageFor(mv,len,mode){ const c=S.cfg||{}; let base=0;
  const br=c.wage_brackets;
  if(Array.isArray(br)&&br.length){ let lo=0;
    for(const b of br){ const up=(b.up==null)?null:+b.up; if((mv||0)>lo) base+=(Math.min(mv, up==null?mv:up)-lo)*(+b.rate); if(up==null) break; lo=up; } }

function bindChips(box){
  box.querySelectorAll('.clen-chip').forEach(ch=>ch.onclick=()=>{
    box.querySelectorAll('.clen-chip').forEach(x=>x.classList.remove('on'));
    ch.classList.add('on'); box.dataset.len=ch.dataset.l; updClen(box);
  });
  box.querySelectorAll('.crole-chip').forEach(ch=>ch.onclick=()=>{   // 539: обрати роль
    if(ch.disabled) return;
    box.querySelectorAll('.crole-chip').forEach(x=>x.classList.remove('on'));
    ch.classList.add('on'); box.dataset.prole=ch.dataset.r; updClen(box);
  });
}

// вкладки вікна гравця: list = [[ключ, заголовок, html], …], def — ключ активної
function ptabs(list,def,stack){   // stack: усі вкладки в одній клітинці сітки — висота = найвищої, вікно не стрибає при перемиканні (вільний гравець)
  return `<div class="ptabs${stack?' stack':''}"><div class="ptab-bar">${list.map(([k,t])=>`<button type="button" class="ptab${k===def?' on':''}" data-pt="${k}">${t}</button>`).join('')}</div>`

}

const TEAM3_X={Czechia:'CZE',Scotland:'SCO',Wales:'WAL',Serbia:'SRB',Romania:'ROU',Bulgaria:'BUL',Finland:'FIN',Iceland:'ISL',Israel:'ISR',Albania:'ALB',Kosovo:'KOS','North Macedonia':'MKD',Luxembourg:'LUX',Cyprus:'CYP',Latvia:'LVA',Lithuania:'LTU',Estonia:'EST',Malta:'MLT',Montenegro:'MNE',Moldova:'MDA',Belarus:'BLR',Armenia:'ARM',Azerbaijan:'AZE',Kazakhstan:'KAZ','Bosnia & Herzegovina':'BIH','Republic of Ireland':'IRL',Japan:'JPN',Mexico:'MEX',Turkey:'TUR','Türkiye':'TUR','Faroe Islands':'FRO',Gibraltar:'GIB',Andorra:'AND','San Marino':'SMR',Liechtenstein:'LIE'};
function teamCode(name){
  if(!name) return '?';
  if(NAT3[name]) return NAT3[name];
  if(TEAM3_X[name]) return TEAM3_X[name];
  const w=String(name).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^(FC|CF|AC|AS|SSC|SS|US|SV|VfB|VfL|1\. FC|Real|Sporting)\s+/i,'').split(/\s+/)[0]||'';
  return w.slice(0,3).toUpperCase()||'?';
}
const UT_CODE={8:'LL',17:'PL',35:'BL',23:'SA',34:'L1',218:'УПЛ',7:'UCL',679:'UEL',17015:'UECL',10783:'UNL'};
const UT_BY_NAME={'LaLiga':'LL','Ла Ліга':'LL','АПЛ':'PL','Бундесліга':'BL','Серія А':'SA','Ліга 1':'L1','УПЛ':'УПЛ','Bundesliga':'BL','Serie A':'SA','Ligue 1':'L1','UEFA Champions League':'UCL','UEFA Europa League':'UEL','UEFA Conference League':'UECL','UEFA Nations League':'UNL'};

  return ini.slice(0,4);
}

function fxTip(f){

  const m=(f.home&&f.away)? `${f.home} – ${f.away}`+((f.hs!=null&&f.as!=null)? ` ${f.hs}:${f.as}` : '') : '';

function fxRow(a, meta, W, pad){
  if(!meta || meta.length!==a.length || !meta.some(Boolean)) return '';
  W=W||340; pad=pad||12;
  const cells=a.map((_,i)=>{
    const f=meta[i]; if(!f) return '';
    const x=(a.length===1? 50 : (pad+i*(W-2*pad)/(a.length-1))/W*100);
    const opp=(f.home_game===false)? f.home : f.away, side=(f.home_game===true)?'(Д)':(f.home_game===false?'(В)':'');
    const t=(f.home&&f.away)? `${esc(teamCode(opp))}${side}` : '';
    return `<span class="fx" style="left:clamp(8%,${x.toFixed(1)}%,92%)" title="${esc(fxTip(f))}"><b>${t}</b><i>${esc(utCode(f))}</i></span>`;
  }).join('');
  return `<div class="fxrow">${cells}</div>`;
}
// Val Δ картки (п.2 відгуку 12.10): ГОЛОВНЕ = накопичена від старту турніру; дрібно під нею — останній тур (market_price_log через market_player_card)
function cardDelta(p,card){
  const d=vDelta(p), n=d.pct*100;
  return { txt:(d.dir==='up'?'▲ +':d.dir==='down'?'▼ −':'– ')+Math.abs(n).toFixed(1).replace(/\.0$/,'')+'%', dir:d.dir };
}
function cardDeltaSum(p,card,plog){
  if(!Array.isArray(plog)) return { ...cardDelta(p,card), small:'' };
  const rows=plog.map(r=>({ n:(S.rounds.find(x=>x.id===r.round_id)||{}).number, v:(r.mult-1)*100 })).filter(r=>r.n!=null).sort((a,b)=>a.n-b.n);
  if(!rows.length) return { txt:'– 0%', dir:'flat', small:'<small class="was" title="Цінового руху ще не було">ще без руху</small>' };
  const sum=(rows.reduce((a,r)=>a*(1+r.v/100),1)-1)*100, dir=sum>0.05?'up':sum<-0.05?'down':'flat';   // складений: Π(1+Δ тура) − 1 (як «Статистика»)
  const f=n=>(n>0.05?'▲ +':n<-0.05?'▼ −':'– ')+Math.abs(n).toFixed(1).replace(/\.0$/,'')+'%';
  const per=rows.map(r=>`Т${r.n} ${r.v>0.05?'+':r.v<-0.05?'−':''}${Math.abs(r.v).toFixed(1).replace(/\.0$/,'')}%`).join(' · ');
  return { txt:f(sum), dir, small:`<small class="was ${dir==='flat'?'':dir}" title="Рух вартості гравця тур за туром (підсумок — складений від старту)">${per}</small>` };
}
function lastTourSmall(card){
  const n=card&&card.val_delta_tour_pct; if(n==null) return '';

  const t=(dir==='up'?'▲ +':dir==='down'?'▼ −':'– ')+Math.abs(n).toFixed(1).replace(/\.0$/,'')+'%';

function ownerHist(card,p){
  const h=(card&&card.owner_history)||[];
  const cur = p.owner_participant_id ? (S.names[p.owner_participant_id]||card.owner_name||'—') : 'вільний';
  if(!h.length){ return p.owner_participant_id? esc(cur) : 'вільний'; }
  const chain=[]; h.forEach(x=>{ const nm=x.to||'вільний'; if(chain[chain.length-1]!==nm) chain.push(nm); });
  chain.pop(); // останній = поточний, покажемо через «зараз:»
  const prev = chain.length? chain.map(esc).join(' → ')+' → ' : '';
  return prev+'зараз: <b>'+esc(cur)+'</b>';
}

  }

  }).join('');

const SCENE_FILE={silver:'steel',gold:'gold',emerald:'emerald',rare:'rare',mega_rare:'mega_rare'};
function fitPodium(stage){
  if(!stage) return;
  const h=stage.clientHeight, isBase=stage.dataset.base==='true', k=isBase?0.68:(stage.classList.contains('mega')?0.75:0.72), target=Math.min(h*k, stage.clientWidth*1.4);   // base 68% · rare 72% · mega 75% (04.10)
  const pc=stage.querySelector('.podium-card'), card=pc&&pc.querySelector(isBase?'.sqcard':'img.rarepng');
  if(!card) return;
  if(isBase){ card.style.transformOrigin='bottom center'; card.style.transform='scale('+(target/450)+')'; }
  else{ card.style.height=target+'px'; card.style.width='auto'; }
  if(stage.dataset.reflect==='true'){
    const rf=stage.querySelector('.reflect'), tl=pc.querySelector('.tilt');
    const sr=stage.getBoundingClientRect(), cr=tl.getBoundingClientRect();
    rf.innerHTML=tl.innerHTML;
    const im=rf.querySelector('img.rarepng'); if(im){ im.style.height=target+'px'; im.style.width='auto'; }
    rf.style.top=(cr.bottom-sr.top-2)+'px';
  }
}
// ── Вітрина: швидке відкриття (02.10), БЕЗ втрати якості ──
// А) прогресивний показ: миттєво мініатюра _sm.webp (малий файл), далі підміна на ПОВНИЙ арт, щойно він завантажений і декодований.
// Б) прогрів: сцена (+ повний арт) вантажаться, поки користувач лише наводить/торкається «Показати картку».
const showThumb=p=>String(p||'').replace(/\.png$/i,'_sm.webp');
const poolThumb=u=>{ const s=String(u||''); return /^players\/pool\/\d+\.webp$/.test(s)?s.replace(/\.webp$/,'_sm.webp'):s; };   // фото пулу в сітках/міні-картках — мініатюра `_sm` (≈35 КБ замість ≈312 КБ); майстер лише на подіумі
const imgFallback=full=>` onerror="this.onerror=null;this.src='${esc(full)}'"`;                                                   // немає `_sm` на сайті → тихо підміняємо на майстер
const _warmRefs=[], _warmSet=new Set();
function warmUrl(u){ if(!u||_warmSet.has(u)) return; _warmSet.add(u); const im=new Image(); im.decoding='async'; im.src=u; _warmRefs.push(im); }
function warmScene(scene){ if(scene) warmUrl('scenes/'+scene+'.webp'); }
function hookWarm(btn,png,scene){ if(!btn) return; const go=()=>{ warmScene(scene); warmUrl(png); };
  ['pointerenter','focus','touchstart'].forEach(ev=>btn.addEventListener(ev,go,{once:true,passive:true})); }
function upgradeArt(el,full){   // el = .sqfull; thumb → повний арт (мініатюра лишається, якщо повний не завантажився)
  const im=el.querySelector('img.rarepng'), tilt=el.querySelector('.tilt'); if(!im||!full) return;
  im.addEventListener('error',()=>{ if(im.src.indexOf('_sm.webp')>=0) im.src=full; },{once:true});
  const big=new Image(); big.decoding='async'; try{ big.fetchPriority='high'; }catch(e){}
  let done=false;
  const swap=()=>{ if(done) return; done=true; if(!el.isConnected) return; im.src=full; if(tilt) tilt.style.setProperty('--m',"url('"+full+"')"); };
  // підміна по onload (надійно); decode() лише згладжує момент, а якщо він завис — через 400мс підміняємо все одно
  big.onload=()=>{ if(!big.decode){ swap(); return; } const t=setTimeout(swap,400); big.decode().then(()=>{ clearTimeout(t); swap(); },()=>{ clearTimeout(t); swap(); }); };
  big.src=full;
}

}

async function pmSettle(md){

    // рідкість), навіть якщо на полі вдягнуто silver/іншу (443 — вибір дизайну на полі окремий від володіння)

      <div class="colc-wrap">${squadCardHTML(p,tier,cardObj)}</div>

  $('view').innerHTML = `
    <div class="head2"><h2>Колекція</h2><span class="sub" id="colSum"></span></div>
    <div class="col-filters">
      <input id="colQ" placeholder="Пошук по імені…" value="${esc(f.q)}">
      <select id="colPos"><option value="">Позиція: усі</option>${['G','D','M','F'].map(x=>`<option value="${x}"${f.pos===x?' selected':''}>${posCat(x)}</option>`).join('')}</select>

      <select id="colRarity"><option value="">Рідкість: усі</option><option value="mega_rare"${f.rarity==='mega_rare'?' selected':''}>Mega Rare</option><option value="rare"${f.rarity==='rare'?' selected':''}>Rare</option></select>
      <select id="colStatus">${[['all','Статус: усі'],['mine','Мої'],['free','Вільні'],['other','Чужі']].map(([v,l])=>`<option value="${v}"${f.status===v?' selected':''}>${l}</option>`).join('')}</select>
      <select id="colSort">${[['rating','За рейтингом'],['price','За ціною'],['rarity','За рідкістю'],['name','За іменем']].map(([v,l])=>`<option value="${v}"${f.sort===v?' selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div class="col-grid" id="colGrid">${S.players.map(card).join('')}</div>`;
  const g=$('colGrid');
  const apply=()=>{
    const f=S.colF, q=(f.q||'').toLowerCase(); let vis=[];
    g.querySelectorAll('.colcard').forEach(el=>{
      let ok=true;
      if(q && !el.dataset.name.includes(q)) ok=false;
      if(f.pos && el.dataset.pos!==f.pos) ok=false;
      if(f.club && el.dataset.club!==f.club) ok=false;
      if(f.coll && !(el.dataset.coll||'').split(' ').filter(Boolean).includes(f.coll)) ok=false;
      if(f.rarity && el.dataset.tier!==f.rarity) ok=false;
      if(f.status!=='all' && el.dataset.own!==f.status) ok=false;
      el.hidden=!ok; if(ok) vis.push(el);
    });
    const rrank=t=> t==='mega_rare'?0 : t==='rare'?1 : 2;
    vis.sort((a,b)=> f.sort==='price'? (b.dataset.price-a.dataset.price)
      : f.sort==='name'? a.dataset.name.localeCompare(b.dataset.name)
      : f.sort==='rarity'? (rrank(a.dataset.tier)-rrank(b.dataset.tier)) || a.dataset.name.localeCompare(b.dataset.name)
      : (b.dataset.rating-a.dataset.rating));
    vis.forEach((el,i)=>el.style.order=i);

    const sum=$('colSum'); if(sum) sum.innerHTML=`усі картки пулу · ${total} · <b>${mineN}</b> твоїх · ${freeN} вільних · показано ${vis.length} · натисни картку для деталей`;
  };
  const bind=(id,key)=>{ const el=$(id); if(el) el.onchange=()=>{ S.colF[key]=el.value; apply(); }; };
  const qi=$('colQ'); if(qi) qi.oninput=()=>{ S.colF.q=qi.value; apply(); };
  bind('colPos','pos'); bind('colClub','club'); bind('colColl','coll'); bind('colRarity','rarity'); bind('colStatus','status'); bind('colSort','sort');
  g.querySelectorAll('.colcard').forEach(el=>el.onclick=()=>openPlayerModal(el.dataset.p));
  apply();
}

// журнал цін ОДНОГО туру (market_price_log: оцінка, очки гравця, множник ціни) для фільтра «Тур» у «Статистиці»; кеш S.plogBy[round_id] (null = помилка)
async function loadTourLog(rid,force){
  S.plogBy=S.plogBy||{}; S.plogAt=S.plogAt||{}; S.plogLoading=S.plogLoading||{};
  if(S.plogLoading[rid] || (!force && S.plogBy[rid]!==undefined)) return;
  S.plogLoading[rid]=true;
  try{ S.plogBy[rid]=await sbSel(`market_price_log?round_id=eq.${rid}&select=player_id,avg_rating,points,mult,value_after&limit=1000`); S.plogAt[rid]=Date.now(); }
  catch(e){ S.plogBy[rid]=null; }
  S.plogLoading[rid]=false;
  if(S.tab==='stats' && S.stF && S.stF.round===rid) viewStats();
}
function viewStats(){
  const N=20;   // топ-20 (було 10); фільтри — як на «Ринку»: ліга · клуб · позиція · власник
  const F=S.stF||(S.stF={league:'',club:'',pos:'',own:'',q:'',round:''});
  const all=S.players.slice();
  let pool=all;
  { const q=(F.q||'').trim().toLowerCase(); if(q) pool=pool.filter(p=>(p.name||'').toLowerCase().includes(q)); }   // пошук по імені — як на «Ринку»
  if(F.league) pool=pool.filter(p=>(S.clubs[p.club_id]||{}).league===F.league);
  if(F.club)   pool=pool.filter(p=>p.club_id===F.club);
  if(F.pos)    pool=pool.filter(p=>p.position===F.pos);
  if(F.own==='free')       pool=pool.filter(p=>!p.owner_participant_id);
  else if(F.own==='owned') pool=pool.filter(p=>p.owner_participant_id);
  else if(F.own==='mine')  pool=pool.filter(p=>S.me && p.owner_participant_id===S.me.id);
  const filtered=!!(F.league||F.club||F.pos||F.own||(F.q||'').trim());   // (тур — не фільтр пулу)
  // режим ТУРУ (п.5 відгуку 12.10): оцінка / очки / рух ціни саме ЦЬОГО туру з журналу цін (market_price_log — рядок на кожного гравця пулу, що зіграв); «Весь турнір» — як раніше
  const rnd=F.round? (S.rounds||[]).find(r=>r.id===F.round) : null;
  const L={}; let tourLoading=false, tourErr=false;
  if(rnd){
    const cached=(S.plogBy||{})[rnd.id];
    if(cached===undefined){ tourLoading=true; loadTourLog(rnd.id); }
    else if(cached===null) tourErr=true;
    else{ cached.forEach(r=>L[r.player_id]=r);
          if(!rnd.results_entered_at && Date.now()-((S.plogAt||{})[rnd.id]||0)>60000) loadTourLog(rnd.id,true); }   // тур у грі: ціни наживо → освіжаємо раз на хвилину
  }
  const scored=p=>{ const st=S.stats[p.id]; return st && st.rounds_played>0 ? st.scored_points : null; };
  let byRating, byPoints, up, down;
  if(rnd){
    byRating=pool.filter(p=>L[p.id]&&L[p.id].avg_rating!=null).sort((a,b)=>L[b.id].avg_rating-L[a.id].avg_rating).slice(0,N);
    byPoints=pool.filter(p=>L[p.id]&&L[p.id].points>0).sort((a,b)=>(L[b.id].points-L[a.id].points)||(L[b.id].avg_rating-L[a.id].avg_rating)).slice(0,N);
    up  =pool.filter(p=>L[p.id]&&L[p.id].mult>1.0001).sort((a,b)=>L[b.id].mult-L[a.id].mult).slice(0,N);
    down=pool.filter(p=>L[p.id]&&L[p.id].mult<0.9999).sort((a,b)=>L[a.id].mult-L[b.id].mult).slice(0,N);
  }else{
    byRating=pool.filter(p=>p.season_avg_rating!=null).sort((a,b)=>b.season_avg_rating-a.season_avg_rating).slice(0,N);
    byPoints=pool.filter(p=>scored(p)!=null).sort((a,b)=>scored(b)-scored(a)).slice(0,N);
    // лише гравці з реальним рухом ціни (у пре-маркеті всі flat 0% → борди порожні, а не «топ з –0%»)
    up  =pool.filter(p=>vDelta(p).pct> 0.0005).sort((a,b)=>vDelta(b).pct-vDelta(a).pct).slice(0,N);
    down=pool.filter(p=>vDelta(p).pct<-0.0005).sort((a,b)=>vDelta(a).pct-vDelta(b).pct).slice(0,N);
  }
  const tn=rnd? 'Тур '+rnd.number : '';
  const empty=`<div class="dim" style="padding:12px 14px">${tourLoading?'Завантаження…':tourErr?'Не вдалося завантажити дані туру':rnd?(filtered?'За цим фільтром у '+tn+' нікого немає':tn+': даних ще немає (матчі не зіграні)'):filtered?'За цим фільтром нікого немає':'Даних ще немає (зʼявляться після зіграних турів)'}</div>`;
  const board=(title,sub,rows)=>`<div class="statcard"><div class="sthead"><b>${title}</b><span>${sub}</span></div>${rows||empty}</div>`;
  const opt=(v,tx,cur)=>`<option value="${esc(v)}" ${String(cur)===String(v)?'selected':''}>${esc(tx)}</option>`;
  const leagues=[...new Set(Object.values(S.clubs).filter(c=>all.some(p=>p.club_id===c.id)).map(c=>c.league).filter(Boolean))].sort((a,b)=>leagueEn(a).localeCompare(leagueEn(b)));
  const clubs=Object.values(S.clubs).filter(c=>all.some(p=>p.club_id===c.id) && (!F.league || c.league===F.league)).sort((a,b)=>a.name.localeCompare(b.name));
  const started=(S.rounds||[]).filter(r=>new Date(r.deadline_at)<=new Date()).sort((a,b)=>a.number-b.number);   // тури, що вже стартували (у грі або закриті)
  const fbar=`<div class="mfilters">
    <div class="mf"><select id="sf-round"><option value="">Тур: весь турнір</option>${started.map(r=>opt(r.id,'Тур '+r.number+(r.results_entered_at?'':' · у грі'),F.round)).join('')}</select></div>
    <div class="mf search"><input id="sf-q" placeholder="Пошук по імені (англ.)" value="${esc(F.q||'')}"></div>
    <div class="mf"><select id="sf-league"><option value="">Ліга: усі (${leagues.length})</option>${leagues.map(l=>opt(l,leagueEn(l),F.league)).join('')}</select></div>
    <div class="mf"><select id="sf-club"><option value="">Клуб: усі (${clubs.length})</option>${clubs.map(c=>opt(c.id,c.name,F.club)).join('')}</select></div>
    <div class="mf"><select id="sf-pos"><option value="">Позиція: усі</option>${['G','D','M','F'].map(x=>opt(x,posCat(x),F.pos)).join('')}</select></div>
    <div class="mf"><select id="sf-own">${[['','Власник: усі'],['free','Вільні'],['owned','У складах'],['mine','Мої']].map(([v,tx])=>opt(v,tx,F.own)).join('')}</select></div>
    ${(filtered||F.round)?'<button class="mini ghost" id="sf-reset">Скинути</button>':''}
    <span class="dim" style="margin-left:auto;font-size:12px">у вибірці: ${pool.length} з ${all.length}</span>
  </div>`;
  $('view').innerHTML=`
    <div class="head2"><h2>Статистика</h2><span class="sub">по пулу турніру · топ-${N} · клік по гравцю — детальна картка</span></div>
    ${fbar}
    <div class="statboards">
      ${rnd
        ? board('🏅 Топ рейтинг','SofaScore · '+tn, byRating.length?statRows(byRating, p=>Number(L[p.id].avg_rating).toFixed(2)):null)
        : board('🏅 Топ рейтинг','SofaScore · увесь пул', statRows(byRating, p=>Number(p.season_avg_rating).toFixed(2)))}
      ${rnd
        ? board('⚽ Найбільше очок','очки гравця за '+tn, byPoints.length?statRows(byPoints, p=>L[p.id].points):null)
        : board('⚽ Найбільше очок','наш турнір · лише заіграні', byPoints.length?statRows(byPoints, p=>scored(p)):null)}
      ${rnd
        ? board('📈 Найбільше подорожчав','рух ціни · '+tn, up.length?statRows(up, p=>fmtDelta({pct:L[p.id].mult-1,dir:'up'})):null)
        : board('📈 Найбільше подорожчав','наш турнір', statRows(up, p=>fmtDelta(vDelta(p))))}
      ${rnd
        ? board('📉 Найбільше подешевшав','рух ціни · '+tn, down.length?statRows(down, p=>fmtDelta({pct:L[p.id].mult-1,dir:'down'})):null)
        : board('📉 Найбільше подешевшав','наш турнір', statRows(down, p=>fmtDelta(vDelta(p))))}
    </div>`;
  const bind=(id,key,extra)=>{ const el=$(id); if(el) el.onchange=()=>{ F[key]=el.value; if(extra) extra(); viewStats(); }; };
  bind('sf-league','league',()=>{ if(F.club && (S.clubs[F.club]||{}).league!==F.league) F.club=''; });   // змінили лігу — клуб поза нею скидаємо
  bind('sf-club','club'); bind('sf-pos','pos'); bind('sf-own','own'); bind('sf-round','round');
  const qi=$('sf-q'); if(qi) qi.oninput=()=>{ F.q=qi.value; const at=qi.selectionStart; viewStats(); const n=$('sf-q'); if(n){ n.focus(); n.setSelectionRange(at,at); } };   // вид перемальовується цілком → повертаємо фокус і курсор
  const rs=$('sf-reset'); if(rs) rs.onclick=()=>{ S.stF={league:'',club:'',pos:'',own:'',q:'',round:''}; viewStats(); };
  $('view').querySelectorAll('.strow').forEach(el=>el.onclick=()=>openPlayerModal(el.dataset.p));
}
function viewTable(){
  $('view').innerHTML = `<div class="head2"><h2>Таблиця &amp; Матчі</h2><span class="sub">борда: залік, тури (таблиця й матчі), очки по турах, менеджмент · та сама, що публічна · <a href="squad-stage.html" target="_blank" style="color:var(--teal)">відкрити окремо ↗</a></span></div>
    <iframe id="boardFrame" src="squad-stage.html?embed" title="Squad борда" scrolling="no"
      style="width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);height:880px;display:block"></iframe>`;
  const fr=$('boardFrame');
  const fit=()=>{ try{ const b=fr.contentDocument&&fr.contentDocument.body; const h=b?b.scrollHeight:0;
    if(h>200) fr.style.height=(h+28)+'px'; }catch(e){/* крос-походження (file://) → лишається запасна висота */} };
  fr.addEventListener('load',()=>{ fit(); setTimeout(fit,400);
    try{ new ResizeObserver(fit).observe(fr.contentDocument.body); }catch(e){} });
  window.addEventListener('resize', fit, {passive:true});
}

// ── 📰 NEWS & PRESS (подієвий авто-лог ринку — наступний крок) ──
// ── 📰 NEWS — подієвий лог ринку (market_news, 425); email — потім ──
function newsLine(n){
  const who=id=>esc(S.names[id]||'—');
  const pl =id=>{ const p=S.players.find(x=>x.id===id); return '<b>'+esc(p?p.name:'гравець')+'</b>'; };
  const m=n.meta||{}, amt=(m.amount!=null)?eur(m.amount):'';
  const t=new Date(n.created_at).toLocaleString('uk',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  let ico='•', txt='';
  switch(n.kind){
    case 'buynow':            ico='💰'; txt=`<b>${who(n.actor_participant)}</b> купив ${pl(n.player_id)} · ${amt}`; break;
    case 'sold':              ico='💸'; txt=`<b>${who(n.actor_participant)}</b> продав ${pl(n.player_id)} у ринок · ${amt}`; break;
    case 'autosold':          ico='⏳'; txt=`${pl(n.player_id)}: контракт вичерпано → автопродаж (<b>${who(n.actor_participant)}</b>) · ${amt}`; break;
    case 'auction_start':     ico='🔨'; txt=`<b>${who(n.actor_participant)}</b> виставив ${pl(n.player_id)} на аукціон · старт ${amt}`; break;
    case 'auction_won':       ico='🏆'; txt=`<b>${who(n.actor_participant)}</b> виграв аукціон на ${pl(n.player_id)} · ${amt}`; break;
    case 'bid':               ico='⬆️'; txt=`<b>${who(n.actor_participant)}</b> перебив ставку на ${pl(n.player_id)} · ${amt}`; break;
    case 'listed':            ico='🏷'; txt=`<b>${who(n.actor_participant)}</b> виставив ${pl(n.player_id)} на вітрину за ${amt}`; break;
    case 'listing_sold':      ico='🏷'; txt=`<b>${who(n.actor_participant)}</b> викупив ${pl(n.player_id)} з вітрини (у <b>${who(n.subject_participant)}</b>) · ${amt}`; break;
    case 'transfer_done':     ico='↔️'; txt=`<b>${who(n.actor_participant)}</b> купив ${pl(n.player_id)} у <b>${who(n.subject_participant)}</b> (трансфер) · ${amt}`; break;
    case 'transfer_rejected': ico='✖️'; txt=`<b>${who(n.subject_participant)}</b> відхилив пропозицію <b>${who(n.actor_participant)}</b> на ${pl(n.player_id)} · ${amt}`; break;
    case 'exchange_done':     ico='🔄'; txt=`Обмін: <b>${who(n.actor_participant)}</b> ↔ <b>${who(n.subject_participant)}</b> — ${pl(n.player_id)} ↔ ${pl(m.wanted_player)}${m.cash_delta?` · доплата ${eur(Math.abs(m.cash_delta))}`:''}`; break;
    case 'boost': { const bb=BOOSTS[m.boost]||{ico:'🚀',name:esc(m.boost||'буст')}; ico=bb.ico;
                    txt=`<b>${who(n.actor_participant)}</b> — ${bb.name} на Тур ${m.round_number||'?'}${m.delta!=null?` · ${m.delta>0?'+':''}${m.delta} оч.`:''}${(m.boost==='squad_autopilot'&&n.player_id)?` (×2 на ${pl(n.player_id)})`:''}`; break; }
    default:                  txt=esc(n.kind);
  }
  return `<div class="nrow"><span class="nico">${ico}</span><span class="ntxt">${txt}</span><span class="ntime">${t}</span></div>`;
}
async function viewNews(){
  let rows=null;
  try{ rows = await sbSel(`market_news?tournament_id=eq.${S.tour.id}&order=created_at.desc&limit=200&select=id,kind,actor_participant,subject_participant,player_id,meta,created_at`); }
  catch(e){ rows=null; }   // 425 ще не залито → degrade
  S.news=rows; renderNews();
}
function renderNews(){
  const rows=S.news;
  if(rows===null){
    $('view').innerHTML=`<div class="head2"><h2>News</h2></div><div class="soon">Стрічка ринку зʼявиться після заливки <b>425</b> (<code>market_news</code>). Суми угод публічні; бюджети учасників приватні. Email — окремо.</div>`;
    return;
  }
  const f=S.newsF||(S.newsF={sub:'all',player:''});
  // гравці, що згадані у стрічці (для фільтра «по гравцю»)
  const ids=new Set(); rows.forEach(n=>{ if(n.player_id) ids.add(n.player_id); if(n.meta&&n.meta.wanted_player) ids.add(n.meta.wanted_player); });
  const plOpts=[...ids].map(id=>{ const p=S.players.find(x=>x.id===id); return p?[id,p.name]:null; }).filter(Boolean).sort((a,b)=>a[1].localeCompare(b[1]));
  let list=rows.slice();
  if(f.sub==='mine') list=list.filter(n=>n.actor_participant===S.me.id||n.subject_participant===S.me.id);
  if(f.player) list=list.filter(n=>n.player_id===f.player||(n.meta&&n.meta.wanted_player===f.player));
  $('view').innerHTML=`
    <div class="head2"><h2>News</h2><span class="sub">подієвий лог ринку · ${rows.length} подій · суми угод публічні, бюджети приватні · показано ${list.length}</span></div>
    <div class="news-filters">
      <div class="subtabs"><button data-ns="all" class="${f.sub==='all'?'on':''}">Усі</button><button data-ns="mine" class="${f.sub==='mine'?'on':''}">Мої</button></div>
      <select id="newsPl"><option value="">Гравець: усі</option>${plOpts.map(([id,nm])=>`<option value="${id}"${f.player===id?' selected':''}>${esc(nm)}</option>`).join('')}</select>
    </div>
    <div class="news-feed">${list.length?list.map(newsLine).join(''):'<div class="soon">Подій ще немає — вони зʼявляться, щойно на ринку почнуться дії (купівля/аукціон/трансфер/обмін).</div>'}</div>`;
  $('view').querySelectorAll('[data-ns]').forEach(b=>b.onclick=()=>{ S.newsF.sub=b.dataset.ns; renderNews(); });
  const ps=$('newsPl'); if(ps) ps.onchange=()=>{ S.newsF.player=ps.value; renderNews(); };
}

     кабінет), а не новою вкладкою. Класичний скрипт, делегує `.win-open`. -->
<script>
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('.win-open');
  if(!a) return;
  if(window.parent && window.parent !== window){
    e.preventDefault();
    window.parent.postMessage({
      type:'boorbit:openwin',
      href:a.getAttribute('href'),
      title:a.getAttribute('data-title') || a.textContent.trim()
    }, '*');
  }
});
</script>
<!-- Бейдж лічильника запрошень/заявок на кнопці «👥 Спільноти» (self-contained:
     читає сесію з localStorage supabase-js, опитує my_community_pending). -->
<script>
(function(){
  var A=document.getElementById('btn-communities'); if(!A) return;
  var REF='wsdamzcezumjmgxmvakw', KEY='sb_publishable_bkXuSYswtmg4xCtecLb9cw_No0oCuSo', badge=null;
  function tok(){ try{ var r=localStorage.getItem('sb-'+REF+'-auth-token'); return r?(JSON.parse(r)||{}).access_token:null; }catch(e){ return null; } }
  function upd(n){
    if(!n){ if(badge){ badge.remove(); badge=null; } return; }
    if(!badge){ badge=document.createElement('span');
      badge.style.cssText='display:inline-block;margin-left:5px;min-width:16px;height:16px;line-height:16px;text-align:center;font-size:11px;font-weight:700;background:#F4C430;color:#1a1206;border-radius:9px;padding:0 4px;vertical-align:middle';
      A.appendChild(badge); }
    badge.textContent=n; A.title=n+' запрошень/заявок чекають на відповідь';
  }
  function poll(){ var t=tok(); if(!t) return;
    fetch('https://'+REF+'.supabase.co/rest/v1/rpc/my_community_pending',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:'{}'})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(rows){ if(rows) upd(rows.length); }).catch(function(){});
  }
  poll(); setInterval(poll, 20000);
})();
</script>
