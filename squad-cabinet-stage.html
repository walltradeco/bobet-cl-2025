<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Squad Mode · кабінет (STAGE)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<!-- шрифти BoBet — ЛИШЕ для екрана входу (вхід спільний для всіх ліг) -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1310; --panel:#132019; --panel2:#18271f; --line:#243a30;
  --text:#e9f1ec; --text-dim:#8ba297;
  --gold:#e6c14b; --teal:#6fb0c9; --blue:#7fbcff; --purple:#a98fdb;
  --green:#18b47a; --green-soft:rgba(24,180,122,0.14); --red:#e2585f;
  --up:#26c281; --down:#e2585f;
  --accent:#18b47a; --accent-d:#0e6f4c; --dim:#5f7469;
  --mono:'Rajdhani',system-ui,sans-serif; --body:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 480px at 80% -10%, #12261c 0%, transparent 58%),
    radial-gradient(900px 400px at 0% 0%, #10201a 0%, transparent 50%),
    var(--bg)}
h1,h2,h3{font-family:var(--mono);letter-spacing:.01em}
.tnum,table.t td.n,.stat span,.lrt,.lmv,.mprice,.rpill,.mbig .n,.mstats div b{font-variant-numeric:tabular-nums}
.stage-badge{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--red);
  color:#fff;text-align:center;font-size:12px;font-weight:700;letter-spacing:.05em;padding:4px}
.wrap{max-width:1440px;margin:0 auto;padding:34px 16px 80px}
.hide{display:none!important}
h1{font-size:24px;margin:0}
h2{font-size:19px;margin:0 0 10px}
.dim{color:var(--text-dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:12px 0}
.msg{padding:10px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.msg.err{background:var(--red);color:#fff}
.msg.ok{background:var(--green);color:#fff}
input{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:9px 11px;font-size:15px;width:100%;max-width:320px}
button{background:var(--accent);color:#06120c;border:1px solid var(--accent-d);border-radius:9px;padding:10px 17px;
  font-family:var(--mono);font-size:14.5px;font-weight:700;letter-spacing:.03em;cursor:pointer}
button.ghost{background:none;color:var(--text);border:1px solid var(--line)}
button:disabled{background:var(--panel2);color:var(--dim);border-color:var(--line);opacity:1;cursor:not-allowed}

/* шапка застосунку (F1-макет) */
#screen-app{padding-top:26px}
header{border-bottom:1px solid var(--line);background:rgba(12,19,16,.86);backdrop-filter:blur(10px)}
.hbar{max-width:1440px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .dot{width:30px;height:30px;border-radius:9px;font-size:13px;
  background:conic-gradient(from 200deg,var(--accent),var(--gold),var(--accent));
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:#06120c}
.brand h1{font-size:19px;font-weight:700;margin:0}
.brand small{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.16em;
  text-transform:uppercase;font-family:var(--mono);margin-top:-2px}
.hstat{display:flex;flex-direction:column;line-height:1.15}
.hstat .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono);font-weight:600}
.hstat .v{font-family:var(--mono);font-weight:700;font-size:18px}
.hstat.bank .v{color:var(--gold)}
.me{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border:1px solid var(--line);border-radius:30px;background:var(--panel)}
.me .av{width:26px;height:26px;border-radius:50%;background:var(--accent-d);display:grid;place-items:center;
  font-family:var(--mono);font-weight:700;font-size:13px;color:#dff5ea}
.priv{font-size:9.5px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px;letter-spacing:.04em}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);max-width:1440px;margin:0 auto;padding:0 16px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:none;color:var(--text-dim);font-family:var(--mono);font-weight:600;
  font-size:14.5px;letter-spacing:.02em;padding:13px 15px 11px;cursor:pointer;border-bottom:2px solid transparent;
  white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.tab .ic{font-size:15px}
#screen-app .wrap{padding-top:18px}
.spin{color:var(--text-dim);padding:30px 4px}

/* статус-панель (Bank / Squad Price / дедлайн) */
.statbar{display:flex;gap:20px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:14px 18px;margin-bottom:14px}
.stat b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
  font-family:var(--mono);font-weight:600}
.stat span{font-family:var(--mono);font-size:19px;font-weight:700}
.stat .bank{color:var(--gold)} .stat .price{color:var(--teal)}

/* пре-маркет банер (§L) */
.premkt{background:linear-gradient(90deg,rgba(244,196,48,.12),rgba(244,196,48,.03));
  border:1px solid rgba(244,196,48,.35);border-radius:12px;padding:12px 16px;margin-bottom:12px;
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
.premkt b{color:var(--gold)}
.premkt .pm-prog{color:var(--text-dim)} .premkt .pm-prog b{color:var(--text)}
.premkt .pm-bank{margin-left:auto;color:var(--text-dim)}

/* бейдж позиції у лайнапі («Мій склад») */
.pos{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:4px;
  border:1px solid var(--line);background:none;color:var(--text-dim);flex:none}
.pos.G{color:#f0c14b;border-color:#5a4a1c} .pos.D{color:#7fbcff;border-color:#274a63}
.pos.M{color:#8be3b0;border-color:#255a3e} .pos.F{color:#ff9d7a;border-color:#5e3423}

/* лайнап */
.vbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.vchip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.vchip.ok{color:var(--up);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.vchip.bad{color:var(--down);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
.lzone{margin-bottom:12px}
.lzt{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);font-weight:700;margin:10px 0 4px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin-bottom:5px;flex-wrap:wrap}
.lrow .lnm{font-weight:700;flex:1;min-width:140px}
.lrow .lclub{color:var(--text-dim);font-weight:400;font-size:12px;margin-left:6px}
.lrow .lrt{color:var(--gold);font-weight:700;width:46px;text-align:right}
.lrow .lmv{color:var(--teal);width:64px;text-align:right;font-variant-numeric:tabular-nums}
.lrow .lctrl{display:flex;gap:4px}
.lrow .capb{color:var(--gold)} .lrow .viceb{color:var(--teal)}
.benchord{flex:none;width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  color:var(--text-dim);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
button.mini{padding:4px 9px;font-size:12px;font-weight:700;border-radius:6px}
button.mini.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.mini.on{background:var(--gold);color:#1B1B1B}
button.mini.sell{color:var(--text-dim);font-weight:400}

/* таблиці */
table.t{width:100%;border-collapse:collapse}
.t th,.t td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;font-variant-numeric:tabular-nums}
.t th{font-size:11px;text-transform:uppercase;color:var(--text-dim);font-weight:600;letter-spacing:.03em}
.t td.n{text-align:right;white-space:nowrap}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.subtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{background:var(--panel);color:var(--text-dim);border:1px solid var(--line);
  border-radius:9px;padding:7px 14px;font-family:var(--mono);font-size:13.5px;font-weight:600}
.subtabs button.on{background:var(--accent-d);color:#dff5ea;border-color:var(--accent-d)}
.soon{border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--text-dim)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:var(--text-dim)}

/* ── РИНОК за макетом (фільтри-ряд + сітка плиток + модалка) ── */
.mfilters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 16px}
.mf{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:6px 11px;font-size:13px}
.mf label{color:var(--text-dim);text-transform:uppercase;font-size:10px;letter-spacing:.05em;font-weight:700}
.mf select,.mf input{background:transparent;border:0;color:var(--text);font-size:13px;font-weight:600;
  padding:0;width:auto;max-width:none;-webkit-appearance:none}
.mf select{cursor:pointer}
.mf.search input{min-width:150px}
.mf.range .rng{display:flex;flex-direction:column;gap:1px}
.mf input[type=range]{width:90px;accent-color:var(--gold);cursor:pointer;height:14px}
.mf .rv{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.msort{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);
  display:flex;align-items:center;gap:7px;font-weight:700}
.msort select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:6px 9px;font-weight:700;font-size:13px;text-transform:none;letter-spacing:0}
.msec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:700;
  border-bottom:1px solid var(--line);padding-bottom:8px;margin:6px 0 14px;display:flex;justify-content:space-between}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mtile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;
  cursor:pointer;transition:border-color .12s,transform .12s;text-align:center}
.mtile:hover{border-color:var(--gold);transform:translateY(-1px)}
.mtile.mine{border-color:rgba(244,196,48,.45)}
.mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pbadge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:5px;border:1px solid transparent}
.pbadge.G{background:rgba(240,193,75,.14);color:#f0c14b;border-color:#5a4a1c}
.pbadge.D{background:rgba(127,188,255,.12);color:#7fbcff;border-color:#274a63}
.pbadge.M{background:rgba(24,180,122,.16);color:#8be3b0;border-color:#255a3e}
.pbadge.F{background:rgba(255,157,122,.14);color:#ff9d7a;border-color:#5e3423}
.vdelta{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.vdelta.up{color:var(--up)} .vdelta.down{color:var(--down)} .vdelta.flat{color:var(--text-dim)}
.mav{width:76px;height:76px;border-radius:50%;margin:0 auto 8px;background:var(--panel2);
  border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:800;color:var(--text-dim);overflow:hidden;flex:none}
.mav img{width:100%;height:100%;object-fit:cover}
.mtile .mnm{font-weight:700;font-size:14px;line-height:1.2}
.mtile .mclub{font-size:12px;color:var(--text-dim);margin-top:2px}
.mrow{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:9px}
.rpill{background:var(--panel2);border-radius:7px;padding:2px 9px;font-weight:800;color:var(--up);font-size:14px}
.mprice{color:var(--text);font-weight:700;font-size:14px}
.spark{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:22px;margin-top:10px}
.spark i{width:6px;background:var(--up);border-radius:2px;opacity:.85}
.spark.empty{color:var(--text-dim);font-size:10px;height:22px;align-items:center}
.mstatus{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;gap:5px}
.mstatus.free{color:var(--up)} .mstatus.mine{color:var(--gold);font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.g{background:var(--up)} .dot.o{background:var(--text-dim)}

/* модалка гравця / дій */
.modal-host{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.modal .mx{position:absolute;top:12px;right:14px;color:var(--text-dim);background:none;border:0;
  font-size:20px;cursor:pointer;padding:2px 6px;font-weight:400}
.modal h3{margin:0;font-size:22px}
.mhead{display:flex;gap:14px;align-items:center}
.mmeta{font-size:13px;color:var(--text-dim);margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mbig{margin-left:auto;text-align:right}
.mbig .n{font-size:30px;font-weight:800;color:var(--up);line-height:1}
.mbig .l{font-size:10px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.05em}
.mstats{display:flex;gap:24px;flex-wrap:wrap;margin:18px 0 4px}
.mstats div b{display:block;font-size:20px;font-weight:800}
.mstats div span{font-size:10px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.04em}
.mchart{margin:14px 0 4px}
.macts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.macts button{flex:1;min-width:130px;padding:11px 14px}
.mamt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mamt input{max-width:110px}
.mamt .dim{flex:1;min-width:150px}
.mnote{font-size:12px;color:var(--text-dim);margin-top:9px}
.mnote.warn{color:var(--down);font-weight:600}

/* рядки трансферів */
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.trow .tinfo{flex:1;min-width:230px;font-size:14px}
.trow .tctrl{display:flex;gap:6px}
.trow .tctrl button{padding:6px 12px;font-size:13px}

/* ── ЕКРАН ВХОДУ = BoBet/ЄвроСезон (спільна брама всіх ліг, НЕ дизайн турніру) ──
   Колори тут ЗАШИТІ під палітру BoBet, а не F1-токени: вхід має бути однаковий
   скрізь. In-app лишається F1. Перемикання фону — через :has(), JS не чіпаємо. */
body:has(#screen-login:not(.hide)){
  background:
    repeating-linear-gradient(0deg, rgba(237,239,232,.06) 0px, rgba(237,239,232,.06) 1px, transparent 1px, transparent 64px),
    #1B1B1B;
}
/* верхня червона смуга Squad — сховати на вході (у BoBet бейдж дрібний, у заголовку) */
body:has(#screen-login:not(.hide)) .stage-badge{display:none;}
.login{max-width:380px;margin:8vh auto 0;text-align:center;font-family:'Onest',sans-serif;}
.login h1{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;
  letter-spacing:.14em;text-transform:uppercase;color:#2E8B57;margin:0 0 24px;line-height:1.4;}
.login .badge{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;
  letter-spacing:.08em;color:#C75C4A;border:1px solid #C75C4A;border-radius:5px;padding:2px 7px;
  text-transform:none;vertical-align:middle;}
.login p.dim{color:#8B9A8C;font-size:15px;margin:0 0 14px;}
.login input{width:100%;max-width:none;padding:15px;margin:8px 0;background:#1B251D;
  border:1px solid #2A362B;border-radius:10px;color:#EDEFE8;font-size:17px;
  font-family:'Onest',sans-serif;text-align:center;}
.login input.code{font-family:'IBM Plex Mono',monospace;font-size:25px;letter-spacing:.18em;font-weight:700;}
.login input:focus{outline:none;border-color:#F4C430;}
.login button.primary{width:100%;background:#F4C430;color:#1a1206;border:none;border-radius:10px;
  padding:15px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;
  letter-spacing:0;cursor:pointer;}
.login button.primary:disabled{background:#212D23;color:#8B9A8C;cursor:not-allowed;}
.login button.ghost{background:transparent;border:1px solid #2A362B;color:#8B9A8C;
  border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer;font-family:'Onest',sans-serif;
  margin-top:10px;width:100%;}
.login #login-msg .msg{text-align:left;}

/* ── F1 компоненти (макет squad_cabinet_mockup) ── */
.rndbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 16px;margin:4px 0 16px}
.rndbar .pill{font-family:var(--mono);font-weight:700;background:var(--accent-d);color:#dff5ea;padding:3px 11px;
  border-radius:20px;font-size:13px;letter-spacing:.03em}
.rndbar .txt{color:var(--text-dim);font-size:13px}
.rndbar .cd{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold);font-size:15px}
.head2{display:flex;align-items:baseline;gap:10px;margin:6px 2px 12px;flex-wrap:wrap}
.head2 h2{font-size:17px;font-weight:700;margin:0}
.head2 .sub{color:var(--dim);font-size:12px}
.squad-wrap{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:820px){.squad-wrap{grid-template-columns:1.5fr 1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.slot-h{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin:2px 2px 10px;display:flex;justify-content:space-between}
.plist{display:grid;gap:8px}
.pcard{display:grid;grid-template-columns:1fr auto;gap:11px;align-items:center;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;border-left:3px solid var(--club,var(--line))}
.pcard .nm{font-weight:600;font-size:14.5px;line-height:1.15;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pcard .meta{font-size:11.5px;color:var(--text-dim);display:flex;gap:7px;align-items:center;margin-top:2px}
.pcard .rt{text-align:right;line-height:1.2}
.pcard .rt .big{font-family:var(--mono);font-weight:700;font-size:19px}
.pcard .rt .pr{font-size:11px;color:var(--text-dim);white-space:nowrap}
.pcard .lctrl{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.capB{font-family:var(--mono);font-weight:700;font-size:10px;background:var(--gold);color:#241c00;border-radius:4px;padding:0 5px}
.viceB{font-family:var(--mono);font-weight:700;font-size:10px;background:#2a3f33;color:#bfe8d1;border-radius:4px;padding:0 5px}
.valid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chk{font-size:12px;color:var(--text-dim);border:1px solid var(--line);border-radius:20px;padding:3px 10px;
  display:flex;gap:5px;align-items:center;background:var(--panel2)}
.chk.ok{color:var(--up);border-color:#1f4d38}.chk.no{color:var(--down);border-color:#4d2427}
.btn{font-family:var(--mono);font-weight:700;letter-spacing:.03em;border-radius:9px;padding:11px 18px;
  border:1px solid var(--accent-d);background:var(--accent);color:#06120c;cursor:pointer;font-size:14.5px}
.btn:disabled{background:var(--panel2);color:var(--dim);border-color:var(--line);cursor:not-allowed}
.btn.ghost{background:none;color:var(--text);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.up{color:var(--up)}.down{color:var(--down)}
/* матчі */
.mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:9px 12px;
  border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--panel2)}
.mrow .t{display:flex;align-items:center;gap:8px;min-width:0}
.mrow .t span:not(.crest){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .t.away{justify-content:flex-end}
.crest{width:20px;height:20px;border-radius:5px;background:var(--club,#233);border:1px solid rgba(255,255,255,.14);flex:none}
.score{font-family:var(--mono);font-weight:700;font-size:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:7px;padding:3px 11px;min-width:64px;text-align:center;flex:none}
.score.sched{color:var(--text-dim);font-size:12px;font-weight:500}
/* news */
.feed{display:grid;gap:2px}
.fitem{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.fico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.fitem .body{color:var(--text-dim);font-size:13.5px}.fitem .body b{color:var(--text)}
.fitem .ts{font-size:11px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
/* адмінка */
.adm-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:680px){.adm-grid{grid-template-columns:1fr 1fr}}
.acard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}
.acard h3{font-size:14.5px;margin:0 0 4px}
.acard p{color:var(--text-dim);font-size:12.5px;margin:0}
.acard .lk{color:var(--dim);font-size:12px;font-family:var(--mono);font-weight:600;margin-top:8px;display:inline-block}
</style>
</head>
<body>
<div class="stage-badge">STAGE · Squad Mode · дані тестові</div>
<!-- ЛОГІН = спільний вхід BoBet/ЄвроСезон (не дизайн турніру) -->
<div id="screen-login" class="wrap">
    <div class="login">
      <h1>BoBet · Fantasy League <span class="badge">STAGE</span></h1>

      <div id="step-email">
        <p class="dim">Вкажи пошту — надішлемо код</p>
        <input type="email" id="in-email" placeholder="пошта" autocomplete="email" inputmode="email">
        <button class="primary" id="btn-send">Надіслати код</button>
      </div>

      <div id="step-code" class="hide">
        <p class="dim">Код із листа. Перевір і спам.</p>
        <input type="text" id="in-code" class="code" placeholder="000000" maxlength="12" inputmode="numeric" autocomplete="one-time-code">
        <button class="primary" id="btn-verify">Увійти</button>
        <button class="ghost" id="btn-back">Інша пошта</button>
      </div>

      <div id="login-msg"></div>
    </div>
  </div>

<!-- ЗАСТОСУНОК -->
<div id="screen-app" class="hide">
  <header>
    <div class="hbar">
      <div class="brand"><div class="dot">SQ</div><div><h1>Squad Mode</h1><small>Трансферний ринок</small></div></div>
      <div class="hstat bank"><span class="k">Мій Bank <span class="priv">лише я</span></span><span class="v tnum" id="h-bank">—</span></div>
      <div class="hstat"><span class="k">Squad Price</span><span class="v tnum" id="h-price">—</span></div>
      <div class="me"><span class="av" id="h-av">—</span><span id="my-name" style="font-family:var(--mono);font-weight:600">—</span>
        <button id="btn-logout" class="btn ghost sm" style="margin-left:4px">Вийти</button></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <div class="wrap"><div id="view"><div class="spin">завантаження…</div></div></div>
</div>

<div id="mhost" class="modal-host hide"></div>

<script type="module">
// anon-ключ публічний — захист у RLS. service_role сюди НЕ КЛАСТИ.
const SUPABASE_URL  = 'https://wsdamzcezumjmgxmvakw.supabase.co';
const SUPABASE_ANON = 'sb_publishable_bkXuSYswtmg4xCtecLb9cw_No0oCuSo';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

const S = { me:null, tour:null, cfg:null, tab:'my', rounds:[], clubs:{}, players:[], bank:null,
  mktSub:'free', form:{}, rBounds:[6,10], pBounds:[0,150000000], transfers:[], transfersReady:false,
  f:{ q:'', league:'', club:'', pos:'', rMin:null, rMax:null, pMin:null, pMax:null, status:'all', sort:'rating' } };
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function msg(host,text,kind='err'){ host.innerHTML = `<div class="msg ${kind}">${esc(text)}</div>`; }
function eur(v){ return v==null?'—':'€'+(v/1e6).toFixed(v>=1e8?0:1)+'M'; }
function lastName(f){ const p=(f||'').trim().split(/\s+/); return p[p.length-1]||f; }
// колір клубу за реальною назвою (market_clubs) — та сама мапа, що на публічній борді
const CLUB={'Arsenal':'#ef0107','Atletico':'#cb3524','Barcelona':'#a50044','Bayern':'#dc052d',
 'Chelsea':'#034694','Dortmund':'#b8a300','Dynamo Kyiv':'#0d47a1','Inter':'#0068a8',
 'Juventus':'#4a4a4a','Leverkusen':'#e32219','Liverpool':'#c8102e','Man City':'#6cabdd',
 'Man Utd':'#da291c','Milan':'#fb090b','Napoli':'#12a0d7','PSG':'#1b3b6f',
 'Real Madrid':'#3f6fbf','Roma':'#8e1f2f','Shakhtar':'#f37021'};
function clubName(cid){ return (S.clubs[cid]||{}).name||''; }
function clubCol(cid){ return CLUB[clubName(cid)]||'var(--line)'; }
// зворотний відлік до дедлайну: «Nд ГГ:ХХ»
function countdown(iso){ const ms=new Date(iso)-new Date(); if(ms<=0) return 'дедлайн минув';
  const m=Math.floor(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  return (d?d+'д ':'')+String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }

// ── ВХІД (той самий шлях, що BoBet/PSL) ──
$('btn-send').onclick = async () => {
  const email = $('in-email').value.trim().toLowerCase();
  if(!email) return msg($('login-msg'),'Вкажи пошту');
  $('btn-send').disabled=true; $('btn-send').textContent='надсилаю…';
  const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
  $('btn-send').disabled=false; $('btn-send').textContent='Надіслати код';
  if(error){ const t=/не.*доступ|not allowed|Database error/i.test(error.message)
    ? 'Немає доступу — цієї пошти немає в списку учасників' : error.message;
    return msg($('login-msg'),t); }
  window.__email=email; $('step-email').classList.add('hide'); $('step-code').classList.remove('hide');
  $('login-msg').innerHTML=''; $('in-code').focus();
};
$('btn-verify').onclick = async () => {
  const token=$('in-code').value.trim();
  if(token.length<4) return msg($('login-msg'),'Код закороткий');
  $('btn-verify').disabled=true;
  let error=null;
  for(const type of ['email','signup','magiclink']){
    const res=await sb.auth.verifyOtp({ email:window.__email, token, type });
    if(!res.error){ error=null; break; } error=res.error;
  }
  $('btn-verify').disabled=false;
  if(error){ return msg($('login-msg'),'Не вийшло: '+(error.message||'')); }
  await boot();
};
$('btn-back').onclick=()=>{ $('step-code').classList.add('hide'); $('step-email').classList.remove('hide'); $('login-msg').innerHTML=''; };
$('btn-logout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };

// ── СТАРТ ──
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('screen-login').classList.remove('hide'); $('screen-app').classList.add('hide'); return; }
  try{ await sb.rpc('bind_me'); }catch(e){ /* самолікування, ковтаємо */ }

  // squad-турнір (mode='squad', активний). Стейдж = squad_test єдиний.
  const { data:tt } = await sb.from('tournaments')
    .select('id,title,key,mode,status').eq('mode','squad').eq('status','active').order('starts_at',{ascending:false});
  S.tour = (tt&&tt[0])||null;
  if(!S.tour){
    $('screen-login').classList.add('hide'); $('screen-app').classList.remove('hide');
    $('tabs').innerHTML=''; $('view').innerHTML=`<div class="card"><h2>Squad-турнір ще не відкрито</h2><p class="dim">Активного Squad-турніру немає.</p></div>`;
    return;
  }
  // я в цьому турнірі?
  const { data:me } = await sb.rpc('me', { p_tournament:S.tour.id });
  if(!me || !me.length){
    $('screen-login').classList.remove('hide');
    return msg($('login-msg'),'Тебе немає серед учасників цього турніру');
  }
  S.me = me[0];
  S.me.id = S.me.participant_id;   // ⚠️ me() віддає колонку participant_id; увесь код кабінету чекає .id

  $('screen-login').classList.add('hide'); $('screen-app').classList.remove('hide');
  $('my-name').textContent = S.me.display_name;
  // страховка: помилка завантаження показується, а не зависає «завантаження…»
  try {
    await loadRefs();
    renderTabs();
    go(S.tab);
  } catch(e){
    $('view').innerHTML = '<div class="soon">Не вдалось завантажити дані: '
      + esc(e && e.message ? e.message : e) + '</div>';
  }
}

async function loadRefs(){
  const cs = await sbSel('market_clubs?select=id,name,league');
  S.clubs = {}; cs.forEach(c=>S.clubs[c.id]=c);
  S.cfg = (await sb.rpc('market_cfg', { p_tournament:S.tour.id })).data || null;
  S.rounds = await sbSel(`market_rounds?tournament_id=eq.${S.tour.id}&select=id,number,title,deadline_at,results_entered_at&order=number.asc`);
  S.players = await sbSel(`market_players?tournament_id=eq.${S.tour.id}&select=id,name,position,club_id,owner_participant_id,market_value_start,market_value_current,season_avg_rating,photo_url,appearances,minutes&order=market_value_current.desc`);
  // активні аукціони (публічні)
  S.auctions = await sbSel(`market_auctions?tournament_id=eq.${S.tour.id}&status=eq.active&select=id,player_id,current_bid,leader_participant_id,ends_at`);
  // імена учасників (для лідерів аукціонів) — з наскрізного заліку (публічний)
  const lb = await sbSel(`market_leaderboard?tournament_id=eq.${S.tour.id}&select=participant_id,display_name`);
  S.names = {}; lb.forEach(p=>S.names[p.participant_id]=p.display_name);
  // свій Bank / доступне / заморожене (RLS + RPC: лише свій)
  const b = await sbSel(`market_budget?tournament_id=eq.${S.tour.id}&participant_id=eq.${S.me.id}&select=bank_eur`);
  S.bank = b.length? b[0].bank_eur : null;
  S.spendable = (await sb.rpc('market_spendable', { p_participant:S.me.id })).data;
  S.frozen    = (await sb.rpc('market_frozen',    { p_participant:S.me.id })).data;
  // форма гравця (рейтинги по турах) — для спарклайну плитки й графіка в модалці
  S.form = {};
  try{
    const fr = await sbSel(`market_player_round_points?tournament_id=eq.${S.tour.id}&select=player_id,round_id,avg_rating&order=round_id.asc`);
    fr.forEach(r=>{ (S.form[r.player_id]=S.form[r.player_id]||[]).push(r.avg_rating); });
  }catch(e){ S.form={}; }
  // прямі трансфери (405; таблиця публічна). Поки 405 не залито — таблиці немає → degrade
  S.transfers=[]; S.transfersReady=false;
  try{
    S.transfers = await sbSel(`market_transfers?tournament_id=eq.${S.tour.id}&status=eq.pending&select=id,player_id,to_participant,from_participant,amount,awaiting_participant,status,created_at&order=created_at.desc`);
    S.transfersReady=true;
  }catch(e){ S.transfers=[]; S.transfersReady=false; }
  // обмін 1↔1 + двостороння доплата (412; таблиця публічна). Поки 412 не залито → degrade
  S.exchanges=[]; S.exchangesReady=false;
  try{
    S.exchanges = await sbSel(`market_exchanges?tournament_id=eq.${S.tour.id}&status=eq.pending&select=id,from_participant,to_participant,offered_player,wanted_player,cash_delta,awaiting_participant,status,created_at&order=created_at.desc`);
    S.exchangesReady=true;
  }catch(e){ S.exchanges=[]; S.exchangesReady=false; }
  // межі слайдерів (рейтинг/ціна) з реального пулу; значення фільтра ставимо лише раз
  const rs = S.players.map(p=>p.season_avg_rating).filter(v=>v!=null);
  S.rBounds = rs.length ? [Math.floor(Math.min(...rs)*10)/10, Math.ceil(Math.max(...rs)*10)/10] : [6,10];
  const ps = S.players.map(p=>p.market_value_current||0);
  S.pBounds = [0, Math.max(1e6, Math.ceil(Math.max(0,...ps)/1e6)*1e6)];
  if(S.f.rMin==null){ S.f.rMin=S.rBounds[0]; S.f.rMax=S.rBounds[1]; }
  if(S.f.pMin==null){ S.f.pMin=S.pBounds[0]; S.f.pMax=S.pBounds[1]; }
}

// виклик дії ринку: RPC → показати результат → перезавантажити
async function act(fn, args, okMsg){
  const { data, error } = await sb.rpc(fn, args);
  if(error){ alert('⛔ ' + (error.message||'').replace(/^.*?(Squad: )/, '$1')); return; }
  if(okMsg) alert('✅ ' + okMsg);
  await loadRefs(); go(S.tab);
}
// EUR ↔ млн у діалогах (зручніше вводити млн)
function askM(label, minEur){
  const v = prompt(label + ' (у €млн, мін ' + (minEur/1e6).toFixed(1) + ')', (minEur/1e6).toFixed(1));
  if(v==null) return null;
  const eurv = Math.round(parseFloat(v.replace(',','.')) * 1e6);
  if(!eurv || eurv < minEur){ alert('Замало — мінімум ' + eur(minEur)); return null; }
  return eurv;
}
// прив'язати кнопки дій після рендеру сітки карток
function bindActions(){
  document.querySelectorAll('[data-auc]').forEach(b=>b.onclick=()=>{
    const amt=askM('Стартова ставка', +b.dataset.min); if(amt) act('market_start_auction',{p_player:b.dataset.auc,p_amount:amt},'Аукціон почато'); });
  document.querySelectorAll('[data-bid]').forEach(b=>b.onclick=()=>{
    const amt=askM('Перебити', +b.dataset.min); if(amt) act('market_place_bid',{p_auction:b.dataset.bid,p_amount:amt},'Ставку зроблено'); });
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const p=S.players.find(x=>x.id===b.dataset.buy)||{name:'гравця'};
    confirmModal(`Викупити <b>${esc(p.name)}</b> за <b>${b.dataset.price}</b>?`, 'Викупити · '+b.dataset.price,
      ()=>act('market_buynow',{p_player:b.dataset.buy},'Гравець твій')); });
  document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{
    const p=S.players.find(x=>x.id===b.dataset.sell)||{name:'гравця'};
    confirmModal(`Продати <b>${esc(p.name)}</b> за <b>${b.dataset.price}</b> (−5%)?`, 'Продати · '+b.dataset.price,
      ()=>act('market_sell',{p_player:b.dataset.sell},'Продано')); });
}
// прямий REST (для market_* — простіше за .from ланцюги)
async function sbSel(path){
  const res = await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+(await tok())}});
  if(!res.ok) throw new Error('база '+res.status); return res.json();
}
async function tok(){ const {data}=await sb.auth.getSession(); return data.session?data.session.access_token:SUPABASE_ANON; }

// ── ВКЛАДКИ (6, §F) ──
function renderTabs(){
  const tabs=[['my','🏟','Мій склад'],['market','💱','Ринок'],['table','🏆','Таблиця'],['matches','⚽','Матчі'],['news','📰','News & Press']];
  if(S.me && S.me.is_admin) tabs.push(['admin','⚙','Адмінка']);
  $('tabs').innerHTML = tabs.map(([k,ic,t])=>`<button class="tab" data-tab="${k}" aria-selected="${k===S.tab}"><span class="ic">${ic}</span>${t}</button>`).join('');
  [...$('tabs').querySelectorAll('button')].forEach(b=>b.onclick=()=>go(b.dataset.tab));
}
// шапка: Bank (лише свій) + Squad Price (з Val Δ) + аватар/ім'я
function renderHeader(){
  if(!S.me) return;
  const mine=S.players.filter(p=>p.owner_participant_id===S.me.id);
  const price=mine.reduce((s,p)=>s+(p.market_value_current||0),0);
  const start=mine.reduce((s,p)=>s+(p.market_value_start||0),0);
  const dp=start?(price-start)/start*100:0;
  const dstr=start?(dp>0.05?` <small class="up">▲${dp.toFixed(1)}</small>`:dp<-0.05?` <small class="down">▼${Math.abs(dp).toFixed(1)}</small>`:''):'';
  const bk=$('h-bank'); if(bk) bk.textContent=eur(S.bank);
  const pr=$('h-price'); if(pr) pr.innerHTML=eur(price)+dstr;
  const nm=S.me.display_name||'—';
  const mn=$('my-name'); if(mn) mn.textContent=nm;
  const av=$('h-av'); if(av) av.textContent=(nm.trim()[0]||'—').toUpperCase();
}
async function go(tab){
  S.tab=tab; renderTabs(); renderHeader();
  $('view').innerHTML='<div class="spin">завантаження…</div>';
  if(tab==='my')      return viewSquad();
  if(tab==='market')  return viewMarket();
  if(tab==='table')   return viewTable();
  if(tab==='matches') return viewMatches();
  if(tab==='news')    return viewNews();
  if(tab==='admin')   return viewAdmin();
}

// шапка-статус (Bank лише свій, Squad Price)
function statbar(){
  const mine = S.players.filter(p=>p.owner_participant_id===S.me.id);
  const price = mine.reduce((s,p)=>s+(p.market_value_current||0),0);
  const dl = S.rounds.find(r=>new Date(r.deadline_at)>new Date());
  return `<div class="statbar">
    <div class="stat"><b>Доступно</b><span class="bank">${eur(S.spendable)}</span></div>
    <div class="stat"><b>Заморожено</b><span>${eur(S.frozen)}</span></div>
    <div class="stat"><b>Склад</b><span>${mine.length}/${S.cfg?S.cfg.squad_max:8}</span></div>
    <div class="stat"><b>Найближчий дедлайн</b><span>${dl?new Date(dl.deadline_at).toLocaleDateString('uk'):'—'}</span></div>
  </div>`;
}

// банер пре-маркету (§L): «вікно відкрито до [дедлайн], набери склад мін/макс»
function premarketBanner(mine){
  const cfg=S.cfg||{}, min=cfg.squad_min||5, max=cfg.squad_max||8;
  const firstFut=S.rounds.find(r=>new Date(r.deadline_at)>new Date());
  if(!firstFut) return '';                       // усі тури почались — пре-маркету немає
  const need=Math.max(0,min-mine.length);
  const dl=new Date(firstFut.deadline_at).toLocaleString('uk',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  return `<div class="premkt">
    <span><b>Трансферне вікно відкрито</b> до ${dl} · набери склад (мін ${min}, макс ${max}).</span>
    <span class="pm-prog">Зараз <b>${mine.length}/${max}</b>${need?` · ще мін <b>${need}</b> до старту`:` · мінімум зібрано ✓`}</span>
    <span class="pm-bank">Доступно ${eur(S.spendable)}</span>
  </div>`;
}

// ── 🧩 МІЙ СКЛАД + ЛАЙНАП (виставлення стартової 5 / капітан / віце / лавка) ──
async function viewSquad(){
  const mine = S.players.filter(p=>p.owner_participant_id===S.me.id);
  if(!mine.length){
    $('view').innerHTML = premarketBanner(mine) +
      '<div class="head2"><h2>Мій склад</h2></div><div class="soon">Склад порожній. Купуй гравців у вкладці <b>💱 Ринок</b> (аукціон / викуп).</div>';
    return;
  }
  // тур для виставлення = найближчий із дедлайном попереду (лок після дедлайну)
  const round = S.rounds.find(r => new Date(r.deadline_at) > new Date()) || null;
  let lu = [];
  if(round){
    try{ lu = await sbSel(`market_lineup?round_id=eq.${round.id}&participant_id=eq.${S.me.id}&select=player_id,role,bench_order,is_captain,is_vice`); }catch(e){}
  }
  // чернетка лайнапу: player_id → {role:'start'|'bench'|'out', cap, vice, ord}
  S.lineup = {}; S.lineupRound = round;
  mine.forEach(p => S.lineup[p.id] = { role:'out', cap:false, vice:false, ord:99 });
  lu.forEach(r => { if(S.lineup[r.player_id]) S.lineup[r.player_id] = { role:r.role, cap:r.is_captain, vice:r.is_vice, ord:r.bench_order||99 }; });
  renderLineup(mine, round);
}

function lnState(mine){
  const st = mine.filter(p=>S.lineup[p.id].role==='start');
  const bn = mine.filter(p=>S.lineup[p.id].role==='bench').sort((a,b)=>S.lineup[a.id].ord-S.lineup[b.id].ord);
  const out= mine.filter(p=>S.lineup[p.id].role==='out');
  const min5 = S.cfg?S.cfg.squad_min:5, benchMax=(S.cfg?S.cfg.squad_max-S.cfg.squad_min:3), dgMin=S.cfg?S.cfg.defgk_start_min:1;
  const defgk = st.filter(p=>p.position==='D'||p.position==='G').length;
  const cap = st.find(p=>S.lineup[p.id].cap);
  const vice= st.find(p=>S.lineup[p.id].vice);
  const errs=[];
  if(st.length<1||st.length>min5) errs.push(`старт 1..${min5}`);
  if(bn.length>benchMax) errs.push(`лавка ≤${benchMax}`);
  if(defgk<dgMin) errs.push(`≥${dgMin} DEF/GK у старті`);
  if(!cap) errs.push('обери капітана');
  if(st.length>=2 && !vice) errs.push('обери віце');   // віце обов'язковий (потребує ≥2 у старті)
  return { st, bn, out, defgk, dgMin, min5, benchMax, cap, vice, ok: errs.length===0, errs };
}

// перемістити лавкового вгору/вниз (порядок = пріоритет автозаміни)
function moveBench(mine, pid, dir){
  const bn = mine.filter(p=>S.lineup[p.id].role==='bench').sort((a,b)=>S.lineup[a.id].ord-S.lineup[b.id].ord);
  bn.forEach((p,i)=>S.lineup[p.id].ord=i+1);          // нормалізувати 1..n
  const i = bn.findIndex(p=>p.id===pid), j = i+dir;
  if(i<0 || j<0 || j>=bn.length) return;
  const a=bn[i].id, b=bn[j].id, t=S.lineup[a].ord; S.lineup[a].ord=S.lineup[b].ord; S.lineup[b].ord=t;
}

    ${chip(!!s.cap, s.cap?`Капітан: ${lastName(s.cap.name)}`:'Капітан не обраний')}
    ${chip(!!s.vice || s.st.length<2, s.vice?`Віце: ${lastName(s.vice.name)}`:'Віце не обраний')}

        <button class="mini" data-role="${p.id}:start">У старт</button>
        <button class="mini ghost" data-role="${p.id}:out">−</button>`;
    } else {
      ctrl = `<button class="mini" data-role="${p.id}:start">У старт</button>
        <button class="mini ghost" data-role="${p.id}:bench">На лаву</button>`;

      </div>
      <div class="rt"><div class="big tnum">★${p.season_avg_rating??'—'}</div><div class="pr tnum">${eur(p.market_value_current)} <span class="${d.dir}">${fmtDelta(d)}</span></div></div>
    </div>`;
  };

  const zoneBlock=(title,arr,z,sub)=>`<div class="slot-h" style="margin-top:14px"><span>${title}</span><span>${sub||''}</span></div>
    <div class="plist">${arr.length?arr.map((p,i)=>row(p,z,i)).join(''):'<div class="dim" style="padding:6px 2px">—</div>'}</div>`;

    }
    if(role==='bench'){
      const cnt=mine.filter(p=>S.lineup[p.id].role==='bench').length;
      if(cnt>=(S.cfg?S.cfg.squad_max-S.cfg.squad_min:3)) return alert('Лавка повна');
      S.lineup[pid].ord = 1+Math.max(0,...mine.map(p=>S.lineup[p.id].role==='bench'?S.lineup[p.id].ord:0));

// ── дрібні хелпери плитки/картки ──
const POS = { G:'GK', D:'DEF', M:'MID', F:'FWD' };
function posCat(p){ return POS[p]||p; }
function vDelta(p){
  const s=p.market_value_start||0, c=p.market_value_current||0;
  if(!s) return { pct:0, dir:'flat' };
  const d=(c-s)/s;
  return { pct:d, dir: d>0.0005?'up':(d<-0.0005?'down':'flat') };
}
function fmtDelta(d){ return (d.dir==='up'?'▲ ':d.dir==='down'?'▼ ':'– ')+Math.abs(d.pct*100).toFixed(0)+'%'; }
function avatar(p,size){
  const s=size||76;
  const init=(p.name||'?').split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
  const inner = p.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : esc(init);
  return `<div class="mav" style="width:${s}px;height:${s}px;font-size:${Math.round(s/3)}px">${inner}</div>`;
}
function ownerInfo(p){
  if(p.owner_participant_id===S.me.id) return { cls:'mine', txt:'★ У твоєму складі', dot:'' };
  if(p.owner_participant_id) return { cls:'', txt:'у складі · '+esc(S.names[p.owner_participant_id]||'—'), dot:'<span class="dot o"></span>' };
  const au=S.auctions.find(a=>a.player_id===p.id);
  if(au) return { cls:'free', txt:'🔨 аукціон · '+eur(au.current_bid), dot:'<span class="dot g"></span>' };
  return { cls:'free', txt:'🔒 Вільний', dot:'<span class="dot g"></span>' };
}
function sparkTile(p){
  const arr=(S.form[p.id]||[]).filter(v=>v!=null).slice(-6);
  if(!arr.length) return `<div class="spark empty">форма —</div>`;
  return `<div class="spark">${arr.map(v=>{
    const h=Math.max(3,Math.round((Math.min(10,Math.max(5,v))-5)/5*22));
    return `<i style="height:${h}px"></i>`;
  }).join('')}</div>`;
}
function formChart(p){
  const last=(S.form[p.id]||[]).filter(v=>v!=null).slice(-5);
  if(!last.length) return `<p class="mnote">Форма зʼявиться після зіграних турів.</p>`;
  const W=320,H=64,pad=8, mn=Math.min(...last,6), mx=Math.max(...last,9);
  const pts=last.map((v,i)=>{
    const x=pad+i*(W-2*pad)/Math.max(1,last.length-1);
    const y=H-pad-((v-mn)/Math.max(0.1,mx-mn))*(H-2*pad);
    return x.toFixed(0)+','+y.toFixed(0);
  }).join(' ');
  return `<div class="mchart"><div class="msec" style="border:0;margin:0 0 4px">Форма · рейтинги за останні тури</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
      <polyline fill="none" stroke="var(--gold)" stroke-width="2" points="${pts}"/></svg></div>`;
}
// пре-чек лімітів складу при набутті (дублює тригер 398 — тут для UX, блокуємо заздалегідь §K)
function acquireBlock(p){
  const cfg=S.cfg||{}, mine=S.players.filter(x=>x.owner_participant_id===S.me.id);
  if(mine.length >= (cfg.squad_max||8)) return `Склад повний (${cfg.squad_max||8}) — спершу звільни місце`;
  if(mine.filter(x=>x.club_id===p.club_id).length >= (cfg.max_per_club||3)) return `Уже ${cfg.max_per_club||3} з цього клубу`;
  if(p.position==='G' && mine.some(x=>x.position==='G'&&x.club_id===p.club_id)) return 'Уже є воротар з цього клубу';
  const dgFull=cfg.defgk_full_min||2;
  if(mine.length === (cfg.squad_max||8)-1){
    const dg=mine.filter(x=>x.position==='D'||x.position==='G').length + ((p.position==='D'||p.position==='G')?1:0);
    if(dg<dgFull) return `На повному складі потрібно ≥${dgFull} DEF/GK`;
  }
  return null;
}

// ── фільтрація + сортування ──
function marketList(){
  const f=S.f; let list=S.players.slice();
  if(f.status==='free')  list=list.filter(p=>!p.owner_participant_id);
  else if(f.status==='owned') list=list.filter(p=>p.owner_participant_id);
  else if(f.status==='mine')  list=list.filter(p=>p.owner_participant_id===S.me.id);
  if(f.league) list=list.filter(p=>(S.clubs[p.club_id]||{}).league===f.league);
  if(f.club)   list=list.filter(p=>p.club_id===f.club);
  if(f.pos)    list=list.filter(p=>p.position===f.pos);
  if(f.q){ const q=f.q.toLowerCase(); list=list.filter(p=>(p.name||'').toLowerCase().includes(q)); }
  if(f.rMin!=null) list=list.filter(p=>(p.season_avg_rating??0) >= f.rMin);
  if(f.rMax!=null) list=list.filter(p=>(p.season_avg_rating??99) <= f.rMax);
  if(f.pMin!=null) list=list.filter(p=>(p.market_value_current||0) >= f.pMin);
  if(f.pMax!=null) list=list.filter(p=>(p.market_value_current||0) <= f.pMax);
  const s=f.sort;
  list.sort((a,b)=>{
    if(s==='price') return (b.market_value_current||0)-(a.market_value_current||0);
    if(s==='val')   return vDelta(b).pct - vDelta(a).pct;
    if(s==='name')  return (a.name||'').localeCompare(b.name||'');
    return (b.season_avg_rating||0)-(a.season_avg_rating||0);
  });
  return list;
}

function renderGrid(){
  const grid=$('mgrid'); if(!grid) return;
  const list=marketList(), cap=80;
  const cnt=$('mcount'); if(cnt) cnt.textContent=list.length+' гравців';
  grid.innerHTML = list.length
    ? list.slice(0,cap).map(mtile).join('') + (list.length>cap?`<p class="dim" style="grid-column:1/-1;margin:6px 0 0">показано ${cap} з ${list.length} — звузь фільтром</p>`:'')
    : '<div class="soon" style="grid-column:1/-1">Немає гравців під фільтри</div>';
  grid.querySelectorAll('.mtile').forEach(t=>t.onclick=()=>openPlayerModal(t.dataset.p));
}
function bindFilters(){
  const q=$('f-q'); if(q) q.oninput=()=>{ S.f.q=q.value; renderGrid(); };
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onchange=e=>{ fn(e.target.value); renderGrid(); }; };
  bind('f-league',v=>S.f.league=v); bind('f-club',v=>S.f.club=v);
  bind('f-pos',v=>S.f.pos=v); bind('f-sort',v=>S.f.sort=v);
  const rmin=$('f-rmin'), rmax=$('f-rmax');
  const syncR=()=>{ let a=+rmin.value,b=+rmax.value; if(a>b){[a,b]=[b,a];} S.f.rMin=a;S.f.rMax=b; $('rv-r').textContent=a.toFixed(1)+'–'+b.toFixed(1); renderGrid(); };
  if(rmin) rmin.oninput=syncR; if(rmax) rmax.oninput=syncR;
  const pmin=$('f-pmin'), pmax=$('f-pmax');
  const syncP=()=>{ let a=+pmin.value,b=+pmax.value; if(a>b){[a,b]=[b,a];} S.f.pMin=a;S.f.pMax=b; $('rv-p').textContent=eur(a)+'–'+eur(b); renderGrid(); };
  if(pmin) pmin.oninput=syncP; if(pmax) pmax.oninput=syncP;
}

// ── 💱 РИНОК (Ринок · Мої ставки · Трансфери) ──
function viewMarket(){
  const inCount=(S.transfers||[]).filter(t=>t.awaiting_participant===S.me.id).length
               +(S.exchanges||[]).filter(x=>x.awaiting_participant===S.me.id).length;
  const subs=[['free','Вільні'],['all','Усі гравці'],['bids','Мої ставки'],['transfers','Трансфери'+(inCount?` (${inCount})`:'')]];
  const bar=`<div class="subtabs">${subs.map(([k,t])=>`<button data-s="${k}" class="${k===S.mktSub?'on':''}">${t}</button>`).join('')}</div>`;
  let body='';
  if(S.mktSub==='free'||S.mktSub==='all'){
    S.f.status = (S.mktSub==='free')?'free':'all';
    const t=(S.mktSub==='free')?['Вільні гравці','купити зараз (+15%) або поставити (аукціон 12 год, крок +5%)']:['Усі гравці','весь пул + власник · натисни на гравця для дій'];
    body = filterBar()+`<div class="head2" style="margin-top:2px"><h2>${t[0]}</h2><span class="sub">${t[1]} · <span id="mcount"></span></span></div><div class="mgrid" id="mgrid"></div>`;
  } else if(S.mktSub==='bids'){
    const mine = S.auctions.filter(a=>a.leader_participant_id===S.me.id);
    body = mine.length? `<p class="dim">Лоти, де ти лідируєш (гроші заморожено до закриття). Перебити чужий лот — у «Ринок».</p>
      <table class="t"><thead><tr><th>Гравець</th><th class="n">Твоя ставка</th><th class="n">До</th></tr></thead><tbody>${
      mine.map(a=>{ const p=S.players.find(x=>x.id===a.player_id)||{};
        return `<tr><td><b>${esc(p.name||'?')}</b> <span class="dim">${esc((S.clubs[p.club_id]||{}).name||'')}</span></td>
          <td class="n">${eur(a.current_bid)}</td><td class="n">${new Date(a.ends_at).toLocaleString('uk',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td></tr>`;
      }).join('')}</tbody></table>`
      : `<div class="soon">Немає активних ставок, де ти лідируєш. Почни аукціон або перебий лот у «Ринок».</div>`;
  } else {
    if(!S.transfersReady && !S.exchangesReady){
      body = `<div class="soon">Прямі трансфери (≥75% · так/ні/контр) і обмін 1↔1 зʼявляться після заливки <b>405</b>/<b>412</b> (market_transfers/market_exchanges + RPC).</div>`;
    } else {
      const trInv=(S.transfers||[]).filter(t=>t.to_participant===S.me.id||t.from_participant===S.me.id);
      const xInv =(S.exchanges||[]).filter(x=>x.to_participant===S.me.id||x.from_participant===S.me.id);
      const inRows  = trInv.filter(t=>t.awaiting_participant===S.me.id).map(transferRow)
                    .concat(xInv.filter(x=>x.awaiting_participant===S.me.id).map(exchangeRow));
      const outRows = trInv.filter(t=>t.awaiting_participant!==S.me.id).map(transferRow)
                    .concat(xInv.filter(x=>x.awaiting_participant!==S.me.id).map(exchangeRow));
      body = `<p class="dim">У <b>Ринок</b> тисни на гравця суперника → «Запропонувати трансфер» (гроші, ≥${Math.round((S.cfg?.transfer_min_pct??0.75)*100)}%) або «Обмін» (свій гравець ↔ його + доплата). Угоди публічні; гроші морозяться на час пропозиції.</p>
        <div class="msec">Твоя черга${inRows.length?` · <b style="color:var(--gold)">${inRows.length}</b>`:''}</div>
        ${inRows.length?inRows.join(''):'<div class="dim" style="padding:6px 2px">— немає</div>'}
        <div class="msec" style="margin-top:16px">Твої пропозиції / чекають іншого боку</div>
        ${outRows.length?outRows.join(''):'<div class="dim" style="padding:6px 2px">— немає</div>'}`;
    }
  }
  $('view').innerHTML = statbar()+bar+body;
  [...document.querySelectorAll('.subtabs button')].forEach(b=>b.onclick=()=>{ S.mktSub=b.dataset.s; viewMarket(); });
  if(S.mktSub==='free'||S.mktSub==='all'){ bindFilters(); renderGrid(); }
  if(S.mktSub==='transfers'){ bindTransfers(); bindExchanges(); }
}

// ── рядок трансферу + дії (Так/Ні/Контр) ──
function transferRow(t){
  const p=S.players.find(x=>x.id===t.player_id)||{};
  const cl=(S.clubs[p.club_id]||{}).name||'';
  const iAmSeller=t.from_participant===S.me.id;
  const other=iAmSeller?t.to_participant:t.from_participant;
  const otherName=esc(S.names[other]||'—');
  const mine=t.awaiting_participant===S.me.id;
  const info = iAmSeller
    ? `<b>${otherName}</b> хоче купити твого <b>${esc(p.name||'?')}</b> <span class="dim">${esc(cl)}</span> за <b class="mprice">${eur(t.amount)}</b>`
    : `Твоя пропозиція на <b>${esc(p.name||'?')}</b> <span class="dim">${esc(cl)}</span> → <b>${otherName}</b> · <b class="mprice">${eur(t.amount)}</b>`;
  const minC=Math.ceil((p.market_value_current||0)*(S.cfg?.transfer_min_pct??0.75));
  const ctrl = mine
    ? `<div class="tctrl"><button data-tr-acc="${t.id}">Прийняти</button>
        <button class="ghost" data-tr-cnt="${t.id}" data-min="${minC}">Контр</button>
        <button class="ghost" data-tr-rej="${t.id}">Відхилити</button></div>`
    : (!iAmSeller
        ? `<div class="tctrl"><span class="pill">чекає ${otherName}</span><button class="ghost" data-tr-cancel="${t.id}">Відкликати</button></div>`
        : `<span class="pill">чекає ${otherName}</span>`);
  return `<div class="trow"><span class="tinfo">${info}</span>${ctrl}</div>`;
}

// ── рядок обміну + дії (Прийняти/Відхилити/Контр/Відкликати) ──
function xCashLine(x, iAmFrom){
  if(x.cash_delta===0) return '<span class="dim">без доплати</span>';
  const payFrom = x.cash_delta>0;                 // true: ініціатор(from) доплачує; false: власник(to) доплачує
  const iPay = (payFrom && iAmFrom) || (!payFrom && !iAmFrom);
  return `<b class="mprice">${iPay?'ти доплачуєш':'тобі доплачують'} ${eur(Math.abs(x.cash_delta))}</b>`;
}
function exchangeRow(x){
  const off=S.players.find(p=>p.id===x.offered_player)||{}, want=S.players.find(p=>p.id===x.wanted_player)||{};
  const offCl=(S.clubs[off.club_id]||{}).name||'', wantCl=(S.clubs[want.club_id]||{}).name||'';

    ? `🔄 Твій <b>${esc(off.name||'?')}</b> <span class="dim">${esc(offCl)}</span> ↔ <b>${esc(want.name||'?')}</b> <span class="dim">${esc(wantCl)}</span> · <b>${otherName}</b> · ${xCashLine(x,iAmFrom)}`
    : `🔄 <b>${otherName}</b>: <b>${esc(off.name||'?')}</b> <span class="dim">${esc(offCl)}</span> ↔ твій <b>${esc(want.name||'?')}</b> <span class="dim">${esc(wantCl)}</span> · ${xCashLine(x,iAmFrom)}`;
  const ctrl = mine
    ? `<div class="tctrl"><button data-xc-acc="${x.id}">Прийняти</button>

        ? `<div class="tctrl"><span class="pill">чекає ${otherName}</span><button class="ghost" data-xc-cancel="${x.id}">Відкликати</button></div>`

// ── МОДАЛКА гравця: деталь + дії (купити/ставка/продати/трансфер/обмін) ──
function modalOpen(html){
  const h=$('mhost');
  h.innerHTML = `<div class="modal"><button class="mx" aria-label="закрити">✕</button>${html}</div>`;
  h.classList.remove('hide');
  h.onclick=(e)=>{ if(e.target===h) modalClose(); };
  h.querySelector('.mx').onclick=modalClose;
}
function modalClose(){ const h=$('mhost'); h.classList.add('hide'); h.innerHTML=''; }
// стилізоване підтвердження (замість системного confirm())
function confirmModal(msg, okLabel, onOk, onCancel){
  modalOpen(`<h3>Підтвердження</h3>
    <p style="font-size:15px;margin:10px 0 4px">${msg}</p>
    <div class="macts"><button data-do="cyes">${okLabel}</button><button class="ghost" data-do="cno">Скасувати</button></div>`);
  $('mhost').querySelector('[data-do="cyes"]').onclick=async()=>{ modalClose(); await onOk(); };
  $('mhost').querySelector('[data-do="cno"]').onclick=()=>{ if(onCancel) onCancel(); else modalClose(); };

    <span class="dim">${label} · €млн (мін ${(minEur/1e6).toFixed(1)})</span>
    <input id="amtInp" inputmode="decimal" value="${(minEur/1e6).toFixed(1)}">
    <button data-do="amt">OK</button></div>`;
}
// JS-аналог _market_exchange_reason (412): склад pid БЕЗ outP + inP легальний?
function exchangeBlock(pid,outP,inP){
  const cfg=S.cfg||{}, roster=S.players.filter(x=>x.owner_participant_id===pid && x.id!==outP.id);
  const total=roster.length+1;
  const clubN=roster.filter(x=>x.club_id===inP.club_id).length+1;
  const clubGK=roster.filter(x=>x.club_id===inP.club_id&&x.position==='G').length+(inP.position==='G'?1:0);
  const dg=roster.filter(x=>x.position==='D'||x.position==='G').length+((inP.position==='D'||inP.position==='G')?1:0);
  if(total>(cfg.squad_max||8)) return `склад >${cfg.squad_max||8}`;
  if(clubN>(cfg.max_per_club||3)) return `>${cfg.max_per_club||3} з клубу ${esc((S.clubs[inP.club_id]||{}).name||'')}`;
  if(clubGK>1) return 'два воротарі з одного клубу';
  if(total===(cfg.squad_max||8)&&dg<(cfg.defgk_full_min||2)) return `на повному потрібно ≥${cfg.defgk_full_min||2} DEF/GK`;
  return null;
}
// блок обміну в модалці чужого гравця p (=wanted). Селект свого + доплата + наживо валідація.

  return `<div class="xbox" data-want="${p.id}" data-owner="${p.owner_participant_id}">

  </div>`;

// наживо: рахує cash_delta, звіряє 75% обом + ліміти обом + бюджет, оновлює статус/кнопку
function xRefresh(){
  const box=$('mhost') && $('mhost').querySelector('.xbox'); if(!box) return;
  const cfg=S.cfg||{}, pct=(cfg.transfer_min_pct??0.75);
  const want=S.players.find(p=>p.id===box.dataset.want), owner=box.dataset.owner;
  const off=S.players.find(p=>p.id===$('mhost').querySelector('#xOff').value);
  const dir=$('mhost').querySelector('#xDir').value, amtInp=$('mhost').querySelector('#xAmt');
  amtInp.disabled=(dir==='none'); if(dir==='none') amtInp.value='0';
  const raw=Math.round((parseFloat((amtInp.value||'0').replace(',','.'))||0)*1e6);
  const cash = dir==='pay'?raw : dir==='ask'?-raw : 0;   // >0 я(from) доплачую, <0 власник(to) доплачує
  const offV=off?off.market_value_current||0:0, wantV=want.market_value_current||0;
  const pr=[];
  if(!off) pr.push('обери свого гравця');
  else{
    if(offV+Math.max(cash,0) < Math.ceil(wantV*pct)) pr.push(`ти віддаєш <${Math.round(pct*100)}% вартості ${esc(want.name)} — додай доплату`);
    if(wantV+Math.max(-cash,0) < Math.ceil(offV*pct)) pr.push('доплата завелика (власник віддав би замало)');
    const bMe=exchangeBlock(S.me.id,off,want); if(bMe) pr.push('у тебе: '+bMe);
    const bOw=exchangeBlock(owner,want,off); if(bOw) pr.push('у власника: '+bOw);
    if(cash>0 && (S.spendable??0)<cash) pr.push(`доплата морозить ${eur(cash)}, доступно ${eur(S.spendable||0)}`);
  }
  const st=$('mhost').querySelector('#xStatus'), btn=$('mhost').querySelector('#xBtn');
  if(pr.length){ st.className='mnote warn'; st.innerHTML='⛔ '+pr.join(' · '); btn.disabled=true; }
  else{ st.className='mnote'; st.innerHTML=`✅ твій <b>${esc(off.name)}</b> ↔ <b>${esc(want.name)}</b> · ${cash===0?'без доплати':(cash>0?'ти доплачуєш '+eur(cash):'тобі доплачують '+eur(-cash))}`; btn.disabled=false; box.dataset.cash=cash; box.dataset.off=off.id; }
}
function actionsHTML(p,ctx){
  const {owned,free,au,mv}=ctx, cfg=S.cfg||{};
  if(owned){
    const proceeds=Math.round(mv*(1-(cfg.sell_pct??0.05)));
    return `<div class="macts"><button class="ghost" data-do="sell" data-amt="${proceeds}">Продати · ${eur(proceeds)} (−5%)</button></div>
      <p class="mnote">Заморозка блокує продаж під час туру; гравця в лайнапі незіграного туру продати не можна.</p>`;
  }
  if(!free){
    const ownerNm=esc(S.names[p.owner_participant_id]||'—');
    let h=`<p class="mnote">Власник: <b>${ownerNm}</b>. Угоди <b>публічні</b> — інші теж можуть запропонувати; він обере.</p>`;
    // ТРАНСФЕР (гроші за гравця)
    if(S.transfersReady){
      const blockT=acquireBlock(p);
      if(blockT){ h+=`<p class="mnote warn">Трансфер ⛔ ${blockT} — або зроби ОБМІН нижче (він звільняє слот)</p>`; }
      else {
        const minT=Math.ceil(mv*(cfg.transfer_min_pct??0.75));
        h+=`<p class="mnote">Сума <b>заморозиться</b> (доступно ${eur(S.spendable)}); спишеться при прийнятті.</p>
          ${amountUI('Запропонувати трансфер (≥'+Math.round((cfg.transfer_min_pct??0.75)*100)+'%)',minT,'propose',p.id)}`;
      }
    }
    // ОБМІН 1↔1 + двостороння доплата
    if(S.exchangesReady) h+=exchangeUI(p);
    if(!S.transfersReady && !S.exchangesReady)
      h+=`<p class="mnote">Трансфери/обмін зʼявляться після заливки <b>405</b>/<b>412</b>.</p>`;
    return h;
  }
  const block=acquireBlock(p), ceil=Math.round(mv*(1+(cfg.buynow_pct??0.15)));
  if(au){
    const iLead=au.leader_participant_id===S.me.id;
    const minBid=Math.ceil(au.current_bid*(1+(cfg.bid_step_pct??0.05)));
    const canBuy=au.current_bid < ceil;
    let h=`<p class="mnote">🔨 Аукціон: поточна ${eur(au.current_bid)} · ${iLead?'<b style="color:var(--gold)">ти лідер</b>':esc(S.names[au.leader_participant_id]||'—')} · до ${new Date(au.ends_at).toLocaleTimeString('uk',{hour:'2-digit',minute:'2-digit'})}</p>`;
    if(block) return h+`<p class="mnote warn">⛔ ${block}</p>`;
    if(!iLead) h+=amountUI('Перебити',minBid,'bid',au.id);
    if(canBuy) h+=`<div class="macts"><button data-do="buy" data-amt="${ceil}">Викуп · ${eur(ceil)}</button></div>`;
    return h;
  }
  if(block) return `<p class="mnote warn">⛔ ${block}</p>`;
  return `<div class="macts"><button data-do="buy" data-amt="${ceil}">Купити зараз · ${eur(ceil)}</button></div>
    ${amountUI('Зробити ставку (аукціон)',mv,'auc',p.id)}`;
}
function openPlayerModal(pid){
  const p=S.players.find(x=>x.id===pid); if(!p) return;
  const cl=(S.clubs[p.club_id]||{}), d=vDelta(p), o=ownerInfo(p);
  const ctx={ owned:p.owner_participant_id===S.me.id, free:!p.owner_participant_id,
              au:(!p.owner_participant_id)?S.auctions.find(a=>a.player_id===p.id):null, mv:p.market_value_current };
  const head=`<div class="mhead">${avatar(p,64)}
      <div><h3>${esc(p.name)}</h3>
        <div class="mmeta"><span class="pbadge ${p.position}">${posCat(p.position)}</span> ${esc(cl.name||'')}${cl.league?' · '+esc(cl.league):''}</div>
        <div class="mmeta ${o.cls}">${o.dot}${o.txt}</div></div>
      <div class="mbig"><div class="n">${p.season_avg_rating??'—'}</div><div class="l">сер. рейтинг</div></div></div>`;
  const stats=`<div class="mstats">
      <div><b class="mprice">${eur(p.market_value_current)}</b><span>вартість</span></div>
      <div><b class="vdelta ${d.dir}">${fmtDelta(d)}</b><span>Val Δ</span></div>
      ${p.appearances!=null?`<div><b>${p.appearances}</b><span>матчі</span></div>`:''}
      ${p.minutes!=null?`<div><b>${p.minutes}</b><span>хвилини</span></div>`:''}
    </div>`;
  modalOpen(head+stats+formChart(p)+actionsHTML(p,ctx));
  bindModalActions(p);
}
function bindModalActions(p){
  const h=$('mhost');
  h.querySelectorAll('[data-do]').forEach(b=>b.onclick=async()=>{
    const kind=b.dataset.do;
    if(kind==='sell'){ const amt=+b.dataset.amt; confirmModal(`Продати <b>${esc(p.name)}</b> за <b>${eur(amt)}</b> (−5%)?`, 'Продати · '+eur(amt),
      ()=>act('market_sell',{p_player:p.id},'Продано'), ()=>openPlayerModal(p.id)); return; }
    if(kind==='buy'){ const amt=+b.dataset.amt; confirmModal(`Викупити <b>${esc(p.name)}</b> за <b>${eur(amt)}</b>?`, 'Викупити · '+eur(amt),
      ()=>act('market_buynow',{p_player:p.id},'Гравець твій'), ()=>openPlayerModal(p.id)); return; }
    if(kind==='xpropose'){
      const box=h.querySelector('.xbox'); if(!box||box.dataset.off==null){ alert('Обери гравця й перевір умови'); return; }
      const off=S.players.find(x=>x.id===box.dataset.off)||{}, cash=+box.dataset.cash||0;
      confirmModal(`Запропонувати обмін: твій <b>${esc(off.name)}</b> ↔ <b>${esc(p.name)}</b>${cash===0?'':(cash>0?' · ти доплачуєш '+eur(cash):' · тобі доплачують '+eur(-cash))}?`, 'Запропонувати',
        ()=>act('market_propose_exchange',{p_offered:box.dataset.off,p_wanted:box.dataset.want,p_cash_delta:cash},'Обмін запропоновано'), ()=>openPlayerModal(p.id)); return; }
    if(kind==='amt'){
      const box=b.closest('.mamt'), min=+box.dataset.min;
      const eurv=Math.round(parseFloat((box.querySelector('#amtInp').value||'').replace(',','.'))*1e6);
      if(!eurv || eurv<min){ alert('Замало — мінімум '+eur(min)); return; }
      modalClose();
      if(box.dataset.kind==='auc') await act('market_start_auction',{p_player:box.dataset.ref,p_amount:eurv},'Аукціон почато');
      else if(box.dataset.kind==='bid') await act('market_place_bid',{p_auction:box.dataset.ref,p_amount:eurv},'Ставку зроблено');
      else if(box.dataset.kind==='propose') await act('market_propose_transfer',{p_player:box.dataset.ref,p_amount:eurv},'Пропозицію надіслано');
    }
  });
  // наживо-валідація обміну (75% обом · ліміти обом · бюджет)
  if(h.querySelector('.xbox')){
    ['xOff','xDir','xAmt'].forEach(id=>{ const el=h.querySelector('#'+id); if(el){ el.onchange=xRefresh; el.oninput=xRefresh; } });
    xRefresh();
  }
}

// ── 🏆 ТАБЛИЦЯ = вбудована публічна борда (?embed ховає її шапку/бейдж).
// НЕ дублюємо ~200 рядків логіки борди (пастка board.js) — 1:1, завжди в синхроні.
function viewTable(){
  $('view').innerHTML = `<div class="head2"><h2>Таблиця</h2><span class="sub">повна F1-борда — склади-плитки, очки по турах, рух рангу ▲▼ · та сама, що публічна · <a href="squad-stage.html" target="_blank" style="color:var(--teal)">відкрити окремо ↗</a></span></div>
    <iframe id="boardFrame" src="squad-stage.html?embed" title="Squad борда" scrolling="no"
      style="width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);height:880px;display:block"></iframe>`;
  const fr=$('boardFrame');
  const fit=()=>{ try{ const b=fr.contentDocument&&fr.contentDocument.body; const h=b?b.scrollHeight:0;
    if(h>200) fr.style.height=(h+28)+'px'; }catch(e){/* крос-походження (file://) → лишається запасна висота */} };
  fr.addEventListener('load',()=>{ fit(); setTimeout(fit,400);
    try{ new ResizeObserver(fit).observe(fr.contentDocument.body); }catch(e){} });
  window.addEventListener('resize', fit, {passive:true});
}

// ── ⚽ МАТЧІ (фікстури 19 клубів; селектор турів + заморозка + клік на матч) ──
async function viewMatches(){
  if(!S.rounds.length){ $('view').innerHTML=`<div class="head2"><h2>Матчі</h2></div><div class="soon">Турів ще немає.</div>`; return; }
  const fx = await sbSel(`market_fixtures?tournament_id=eq.${S.tour.id}&select=round_id,home_club_id,away_club_id,kickoff_at,status,home_score,away_score`);
  if(S.matchRound==null){ const up=S.rounds.find(r=>new Date(r.deadline_at)>new Date()); S.matchRound=(up||S.rounds[S.rounds.length-1]).id; }
  const round=S.rounds.find(r=>r.id===S.matchRound)||S.rounds[0];
  const frozen = new Date(round.deadline_at)<=new Date() && !round.results_entered_at;
  const sel=`<div class="subtabs">${S.rounds.map(r=>`<button data-mr="${r.id}" class="${r.id===round.id?'on':''}">Тур ${r.number}</button>`).join('')}</div>`;
  const freeze = frozen? `<div class="rndbar" style="border-color:#244;background:#0e1a22">
      <span class="pill" style="background:#0e1a22;border:1px solid #244;color:var(--blue)">❄ Заморозка</span>
      <span class="txt">Тур ${round.number} у грі — ринок зачинено до внесення всіх результатів.</span></div>` : '';
  const rf=fx.filter(f=>f.round_id===round.id);
  const rows = rf.length ? rf.map(f=>{
    const sched=f.home_score==null;
    const sc=sched? new Date(f.kickoff_at).toLocaleString('uk',{weekday:'short',hour:'2-digit',minute:'2-digit'}) : `${f.home_score}:${f.away_score}`;
    return `<div class="mrow" data-fx="${f.home_club_id}|${f.away_club_id}">
      <div class="t"><span class="crest" style="--club:${clubCol(f.home_club_id)}"></span><span>${esc(clubName(f.home_club_id))}</span></div>
      <div class="score ${sched?'sched':''}">${sc}</div>
      <div class="t away"><span>${esc(clubName(f.away_club_id))}</span><span class="crest" style="--club:${clubCol(f.away_club_id)}"></span></div>
    </div>`;
  }).join('') : '<div class="dim" style="padding:12px 4px">Фікстур на цей тур ще немає.</div>';
  $('view').innerHTML = `<div class="head2"><h2>Матчі · Тур ${round.number}</h2><span class="sub">розклад/результати 19 клубів · клік на матч → рейтинги гравців пулу</span></div>
    ${sel}${freeze}<div class="panel" style="padding:4px 10px">${rows}</div>`;
  [...document.querySelectorAll('[data-mr]')].forEach(b=>b.onclick=()=>{ S.matchRound=b.dataset.mr; viewMatches(); });
  [...document.querySelectorAll('[data-fx]')].forEach(el=>el.onclick=()=>openMatchModal(round, el.dataset.fx));
}
async function openMatchModal(round, fx){
  const [hc,ac]=fx.split('|');
  const pool=S.players.filter(p=>p.club_id===hc||p.club_id===ac);
  let prp={};
  try{ (await sbSel(`market_player_round_points?tournament_id=eq.${S.tour.id}&round_id=eq.${round.id}&select=player_id,avg_rating,points`)).forEach(r=>prp[r.player_id]=r); }catch(e){}
  const played=pool.filter(p=>prp[p.id]);
  const body = played.length
    ? `<div class="plist" style="margin-top:4px">${played.map(p=>{const r=prp[p.id];return `<div class="pcard" style="--club:${clubCol(p.club_id)}">
        <div><div class="nm">${esc(p.name)}</div><div class="meta"><span class="pos ${p.position}">${posCat(p.position)}</span><span>${esc(clubName(p.club_id))}</span></div></div>
        <div class="rt"><div class="big tnum">${r.points??'—'}</div><div class="pr tnum">рейтинг ${r.avg_rating??'—'} → ${r.points??0} оч.</div></div></div>`;}).join('')}</div>`
    : `<p class="mnote">Матч ще не зіграний або рейтинги ще не внесені — зʼявляться після результатів туру. Показуємо лише гравців пулу (решта складів не відкриваємо).</p>`;
  modalOpen(`<h3>${esc(clubName(hc))} — ${esc(clubName(ac))}</h3><p class="mnote">Тур ${round.number} · рейтинги гравців пулу за тур</p>${body}`);
}
